<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Chi tiết Bài viết</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #10B981; /* Xanh lá cây hiện đại */
            --dark-green: #047857; 
            --bg-color: #F9FAFB; /* Nền xám nhạt cho sự sang trọng */
            --text-color: #111827; 
            --light-text: #6B7280; 
            --accent-color: #3B82F6; /* Màu nhấn phụ xanh dương */
            --card-bg: #FFFFFF; 
            --border-color: #E5E7EB;
        }

        body { 
            margin: 0; 
            padding-top: 80px; 
            font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
        }

        /* Navbar */
        .navbar { 
            background: var(--primary-green);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .navbar-brand { 
            font-weight: 900; 
            font-size: 1.6rem; 
            color: white !important; 
        }
        .nav-link-custom { 
            color: white !important; 
            font-weight: 700; 
            transition: 0.3s; 
            padding: 0.5rem 1rem;
            text-decoration: none;
        }
        .nav-link-custom:hover { 
            color: var(--accent-color) !important;
            transform: translateY(-1px);
        }
        
        /* Main Content - Card Design */
        .main-content { 
            background: var(--card-bg); 
            padding: 50px 70px;
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }
        .post-title { 
            font-weight: 900; 
            color: var(--dark-green); 
            margin-bottom: 15px; 
            font-size: 3rem;
            line-height: 1.2;
        }
        .post-meta { 
            color: var(--light-text); 
            font-size: 1rem; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .post-image { 
            max-height: 450px;
            width: 100%;
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            margin-top: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        
        /* Author UI */
        #postAuthorContainer {
            background: #F3F4F6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            border-left: 4px solid var(--primary-green);
        }
        #postAuthorAvatar {
            width: 40px;
            height: 40px;
            line-height: 40px; 
            text-align: center;
            background: var(--dark-green);
            color: white;
            border-radius: 50%;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
            margin-right: 15px;
        }
        
        /* Content Wrapper & Read More */
        #postContentWrapper {
            /* Loại bỏ viền và padding không cần thiết */
            border: none;
            padding: 0; 
            background: transparent;
            margin-bottom: 20px;
            
            transition: max-height 0.5s ease-in-out;
            overflow: hidden; 
            position: relative;
        }
        
        /* 🔥 KHẮC PHỤC LỖI CĂN GIỮA: Đảm bảo nội dung căn trái */
        .post-content { 
            line-height: 1.8; 
            font-size: 1.15rem; 
            color: var(--text-color); 
            margin: 0; 
            white-space: pre-wrap;
            text-align: left; /* Đảm bảo căn trái */
        }
        .post-content p {
            margin-bottom: 1.7em; 
            margin-top: 0;
        }

        #readMoreBtn {
            background: none;
            border: none;
            color: var(--accent-color); 
            font-weight: 700;
            padding: 0;
            cursor: pointer;
            display: block;
            margin: 10px 0 0 0; 
            font-size: 1rem;
            transition: color 0.3s;
        }
        
        /* Comment UI */
        #commentSection { 
            border-top: 1px solid var(--border-color) !important; 
            padding-top: 40px !important; 
        }
        
        /* 🔥 AVATAR NGƯỜI BÌNH LUẬN: Đảm bảo hình tròn và giữ style gốc */
        .user-avatar-comment { 
            width: 40px; 
            height: 40px; 
            line-height: 40px; 
            text-align: center;
            background: var(--primary-green); 
            color: white; 
            border-radius: 50%; /* Rất quan trọng */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            flex-shrink: 0; 
            font-size: 1rem;
        }

        /* Avatar cho Reply: nhỏ hơn và dùng màu nhấn */
        .comment-item .comment-item .user-avatar-comment {
            background: var(--accent-color) !important;
            width: 30px !important; 
            height: 30px !important;
            line-height: 30px !important;
            font-size: 0.75rem !important;
        }


        #commentFormContainer { 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 20px; 
            margin-top: 30px; 
            background: #FDFDFD; 
        }
        #btnSubmitComment {
            background-color: var(--primary-green) !important; 
            border-color: var(--primary-green) !important;
        }
        .comment-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .comment-item:last-child {
            border-bottom: none;
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .main-content { padding: 30px; }
            .post-title { font-size: 2.5rem; }
        }
        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
            .post-title {
                font-size: 1.8rem;
            }
            .post-content {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="blog.html"><i class="fas fa-camera-retro me-2"></i>Studio LNP Blog</a>
            
            <div class="d-flex align-items-center">
                <a class="nav-link-custom" href="admin.html">
                    <i class="fas fa-home me-1"></i> Trang chủ
                </a>
                <a class="nav-link-custom" href="blog.html">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div id="postContainer" class="main-content">
                    <div class="text-center text-muted py-5" id="loadingMessage">
                        <i class="fas fa-spinner fa-spin fa-2x text-primary-green"></i> Đang tải bài viết...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ⚠️ CẤU HÌNH WEBHOOK (Giữ nguyên)
        const N8N_GET_POST_DETAIL = 'https://dichvufb.tino.page/webhook/get-post-detail';
        const N8N_GET_COMMENTS = 'https://dichvufb.tino.page/webhook/get-comments';
        const N8N_SUBMIT_COMMENT = 'https://dichvufb.tino.page/webhook/submit-comment'; 
        
        // Cấu hình Cache
        const POST_CACHE_PREFIX = 'post_detail_';
        const CACHE_EXPIRY = 3600000; 
        const MAX_CONTENT_HEIGHT = 350; /* Chiều cao cắt cho giao diện mới */
        
        // --- LOGIC TIỆN ÍCH --- 
        function getLoggedInUser() {
            return {
                name: localStorage.getItem('admin_name'),
                email: localStorage.getItem('admin_email'),
                isLoggedIn: !!localStorage.getItem('admin_email')
            };
        }
        
        function extractDriveFileId(urlOrId) {
            if (urlOrId && urlOrId.includes('id=')) {
                const parts = urlOrId.split('id=');
                return parts[1].split('&')[0];
            }
            return urlOrId; 
        }
        
        // --- KHẮC PHỤC NÚT XEM THÊM ---
        function toggleReadMore() {
            const contentWrapper = document.getElementById('postContentWrapper');
            const readMoreBtn = document.getElementById('readMoreBtn');
            const contentDiv = document.getElementById('postContentActual');
            
            // Lấy chiều cao cuộn thực tế của nội dung.
            const actualHeight = contentDiv.scrollHeight; 
            
            if (contentWrapper.classList.contains('collapsed')) {
                contentWrapper.classList.remove('collapsed');
                // Cộng thêm 40px chỉ là dự phòng nếu có padding, trong thiết kế mới padding đã là 0
                // Tuy nhiên, giữ +40px an toàn hơn cho các margin/padding khác của contentDiv
                contentWrapper.style.maxHeight = (actualHeight + 40) + 'px'; 
                readMoreBtn.innerHTML = 'Thu gọn <i class="fas fa-chevron-up"></i>';
            } else {
                contentWrapper.classList.add('collapsed');
                contentWrapper.style.maxHeight = MAX_CONTENT_HEIGHT + 'px'; 
                readMoreBtn.innerHTML = 'Xem thêm <i class="fas fa-chevron-down"></i>';
            }
        }

        // --- HÀM XỬ LÝ CHÍNH (loadPostDetail & renderPost) ---

        async function loadPostDetail(forceReload = false) {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const postContainer = document.getElementById('postContainer');
            const cacheKey = POST_CACHE_PREFIX + postId;

            if (!postId) {
                postContainer.innerHTML = '<div class="alert alert-danger">Lỗi: Không tìm thấy ID bài viết.</div>';
                return;
            }

            const cachedData = JSON.parse(localStorage.getItem(cacheKey));
            
            if (!forceReload && cachedData && (Date.now() - cachedData.timestamp < CACHE_EXPIRY)) {
                document.getElementById('pageTitle').innerText = cachedData.blog.title;
                renderPost(cachedData.blog);
                loadComments(postId); 
            } 
            
            if (!cachedData || forceReload) {
                postContainer.innerHTML = `<div class="main-content"><div class="text-center text-muted py-5" id="loadingMessage"><i class="fas fa-spinner fa-spin fa-2x text-success"></i> Đang tải bài viết...</div></div>`;
            }

            try {
                const response = await fetch(`${N8N_GET_POST_DETAIL}?id=${postId}`);
                if (!response.ok) throw new Error("Lỗi tải dữ liệu");
                
                const rawData = await response.json();
                let results = Array.isArray(rawData) ? rawData : (rawData.data || []);
                const blog = results[0] || null;
                
                if (!blog) {
                    if (!cachedData) postContainer.innerHTML = '<div class="alert alert-warning">Không tìm thấy bài viết hoặc ID không hợp lệ.</div>';
                    return;
                }
                
                localStorage.setItem(cacheKey, JSON.stringify({
                    blog: blog,
                    timestamp: Date.now()
                }));

                if (!cachedData || forceReload) {
                    document.getElementById('pageTitle').innerText = blog.title;
                    renderPost(blog);
                    loadComments(postId);
                }

            } catch (error) {
                console.error("Lỗi tải bài viết từ Server:", error);
                if (!cachedData) {
                    postContainer.innerHTML = `<div class="alert alert-danger">Lỗi tải bài viết: ${error.message}</div>`;
                }
            }
        }
        
        // HÀM RENDERPOST: Sắp xếp theo thứ tự Tiêu đề, Nội dung, Hình ảnh, Tác giả
        function renderPost(blog) {
            const driveFileId = extractDriveFileId(blog.image);
            const user = getLoggedInUser();
            
            const imageUrl = driveFileId 
                ? `https://drive.google.com/thumbnail?id=${driveFileId}&sz=w800`
                : 'https://via.placeholder.com/1000x450';

            // Thay thế \n bằng thẻ <p>
            const fullContent = blog.content ? blog.content.replace(/\n/g, '</p><p>') : ''; 
            const wrappedContent = `<p>${fullContent}</p>`; 
            let readMoreButtonHtml = '';
            
            const requiresCollapse = blog.content && (blog.content.length > 500 || blog.content.split('\n').length > 8); 
            
            if (requiresCollapse) {
                readMoreButtonHtml = `<button id="readMoreBtn" onclick="toggleReadMore()">Xem thêm <i class="fas fa-chevron-down"></i></button>`;
            }

            const authorName = blog.author || user.name || 'Người ẩn danh';
            const authorAvatarLetter = authorName.charAt(0).toUpperCase();

            const contentHtml = `
                <h1 class="post-title">${blog.title}</h1>
                <div class="post-meta">
                    <i class="far fa-calendar-alt me-2"></i> ${blog.date} 
                </div>

                <div id="postContentWrapper" class="${requiresCollapse ? 'collapsed' : ''}" style="${requiresCollapse ? `max-height: ${MAX_CONTENT_HEIGHT}px;` : 'max-height: none;'}">
                    <div class="post-content" id="postContentActual">
                        ${wrappedContent}
                    </div>
                </div>
                ${readMoreButtonHtml}
                <hr style="margin-top: 30px; border-top: 1px solid var(--border-color);">

                <img src="${imageUrl}" alt="${blog.title}" class="w-100 post-image" onerror="this.src='https://via.placeholder.com/1000x450'">

                <div id="postAuthorContainer" class="d-flex align-items-center">
                    <div id="postAuthorAvatar">${authorAvatarLetter}</div>
                    <div>
                        <span class="fw-bold text-dark">${authorName}</span>
                        <p class="text-muted small m-0">Người đăng bài viết</p>
                    </div>
                </div>
                
                <div id="commentSectionContainer"></div>
            `;
            if (document.getElementById('postContainer')) {
                document.getElementById('postContainer').innerHTML = contentHtml;
                renderCommentSection(blog.id); 
            }
        }

        // --- CÁC HÀM LIÊN QUAN ĐẾN BÌNH LUẬN --- (GIỮ NGUYÊN LOGIC)

        function renderCommentSection(postId) {
            const user = getLoggedInUser();
            const commentSection = document.getElementById('commentSectionContainer');
            
            const isDisabled = !user.isLoggedIn;
            const userStatusHtml = user.isLoggedIn 
                ? `<i class="fas fa-user-check me-1"></i>Bình luận với tư cách: <span class="text-primary">${user.name}</span>`
                : `<i class="fas fa-exclamation-triangle me-1 text-danger"></i>Vui lòng đăng nhập Admin để bình luận.`;

            commentSection.innerHTML = `
                <div id="commentSection" class="mt-5 pt-3 border-top">
                    <h4 class="fw-bold mb-4 text-dark-green"><i class="fas fa-comments me-2"></i>Bình Luận</h4>
                    
                    <div id="commentsList" class="mb-4"></div>

                    <div id="commentFormContainer">
                        <h6 class="fw-bold text-success mb-3" id="commentAsUser">${userStatusHtml}</h6>
                        <form id="commentForm" onsubmit="submitComment(event)">
                            <input type="hidden" id="commentPostId" value="${postId}">
                            <input type="hidden" id="commentUserName" value="${user.name || ''}">
                            <input type="hidden" id="commentUserEmail" value="${user.email || ''}">
                            <input type="hidden" id="commentParentId" value="">

                            <div class="mb-3">
                                <textarea id="commentContent" class="form-control" rows="4" placeholder="Viết bình luận của bạn..." required ${isDisabled ? 'disabled' : ''}></textarea>
                            </div>
                            <div class="text-end">
                                <button type="submit" id="btnSubmitComment" class="btn btn-primary fw-bold px-4" ${isDisabled ? 'disabled' : ''} style="background-color: var(--primary-green); border-color: var(--primary-green);">Gửi Bình Luận</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function nestComments(comments) { 
            const commentMap = {};
            const topLevelComments = [];
            comments.forEach(comment => { if (comment.id) { commentMap[comment.id] = { ...comment, replies: [] }; } });
            Object.values(commentMap).forEach(comment => {
                const parentId = comment.parent_comment_id;
                if (parentId && parentId !== "" && commentMap[parentId]) { 
                    commentMap[parentId].replies.push(comment); 
                } else { 
                    topLevelComments.push(comment); 
                }
            });
            topLevelComments.sort((a, b) => new Date(a.date) - new Date(b.date));
            function sortReplies(comment) {
                if (comment.replies) {
                    comment.replies.sort((a, b) => new Date(a.date) - new Date(b.date));
                    comment.replies.forEach(sortReplies);
                }
            }
            topLevelComments.forEach(sortReplies);
            return topLevelComments;
        }

        function renderComments(flatComments) { 
            const commentsList = document.getElementById('commentsList');
            if (flatComments.length === 0) { commentsList.innerHTML = '<div class="text-center text-muted py-3">Chưa có bình luận nào. Hãy là người đầu tiên!</div>'; return; }
            const nestedComments = nestComments(flatComments);
            let html = '';
            
            function buildCommentHtml(comment, depth = 0) {
                const name = comment.author || 'Người ẩn danh';
                const avatarLetter = name.charAt(0).toUpperCase(); 
                const isReply = depth > 0;
                const commentId = comment.id;
                const marginStyle = isReply ? `margin-left: ${Math.min(depth, 3) * 30}px; border-left: 3px solid ${depth === 1 ? 'var(--primary-green)' : '#ddd'}; padding-left: 15px;` : ''; 
                
                const user = getLoggedInUser();
                const replyButton = user.isLoggedIn 
                    ? `<button class="btn btn-sm btn-link text-decoration-none" style="color: var(--dark-green);" onclick="handleReply('${commentId}', '${name}')">
                            <i class="fas fa-reply me-1"></i> Trả lời
                        </button>`
                    : `<button class="btn btn-sm btn-link text-decoration-none text-muted" disabled>
                            <i class="fas fa-reply me-1"></i> Trả lời
                        </button>`;
                
                // Sử dụng class/style được sửa để đảm bảo hình tròn
                let avatarClass = 'user-avatar-comment me-3';
                let avatarStyle = '';
                if (isReply) {
                    // Avatar Reply nhỏ hơn, dùng màu nhấn
                    avatarStyle = `background: var(--accent-color); width: 30px; height: 30px; line-height: 30px; font-size: 0.75rem;`; 
                }
                // Avatar chính dùng style từ CSS (primary-green, 40px)

                let commentBlock = `
                <div class="comment-item" style="${marginStyle}">
                    <div class="d-flex align-items-start">
                        <div class="${avatarClass}" style="${avatarStyle}">${avatarLetter}</div>
                        <div class="flex-grow-1">
                            <h6 class="m-0 fw-bold ${isReply ? 'text-dark-green' : 'text-primary'}">${name}</h6>
                            <p class="text-muted small mb-1">${comment.date || 'Vừa xong'}</p>
                            <div class="mb-2 text-wrap">${comment.content}</div>
                            ${replyButton}
                            <div id="reply-form-placeholder-${commentId}" class="mt-2"></div>
                        </div>
                    </div>`;
                if (comment.replies && comment.replies.length > 0) {
                     comment.replies.forEach(reply => { commentBlock += buildCommentHtml(reply, depth + 1); });
                }
                commentBlock += '</div>';
                return commentBlock;
            }

            nestedComments.forEach(comment => { html += buildCommentHtml(comment); });
            commentsList.innerHTML = html;
        }

        async function loadComments(postId, skipSpinner = false) {
            const commentsList = document.getElementById('commentsList');
            const btn = document.getElementById('btnSubmitComment');
            
            const user = getLoggedInUser();
            const initialCommentStatus = user.isLoggedIn ? 'Gửi Bình Luận' : 'Gửi Bình Luận'; 

            if (!skipSpinner) {
                commentsList.innerHTML = '<div class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-2 text-primary-green"></i>Đang tải bình luận...</div>';
            }

            try {
                const response = await fetch(`${N8N_GET_COMMENTS}?post_id=${postId}`);
                const data = await response.json();
                const flatComments = Array.isArray(data) ? data : (data.data || []); 
                renderComments(flatComments);
                
                btn.innerHTML = initialCommentStatus; 
                btn.disabled = !user.isLoggedIn;

            } catch (error) {
                console.error("Lỗi tải bình luận:", error);
                commentsList.innerHTML = '<div class="alert alert-danger">Không thể tải bình luận.</div>';
                btn.innerHTML = initialCommentStatus;
                btn.disabled = !user.isLoggedIn;
            }
        }

        function handleReply(commentId, authorName) { 
            const user = getLoggedInUser();
            const commentContent = document.getElementById('commentContent');

            if (!user.isLoggedIn) { alert("Vui lòng đăng nhập Admin để trả lời!"); return; }

            const formContainer = document.getElementById('commentFormContainer');
            const placeholder = document.getElementById(`reply-form-placeholder-${commentId}`);
            const currentParentIdInput = document.getElementById('commentParentId');
            const commentAsUser = document.getElementById('commentAsUser');
            
            resetCommentFormState();
            
            currentParentIdInput.value = commentId; 
            
            placeholder.appendChild(formContainer);
            
            commentAsUser.innerHTML = `<i class="fas fa-reply me-1"></i> Trả lời <span class="text-danger fw-bold">${authorName}</span> với tư cách: <span class="text-primary">${user.name}</span> <button class="btn btn-sm btn-link text-danger" onclick="resetCommentFormState()">Hủy</button>`;
            
            document.getElementById('btnSubmitComment').disabled = false;
            commentContent.disabled = false;
            commentContent.focus(); 
            commentContent.value = `@${authorName} `;
        }

        function resetCommentFormState() { 
            const user = getLoggedInUser();
            const commentSection = document.getElementById('commentSection');
            const formContainer = document.getElementById('commentFormContainer');
            const currentParentIdInput = document.getElementById('commentParentId');
            const commentContent = document.getElementById('commentContent');
            const commentAsUser = document.getElementById('commentAsUser');
            const btnSubmitComment = document.getElementById('btnSubmitComment');
            const initialCommentStatus = user.isLoggedIn ? 'Gửi Bình Luận' : 'Gửi Bình Luận'; 


            if (formContainer.parentNode !== commentSection) {
                commentSection.appendChild(formContainer);
            }
            
            currentParentIdInput.value = '';
            commentContent.value = '';
            
            if (user.isLoggedIn) {
                 commentAsUser.innerHTML = `<i class="fas fa-user-check me-1"></i>Bình luận với tư cách: <span class="text-primary">${user.name}</span>`;
                 btnSubmitComment.disabled = false;
                 commentContent.disabled = false;
            } else {
                 commentAsUser.innerHTML = `<i class="fas fa-exclamation-triangle me-1 text-danger"></i>Vui lòng đăng nhập Admin để bình luận.`;
                 btnSubmitComment.disabled = true;
                 commentContent.disabled = true;
            }
            btnSubmitComment.innerHTML = initialCommentStatus;
        }
        
        async function submitComment(e) { 
            e.preventDefault();
            const btn = document.getElementById('btnSubmitComment');
            const postId = document.getElementById('commentPostId').value;
            const content = document.getElementById('commentContent').value;
            const author = document.getElementById('commentUserName').value;
            const email = document.getElementById('commentUserEmail').value;
            const parentId = document.getElementById('commentParentId').value; 

            if (!postId || !content || !email) {
                console.error("Thiếu thông tin bình luận cần thiết.");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang gửi...'; 
            btn.disabled = true;

            try {
                const response = await fetch(N8N_SUBMIT_COMMENT, {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        post_id: postId,
                        author: author,
                        email: email,
                        content: content,
                        date: new Date().toISOString().replace('T', ' ').substring(0, 19), 
                        parent_comment_id: parentId || null
                    })
                });

                if (response.ok) {
                    document.getElementById('commentContent').value = ''; 
                    
                    loadComments(postId, true); 

                    if (parentId) {
                        resetCommentFormState();
                    }

                } else {
                    console.error("Lỗi khi gửi bình luận. Webhook trả về lỗi.");
                    alert("Gửi bình luận thất bại.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Lỗi kết nối Webhook:", error);
                alert("Lỗi kết nối.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            } 
        }

        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
