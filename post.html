<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Chi tiết Bài viết - CHONANHNHANH.VN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00ebb0; --gold-vip: #f0c300; --bg-deep: #050a14; --neon: 0 0 20px rgba(0, 235, 176, 0.4); --card-glass: rgba(10, 17, 36, 0.95); --border-glass: rgba(255, 255, 255, 0.1); }
        html { scroll-behavior: smooth; }
        body { margin: 0; padding-top: 100px; font-family: 'Montserrat', sans-serif; background-color: var(--bg-deep); background-image: linear-gradient(to bottom, rgba(5, 10, 20, 1) 0%, rgba(5, 10, 20, 0.8) 40%, rgba(5, 10, 20, 0.95) 100%), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; min-height: 100vh; }

        .navbar { background: rgba(5, 10, 20, 0.95); backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255,255,255,0.08); min-height: 80px; position: fixed; width: 100%; top: 0; z-index: 2000; }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); font-size: 1.25rem; }
        .nav-link-custom { color: #94a3b8 !important; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; transition: 0.3s; padding: 0.5rem 1rem; text-decoration: none; }
        .nav-link-custom:hover { color: var(--primary) !important; }
        
        /* Main Content Compact */
        .main-content { background: var(--card-glass); padding: 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); border: 1px solid var(--border-glass); }
        .post-title { font-weight: 900; color: #fff; margin-bottom: 10px; font-size: 2.6rem; line-height: 1.2; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .post-meta { color: #94a3b8; font-size: 0.9rem; padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; border-bottom: 1px solid var(--border-glass); font-weight: 600; }
        
        .post-image { max-height: 550px; width: 100%; object-fit: cover; border-radius: 20px; margin: 10px 0 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid var(--border-glass); }
        
        /* AUTHOR UI BELOW IMAGE */
        #postAuthorContainer { background: rgba(0, 235, 176, 0.05); border-radius: 20px; padding: 20px 25px; margin-bottom: 35px; border: 1px solid rgba(0, 235, 176, 0.2); display: flex; align-items: center; gap: 15px; width: fit-content; }
        #postAuthorAvatar { width: 50px; height: 50px; line-height: 50px; text-align: center; background: var(--primary); color: #000; border-radius: 50%; font-weight: 900; font-size: 1.2rem; box-shadow: var(--neon); border: 2px solid #fff; }
        
        /* FIX READ MORE POSITION */
        #postContentWrapper { margin-bottom: 10px; position: relative; overflow: hidden; transition: max-height 0.5s ease; }
        .post-content { line-height: 1.8; font-size: 1.1rem; color: #e2e8f0; white-space: pre-wrap; text-align: justify; }
        .post-content p { margin-bottom: 1.5em; }

        #readMoreBtn { background: var(--primary); border: none; color: #000; font-weight: 900; padding: 12px 30px; border-radius: 50px; cursor: pointer; margin: 20px 0; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem; display: block; width: fit-content; box-shadow: var(--neon); }
        #readMoreBtn:hover { transform: scale(1.05); filter: brightness(1.1); }
        
        /* COMMENTS */
        #commentSectionContainer { margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border-glass); }
        .comment-header-title { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin-bottom: 25px; }
        .user-avatar-comment { width: 42px; height: 42px; background: var(--primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
        .comment-item { padding: 18px 0; border-bottom: 1px solid var(--border-glass); }
        
        .form-control { background: rgba(0,0,0,0.4) !important; border: 1px solid var(--border-glass) !important; color: #fff !important; border-radius: 15px; padding: 15px; }
        .form-control:focus { border-color: var(--primary) !important; box-shadow: var(--neon) !important; }

        #btnSubmitComment { background: var(--primary) !important; color: #000 !important; font-weight: 900; padding: 12px 35px; border-radius: 50px; text-transform: uppercase; border: none; }

        @media (max-width: 768px) { .main-content { padding: 25px; } .post-title { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="blog.html">CHONANHNHANH.VN</a>
            <div class="ms-auto d-flex align-items-center">
                <a class="nav-link-custom me-2" href="admin.html"><i class="fas fa-home me-1"></i> Trang chủ</a>
                <a class="nav-link-custom" href="blog.html"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="postContainer" class="main-content">
                    <div class="text-center py-5" id="loadingMessage">
                        <i class="fas fa-atom fa-spin fa-3x text-primary mb-3"></i>
                        <p class="fw-bold text-primary">ĐANG TẢI NỘI DUNG VIP...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const N8N_GET_POST_DETAIL = 'https://dichvufb.tino.page/webhook/get-post-detail';
        const N8N_GET_COMMENTS = 'https://dichvufb.tino.page/webhook/get-comments';
        const N8N_SUBMIT_COMMENT = 'https://dichvufb.tino.page/webhook/submit-comment'; 
        const POST_CACHE_PREFIX = 'post_detail_';
        const CACHE_EXPIRY = 3600000; 
        const MAX_CONTENT_HEIGHT = 450; 
        
        function getLoggedInUser() {
            return { name: localStorage.getItem('admin_name'), email: localStorage.getItem('admin_email'), isLoggedIn: !!localStorage.getItem('admin_email') };
        }
        
        function extractDriveFileId(urlOrId) {
            if (urlOrId && urlOrId.includes('id=')) return urlOrId.split('id=')[1].split('&')[0];
            return urlOrId; 
        }
        
        function toggleReadMore() {
            const wrapper = document.getElementById('postContentWrapper');
            const btn = document.getElementById('readMoreBtn');
            const actualHeight = document.getElementById('postContentActual').scrollHeight;
            
            if (wrapper.classList.contains('collapsed')) {
                wrapper.classList.remove('collapsed');
                wrapper.style.maxHeight = (actualHeight + 50) + 'px'; 
                btn.innerHTML = 'Thu gọn <i class="fas fa-chevron-up ms-2"></i>';
            } else {
                wrapper.classList.add('collapsed');
                wrapper.style.maxHeight = MAX_CONTENT_HEIGHT + 'px'; 
                btn.innerHTML = 'Xem thêm <i class="fas fa-chevron-down ms-2"></i>';
            }
        }

        async function loadPostDetail(forceReload = false) {
            const postId = new URLSearchParams(window.location.search).get('id');
            const postContainer = document.getElementById('postContainer');
            if (!postId) { postContainer.innerHTML = '<div class="alert alert-danger">Lỗi: Không tìm thấy ID bài viết.</div>'; return; }

            const cacheKey = POST_CACHE_PREFIX + postId;
            const cachedData = JSON.parse(localStorage.getItem(cacheKey));
            if (!forceReload && cachedData && (Date.now() - cachedData.timestamp < CACHE_EXPIRY)) {
                document.getElementById('pageTitle').innerText = cachedData.blog.title;
                renderPost(cachedData.blog); loadComments(postId); return;
            } 

            try {
                const response = await fetch(`${N8N_GET_POST_DETAIL}?id=${postId}`);
                const rawData = await response.json();
                const blog = (Array.isArray(rawData) ? rawData : (rawData.data || []))[0];
                if (blog) {
                    localStorage.setItem(cacheKey, JSON.stringify({ blog: blog, timestamp: Date.now() }));
                    document.getElementById('pageTitle').innerText = blog.title;
                    renderPost(blog); loadComments(postId);
                }
            } catch (error) { console.error("Lỗi:", error); }
        }
        
        function renderPost(blog) {
            const driveFileId = extractDriveFileId(blog.image);
            const user = getLoggedInUser();
            const imageUrl = driveFileId ? `https://drive.google.com/thumbnail?id=${driveFileId}&sz=w800` : 'https://via.placeholder.com/1000x450';
            const fullContent = blog.content ? blog.content.replace(/\n/g, '</p><p>') : ''; 
            const wrappedContent = `<p>${fullContent}</p>`; 
            const requiresCollapse = blog.content && (blog.content.length > 700 || blog.content.split('\n').length > 12); 
            
            const authorName = blog.author || user.name || 'Thành viên';
            const authorAvatarLetter = authorName.charAt(0).toUpperCase();

            // RENDER ORDER: TITLE -> META -> CONTENT -> BUTTON -> IMAGE -> AUTHOR
            const contentHtml = `
                <h1 class="post-title">${blog.title}</h1>
                <div class="post-meta"><i class="far fa-calendar-alt me-2 text-primary"></i> ${blog.date} </div>

                <div id="postContentWrapper" class="${requiresCollapse ? 'collapsed' : ''}" style="${requiresCollapse ? `max-height: ${MAX_CONTENT_HEIGHT}px;` : 'max-height: none;'} transition: 0.5s; overflow:hidden;">
                    <div class="post-content" id="postContentActual">${wrappedContent}</div>
                </div>
                ${requiresCollapse ? `<button id="readMoreBtn" onclick="toggleReadMore()">Xem thêm <i class="fas fa-chevron-down ms-1"></i></button>` : ''}
                
                <img src="${imageUrl}" alt="${blog.title}" class="post-image" onerror="this.src='https://via.placeholder.com/1000x450'">

                <div id="postAuthorContainer">
                    <div id="postAuthorAvatar">${authorAvatarLetter}</div>
                    <div>
                        <span class="fw-bold" style="color:var(--primary); font-size:1.1rem;">${authorName}</span>
                        <p class="text-muted small m-0">Tác giả bài viết • CHONANHNHANH.VN</p>
                    </div>
                </div>
                <div id="commentSectionContainer"></div>
            `;
            document.getElementById('postContainer').innerHTML = contentHtml;
            renderCommentSection(blog.id); 
        }

        function renderCommentSection(postId) {
            const user = getLoggedInUser();
            const commentSection = document.getElementById('commentSectionContainer');
            const isDisabled = !user.isLoggedIn;
            const userStatusHtml = user.isLoggedIn 
                ? `<i class="fas fa-user-check me-2 text-primary"></i>Đang bình luận: <span class="text-primary fw-bold">${user.name}</span>`
                : `<i class="fas fa-lock me-2 text-warning"></i>Đăng nhập để gửi bình luận.`;

            commentSection.innerHTML = `
                <div id="commentSection">
                    <h4 class="comment-header-title"><i class="fas fa-comments me-2"></i>Thảo luận cộng đồng</h4>
                    <div id="commentsList" class="mb-4"></div>
                    <div id="commentFormContainer">
                        <h6 class="fw-bold mb-3" style="color:#94a3b8; font-size: 0.9rem;">${userStatusHtml}</h6>
                        <form id="commentForm" onsubmit="submitComment(event)">
                            <input type="hidden" id="commentPostId" value="${postId}">
                            <input type="hidden" id="commentUserName" value="${user.name || ''}">
                            <input type="hidden" id="commentUserEmail" value="${user.email || ''}">
                            <input type="hidden" id="commentParentId" value="">
                            <div class="mb-3"><textarea id="commentContent" class="form-control" rows="4" placeholder="Ý kiến của bạn..." required ${isDisabled ? 'disabled' : ''}></textarea></div>
                            <div class="text-end"><button type="submit" id="btnSubmitComment" class="btn" ${isDisabled ? 'disabled' : ''}>Gửi bình luận</button></div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderComments(data) {
            const list = document.getElementById('commentsList');
            const comments = Array.isArray(data) ? data : (data.data || []);
            if (comments.length === 0) { list.innerHTML = '<p class="text-muted py-3">Chưa có bình luận. Hãy chia sẻ cảm nghĩ của bạn!</p>'; return; }
            
            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="d-flex align-items-start gap-3">
                        <div class="user-avatar-comment">${(c.author || '?').charAt(0).toUpperCase()}</div>
                        <div>
                            <h6 class="m-0 fw-bold text-primary">${c.author}</h6>
                            <p class="text-muted small mb-1">${c.date || 'Vừa xong'}</p>
                            <div class="text-light">${c.content}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadComments(postId) {
            try {
                const response = await fetch(`${N8N_GET_COMMENTS}?post_id=${postId}`);
                renderComments(await response.json());
            } catch (e) { console.error(e); }
        }

        async function submitComment(e) { 
            e.preventDefault();
            const btn = document.getElementById('btnSubmitComment');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            try {
                const response = await fetch(N8N_SUBMIT_COMMENT, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        post_id: document.getElementById('commentPostId').value,
                        author: document.getElementById('commentUserName').value,
                        email: document.getElementById('commentUserEmail').value,
                        content: document.getElementById('commentContent').value,
                        date: new Date().toISOString().replace('T', ' ').substring(0, 19)
                    })
                });
                if (response.ok) { document.getElementById('commentContent').value = ''; loadComments(document.getElementById('commentPostId').value); }
            } catch (e) { alert("Lỗi!"); } finally { btn.innerHTML = 'Gửi bình luận'; btn.disabled = false; }
        }

        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
