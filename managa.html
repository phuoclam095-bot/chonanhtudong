<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chonanhnhanh.vn - Quản Lý Album VIP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --bg-blur: rgba(5, 10, 20, 0.4); /* Làm trong suốt nền để thấy ảnh nền */
            --glass: rgba(255, 255, 255, 0.05);
            --neon: 0 0 15px rgba(0, 235, 176, 0.5);
        }
        
        body { 
            background-color: #050a14;
            /* Cấu hình ảnh nền ưu tiên hiển thị */
            background-image: linear-gradient(to bottom, rgba(5,10,20,0.4) 0%, rgba(5,10,20,0.6) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            min-height: 100vh; 
            padding-top: 100px; 
            overflow-x: hidden;
        }

        /* --- NAVBAR: ƯU TIÊN THƯƠNG HIỆU chonanhnhanh.vn --- */
        .navbar { 
            background: rgba(5, 10, 20, 0.7); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 85px;
        }
        .navbar-brand { 
            font-weight: 900; 
            font-size: 1.6rem; 
            color: var(--primary) !important; 
            letter-spacing: -1px;
            text-shadow: var(--neon);
        }
        .brand-dot { color: #fff; }

        .nav-link { color: #94a3b8 !important; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding: 10px 15px !important; }
        .nav-link.active { color: #fff !important; background: rgba(0, 235, 176, 0.1); border-radius: 10px; }

        /* USER STATUS */
        .user-status-vip { 
            background: rgba(255,255,255,0.08); 
            border: 1px solid var(--primary); 
            border-radius: 50px; 
            padding: 5px 15px; 
            display: flex; align-items: center; gap: 10px;
        }
        .avatar-box { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--primary); }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        /* SEARCH TRONG SUỐT */
        .search-wrapper-vip { 
            max-width: 550px; margin: 0 auto 50px; 
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 235, 176, 0.3);
            border-radius: 50px;
            display: flex; align-items: center; padding: 5px 25px;
            backdrop-filter: blur(10px);
        }
        .search-wrapper-vip input { background: transparent; border: none; color: #fff; width: 100%; padding: 12px; font-weight: 700; outline: none; }
        .search-wrapper-vip i { color: var(--primary); font-size: 1.2rem; }

        /* --- GRID ALBUM TRONG SUỐT --- */
        #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 25px; padding: 0 20px; }
        
        .album-card-vip { 
            background: rgba(10, 20, 40, 0.5); /* Trong suốt hơn để thấy background */
            backdrop-filter: blur(10px);
            border-radius: 24px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1); 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .album-card-vip:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: var(--neon); }

        .card-img-header { height: 170px; position: relative; background-size: cover; background-position: center; }
        .album-vip-title { position: absolute; bottom: 12px; left: 20px; font-weight: 900; font-size: 1.1rem; color: #fff; text-shadow: 0 2px 10px #000; }

        .card-body-vip { padding: 20px; flex-grow: 1; }
        
        .stats-vip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-pill { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { display: block; font-weight: 900; font-size: 1.1rem; color: var(--primary); }
        .stat-lab { display: block; font-size: 0.6rem; font-weight: 800; color: #aaa; text-transform: uppercase; }

        .vip-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-vip { 
            height: 42px; border: none; border-radius: 10px; font-weight: 900; font-size: 0.65rem;
            text-transform: uppercase; color: #fff; display: flex; align-items: center; justify-content: center; 
        }
        .v-view { background: #3b82f6; } .v-drive { background: #10b981; } .v-export { background: #f59e0b; color: #000; }
        .v-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; grid-column: span 3; margin-top: 5px; height: 35px; }

        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-text { font-weight: 900; color: var(--primary); letter-spacing: 5px; margin-top: 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <div class="loading-text">CHONANHNHANH.VN</div>
    </div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="#">chonanhnhanh<span class="brand-dot">.vn</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="fas fa-bars"></i></button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active">Quản Lý</a></li>
                </ul>
                <div id="authControl" style="display: none;" class="align-items-center gap-3">
                    <div class="user-status-vip">
                        <div class="avatar-box" id="userAvatarPlaceholder"></div>
                        <span class="fw-bold text-white small" id="userNameDisplay">...</span>
                        <span id="badgeStatus" class="status-badge bg-active">...</span>
                    </div>
                    <button onclick="logoutAdmin()" class="btn btn-link text-danger p-0"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-lg-5">
        <div class="text-center mb-5">
            <h2 class="fw-900" style="font-size: 2.5rem; letter-spacing: -1px;">Dashboard <span style="color: var(--primary);">Manager</span></h2>
        </div>

        <div class="search-wrapper-vip">
            <i class="fas fa-search"></i>
            <input type="text" id="albumSearch" placeholder="Tìm kiếm album của bạn..." oninput="filterAlbums()">
            <span class="badge bg-primary text-dark rounded-pill px-3" id="albumCount">0</span>
        </div>

        <div id="albumGrid"></div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-900"><i class="fas fa-file-export me-2 text-primary"></i> DANH SÁCH FILE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert bg-primary text-dark fw-bold rounded-3 mb-3" id="modalInfo"></div>
                    <textarea id="fileNamesOutput" class="form-control" rows="12" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100 py-3 rounded-3 fw-bold text-dark" onclick="copyFileNames()">SAO CHÉP TẤT CẢ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const URL_GET_ALBUM_LIST = 'https://dichvufb.tino.page/webhook/get-album-list';
        const URL_DELETE_ALBUM = 'https://dichvufb.tino.page/webhook/delete-album'; 
        const URL_EXPORT_FILENAMES = 'https://dichvufb.tino.page/webhook/export_filenames'; 
        const DOMAIN_CLIENT = 'https://phuoclam095-bot.github.io/chonanhtudong/'; 

        let adminEmail = localStorage.getItem('admin_email'), allAlbums = [];

        function filterAlbums() {
            const kw = document.getElementById('albumSearch').value.toLowerCase();
            renderAlbums(allAlbums.filter(a => (a.folderName || a.name || '').toLowerCase().includes(kw)));
        }

        function renderAlbums(albums) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = albums.length ? '' : '<div class="text-center w-100 py-5 opacity-50">Không có dữ liệu...</div>';
            albums.forEach(a => grid.appendChild(createAlbumCard(a)));
            document.getElementById('albumCount').innerText = albums.length;
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            const id = album.folder_id || album.folderId;
            card.id = `card-${id}`; card.className = 'album-card-vip';
            const rawName = album.folderName || album.name || 'Album VIP';
            const img = album.thumbnailFileId ? `https://drive.google.com/thumbnail?id=${album.thumbnailFileId}&sz=w600` : 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';
            
            card.innerHTML = `
                <div class="card-img-header" style="background-image: url('${img}');">
                    <div class="album-vip-title">${rawName}</div>
                </div>
                <div class="card-body-vip">
                    <div class="stats-vip-row">
                        <div class="stat-pill" onclick="window.open('${DOMAIN_CLIENT}client.html?id=${id}&mode=selected', '_blank')">
                            <span class="stat-val">${album.selected_photos || 0}</span>
                            <span class="stat-lab">Đã chọn</span>
                        </div>
                        <div class="stat-pill">
                            <span class="stat-val">${album.total_photos || 0}</span>
                            <span class="stat-lab">Tổng ảnh</span>
                        </div>
                    </div>
                    <div class="vip-actions-grid">
                        <button class="btn-vip v-view" onclick="window.open('${DOMAIN_CLIENT}client.html?id=${id}', '_blank')">XEM</button>
                        <button class="btn-vip v-drive" onclick="window.open('https://drive.google.com/drive/folders/${id}', '_blank')">DRIVE</button>
                        <button class="btn-vip v-export" onclick="handleExportClick('${id}', '${rawName.replace(/'/g, "\\'")}')">XUẤT</button> 
                        <button class="btn-vip v-delete" onclick="deleteAlbum('${id}', '${rawName.replace(/'/g, "\\'")}')">XÓA VĨNH VIỄN</button>
                    </div>
                </div>`;
            return card;
        }

        async function handleExportClick(albumId, albumName) {
            try {
                const res = await fetch(URL_EXPORT_FILENAMES, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folderId: albumId, adminEmail: adminEmail, action: 'export_filenames_request' })
                });
                const result = await res.json();
                const data = Array.isArray(result) ? result[0] : result;
                if (data && data.fileNamesForCopy) {
                    document.getElementById('modalInfo').innerHTML = `Album: ${albumName} | ${data.selectedPhotos || 0} ảnh`;
                    document.getElementById('fileNamesOutput').value = data.fileNamesForCopy.split(',').map(n => n.trim()).join('\n');
                    new bootstrap.Modal(document.getElementById('exportModal')).show();
                }
            } catch (e) { alert("Lỗi trích xuất!"); }
        }

        function copyFileNames() {
            const txt = document.getElementById('fileNamesOutput').value;
            navigator.clipboard.writeText(txt.split('\n').join(',')).then(() => alert("✅ Đã copy!"));
        }

        async function deleteAlbum(id, name) {
            if (!confirm(`Xóa album: ${name}?`)) return;
            try {
                const res = await fetch(URL_DELETE_ALBUM, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: id, adminEmail: adminEmail }) });
                const r = await res.json();
                if (r.success) { document.getElementById(`card-${id}`).remove(); }
            } catch (e) { alert("Lỗi xóa!"); }
        }

        function updateHeaderUI() {
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name');
                const avatar = localStorage.getItem('admin_avatar');
                const status = localStorage.getItem('admin_status') || 'new';
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}">` : name.charAt(0).toUpperCase();
                document.getElementById('badgeStatus').innerText = status.toUpperCase();
                document.getElementById('authControl').style.display = 'flex';
            } else { window.location.href = 'admin.html'; }
        }

        async function init() {
            updateHeaderUI();
            try {
                const res = await fetch(`${URL_GET_ALBUM_LIST}?adminEmail=${adminEmail}`);
                allAlbums = await res.json();
                renderAlbums(allAlbums);
                document.getElementById('loadOverlay').style.display = 'none';
            } catch (e) { }
        }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
