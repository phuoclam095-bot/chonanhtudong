<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHONANHNHANH.VN - QUẢN LÝ ALBUM VIP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --bg-deep: #050a14; 
            --neon: 0 0 20px rgba(0, 235, 176, 0.4);
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.5) 0%, rgba(5, 10, 20, 0.7) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-top: 105px; overflow-x: hidden;
        }

        /* --- NAVBAR & TABS ĐỒNG BỘ --- */
        .navbar { background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 90px; }
        .navbar-brand { font-weight: 900; font-size: 1.5rem; color: var(--primary) !important; text-shadow: var(--neon); letter-spacing: -1px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 10px 15px !important; transition: 0.3s ease; position: relative; }
        .nav-link:hover { color: #fff !important; }
        .nav-link.active { color: var(--primary) !important; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 5px; left: 50%; background: var(--primary); transition: 0.3s ease; transform: translateX(-50%); }
        .nav-link:hover::after, .nav-link.active::after { width: 60%; box-shadow: var(--neon); }

        /* USER STATUS BOX ĐỒNG BỘ */
        .user-status-box { background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 50px; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--primary); }
        .avatar-circle { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--primary); background: #000; display: flex; align-items: center; justify-content: center; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .status-badge { font-size: 0.55rem; padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
        .bg-active { background: var(--primary); color: #000; }
        .bg-expired { background: #ff4757; color: #fff; }

        /* TITLE QUẢN LÝ ALBUM 11 SAO */
        .supreme-title { 
            font-weight: 900; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 10px;
            background: linear-gradient(to bottom, #fff 20%, var(--primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 235, 176, 0.2); margin-bottom: 40px; text-align: center;
        }

        /* SEARCH RAINBOW */
        .search-wrapper { max-width: 550px; margin: 0 auto 50px; padding: 3px; border-radius: 50px; background: var(--rainbow); background-size: 200% auto; animation: rainbow-run 4s linear infinite; }
        @keyframes rainbow-run { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .search-inner { background: #080d1a; border-radius: 50px; display: flex; align-items: center; padding: 5px 25px; }
        .search-inner input { background: transparent; border: none; color: white; width: 100%; padding: 10px; font-weight: 700; outline: none; }

        /* ALBUM GRID */
        #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 0 20px; }
        .album-card-vip { background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(15px); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; display: flex; flex-direction: column; }
        .album-card-vip:hover { border-color: var(--primary); box-shadow: var(--neon); transform: translateY(-5px); }
        .card-img-header { height: 170px; background-size: cover; background-position: center; position: relative; }
        .album-vip-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); font-weight: 900; font-size: 1rem; color: #fff; text-align: center; }

        /* STATS PILLS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px 20px 0 20px; }
        .stat-pill { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; text-align: center; transition: 0.3s; cursor: pointer; }
        .stat-pill:hover { border-color: var(--primary); background: rgba(0, 235, 176, 0.1); }
        .stat-val { display: block; font-weight: 900; font-size: 1.2rem; color: var(--primary); }
        .stat-lab { display: block; font-size: 0.6rem; font-weight: 800; color: #64748b; text-transform: uppercase; }

        /* ACTIONS */
        .vip-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px 20px 20px 20px; }
        .btn-vip { height: 40px; border: none; border-radius: 12px; font-weight: 900; font-size: 0.7rem; text-transform: uppercase; color: #fff; transition: 0.2s; }
        .v-view { background: #3b82f6; } .v-drive { background: #10b981; } .v-export { background: #f59e0b; color: #000; }
        .v-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; grid-column: span 3; margin-top: 5px; height: 35px; }

        /* NOTIFICATION */
        #toastNotice { position: fixed; top: 110px; right: 30px; background: var(--primary); color: #000; padding: 15px 35px; border-radius: 15px; z-index: 10000; font-weight: 900; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        .modal-content { background: #080d1a; border: 1px solid var(--primary); border-radius: 30px; }
        textarea { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: var(--primary) !important; font-family: monospace; border-radius: 15px !important; }

        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    </div>

    <div id="toastNotice"></div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="admin.html">CHONANHNHANH.VN</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active">Quản Lý</a></li>
                </ul>
                <div id="authControl" style="display: none !important;" class="align-items-center gap-3">
                    <div class="user-status-box">
                        <div class="avatar-circle" id="userAvatarPlaceholder"></div>
                        <div class="d-flex flex-column overflow-hidden">
                            <span id="userNameDisplay" style="font-weight:900; font-size:0.8rem; line-height:1; color:#fff;">...</span>
                            <div class="d-flex align-items-center gap-2">
                                <span id="badgeStatus" class="status-badge">...</span>
                                <span id="userExpiryText" style="font-size:0.55rem; color:#94a3b8; margin-top:2px;"></span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-link text-danger p-0" onclick="logoutAdmin()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="mt-5">
            <h1 class="supreme-title">Quản Lý Album</h1>
        </div>

        <div class="search-wrapper">
            <div class="search-inner">
                <i class="fas fa-search me-3" style="color:var(--primary)"></i>
                <input type="text" id="albumSearch" placeholder="Tìm kiếm tên album..." oninput="filterAlbums()">
                <span class="badge bg-dark text-primary rounded-pill px-3" id="albumCount">0</span>
            </div>
        </div>

        <div id="albumGrid"></div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-900 text-white">DANH SÁCH FILE ĐÃ LỌC</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert bg-primary text-dark fw-bold rounded-4 mb-4 text-center" id="modalInfo"></div>
                    <textarea id="fileNamesOutput" class="form-control" rows="12" readonly></textarea>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-primary w-100 py-3 rounded-4 fw-900 text-dark" onclick="copyFileNames()">SAO CHÉP DANH SÁCH</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PATHS = { LIST: 'https://dichvufb.tino.page/webhook/get-album-list', DELETE: 'https://dichvufb.tino.page/webhook/delete-album', EXPORT: 'https://dichvufb.tino.page/webhook/export_filenames', CLIENT: 'https://phuoclam095-bot.github.io/chonanhtudong/' };
        let adminEmail = localStorage.getItem('admin_email'), allAlbums = [];

        function showToast(msg) {
            const t = document.getElementById('toastNotice');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function filterAlbums() {
            const kw = document.getElementById('albumSearch').value.toLowerCase();
            renderAlbums(allAlbums.filter(a => (a.folderName || a.name || '').toLowerCase().includes(kw)));
        }

        function renderAlbums(albums) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = albums.length ? '' : '<div class="text-center w-100 py-5 opacity-50">Dữ liệu trống.</div>';
            albums.forEach(a => grid.appendChild(createAlbumCard(a)));
            document.getElementById('albumCount').innerText = albums.length;
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            const id = album.folder_id || album.folderId; card.className = 'album-card-vip'; card.id = `card-${id}`;
            const img = album.thumbnailFileId ? `https://drive.google.com/thumbnail?id=${album.thumbnailFileId}&sz=w600` : 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';
            
            card.innerHTML = `
                <div class="card-img-header" style="background-image: url('${img}');">
                    <div class="album-vip-title">${album.folderName || album.name || 'VIP Album'}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-pill" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}&mode=selected', '_blank')">
                        <span class="stat-val">${album.selected_photos || 0}</span>
                        <span class="stat-lab">Đã chọn</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-val text-white">${album.total_photos || 0}</span>
                        <span class="stat-lab">Tổng ảnh</span>
                    </div>
                    <div class="stat-pill" style="grid-column: span 2;" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}&mode=notes', '_blank')">
                        <span class="stat-val text-info"><i class="fas fa-comment-dots me-2"></i>${album.comments || 0}</span>
                        <span class="stat-lab">Ghi chú từ khách</span>
                    </div>
                </div>
                <div class="vip-actions-grid">
                    <button class="btn-vip v-view" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}', '_blank')"><i class="fas fa-eye"></i></button>
                    <button class="btn-vip v-drive" onclick="window.open('https://drive.google.com/drive/folders/${id}', '_blank')"><i class="fab fa-google-drive"></i></button>
                    <button class="btn-vip v-export" onclick="handleExportClick('${id}', '${(album.folderName || album.name).replace(/'/g, "\\'")}')"><i class="fas fa-file-export"></i></button> 
                    <button class="btn-vip v-delete" onclick="deleteAlbum('${id}', '${(album.folderName || album.name).replace(/'/g, "\\'")}')">Xóa album</button>
                </div>`;
            return card;
        }

        async function handleExportClick(albumId, albumName) {
            showToast("Đang trích xuất...");
            try {
                const res = await fetch(PATHS.EXPORT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: albumId, adminEmail: adminEmail }) });
                const data = await res.json();
                const result = Array.isArray(data) ? data[0] : data;
                if (result?.fileNamesForCopy) {
                    document.getElementById('modalInfo').innerText = `Album: ${albumName} (${result.selectedPhotos || 0} ảnh)`;
                    document.getElementById('fileNamesOutput').value = result.fileNamesForCopy.split(',').map(n => n.trim()).join('\n');
                    new bootstrap.Modal(document.getElementById('exportModal')).show();
                    showToast("Xuất dữ liệu thành công");
                } else { showToast("Không có ảnh nào được chọn"); }
            } catch (e) { showToast("Lỗi hệ thống"); }
        }

        function copyFileNames() {
            const txt = document.getElementById('fileNamesOutput').value;
            if(!txt) return;
            navigator.clipboard.writeText(txt.split('\n').join(',')).then(() => {
                showToast("Đã sao chép danh sách");
            });
        }

        async function deleteAlbum(id, name) {
            if (!confirm(`Xóa album: ${name}?`)) return;
            try {
                const res = await fetch(PATHS.DELETE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: id, adminEmail: adminEmail }) });
                const r = await res.json();
                if (r.success) { document.getElementById(`card-${id}`).remove(); showToast("Đã xóa album"); }
            } catch (e) { showToast("Lỗi xóa"); }
        }

        function updateHeaderUI() {
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name');
                const avatar = localStorage.getItem('admin_avatar');
                const status = localStorage.getItem('admin_status') || 'new';
                const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
                
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = avatar && avatar !== 'null' ? `<img src="${avatar}">` : `<i class="fas fa-user-circle" style="font-size:32px; color:var(--primary)"></i>`;
                
                const badge = document.getElementById('badgeStatus');
                const expText = document.getElementById('userExpiryText');

                if (status === 'active' && expiry > Date.now()) {
                    badge.innerText = "Active VIP"; badge.className = "status-badge bg-active";
                    expText.innerText = `Hạn: ${new Date(expiry).toLocaleDateString('vi-VN')}`;
                } else if (status === 'new') {
                    badge.innerText = "New Member"; badge.className = "status-badge bg-new";
                } else {
                    badge.innerText = "Expired"; badge.className = "status-badge bg-expired";
                    expText.innerText = "Cần gia hạn";
                }
                document.getElementById('authControl').style.setProperty('display', 'flex', 'important');
            } else { window.location.href = 'admin.html'; }
        }

        async function init() {
            updateHeaderUI();
            try {
                const res = await fetch(`${PATHS.LIST}?adminEmail=${adminEmail}`);
                allAlbums = await res.json();
                renderAlbums(allAlbums);
                document.getElementById('loadOverlay').style.display = 'none';
            } catch (e) { }
        }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
