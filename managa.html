<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dard Quản Lý Album</title>

    <!-- FONT & BOOTSTRAP -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-green: #147a30;
            --dark-green: #0e5a22;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Segoe UI", sans-serif;
            padding-top: 70px;
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--primary-green);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .nav-links a {
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-links a:hover { background: var(--dark-green); }

        /* GRID */
        #albumGrid {
            margin: 30px auto;
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .album-card {
            background: white;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            padding: 20px;
        }

        .album-card-header {
            height: 150px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            margin: -20px -20px 12px -20px;
        }

        .action-btns button { width: 100%; margin-bottom: 8px; }

        .btn-view { background: #007bff; color: white; }
        .btn-export { background: #ffc107; color: black; }
        .btn-delete { background: #dc3545; color: white; }

        /* MODAL */
        .modal-header { background: var(--primary-green); color: white; }
        textarea { background: #f1f1f1; font-family: monospace; }
    </style>
</head>

<body>

    <!-- ---------------------- HEADER ---------------------- -->
    <div class="header">
        <div class="logo"><i class="fa fa-chart-line"></i> Dashboard Quản Lý</div>

        <div class="nav-links d-flex gap-3">
            <a href="admin.html"><i class="fa fa-plus-circle"></i> Tạo Album</a>
            <a href="copy_local.html"><i class="fa fa-copy"></i> Sao Chép Ảnh</a>
            <a href="#"><i class="fa fa-hand-holding-usd"></i> Donate</a>

            <div id="userControl" class="dropdown" style="display:none;">
                <a class="dropdown-toggle nav-link" href="#" data-bs-toggle="dropdown">
                    <span id="userEmailDisplay">Admin</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" style="background: var(--dark-green);">
                    <li><a class="dropdown-item active" href="managa.html">
                        <i class="fa fa-folder-open"></i> Quản Lý Album
                    </a></li>
                    <li><a class="dropdown-item" onclick="logoutAdmin()">
                        <i class="fa fa-sign-out-alt"></i> Đăng Xuất
                    </a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- ---------------------- CONTENT ---------------------- -->

    <div class="text-center mt-4">
        <h2>Danh Sách Album (<span id="albumCount">0</span>)</h2>
    </div>

    <div id="albumGrid">
        <div id="loadingMessage" class="text-center text-white">
            <i class="fa fa-spinner fa-spin"></i> Đang tải dữ liệu album...
        </div>
    </div>

    <!-- ---------------------- MODAL EXPORT ---------------------- -->
    <div class="modal fade" id="exportModal">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa fa-file-export me-2"></i>Danh sách file</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="text-secondary">Sao chép chuỗi bên dưới:</p>

                    <div class="alert alert-info">
                        Album: <strong id="modalAlbumName"></strong> — 
                        Ảnh chọn: <strong id="modalSelectedCount"></strong>
                    </div>

                    <textarea id="fileNamesOutput" rows="8" class="form-control" readonly></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button class="btn btn-primary" onclick="copyFileNames()">
                        <i class="fa fa-copy me-2"></i>Sao Chép
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ---------------------- SCRIPT LOGIC ---------------------- -->
    <script>

        /* ---------------- CONFIG ---------------- */
        const URL_GET_ALBUM_LIST = "https://dichvufb.tino.page/webhook/get-album-list";
        const URL_DELETE_ALBUM   = "https://dichvufb.tino.page/webhook/delete-album";
        const URL_EXPORT_FILE    = "https://dichvufb.tino.page/webhook/export_filenames";

        const DOMAIN_CLIENT      = "https://phuoclam095-bot.github.io/chonanhtudong/";
        const DEFAULT_THUMBNAIL  = "https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80";

        const adminEmail = localStorage.getItem("admin_email");
        const adminName  = localStorage.getItem("admin_name");
        const isLoggedIn = localStorage.getItem("admin_is_logged_in") === "true";

        /* ---------------- UI LOGIN ---------------- */
        function checkLogin() {
            if (!isLoggedIn) {
                window.location.href = "admin.html";
                return;
            }
            document.getElementById("userControl").style.display = "block";
            document.getElementById("userEmailDisplay").innerText = adminName || adminEmail;
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.href = "admin.html";
        }

        /* ---------------- COPY ---------------- */
        function copyFileNames() {
            let txt = document.getElementById("fileNamesOutput").value;
            navigator.clipboard.writeText(txt);
            alert("Đã sao chép!");
        }

        /* ---------------- EXPORT ---------------- */
        async function handleExportClick(id, name) {
            if (!confirm(`Xuất danh sách file của album "${name}"?`)) return;

            const response = await fetch(URL_EXPORT_FILE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ folderId: id, adminEmail })
            });

            const result = await response.json();
            const data = Array.isArray(result) ? result[0] : result;

            document.getElementById("modalAlbumName").innerText = name;
            document.getElementById("modalSelectedCount").innerText = data.selected_photos;
            document.getElementById("fileNamesOutput").value = data.file_names_for_copy.replace(/,/g, ", ");

            new bootstrap.Modal("#exportModal").show();
        }

        /* ---------------- DELETE ---------------- */
        async function deleteAlbum(id, name) {
            if (!confirm(`Xóa album "${name}"?`)) return;

            const response = await fetch(URL_DELETE_ALBUM, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ folderId: id, adminEmail })
            });

            const result = await response.json();
            if (result.success) {
                alert("Đã xóa!");
                loadAlbums();
            }
        }

        /* ---------------- LOAD ALBUM ---------------- */
        async function loadAlbums() {
            const grid = document.getElementById("albumGrid");
            const count = document.getElementById("albumCount");
            grid.innerHTML = "";

            const res = await fetch(`${URL_GET_ALBUM_LIST}?adminEmail=${adminEmail}`);
            const albums = await res.json();

            count.innerText = albums.length;

            albums.forEach(album => {
                let id = album.folder_id;
                let name = album.folderName;
                let preview = album.previewImageURL || DEFAULT_THUMBNAIL;

                let div = document.createElement("div");
                div.className = "album-card";
                div.innerHTML = `
                    <div class="album-card-header" style="background-image:url('${preview}')"></div>
                    <h5>${name}</h5>

                    <p><i class="fa fa-check-circle"></i> Đã chọn: ${album.selected_photos}</p>
                    <p><i class="fa fa-images"></i> Tổng ảnh: ${album.total_photos}</p>

                    <div class="action-btns">
                        <button class="btn btn-view" onclick="window.open('${DOMAIN_CLIENT}client.html?id=${id}')">
                            Xem Album
                        </button>
                        <button class="btn btn-export" onclick="handleExportClick('${id}', '${name}')">
                            Xuất File
                        </button>
                        <button class="btn btn-delete" onclick="deleteAlbum('${id}', '${name}')">
                            Xóa
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        /* ---------------- INIT ---------------- */
        checkLogin();
        loadAlbums();

    </script>

</body>
</html>
