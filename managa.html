<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #147a30; 
            --dark-green: #0e5a22;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: rgba(255, 255, 255, 0.98);
            --accent-color: #51ff7d;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding-top: 80px;
        }
        
        /* NAVBAR */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        
        /* DASHBOARD CONTENT */
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        h2 { color: var(--accent-color); text-align: center; margin-bottom: 50px; font-weight: 800; text-shadow: 0 0 20px rgba(81, 255, 125, 0.5); font-size: 2.2rem; }

        /* ALBUM GRID */
        #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 35px; padding-bottom: 50px; }
        .album-card { 
            background: var(--card-bg); color: #333; border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); transition: all 0.3s; display: flex; flex-direction: column; 
        }
        .album-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4); }

        .album-card-header { height: 220px; background-size: cover; background-position: center; position: relative; }
        .album-title-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white; font-weight: 800; font-size: 1.2rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .card-body-custom { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; font-size: 0.95rem; }
        .stats-item { display: flex; align-items: center; gap: 8px; color: #555; font-weight: 600; }
        
        /* ACTION BUTTONS */
        .action-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .action-btns button { 
            padding: 10px; border: none; border-radius: 12px; font-weight: 700; font-size: 13px; color: white;
            display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s;
        }
        .action-btns button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }
        .action-btns button:disabled { background: #999 !important; cursor: not-allowed; transform: none; filter: grayscale(1); }

        /* STATUS BADGE */
        .status-pill { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; margin-left: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; }
        /* MAPPING LẠI MÀU SẮC DỰA TRÊN TRẠNG THÁI KỸ THUẬT */
        .bg-active { background: #198754; color: white; box-shadow: 0 0 10px rgba(25, 135, 84, 0.5); } /* ACTIVE = Green */
        .bg-new { background: #0d6efd; color: white; } /* NEW = Blue */
        .bg-expired { background: #dc3545; color: white; } /* EXPIRED = Red */

        .user-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); }
        .user-info-mobile { display: flex; align-items: center; gap: 10px; }
        
        /* LICENSE ALERT */
        .license-alert { 
            background-color: #f8d7da; color: #842029; border-color: #f5c6cb;
            border-radius: 15px; padding: 15px 25px; margin-bottom: 25px;
            font-size: 1.05rem; display: flex; align-items: center; gap: 15px;
        }
        .license-alert a { color: #842029; font-weight: 800; text-decoration: underline; }
        
        /* Mobile */
        @media (max-width: 768px) {
            .dashboard-container { padding: 20px 15px; }
            #albumGrid { grid-template-columns: 1fr; }
            .user-info-mobile { margin-top: 15px; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-chart-line me-2"></i>Dashboard</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a href="admin.html" class="nav-link"><i class="fas fa-plus-circle"></i> Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link"><i class="fas fa-copy"></i> Sao Chép Ảnh</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link"><i class="fas fa-hand-holding-usd"></i> Donate</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link"><i class="fas fa-envelope"></i> Liên Hệ</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active"><i class="fas fa-folder-open"></i> Quản Lý</a></li>
                </ul>

                <div id="authControl" style="display: none;" class="d-flex align-items-center gap-3 user-info-mobile">
                    <div id="userEmailDisplay" class="d-flex align-items-center text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">
                        <i class="fas fa-user-circle me-2"></i> Admin
                    </div>
                    <a href="javascript:void(0);" onclick="logoutAdmin()" class="btn btn-danger fw-bold rounded-pill px-3">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div id="licenseAlert" class="license-alert shadow" style="display: none;">
            <i class="fas fa-exclamation-triangle fa-2x text-warning"></i>
            <div id="alertMessage"></div>
        </div>

        <h2><i class="fas fa-layer-group me-3"></i>Danh Sách Album (<span id="albumCount">0</span>)</h2>
        
        <div id="albumGrid">
            <div id="loadingMessage" style="color: white; text-align: center; font-size: 1.2rem; grid-column: 1 / -1;">
                <i class="fas fa-spinner fa-spin me-2"></i> Đang tải dữ liệu album...
            </div>
        </div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-white bg-success">
                    <h5 class="modal-title"><i class="fas fa-file-export me-2"></i> KẾT QUẢ XUẤT FILE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-light">
                    <p class="text-secondary fw-bold">Sao chép danh sách bên dưới để lọc ảnh:</p>
                    <div class="alert alert-info py-2">Album: <strong id="modalAlbumName"></strong> | <strong id="modalSelectedCount"></strong> ảnh</div>
                    <textarea id="fileNamesOutput" class="form-control shadow-sm" rows="10" readonly style="font-family: monospace;"></textarea>
                </div>
                <div class="modal-footer bg-white">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="copyFileNames()"><i class="fas fa-copy"></i> Sao Chép</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // CẤU HÌNH WEBHOOK (GIỮ NGUYÊN)
        const URL_GET_ALBUM_LIST = 'https://dichvufb.tino.page/webhook/get-album-list';
        const URL_DELETE_ALBUM = 'https://dichvufb.tino.page/webhook/delete-album'; 
        const URL_EXPORT_FILENAMES = 'https://dichvufb.tino.page/webhook/export_filenames'; 
        
        const DOMAIN_CLIENT = 'https://phuoclam095-bot.github.io/chonanhtudong/'; 
        const DEFAULT_THUMBNAIL_URL = 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';

        const adminEmail = localStorage.getItem('admin_email');
        const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';

        // ✅ LOGIC KIỂM TRA BẢN QUYỀN (QUAN TRỌNG)
        let isPremiumUser = false;

        function checkLicense() {
            const status = localStorage.getItem('admin_status') || 'new'; // 'new', 'active', 'expired'
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0; // Timestamp (milliseconds)
            const now = Date.now();

            const licenseAlert = document.getElementById('licenseAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            // Mặc định là không có quyền
            isPremiumUser = false;
            licenseAlert.style.display = 'none';

            if (isLoggedIn) {
                if (status === 'active' && expiry > now) {
                    // Đã kích hoạt và còn hạn
                    isPremiumUser = true;
                } 
                else if (status === 'new') {
                    // Người mới chưa kích hoạt
                    alertMessage.innerHTML = `<strong>Tài khoản MỚI.</strong> Vui lòng <a href="lienhe.html">Liên Hệ Admin</a> để kích hoạt dùng thử.`;
                    licenseAlert.style.display = 'flex';
                } 
                else {
                    // Hết hạn (expiry <= now) hoặc status không phải 'active'
                    alertMessage.innerHTML = `<strong>Tài khoản đã HẾT HẠN.</strong> Vui lòng <a href="donate.html">Gia Hạn</a> để tiếp tục sử dụng tính năng quản lý.`;
                    licenseAlert.style.display = 'flex';
                }
            }
        }

        function updateHeaderUI() {
            const authControl = document.getElementById('authControl');
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            
            checkLicense(); // Cập nhật lại isPremiumUser trước khi render

            if (isLoggedIn) {
                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar');
                const status = localStorage.getItem('admin_status') || 'new';

                // Xác định trạng thái hiển thị
                let badgeClass = 'bg-expired';
                let badgeText = 'EXPIRED';

                if (isPremiumUser) {
                    badgeClass = 'bg-active';
                    badgeText = 'ACTIVE';
                } else if (status === 'new') {
                    badgeClass = 'bg-new';
                    badgeText = 'NEW';
                }

                // Render User Info
                let badge = `<span class="status-pill ${badgeClass}">${badgeText}</span>`;
                let imgTag = avatar ? `<img src="${avatar}" class="user-avatar me-2">` : `<i class="fas fa-user-circle me-2"></i>`;
                
                userEmailDisplay.innerHTML = `${imgTag} ${name} ${badge}`;
                authControl.style.display = 'flex'; 
            } else {
                authControl.style.display = 'none';
                window.location.href = 'admin.html'; // Đá về trang login nếu chưa đăng nhập
            }
        }

        async function loadAlbums() {
            const albumGrid = document.getElementById('albumGrid');
            const albumCount = document.getElementById('albumCount');
            
            try {
                const response = await fetch(`${URL_GET_ALBUM_LIST}?adminEmail=${adminEmail}`, {
                    method: 'GET', headers: { 'Accept': 'application/json' } 
                });

                if (!response.ok) throw new Error(`Lỗi tải dữ liệu`);
                const rawData = await response.json();
                const albums = Array.isArray(rawData) ? rawData : []; 

                albumGrid.innerHTML = ''; 
                if (albums.length === 0) {
                    albumGrid.innerHTML = '<div style="color: white; text-align: center; padding: 40px; grid-column: 1 / -1;">Bạn chưa có album nào.</div>';
                    albumCount.innerText = 0;
                    return;
                }

                albums.forEach(album => {
                    const card = createAlbumCard(album);
                    albumGrid.appendChild(card);
                });
                albumCount.innerText = albums.length;

            } catch (error) {
                albumGrid.innerHTML = `<div class="alert alert-danger text-center w-100">Lỗi tải dữ liệu: ${error.message}</div>`;
            }
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            const id = album.folder_id || album.folderId;
            card.id = `card-${id}`; 
            card.className = 'album-card';
            
            const rawName = album.folderName || album.name || 'Album Mới';
            const escapedName = rawName.replace(/'/g, "\\'"); 
            const previewImageURL = album.previewImageURL || DEFAULT_THUMBNAIL_URL; 
            const clientLink = `${DOMAIN_CLIENT}client.html?id=${id}`;

            // ✅ LOGIC KHÓA NÚT DỰA TRÊN isPremiumUser
            const lockAttr = isPremiumUser ? '' : 'disabled title="Vui lòng nâng cấp tài khoản"';
            const lockIcon = isPremiumUser ? '' : '<i class="fas fa-lock me-1"></i>';

            card.innerHTML = `
                <div class="album-card-header" style="background-image: url('${previewImageURL}');">
                    <div class="album-title-overlay" title="${rawName}">${rawName}</div>
                </div>
                <div class="card-body-custom">
                    <div class="stats-grid">
                        <div class="stats-item"><i class="fas fa-check-circle text-success"></i> Chọn: ${album.selected_photos || 0}</div>
                        <div class="stats-item"><i class="fas fa-images text-primary"></i> Tổng: ${album.total_photos || 0}</div>
                        <div class="stats-item" style="grid-column: span 2;"><i class="fas fa-comment-dots text-info"></i> Bình luận: ${album.comments || 0}</div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-view" onclick="window.open('${clientLink}', '_blank')"><i class="fas fa-eye"></i> Xem</button>
                        
                        <button class="btn-export" ${lockAttr} onclick="handleExportClick('${id}', '${escapedName}')">
                            ${lockIcon}<i class="fas fa-file-export"></i> Xuất
                        </button> 
                        
                        <button class="btn-delete" ${lockAttr} onclick="deleteAlbum('${id}', '${escapedName}')">
                            ${lockIcon}<i class="fas fa-trash-alt"></i> Xóa
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        // --- CÁC HÀM XỬ LÝ CHỨC NĂNG ---
        async function handleExportClick(albumId, albumName) {
            if (!isPremiumUser) return alert("Vui lòng nâng cấp tài khoản để dùng tính năng này!");
            if (!confirm(`Xuất danh sách file của "${albumName}"?`)) return;
            // Logic Export API Call goes here
            alert("Đang xử lý xuất file (Demo)... Kết nối API Export của bạn ở đây.");
        }

        async function deleteAlbum(albumId, albumName) {
            if (!isPremiumUser) return alert("Vui lòng nâng cấp tài khoản để dùng tính năng này!");
            if (!confirm(`XÓA VĨNH VIỄN album "${albumName}"?`)) return;
            // Logic Delete API Call goes here
            alert("Đang xử lý xóa album (Demo)... Kết nối API Delete của bạn ở đây.");
        }

        function copyFileNames() {
            const textarea = document.getElementById('fileNamesOutput');
            const namesList = textarea.value.split(',').map(name => name.trim()).filter(name => name.length > 0).join('\n');
            textarea.value = namesList; 
            navigator.clipboard.writeText(namesList).then(() => alert('✅ Đã sao chép!'));
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.href = 'admin.html';
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            checkLicense(); 
            updateHeaderUI();
            loadAlbums();
        });
    </script>
</body>
</html>
