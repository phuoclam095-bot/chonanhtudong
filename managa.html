<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #147a30; 
            --dark-green: #0e5a22;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: rgba(255, 255, 255, 0.98);
            --accent-color: #51ff7d;
        }

        body {
            background-color: var(--bg-color);
            /* Nền chấm bi tối */
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding-top: 80px;
        }
        
        /* ⭐ HEADER CHUẨN BOOTSTRAP (RESPONSIVE) ⭐ */
        .navbar {
            background: var(--primary-green);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: white !important;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-link {
            color: rgba(255,255,255,0.9) !important;
            font-weight: 600;
            margin: 0 5px;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255,255,255,0.2);
            color: #fff !important;
            transform: translateY(-2px);
        }
        
        .navbar-toggler {
            border: none;
            color: white;
            padding: 0.5rem;
        }
        .navbar-toggler:focus {
            box-shadow: none;
            outline: 2px solid var(--accent-color);
        }

        /* ⭐ ALBUM CARD STYLE MỚI (ĐÃ CHỈNH SỬA) ⭐ */
        .dashboard-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 30px 20px; 
        }

        h2 { 
            color: var(--accent-color); 
            text-align: center; 
            margin-bottom: 50px; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(81, 255, 125, 0.5);
            font-size: 2.5rem;
        }

        #albumGrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); /* Card rộng hơn chút */
            gap: 35px; 
            padding-bottom: 50px; 
        }

        .album-card { 
            background: var(--card-bg); 
            color: #333; 
            border-radius: 20px; 
            overflow: hidden;
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            height: 100%; /* Đảm bảo card chiếm hết chiều cao */
        }

        .album-card:hover { 
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        /* ⭐ 1. TĂNG CHIỀU CAO ẢNH ⭐ */
        .album-card-header { 
            height: 250px; /* Tăng từ 180px lên 250px cho ảnh cao và cân đối hơn */
            background-size: cover; 
            background-position: center; 
            position: relative;
        }
        
        .album-card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        .album-title-overlay {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            color: white;
            font-size: 1.3rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }

        .card-body-custom {
            padding: 25px; /* Tăng padding */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Đẩy nút xuống đáy */
        }

        /* ⭐ 2. CĂN CHỈNH LẠI PHẦN THỐNG KÊ ⭐ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 cột đều nhau */
            gap: 15px 20px; /* Khoảng cách hàng/cột thoáng hơn */
            margin-bottom: 30px;
            font-size: 0.95rem;
            align-items: center;
        }
        
        .stats-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            font-weight: 600;
        }
        
        .stats-item i { 
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        /* Item bình luận chiếm trọn 2 cột */
        .stats-item-full {
            grid-column: span 2;
        }

        /* ⭐ 3. CĂN CHỈNH LẠI CÁC NÚT BẤM ⭐ */
        .action-btns { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 nút đều nhau */
            gap: 15px; /* Tăng khoảng cách giữa các nút */
        }

        .action-btns button { 
            padding: 12px 5px; 
            border: none; 
            border-radius: 12px; /* Bo tròn hơn */
            font-size: 13px; 
            font-weight: 700;
            cursor: pointer; 
            transition: all 0.2s; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Khoảng cách icon-chữ */
            height: 100%; /* Chiều cao bằng nhau */
            min-height: 75px; /* Chiều cao tối thiểu để nút trông đầy đặn */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .action-btns button:hover { 
            filter: brightness(1.1);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .action-btns button i {
            font-size: 1.3rem;
        }
        
        .btn-view { background: linear-gradient(135deg, #007bff, #0056b3); }
        .btn-export { background: linear-gradient(135deg, #ffc107, #ff9800); color: #212529 !important; }
        .btn-delete { background: linear-gradient(135deg, #dc3545, #c82333); }

        /* Modal Style */
        .modal-content { border-radius: 15px; overflow: hidden; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { background: var(--primary-green); color: white; }
        
        /* Mobile adjustment */
        @media (max-width: 768px) {
            .dashboard-container { padding: 20px 15px; }
            #albumGrid { grid-template-columns: 1fr; gap: 30px; }
            h2 { font-size: 2rem; margin-bottom: 30px; }
            .album-card-header { height: 220px; } /* Mobile thì ảnh thấp hơn chút */
            .action-btns button { font-size: 12px; min-height: 65px; }
            
            .user-info-mobile {
                border-top: 1px solid rgba(255,255,255,0.1);
                margin-top: 15px;
                padding-top: 15px;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-chart-line me-2"></i>Dashboard</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a href="admin.html" class="nav-link"><i class="fas fa-plus-circle"></i> Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link"><i class="fas fa-copy"></i> Sao Chép Ảnh</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link"><i class="fas fa-hand-holding-usd"></i> Donate</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link"><i class="fas fa-envelope"></i> Liên Hệ</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active"><i class="fas fa-folder-open"></i> Quản Lý</a></li>
                </ul>

                <div id="authControl" style="display: none;" class="d-flex align-items-center gap-3 user-info-mobile">
                    <span id="userEmailDisplay" class="text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">
                        <i class="fas fa-user-circle me-2"></i>Admin
                    </span>
                    <a href="javascript:void(0);" onclick="logoutAdmin()" class="btn btn-danger fw-bold d-flex align-items-center gap-2 rounded-pill px-3">
                        <i class="fas fa-sign-out-alt"></i> Đăng Xuất
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <h2><i class="fas fa-layer-group me-3"></i>Danh Sách Album (<span id="albumCount">0</span>)</h2>
        
        <div id="albumGrid">
            <div id="loadingMessage" style="color: white; text-align: center; font-size: 1.2rem; grid-column: 1 / -1;">
                <i class="fas fa-spinner fa-spin me-2"></i> Đang tải dữ liệu album...
            </div>
        </div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exportModalLabel">
                        <i class="fas fa-file-export me-2"></i> DANH SÁCH FILE ĐÃ CHỌN
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light p-4">
                    <p class="text-primary fw-bold mb-3"><i class="fas fa-info-circle me-2"></i>Vui lòng chọn sao chép bên dưới qua mục Sao Chép Ảnh để lọc ảnh trên máy tính !</p>
                    
                    <div class="alert alert-success d-flex justify-content-between align-items-center shadow-sm" role="alert">
                        <span><i class="fas fa-folder me-2"></i>Album: <strong id="modalAlbumName" class="fs-5">...</strong></span>
                        <span class="badge bg-success rounded-pill fs-6 px-3 py-2"><i class="fas fa-check-circle me-1"></i><span id="modalSelectedCount">0 ảnh</span></span>
                    </div>

                    <textarea id="fileNamesOutput" class="form-control shadow-sm p-3" rows="10" readonly style="font-family: 'Fira Code', monospace; font-size: 0.95rem; border: 2px solid #cce5ff; background-color: #f8f9fa;"></textarea>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary fw-bold px-4" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary fw-bold px-4" id="copyBtn" onclick="copyFileNames()">
                        <i class="fas fa-copy me-2"></i> SAO CHÉP TẤT CẢ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 1. CẤU HÌNH WEBHOOK URL VÀ HẰNG SỐ ---
        const URL_GET_ALBUM_LIST = 'https://dichvufb.tino.page/webhook/get-album-list';
        const URL_DELETE_ALBUM = 'https://dichvufb.tino.page/webhook/delete-album'; 
        const URL_EXPORT_FILENAMES = 'https://dichvufb.tino.page/webhook/export_filenames'; 
        
        const DOMAIN_CLIENT = 'https://phuoclam095-bot.github.io/chonanhtudong/'; 
        const DEFAULT_THUMBNAIL_URL = 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';

        // Lấy thông tin Admin đã đăng nhập từ localStorage
        const adminEmail = localStorage.getItem('admin_email');
        const adminName = localStorage.getItem('admin_name') || 'Admin';
        const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';

        // -------------------------------------------------------------
        // HÀM XỬ LÝ SAO CHÉP TRONG MODAL
        // -------------------------------------------------------------
        function copyFileNames() {
            const textarea = document.getElementById('fileNamesOutput');
            textarea.select();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    alert('✅ Đã sao chép toàn bộ tên file vào clipboard!');
                }).catch(() => {
                    alert('Lỗi sao chép tự động: Vui lòng sao chép thủ công.');
                });
            } else {
                document.execCommand('copy');
                alert('✅ Đã sao chép toàn bộ tên file vào clipboard!');
            }
        }


        // -------------------------------------------------------------
        // HÀM XỬ LÝ CHỨC NĂNG XUẤT FILE ĐÃ CHỌN (EXPORT)
        // -------------------------------------------------------------

        async function handleExportClick(albumId, albumName) {
            if (!confirm(`Bạn muốn xuất danh sách tên file đã chọn trong Album "${albumName}"?`)) {
                return;
            }
            
            const cardElement = document.getElementById(`card-${albumId}`);
            if (cardElement) cardElement.style.opacity = 0.5;

            const payload = {
                folderId: albumId,
                adminEmail: adminEmail, 
                action: 'export_filenames_request'
            };

            try {
                const response = await fetch(URL_EXPORT_FILENAMES, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP: ${response.status}. Kiểm tra Workflow n8n.`);
                }
                
                const result = await response.json();
                
                const finalResult = Array.isArray(result) ? result[0] : result;

               if (finalResult && finalResult.fileNamesForCopy) { 
                    
                    const namesList = finalResult.fileNamesForCopy; 
                    const selectedCount = finalResult.selectedPhotos || 'Không rõ'; 
                    
                    // GÁN DỮ LIỆU VÀ HIỂN THỊ MODAL
                    document.getElementById('modalAlbumName').innerText = albumName;
                    document.getElementById('modalSelectedCount').innerText = selectedCount + ' ảnh';
                    document.getElementById('fileNamesOutput').value = namesList; 

                    // Mở Modal
                    const exportModal = new bootstrap.Modal(document.getElementById('exportModal'));
                    exportModal.show();

                } else {
                    throw new Error(result.message || `Lỗi dữ liệu: Server không trả về trường 'file_names_for_copy'.`);
                }

            } catch (error) {
                alert(`❌ LỖI XUẤT FILE! Vui lòng kiểm tra lại Workflow n8n.`);
                console.error("Lỗi Export File (Ẩn):", error);
            } finally {
                if (cardElement) cardElement.style.opacity = 1;
            }
        }

        // -------------------------------------------------------------
        // HÀM XỬ LÝ XÓA ALBUM VÀ ĐĂNG XUẤT
        // -------------------------------------------------------------
        
        function logoutAdmin() {
            localStorage.removeItem('admin_is_logged_in');
            localStorage.removeItem('admin_email');
            localStorage.removeItem('admin_name');
            localStorage.removeItem('google_access_token'); 
            window.location.href = 'admin.html';
        }

        async function deleteAlbum(albumId, albumName) {
            if (!confirm(`Bạn có chắc chắn muốn xóa Album "${albumName}" và tất cả dữ liệu liên quan không? Thao tác này KHÔNG THỂ HOÀN TÁC!`)) {
                return;
            }

            const cardElement = document.getElementById(`card-${albumId}`);
            if (cardElement) cardElement.style.opacity = 0.5; 

            const deletePayload = { folderId: albumId, adminEmail: adminEmail };

            try {
                const response = await fetch(URL_DELETE_ALBUM, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(deletePayload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert(`✅ Album "${albumName}" đã được xóa thành công khỏi database!`);
                    loadAlbums(); 
                } else {
                    throw new Error(result.message || `Lỗi xóa Album: Server không phản hồi thành công.`);
                }

            } catch (error) {
                alert(`❌ Lỗi Xóa: ${error.message}`);
                console.error("Lỗi xóa Album:", error);
            } finally {
                document.querySelectorAll('.album-card button').forEach(btn => btn.disabled = false);
            }
        }

        // -------------------------------------------------------------
        // HÀM TẠO CARD HTML (UPDATE LAYOUT MỚI - ĐÃ CĂN CHỈNH)
        // -------------------------------------------------------------
        
        function createAlbumCard(album) {
            const card = document.createElement('div');
            const albumUniqueId = album.folder_id || album.folderId;
            card.id = `card-${albumUniqueId}`; 
            card.className = 'album-card';
            
            const id = albumUniqueId || 'UNKNOWN_ID';
            const rawName = album.folderName || album.name || 'Album Mới';
            const escapedName = rawName.replace(/'/g, "\\'"); 
            
            const totalPhotos = album.total_photos || 0;
            const selectedPhotos = album.selected_photos || 0;
            const comments = album.comments || 0; 
            
            const previewImageURL = album.previewImageURL || DEFAULT_THUMBNAIL_URL; 

            const clientLink = `${DOMAIN_CLIENT}client.html?id=${id}`;

            card.innerHTML = `
                <div class="album-card-header" style="background-image: url('${previewImageURL}');">
                    <div class="album-title-overlay" title="${rawName}">${rawName}</div>
                </div>
                
                <div class="card-body-custom">
                    
                    <div class="stats-grid">
                        <div class="stats-item">
                            <i class="fas fa-check-circle text-success"></i> 
                            <span>Đã chọn: <strong class="text-success fs-5">${selectedPhotos}</strong></span>
                        </div>
                         <div class="stats-item">
                            <i class="fas fa-images text-primary"></i> 
                            <span>Tổng: <strong class="text-dark fs-5">${totalPhotos}</strong></span>
                        </div>
                        <div class="stats-item stats-item-full">
                            <i class="fas fa-comment-dots text-info"></i> 
                            <span>Bình luận: <strong class="text-dark fs-5">${comments}</strong></span>
                        </div>
                    </div>

                    <div class="action-btns">
                        <button class="btn-view" onclick="window.open('${clientLink}', '_blank')">
                            <i class="fas fa-eye"></i> Xem
                        </button>
                        
                        <button class="btn-export" onclick="handleExportClick('${id}', '${escapedName}')">
                            <i class="fas fa-file-export"></i> Xuất
                        </button> 
                        
                        <button class="btn-delete" onclick="deleteAlbum('${id}', '${escapedName}')">
                            <i class="fas fa-trash-alt"></i> Xóa
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        // -------------------------------------------------------------
        // HÀM CHÍNH: TẢI VÀ HIỂN THỊ DỮ LIỆU
        // -------------------------------------------------------------

        function updateHeaderUI() {
            const authControl = document.getElementById('authControl');
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            
            if (isLoggedIn) {
                userEmailDisplay.innerHTML = `<i class="fas fa-user-circle me-2"></i>${adminName || adminEmail || 'Admin'}`;
                authControl.style.display = 'flex'; 
                authControl.classList.remove('d-none');
                authControl.classList.add('d-flex');
            } else {
                authControl.style.display = 'none';
                authControl.classList.remove('d-flex');
                authControl.classList.add('d-none');
            }
        }

        async function loadAlbums() {
            const albumGrid = document.getElementById('albumGrid');
            const albumCount = document.getElementById('albumCount');
            
            if (!isLoggedIn) {
                return;
            }
            
            try {
                const response = await fetch(`${URL_GET_ALBUM_LIST}?adminEmail=${adminEmail}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' } 
                });

                if (!response.ok) {
                    throw new Error(`[Technical Error: Failed to fetch album data]`);
                }
                
                const rawData = await response.json();
                
                albumGrid.innerHTML = ''; 

                const albums = Array.isArray(rawData) ? rawData : []; 

                if (albums.length === 0) {
                    albumGrid.innerHTML = '<div style="color: white; text-align: center; padding: 40px; grid-column: 1 / -1; font-size: 1.2rem;"><i class="fas fa-folder-open fa-3x mb-3 d-block opacity-50"></i>Bạn chưa có album nào. Hãy tạo album mới!</div>';
                    albumCount.innerText = 0;
                    return;
                }

                albums.forEach(album => {
                    const card = createAlbumCard(album);
                    albumGrid.appendChild(card);
                });
                
                albumCount.innerText = albums.length;

            } catch (error) {
                console.error("Lỗi tải Album (Ẩn):", error.message);
                
                albumGrid.innerHTML = `<div style="color: #ffcccc; text-align: center; padding: 30px; border: 2px dashed #dc3545; background-color: rgba(220, 53, 69, 0.1); border-radius: 15px; grid-column: 1 / -1;">
                    <i class="fas fa-exclamation-triangle fa-2x mb-3 text-danger"></i><br>
                    <strong>LỖI TẢI DỮ LIỆU</strong><br>Không thể hiển thị danh sách album vào lúc này. Vui lòng thử lại sau.
                </div>`;
                albumCount.innerText = 0;
            }
        }

        // BẮT ĐẦU TẢI DỮ LIỆU KHI TRANG LOAD
        document.addEventListener('DOMContentLoaded', function() {
            updateHeaderUI();
            loadAlbums();
        });
    </script>
</body>
</html>
