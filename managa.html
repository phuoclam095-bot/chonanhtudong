<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* --- CSS CƠ BẢN VÀ CARD STYLE (Không thay đổi) --- */
        :root {
            --primary-green: #147a30; 
            --dark-green: #0e5a22;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #fff;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#222 15%, transparent 16%), radial-gradient(#222 15%, transparent 16%);
            background-size: 60px 60px;
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-top: 70px;
        }
        
        .header { /* Header styles... */ }
        .logo { /* Logo styles... */ }
        .nav-links { /* Nav links styles... */ }
        .dashboard-container { /* Container styles... */ }
        h2 { /* Heading styles... */ }
        #albumGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }
        .album-card { /* Album card styles... */ }
        .album-card:hover { transform: translateY(-3px); }
        .album-title-card { /* Title styles... */ }
        .album-card-header { /* Header image styles... */ }
        .stats-item { /* Stats item styles... */ }
        .status-badge { /* Badge styles... */ }
        .status-selected { color: white; background-color: #28a745; }
        .action-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-btns button { /* Button base styles... */ }
        .btn-view { background: #007bff; color: white; }
        .btn-export { background: #ffc107; color: #333; } /* Màu vàng cho nút Export */
        .btn-delete { background: #dc3545; color: white; }
        .dropdown-menu { /* Dropdown styles... */ }
        .dropdown-item { /* Dropdown item styles... */ }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><i class="fas fa-chart-line"></i> Dashboard Quản Lý</div>
        
        <div class="nav-links">
            <a href="admin.html" class="nav-link"><i class="fas fa-plus-circle"></i> Tạo Album Mới</a>
            <a href="copy_local.html" class="nav-link"><i class="fas fa-copy"></i> Sao Chép Ảnh</a>
            <a href="#" class="nav-link"><i class="fas fa-hand-holding-usd"></i> Donate</a>
            <a href="#" class="nav-link"><i class="fas fa-envelope"></i> Liên Hệ</a> <div id="authControl">
                <div id="userControl" class="dropdown" style="display: none;">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span id="userEmailDisplay" class="user-email">Admin</span> <i class="fas fa-chevron-down"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown" style="background-color: var(--dark-green);">
                        <li><a class="dropdown-item active" href="managa.html"><i class="fas fa-folder-open"></i> Quản Lý Album</a></li> 
                        <li><a class="dropdown-item" href="javascript:void(0);" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="dashboard-container">
        <h2>Danh Sách Album (<span id="albumCount">0</span> Album)</h2>
        <div id="albumGrid">
            <div id="loadingMessage" style="color: white; text-align: center;">
                <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu album...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 1. CẤU HÌNH WEBHOOK URL VÀ HẰNG SỐ ---
        const URL_GET_ALBUM_LIST = 'https://dichvufb.tino.page/webhook/get-album-list';
        const URL_DELETE_ALBUM = 'https://dichvufb.tino.page/webhook/delete-album'; 
        // ⭐ WEBHOOK EXPORT MỚI ⭐
        const URL_EXPORT_FILENAMES = 'https://dichvufb.tino.page/webhook/export_filenames'; 
        
        const DOMAIN_CLIENT = 'https://phuoclam095-bot.github.io/chonanhtudong/'; 
        const DEFAULT_THUMBNAIL_URL = 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';


        // Lấy thông tin Admin đã đăng nhập từ localStorage
        const adminEmail = localStorage.getItem('admin_email');
        const adminName = localStorage.getItem('admin_name') || 'Admin';
        const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';

        // -------------------------------------------------------------
        // HÀM XỬ LÝ CHỨC NĂNG XUẤT FILE ĐÃ CHỌN (EXPORT)
        // -------------------------------------------------------------

        async function handleExportClick(albumId, albumName) {
            if (!confirm(`Bạn muốn xuất danh sách tên file đã chọn trong Album "${albumName}"?`)) {
                return;
            }
            
            const cardElement = document.getElementById(`card-${albumId}`);
            if (cardElement) cardElement.style.opacity = 0.5;

            const payload = {
                folderId: albumId,
                adminEmail: adminEmail, 
                action: 'export_filenames_request'
            };

            try {
                const response = await fetch(URL_EXPORT_FILENAMES, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.file_names_for_copy) {
                    
                    const namesList = result.file_names_for_copy;

                    // ⭐ TẠO CHUỖI HIỂN THỊ CÓ CHỨC NĂNG SAO CHÉP ⭐
                    const formattedNote = `--- TÊN FILE ĐÃ CHỌN TRONG ALBUM: ${albumName} ---
Tổng số ảnh được chọn: ${result.selected_photos || 'Không rõ'}

Vui lòng sao chép chuỗi sau để sử dụng:
----------------------------------------------------------------------------------------------------------------------
${namesList}
----------------------------------------------------------------------------------------------------------------------`;
                    
                    // Dùng prompt() để hiển thị và cho phép người dùng dễ dàng chọn và sao chép
                    prompt(formattedNote, namesList);

                } else {
                    throw new Error(result.message || `Lỗi xuất file: Server không phản hồi thành công.`);
                }

            } catch (error) {
                alert(`❌ Lỗi Xuất File: ${error.message}`);
                console.error("Lỗi Export File:", error);
            } finally {
                if (cardElement) cardElement.style.opacity = 1;
            }
        }


        // -------------------------------------------------------------
        // HÀM XỬ LÝ XÓA ALBUM VÀ ĐĂNG XUẤT
        // -------------------------------------------------------------
        
        function logoutAdmin() {
            localStorage.removeItem('admin_is_logged_in');
            localStorage.removeItem('admin_email');
            localStorage.removeItem('admin_name');
            localStorage.removeItem('google_access_token'); 
            window.location.href = 'admin.html';
        }

        async function deleteAlbum(albumId, albumName) {
            if (!confirm(`Bạn có chắc chắn muốn xóa Album "${albumName}" và tất cả dữ liệu liên quan không? Thao tác này KHÔNG THỂ HOÀN TÁC!`)) {
                return;
            }

            const cardElement = document.getElementById(`card-${albumId}`);
            if (cardElement) cardElement.style.opacity = 0.5; 

            const deletePayload = {
                folderId: albumId,
                adminEmail: adminEmail 
            };

            try {
                const response = await fetch(URL_DELETE_ALBUM, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(deletePayload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert(`✅ Album "${albumName}" đã được xóa thành công khỏi database!`);
                    loadAlbums(); 
                } else {
                    throw new Error(result.message || `Lỗi xóa Album: Server không phản hồi thành công.`);
                }

            } catch (error) {
                alert(`❌ Lỗi Xóa: ${error.message}`);
                console.error("Lỗi xóa Album:", error);
            } finally {
                document.querySelectorAll('.album-card button').forEach(btn => btn.disabled = false);
            }
        }

        // -------------------------------------------------------------
        // HÀM TẠO CARD HTML (Sửa lại nút Export)
        // -------------------------------------------------------------
        
        function createAlbumCard(album) {
            const card = document.createElement('div');
            const albumUniqueId = album.folder_id || album.folderId;
            card.id = `card-${albumUniqueId}`; 
            card.className = 'album-card';
            
            const id = albumUniqueId || 'UNKNOWN_ID';
            const name = (album.folderName || album.name || 'Album Mới').replace(/'/g, "\\'"); 
            const totalPhotos = album.total_photos || 0;
            const selectedPhotos = album.selected_photos || 0;
            const comments = album.comments || 0; 
            
            const previewImageURL = album.previewImageURL || DEFAULT_THUMBNAIL_URL; 

            const clientLink = `${DOMAIN_CLIENT}client.html?id=${id}`;

            card.innerHTML = `
                <div class="album-card-header" 
                    style="background-image: url('${previewImageURL}');">
                </div>
                
                <div class="album-title-card">${name}</div>
                
                <div class="stats-item"><i class="fas fa-check-circle"></i> Đã chọn: <span class="status-badge status-selected">${selectedPhotos}</span> ảnh</div>
                <div class="stats-item"><i class="fas fa-images"></i> Tổng số: <strong>${totalPhotos}</strong> ảnh</div>
                <div class="stats-item"><i class="fas fa-comment-dots"></i> Bình luận: <strong>${comments}</strong></div>
                
                <div class="action-btns">
                    <button class="btn-view" onclick="window.open('${clientLink}', '_blank')"><i class="fas fa-eye"></i> Xem Album</button>
                    
                    <button class="btn-export" onclick="handleExportClick('${id}', '${name}')"><i class="fas fa-file-export"></i> Xuất File Chọn</button> 
                    
                    <button class="btn-delete" onclick="deleteAlbum('${id}', '${name}')"><i class="fas fa-trash-alt"></i> Xóa</button>
                </div>
            `;
            return card;
        }

        // -------------------------------------------------------------
        // HÀM CHÍNH: TẢI VÀ HIỂN THỊ DỮ LIỆU
        // -------------------------------------------------------------

        function updateHeaderUI() {
            const userControl = document.getElementById('userControl');
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            
            if (isLoggedIn) {
                userEmailDisplay.innerText = adminName || adminEmail || 'Admin';
                userControl.style.display = 'flex'; 
            } else {
                window.location.href = 'admin.html'; 
            }
        }

        async function loadAlbums() {
            const albumGrid = document.getElementById('albumGrid');
            const albumCount = document.getElementById('albumCount');
            
            if (!isLoggedIn) {
                return;
            }
            
            try {
                const response = await fetch(`${URL_GET_ALBUM_LIST}?adminEmail=${adminEmail}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' } 
                });

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP ${response.status}. Kiểm tra Workflow n8n.`);
                }
                
                const rawData = await response.json();
                
                albumGrid.innerHTML = ''; 

                const albums = Array.isArray(rawData) ? rawData : []; 

                if (albums.length === 0) {
                    albumGrid.innerHTML = '<div style="color: white; text-align: center;">Bạn chưa có album nào đã tạo . <br>Vui lòng bấm Tạo Album Mới</div>';
                    albumCount.innerText = 0;
                    return;
                }

                albums.forEach(album => {
                    const card = createAlbumCard(album);
                    albumGrid.appendChild(card);
                });
                
                albumCount.innerText = albums.length;

            } catch (error) {
                albumGrid.innerHTML = `<div style="color: red; text-align: center; padding: 20px; border: 1px solid red;">
                    Bạn chưa có album nào đã tạo . <br>
                    Vui lòng bấm Tạo Album Mới
                </div>`;
                albumCount.innerText = 0;
                console.error("Lỗi tải Album:", error);
            }
        }

        // BẮT ĐẦU TẢI DỮ LIỆU KHI TRANG LOAD
        document.addEventListener('DOMContentLoaded', function() {
            updateHeaderUI();
            loadAlbums();
        });
    </script>
</body>
</html>
