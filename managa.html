<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHONANHNHANH.VN - QUẢN LÝ ALBUM VIP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --bg-deep: #050a14; 
            --neon: 0 0 20px rgba(0, 235, 176, 0.4);
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.6) 0%, rgba(5, 10, 20, 0.8) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-top: 105px; overflow-x: hidden;
        }

        /* --- LOADING FLOATING & PULSE --- */
        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .load-logo { font-weight: 900; font-size: 2.5rem; color: var(--primary); text-shadow: var(--neon); letter-spacing: 5px; animation: floating 3s ease-in-out infinite; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .pulse-shadow { width: 100px; height: 10px; background: rgba(0,235,176,0.2); border-radius: 50%; margin-top: 20px; animation: shadow-pulse 3s ease-in-out infinite; }
        @keyframes shadow-pulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.5); opacity: 0.1; } }

        /* --- NAVBAR --- */
        .navbar { background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 85px; }
        .navbar-brand { font-weight: 900; font-size: 1.4rem; color: var(--primary) !important; text-shadow: var(--neon); letter-spacing: -1px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 10px 15px !important; transition: 0.3s ease; position: relative; }
        .nav-link.active { color: var(--primary) !important; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 5px; left: 50%; background: var(--primary); transition: 0.3s ease; transform: translateX(-50%); }
        .nav-link.active::after, .nav-link:hover::after { width: 60%; box-shadow: var(--neon); }

        /* --- USER STATUS BOX (ĐỒNG BỘ TRANG LIÊN HỆ) --- */
        .user-status-box { background: rgba(255,255,255,0.05); padding: 5px 18px; border-radius: 50px; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--primary); height: 55px; }
        #avatarPlaceholder { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--primary); background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        #avatarPlaceholder img { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; line-height: 1; }
        #userExpiryText { font-size: 0.75rem !important; color: #fff !important; font-weight: 800 !important; }

        /* --- HIỆU ỨNG CHỮ QUẢN LÝ ALBUM (CHỈ CHẠY TRÊN CHỮ) --- */
        .supreme-title { 
            font-weight: 900; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 10px; text-align: center; margin-bottom: 35px;
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-shine 4s linear infinite;
            filter: drop-shadow(0 0 5px rgba(0, 235, 176, 0.3));
        }
        @keyframes text-shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* --- SEARCH --- */
        .search-wrapper { max-width: 500px; margin: 0 auto 40px; padding: 2px; border-radius: 50px; background: var(--rainbow); background-size: 200% auto; animation: rainbow-run 4s linear infinite; }
        @keyframes rainbow-run { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .search-inner { background: #080d1a; border-radius: 50px; display: flex; align-items: center; padding: 2px 20px; }
        .search-inner input { background: transparent; border: none; color: #fff !important; width: 100%; padding: 10px; font-weight: 700; outline: none; }

        /* --- ALBUM GRID --- */
        #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 0 20px; }
        .album-card-vip { background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
        .album-card-vip:hover { border-color: var(--primary); box-shadow: var(--neon); transform: translateY(-5px); }
        .card-img-header { height: 210px; background-size: cover; background-position: center; position: relative; border-radius: 20px 20px 0 0; }
        .album-vip-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); font-weight: 900; font-size: 0.95rem; text-align: center; color: #fff; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 15px; }
        .stat-pill { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); padding: 8px; border-radius: 12px; text-align: center; }
        .stat-val { display: block; font-weight: 900; font-size: 0.9rem; color: var(--primary); }
        .stat-lab { display: block; font-size: 0.5rem; font-weight: 800; color: #64748b; text-transform: uppercase; }

        .vip-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 15px 20px 15px; }
        .btn-vip { height: 38px; border: none; border-radius: 10px; font-weight: 900; font-size: 0.65rem; text-transform: uppercase; color: #fff; }
        .v-view { background: #3b82f6; } .v-drive { background: #10b981; } .v-export { background: #f59e0b; color: #000; }
        .v-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; grid-column: span 3; margin-top: 4px; height: 32px; }

        #toastNotice { position: fixed; top: 110px; right: 30px; background: var(--primary); color: #000; padding: 12px 30px; border-radius: 12px; z-index: 10000; font-weight: 900; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="load-logo">CHONANHNHANH.VN</div>
        <div class="pulse-shadow"></div>
    </div>

    <div id="toastNotice"></div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="admin.html">CHONANHNHANH.VN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#supremeNav"><i class="fas fa-bars"></i></button>
            <div class="collapse navbar-collapse" id="supremeNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active">Quản Lý</a></li>
                </ul>
                <div id="authControl" style="display: none !important;" class="align-items-center gap-2">
                    <div class="user-status-box">
                        <div id="avatarPlaceholder" class="avt-circle"></div>
                        <div class="d-flex flex-column">
                            <span id="userNameDisplay" style="font-weight:900; font-size:0.75rem; color:#fff;">...</span>
                            <div class="d-flex align-items-center gap-2">
                                <span id="badgeStatus" class="status-tag" style="background:var(--primary); color:#000;">...</span>
                                <span id="userExpiryText"></span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-link text-danger p-0 ms-1" onclick="logoutAdmin()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="mt-5"><h1 class="supreme-title">Quản Lý Album</h1></div>
        <div class="search-wrapper">
            <div class="search-inner">
                <i class="fas fa-search me-2" style="color:var(--primary)"></i>
                <input type="text" id="albumSearch" placeholder="Tìm kiếm tên album..." oninput="filterAlbums()">
                <span class="badge bg-dark text-primary rounded-pill px-2" id="albumCount">0</span>
            </div>
        </div>
        <div id="albumGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PATHS = { LIST: 'https://dichvufb.tino.page/webhook/get-album-list', DELETE: 'https://dichvufb.tino.page/webhook/delete-album', EXPORT: 'https://dichvufb.tino.page/webhook/export_filenames', CLIENT: 'https://phuoclam095-bot.github.io/chonanhtudong/' };
        let adminEmail = localStorage.getItem('admin_email'), allAlbums = [];

        function showToast(msg) { const t = document.getElementById('toastNotice'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2200); }
        function filterAlbums() { const kw = document.getElementById('albumSearch').value.toLowerCase(); renderAlbums(allAlbums.filter(a => (a.folderName || a.name || '').toLowerCase().includes(kw))); }
        function renderAlbums(albums) { const grid = document.getElementById('albumGrid'); grid.innerHTML = ''; albums.forEach(a => grid.appendChild(createAlbumCard(a))); document.getElementById('albumCount').innerText = albums.length; }

        function createAlbumCard(album) {
            const card = document.createElement('div'); const id = album.folder_id || album.folderId; card.className = 'album-card-vip'; card.id = `card-${id}`;
            const img = album.thumbnailFileId ? `https://drive.google.com/thumbnail?id=${album.thumbnailFileId}&sz=w600` : 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';
            card.innerHTML = `<div class="card-img-header" style="background-image: url('${img}');"><div class="album-vip-title">${album.folderName || album.name || 'VIP Album'}</div></div>
                <div class="stats-grid">
                    <div class="stat-pill"><span class="stat-val">${album.selected_photos || 0}</span><span class="stat-lab">Chọn</span></div>
                    <div class="stat-pill"><span class="stat-val text-white">${album.total_photos || 0}</span><span class="stat-lab">Tổng</span></div>
                    <div class="stat-pill"><span class="stat-val text-info">${album.comments || 0}</span><span class="stat-lab">Note</span></div>
                </div>
                <div class="vip-actions-grid">
                    <button class="btn-vip v-view" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}', '_blank')"><i class="fas fa-eye"></i></button>
                    <button class="btn-vip v-drive" onclick="window.open('https://drive.google.com/drive/folders/${id}', '_blank')"><i class="fab fa-google-drive"></i></button>
                    <button class="btn-vip v-export" onclick="handleExportClick('${id}', '${(album.folderName || album.name).replace(/'/g, "\\'")}')"><i class="fas fa-file-export"></i></button> 
                    <button class="btn-vip v-delete" onclick="deleteAlbum('${id}', '${(album.folderName || album.name).replace(/'/g, "\\'")}')">Xóa album</button>
                </div>`;
            return card;
        }

        async function handleExportClick(id, name) {
            showToast("Đang trích xuất dữ liệu...");
            try {
                const res = await fetch(PATHS.EXPORT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: id, adminEmail: adminEmail }) });
                const data = await res.json(); const result = Array.isArray(data) ? data[0] : data;
                if (result?.fileNamesForCopy) {
                    showToast("Sẵn sàng sao chép");
                    navigator.clipboard.writeText(result.fileNamesForCopy).then(() => showToast("Đã sao chép!"));
                }
            } catch (e) { showToast("Lỗi hệ thống"); }
        }

        async function deleteAlbum(id, name) {
            if (!confirm(`Xóa vĩnh viễn album: ${name}?`)) return;
            try {
                const res = await fetch(PATHS.DELETE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: id, adminEmail: adminEmail }) });
                if ((await res.json()).success) { document.getElementById(`card-${id}`).remove(); showToast("Đã xóa"); }
            } catch (e) { showToast("Lỗi"); }
        }

        function updateHeaderUI() {
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name'), av = localStorage.getItem('admin_avatar'), status = localStorage.getItem('admin_status') || 'new', expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('avatarPlaceholder').innerHTML = av && av !== 'null' ? `<img src="${av}">` : `<i class="fas fa-user-circle" style="font-size:32px; color:var(--primary)"></i>`;
                const badge = document.getElementById('badgeStatus'); const expText = document.getElementById('userExpiryText');
                if (status === 'active' && expiry > Date.now()) { badge.innerText = "ACTIVE"; expText.innerText = "Hạn: " + new Date(expiry).toLocaleDateString('vi-VN'); } 
                else { badge.innerText = "MỚI"; }
                document.getElementById('authControl').style.setProperty('display', 'flex', 'important');
            } else { window.location.href = 'admin.html'; }
        }

        async function init() { 
            updateHeaderUI(); 
            try { 
                const res = await fetch(`${PATHS.LIST}?adminEmail=${adminEmail}`); 
                allAlbums = await res.json(); renderAlbums(allAlbums); 
                setTimeout(() => { document.getElementById('loadOverlay').style.display = 'none'; }, 2000); 
            } catch (e) { document.getElementById('loadOverlay').style.display = 'none'; } 
        }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
