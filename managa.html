<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chonanhnhanh.vn - Studio Master Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --accent: #51ff7d; 
            --bg-deep: #050a14; 
            --neon: 0 0 15px rgba(0, 235, 176, 0.4);
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.4) 0%, rgba(5, 10, 20, 0.6) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            min-height: 100vh; 
            padding-top: 110px; 
            overflow-x: hidden;
        }

        /* --- NAVBAR VIP ĐỒNG BỘ ADMIN --- */
        .navbar { background: rgba(5, 10, 20, 0.8); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 95px; }
        .navbar-brand { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.6rem; color: var(--primary) !important; text-shadow: var(--neon); }
        
        /* HIỆU ỨNG HOVER TAB MENU */
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; padding: 10px 15px !important; transition: 0.3s ease; position: relative; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 5px; left: 50%; background: var(--primary); transition: 0.3s ease; transform: translateX(-50%); box-shadow: var(--neon); }
        .nav-link:hover { color: #fff !important; }
        .nav-link:hover::after { width: 70%; }
        .nav-link.active { color: var(--primary) !important; }
        .nav-link.active::after { width: 80%; background: var(--primary); }

        /* USER PILL ĐỒNG BỘ CHÍNH XÁC ADMIN */
        .user-pill { background: rgba(255,255,255,0.05); padding: 5px 20px; border-radius: 50px; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--primary); height: 55px; min-width: 240px; }
        #avatarPlaceholder { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--primary); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        #avatarPlaceholder img { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; text-align: center; display: block; margin-top: 2px; }
        .tag-active { background: var(--primary); color: #000; }
        .tag-new { background: #ff9f43; color: #000; }
        .tag-expired { background: #ff4757; color: #fff; }

        /* THANH TÌM KIẾM CẦU VỒNG ĐỘNG */
        .search-rainbow-wrapper { max-width: 600px; margin: 0 auto 50px; position: relative; padding: 3px; border-radius: 50px; background: var(--rainbow); background-size: 200% auto; animation: rainbow-run 4s linear infinite; }
        @keyframes rainbow-run { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .search-inner { background: #080d1a; border-radius: 50px; display: flex; align-items: center; padding: 5px 25px; }
        .search-inner input { background: transparent; border: none; color: white; width: 100%; padding: 12px; font-weight: 700; outline: none; }
        .search-inner i { color: var(--primary); font-size: 1.2rem; }

        /* --- ALBUM GRID LUXURY --- */
        #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 0 20px; }
        .album-card-vip { background: rgba(10, 20, 40, 0.5); backdrop-filter: blur(15px); border-radius: 25px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; display: flex; flex-direction: column; }
        .album-card-vip:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: var(--neon); }

        .card-img-header { height: 180px; position: relative; background-size: cover; background-position: center; }
        .album-vip-title { position: absolute; bottom: 15px; left: 20px; right: 20px; font-weight: 900; font-size: 1.1rem; color: #fff; text-shadow: 0 2px 10px #000; }

        .card-body-vip { padding: 25px; flex-grow: 1; }
        
        /* THỐNG KÊ CHI TIẾT CẢ BÌNH LUẬN */
        .stats-vip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-pill { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .stat-pill:hover { border-color: var(--primary); background: rgba(0, 235, 176, 0.1); }
        .stat-pill.full-width { grid-column: span 2; }
        .stat-val { display: block; font-weight: 900; font-size: 1.2rem; color: var(--primary); }
        .stat-lab { display: block; font-size: 0.6rem; font-weight: 800; color: #64748b; text-transform: uppercase; }

        .vip-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-vip { height: 45px; border: none; border-radius: 12px; font-weight: 900; font-size: 0.7rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; color: #fff; }
        .v-view { background: #3b82f6; } .v-drive { background: #10b981; } .v-export { background: #f59e0b; color: #000; }
        .v-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1.5px solid #ff4757; grid-column: span 3; margin-top: 5px; height: 38px; }

        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="spinner-grow text-primary mb-3"></div>
        <div class="fw-bold" style="letter-spacing:5px; font-size:0.8rem;">CHONANHNHANH.VN</div>
    </div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="admin.html">CHONANHNHANH<span style="color:#fff">.VN</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="fas fa-bars"></i></button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active">Quản Lý</a></li>
                </ul>
                <div id="authControl" style="display: none !important;" class="align-items-center gap-2">
                    <div class="user-pill">
                        <div id="avatarPlaceholder"></div>
                        <div class="d-flex flex-column overflow-hidden">
                            <span id="userNameDisplay" style="font-weight:900; font-size:0.85rem; line-height:1; color:#fff;"></span>
                            <div id="userStatusDisplay"></div>
                        </div>
                    </div>
                    <button class="btn btn-link text-danger p-0 ms-2" onclick="logoutAdmin()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-lg-5">
        <div class="text-center mb-5">
            <h2 class="fw-900" style="font-size: 2.8rem; letter-spacing: -1px;">Dashboard <span style="color: var(--primary);">Management</span></h2>
        </div>

        <div class="search-rainbow-wrapper">
            <div class="search-inner">
                <i class="fas fa-search"></i>
                <input type="text" id="albumSearch" placeholder="Tìm kiếm tên album..." oninput="filterAlbums()">
                <span class="badge bg-dark text-primary rounded-pill px-3" id="albumCount">0</span>
            </div>
        </div>

        <div id="albumGrid"></div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="background:#080d1a; border:1px solid var(--primary); border-radius:30px;">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-900 text-white">XUẤT DANH SÁCH FILE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="alert bg-primary text-dark fw-bold rounded-4 mb-4" id="modalInfo"></div>
                    <textarea id="fileNamesOutput" class="form-control" rows="12" readonly style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:var(--accent); border-radius:15px;"></textarea>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-primary w-100 py-3 rounded-4 fw-black text-dark" onclick="copyFileNames()">SAO CHÉP TẤT CẢ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PATHS = { 
            LIST: 'https://dichvufb.tino.page/webhook/get-album-list',
            DELETE: 'https://dichvufb.tino.page/webhook/delete-album',
            EXPORT: 'https://dichvufb.tino.page/webhook/export_filenames',
            CLIENT: 'https://phuoclam095-bot.github.io/chonanhtudong/'
        };

        let adminEmail = localStorage.getItem('admin_email'), allAlbums = [];

        function filterAlbums() {
            const kw = document.getElementById('albumSearch').value.toLowerCase();
            renderAlbums(allAlbums.filter(a => (a.folderName || a.name || '').toLowerCase().includes(kw)));
        }

        function renderAlbums(albums) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = albums.length ? '' : '<div class="text-center w-100 py-5 opacity-50">Không tìm thấy dữ liệu...</div>';
            albums.forEach(a => grid.appendChild(createAlbumCard(a)));
            document.getElementById('albumCount').innerText = albums.length;
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            const id = album.folder_id || album.folderId;
            card.id = `card-${id}`; card.className = 'album-card-vip';
            const rawName = album.folderName || album.name || 'VIP Album';
            const img = album.thumbnailFileId ? `https://drive.google.com/thumbnail?id=${album.thumbnailFileId}&sz=w600` : 'https://images.unsplash.com/photo-1542838132-e0c19b48b940?auto=format&fit=crop&w=600&q=80';
            
            card.innerHTML = `
                <div class="card-img-header" style="background-image: url('${img}');">
                    <div class="album-vip-title">${rawName}</div>
                </div>
                <div class="card-body-vip">
                    <div class="stats-vip-row">
                        <div class="stat-pill" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}&mode=selected', '_blank')">
                            <span class="stat-val">${album.selected_photos || 0}</span>
                            <span class="stat-lab">Đã chọn</span>
                        </div>
                        <div class="stat-pill">
                            <span class="stat-val text-white">${album.total_photos || 0}</span>
                            <span class="stat-lab">Tổng ảnh</span>
                        </div>
                        <div class="stat-pill full-width" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}&mode=notes', '_blank')">
                            <span class="stat-val text-info"><i class="fas fa-comment-alt me-2"></i>${album.comments || 0}</span>
                            <span class="stat-lab">Ghi chú / Bình luận</span>
                        </div>
                    </div>
                    <div class="vip-actions-grid">
                        <button class="btn-vip v-view" onclick="window.open('${PATHS.CLIENT}client.html?id=${id}', '_blank')">XEM</button>
                        <button class="btn-vip v-drive" onclick="window.open('https://drive.google.com/drive/folders/${id}', '_blank')">DRIVE</button>
                        <button class="btn-vip v-export" onclick="handleExportClick('${id}', '${rawName.replace(/'/g, "\\'")}')">XUẤT</button> 
                        <button class="btn-vip v-delete" onclick="deleteAlbum('${id}', '${rawName.replace(/'/g, "\\'")}')">XÓA VĨNH VIỄN</button>
                    </div>
                </div>`;
            return card;
        }

        async function handleExportClick(albumId, albumName) {
            try {
                const res = await fetch(PATHS.EXPORT, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folderId: albumId, adminEmail: adminEmail, action: 'export_filenames_request' })
                });
                const result = await res.json();
                const data = Array.isArray(result) ? result[0] : result;
                if (data && data.fileNamesForCopy) {
                    document.getElementById('modalInfo').innerHTML = `Album: ${albumName} | ${data.selectedPhotos || 0} ảnh`;
                    document.getElementById('fileNamesOutput').value = data.fileNamesForCopy.split(',').map(n => n.trim()).join('\n');
                    new bootstrap.Modal(document.getElementById('exportModal')).show();
                }
            } catch (e) { alert("Lỗi trích xuất!"); }
        }

        function copyFileNames() {
            const txt = document.getElementById('fileNamesOutput').value;
            navigator.clipboard.writeText(txt.split('\n').join(',')).then(() => alert("✅ Đã copy!"));
        }

        async function deleteAlbum(id, name) {
            if (!confirm(`Xóa album: ${name}?`)) return;
            try {
                const res = await fetch(PATHS.DELETE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId: id, adminEmail: adminEmail }) });
                const r = await res.json();
                if (r.success) { document.getElementById(`card-${id}`).remove(); }
            } catch (e) { alert("Lỗi xóa!"); }
        }

        function updateHeaderUI() {
            const auth = document.getElementById('authControl');
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name');
                const avatar = localStorage.getItem('admin_avatar');
                const status = localStorage.getItem('admin_status') || 'new';
                const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
                
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('avatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}">` : `<i class="fas fa-user-circle" style="font-size:32px; color:var(--primary)"></i>`;
                
                const statusEl = document.getElementById('userStatusDisplay');
                const expiryStr = (expiry > 0) ? new Date(expiry).toLocaleDateString('vi-VN') : '';

                if (status === 'active' && expiry > Date.now()) {
                    statusEl.innerHTML = `<span class="status-tag tag-active">ACTIVE - Hạn: ${expiryStr}</span>`;
                } else if (status === 'new') {
                    statusEl.innerHTML = `<span class="status-tag tag-new">MỚI</span>`;
                } else {
                    statusEl.innerHTML = `<span class="status-tag tag-expired">HẾT HẠN - ${expiryStr}</span>`;
                }
                auth.style.setProperty('display', 'flex', 'important');
            } else { window.location.href = 'admin.html'; }
        }

        async function init() {
            updateHeaderUI();
            try {
                const res = await fetch(`${PATHS.LIST}?adminEmail=${adminEmail}`);
                allAlbums = await res.json();
                renderAlbums(allAlbums);
                document.getElementById('loadOverlay').style.display = 'none';
            } catch (e) { }
        }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
