<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA HẠN DỊCH VỤ - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        
        /* NAVBAR ĐỒNG BỘ ADMIN */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; transition: 0.3s; border-radius: 8px; padding: 8px 15px !important; }
        .nav-link:hover { background: rgba(255,255,255,0.2); color: #fff !important; }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .payment-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 500px; border-radius: 30px; padding: 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { font-weight: 900; color: var(--primary-green); text-transform: uppercase; margin-bottom: 25px; }

        /* LỜI CHÀO NGƯỜI DÙNG */
        .user-status-box { background: #f8fafc; border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .user-name { font-weight: 800; color: #333; font-size: 1.1rem; display: block; }
        .user-email { font-size: 0.85rem; color: #64748b; font-weight: 600; }

        /* FORM CHỌN GÓI */
        .plan-select-group { text-align: left; margin-bottom: 25px; }
        .plan-select-group label { display: block; margin-bottom: 10px; font-weight: 800; color: var(--primary-green); text-transform: uppercase; font-size: 0.9rem; }
        select { width: 100%; padding: 15px; border: 2.5px solid #f1f5f9; border-radius: 15px; outline: none; font-weight: 700; color: #334155; appearance: none; background: url("data:image/svg+xml,...") no-repeat right 15px center; cursor: pointer; }
        select:focus { border-color: var(--primary-green); }

        .btn-pay { background: var(--primary-green); color: white; border: none; padding: 18px; font-size: 18px; border-radius: 18px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.25); transition: 0.3s; margin-top: 10px; }
        .btn-pay:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(20, 122, 48, 0.4); }

        /* KHU VỰC QR CODE */
        #qrContainer { margin-top: 30px; display: none; animation: fadeIn 0.5s ease; }
        .qr-wrapper { background: white; padding: 15px; border-radius: 20px; border: 2px dashed var(--primary-green); display: inline-block; margin-bottom: 15px; }
        #qrImage { width: 250px; height: 250px; border-radius: 10px; }
        .payment-note { font-size: 0.85rem; color: #d63031; font-weight: 800; margin-top: 10px; line-height: 1.5; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Quay lại Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="payment-card">
            <h2>Gia Hạn Dịch Vụ</h2>

            <div class="user-status-box">
                <span class="user-name" id="userName">Đang tải...</span>
                <span class="user-email" id="userEmail">...</span>
            </div>

            <div class="plan-select-group">
                <label>Chọn Gói Thành Viên</label>
                <select id="planSelect" onchange="resetQR()">
                    <option value="90000" selected>Gói 1 Tháng - 90.000đ</option>
                    <option value="250000">Gói 3 Tháng - 250.000đ</option>
                    <option value="450000">Gói 6 Tháng - 450.000đ</option>
                    <option value="800000">Gói 1 Năm - 800.000đ</option>
                </select>
            </div>

            <button class="btn-pay" onclick="handlePayment()">
                <i class="fas fa-qrcode me-2"></i> Tạo Mã Thanh Toán
            </button>

            <div id="qrContainer">
                <div class="qr-wrapper">
                    <img id="qrImage" src="" alt="VietQR">
                </div>
                <div class="payment-note">
                    <i class="fas fa-info-circle me-1"></i> Hệ thống sẽ tự động kích hoạt sau 1-3 phút kể từ khi nhận được thanh toán thành công.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình Bank của bạn
        const BANK_CONFIG = {
            BANK_ID: "MB", // Ví dụ MB Bank, VCB, v.v.
            ACCOUNT_NO: "0879029170",
            ACCOUNT_NAME: "NGUYEN NHAT PHUONG"
        };

        const WEBHOOK_URL = "https://dichvufb.tino.page/webhook/payment-json";

        // Tải thông tin người dùng từ LocalStorage
        window.onload = function() {
            const name = localStorage.getItem('admin_name') || 'Khách hàng';
            const email = localStorage.getItem('admin_email') || 'Chưa đăng nhập';
            document.getElementById('userName').innerText = name;
            document.getElementById('userEmail').innerText = email;

            if (!localStorage.getItem('admin_is_logged_in')) {
                alert("Vui lòng đăng nhập tại trang Admin trước!");
                window.location.href = "admin.html";
            }
        };

        function resetQR() {
            document.getElementById('qrContainer').style.display = 'none';
        }

        // Logic quan trọng: Trả về số tháng (mon) dựa trên số tiền
        function getMonths(amount) {
            const map = { "90000": 1, "250000": 3, "450000": 6, "800000": 12 };
            return map[amount] || 0;
        }

        function handlePayment() {
            const amount = document.getElementById('planSelect').value;
            const email = localStorage.getItem('admin_email');
            const mon = getMonths(amount); // ⭐ Lấy số tháng để gửi JSON

            const paymentData = {
                email: email,
                amount: parseInt(amount),
                mon: mon, // ⭐ JSON 'mon' bạn cần
                status: "pending",
                timestamp: new Date().toISOString()
            };

            // Gửi dữ liệu về Webhook để hệ thống lưu log chờ thanh toán
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(paymentData)
            })
            .then(() => {
                // Tạo link VietQR (Sử dụng mẫu compact)
                const description = `Gia Han ${email} ${mon} Thang`.replace(/\s+/g, '%20');
                const qrUrl = `https://img.vietqr.io/image/${BANK_CONFIG.BANK_ID}-${BANK_CONFIG.ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${description}&accountName=${encodeURIComponent(BANK_CONFIG.ACCOUNT_NAME)}`;
                
                document.getElementById('qrImage').src = qrUrl;
                document.getElementById('qrContainer').style.display = 'block';
                
                // Cuộn xuống để xem QR
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            })
            .catch(err => {
                alert("Lỗi kết nối máy chủ. Vui lòng thử lại!");
                console.error(err);
            });
        }
    </script>
</body>
</html>
