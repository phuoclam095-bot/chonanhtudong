<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Hạn - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* CSS GIAO DIỆN GỐC - GIỮ NGUYÊN 100% */
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --best-value: #ff9800; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: #333; min-height: 98vh; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        .payment-container { background: linear-gradient(145deg, #f0fff4, #ffffff); border-radius: 20px; padding: 24px; max-width: 1200px; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .package-option { padding: 18px 14px; min-height: 440px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; transition: 0.3s; background: #fcfcfc; position: relative; overflow: hidden; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .package-option.selected { border-color: var(--primary-green); background: #e9f5eb; }
        .best-badge:before { content: '⭐ TỐT NHẤT'; position: absolute; top: 18px; right: -25px; padding: 2px 25px; background: var(--best-value); color: white; font-weight: 900; font-size: 0.75rem; transform: rotate(45deg); box-shadow: 0 3px 5px rgba(0,0,0,0.2); }
        .price-unit { font-size: 2.8rem; font-weight: 900; color: var(--primary-green); }
        .feature-list { list-style: none; padding: 0; text-align: left; font-size: 0.9rem; margin-top: 15px; }
        .feature-list i { color: var(--primary-green); margin-right: 7px; }
    </style>
</head>
<body>

<div class="payment-container">
    <div id="selectionMode">
        <h2 class="text-center fw-bold mb-4">Chọn Gói Nâng Cấp Dịch Vụ</h2>
        <div id="packageSelection" class="row g-3 justify-content-center"></div>
        <div class="text-center mt-4"> 
            <button id="btnContinue" class="btn btn-lg btn-success fw-bold px-5" disabled onclick="processPayment()">Tiến Hành Thanh Toán</button>
        </div>
    </div>

    <div id="paymentPollingMode" style="display: none;" class="text-center">
        <h3 class="text-danger fw-bold mb-3">Quét Mã VietQR để Thanh Toán</h3>
        <div id="qrLoading" style="display: none; padding: 50px;">
            <i class="fas fa-spinner fa-spin fa-3x text-success"></i>
            <p class="mt-3 fw-bold">Đang khởi tạo mã QR...</p>
        </div>
        <div id="qrContent">
            <div style="width: 300px; margin: 0 auto; padding: 10px; background: white; border-radius: 15px;">
                <img id="qrCodeImg" src="" style="width: 100%; border-radius: 8px;">
            </div>
            <div class="mt-3">
                <p>Số tiền: <strong id="displayAmount" class="text-danger fs-4"></strong></p>
                <p>Nội dung: <strong id="displayPaymentCode" class="text-primary fs-5" onclick="copyCode()"></strong></p>
            </div>
            <div class="alert alert-success mt-3">
                <i class="fas fa-sync fa-spin me-2"></i>Đang chờ xác nhận...
            </div>
        </div>
    </div>

    <div id="successMode" style="display: none;" class="text-center py-5">
        <i class="fas fa-check-circle fa-5x text-success mb-4"></i>
        <h3 class="fw-bold">Thanh Toán Thành Công!</h3>
        <p class="fs-5">Cảm ơn quý khách đã tin tưởng sử dụng dịch vụ !</p>
    </div>
</div>

<script>
    const PAYMENT_CONFIG = {
        N8N_SAVE: 'https://dichvufb.tino.page/webhook/save-pending',
        N8N_CHECK: 'https://dichvufb.tino.page/webhook/google-oauth-callback'
    };

    const PAYMENT_PACKAGES = [
        { months: 1, name: "Gói Dùng Thử", price: 90000, features: ["Lưu trữ 1 tháng", "Tải ảnh chuẩn", "Hỗ trợ Zalo"] },
        { months: 3, name: "Gói Cơ Bản", price: 250000, features: ["Lưu trữ 3 tháng", "Thumbnail nhanh", "Hỗ trợ ưu tiên"] },
        { months: 6, name: "Gói Chuyên Nghiệp", price: 450000, features: ["Lưu trữ 6 tháng", "Tải ảnh tức thì", "Watermark riêng"] },
        { months: 12, name: "Gói UNLIMITED", price: 750000, features: ["Lưu trữ 12 tháng", "Tốc độ tối đa", "Hỗ trợ 24/7"], isBest: true }
    ];

    let selectedPackage = null;
    let userEmail = localStorage.getItem('admin_email');

    function renderPackages() {
        const container = document.getElementById('packageSelection');
        PAYMENT_PACKAGES.forEach(pkg => {
            const div = document.createElement('div');
            div.className = 'col-md-3';
            div.innerHTML = `
                <div class="package-option ${pkg.isBest ? 'best-value' : ''}" onclick="selectPkg(this, ${JSON.stringify(pkg).replace(/"/g, '&quot;')})">
                    ${pkg.isBest ? '<div class="best-badge"></div>' : ''}
                    <h5 class="fw-bold">${pkg.name}</h5>
                    <div class="price-unit">${pkg.price.toLocaleString()}<small class="fs-6 d-block text-dark">VNĐ</small></div>
                    <ul class="feature-list">${pkg.features.map(f => `<li><i class="fas fa-check-circle"></i>${f}</li>`).join('')}</ul>
                </div>`;
            container.appendChild(div);
        });
    }

    function selectPkg(el, pkg) {
        document.querySelectorAll('.package-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedPackage = pkg;
        document.getElementById('btnContinue').disabled = false;
        document.getElementById('btnContinue').innerText = `Thanh Toán ${pkg.price.toLocaleString()} VNĐ`;
    }

    async function processPayment() {
        const code = 'SEVQR' + Math.floor(Math.random() * 900000);
        document.getElementById('selectionMode').style.display = 'none';
        document.getElementById('paymentPollingMode').style.display = 'block';
        document.getElementById('qrLoading').style.display = 'block';
        document.getElementById('qrContent').style.display = 'none';

        try {
            const res = await fetch(PAYMENT_CONFIG.N8N_SAVE, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: userEmail, paymentCode: code, amount: selectedPackage.price })
            });
            const data = await res.json();
            document.getElementById('qrCodeImg').src = data.qrDataURL;
            document.getElementById('displayAmount').innerText = selectedPackage.price.toLocaleString() + ' VNĐ';
            document.getElementById('displayPaymentCode').innerText = code;
            document.getElementById('qrLoading').style.display = 'none';
            document.getElementById('qrContent').style.display = 'block';
            startPolling(code);
        } catch (e) { location.reload(); }
    }

    function startPolling(code) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(PAYMENT_CONFIG.N8N_CHECK, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'check_status', email: userEmail, paymentCode: code })
                });
                const data = await res.json();
                if (data.status === 'active') { // So khớp trường status: active từ dữ liệu của bạn
                    clearInterval(interval);
                    document.getElementById('paymentPollingMode').style.display = 'none';
                    document.getElementById('successMode').style.display = 'block';
                    const expiry = data.expiry_timestamp; // Lấy timestamp 2026 chuẩn
                    setTimeout(() => {
                        window.location.href = `admin.html?user_status=active&user_expiry=${expiry}&user_email=${encodeURIComponent(userEmail)}`;
                    }, 2500);
                }
            } catch (e) {}
        }, 3000);
    }

    function returnToSelection() { location.reload(); }
    window.onload = () => { renderPackages(); document.getElementById('userEmailDisplay').innerText = userEmail; };
</script>
</body>
</html>
