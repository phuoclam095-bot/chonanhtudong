<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHONANHNHANH.VN - SAO CHÉP ẢNH VIP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --bg-deep: #050a14; 
            --neon: 0 0 20px rgba(0, 235, 176, 0.4);
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.7) 0%, rgba(5, 10, 20, 0.9) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-top: 105px; overflow-x: hidden;
        }

        /* --- LOADING FLOATING --- */
        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .load-logo { font-weight: 900; font-size: 2.5rem; color: var(--primary); text-shadow: var(--neon); letter-spacing: 5px; animation: floating 3s ease-in-out infinite; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .pulse-shadow { width: 100px; height: 10px; background: rgba(0,235,176,0.2); border-radius: 50%; margin-top: 20px; animation: shadow-pulse 3s ease-in-out infinite; }
        @keyframes shadow-pulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.5); opacity: 0.1; } }

        /* --- NAVBAR & USER STATUS --- */
        .navbar { background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 85px; }
        .navbar-brand { font-weight: 900; font-size: 1.4rem; color: var(--primary) !important; text-shadow: var(--neon); letter-spacing: -1px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 10px 15px !important; transition: 0.3s ease; position: relative; }
        .nav-link.active { color: var(--primary) !important; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 5px; left: 50%; background: var(--primary); transition: 0.3s ease; transform: translateX(-50%); }
        .nav-link.active::after, .nav-link:hover::after { width: 60%; box-shadow: var(--neon); }

        .user-status-box { background: rgba(255,255,255,0.05); padding: 5px 18px; border-radius: 50px; display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--primary); height: 55px; }
        #avatarPlaceholder { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--primary); background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        #avatarPlaceholder img { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; line-height: 1; }
        #userExpiryText { font-size: 0.75rem !important; color: #fff !important; font-weight: 800 !important; }

        /* --- TYPOGRAPHY ĐỘNG NHẸ --- */
        .supreme-title { 
            font-weight: 900; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 10px; color: #fff; text-align: center; margin-bottom: 35px;
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: text-shine 4s linear infinite; filter: drop-shadow(0 0 5px rgba(0, 235, 176, 0.3));
        }
        @keyframes text-shine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

        /* --- CẤU TRÚC FORM SAO CHÉP --- */
        .copy-wrapper { max-width: 700px; margin: 0 auto; padding: 3px; border-radius: 35px; background: var(--rainbow); background-size: 200% auto; animation: rainbow-run 4s linear infinite; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
        @keyframes rainbow-run { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .copy-card { background: #080d1a; border-radius: 32px; padding: 40px; }

        label { display: block; font-size: 0.7rem; color: var(--primary); font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"] { width: 100%; padding: 18px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; color: #fff; text-align: center; font-weight: 700; outline: none; transition: 0.4s; margin-bottom: 25px; }
        input[type="text"]:focus { border-color: var(--primary); background: rgba(0, 235, 176, 0.05); }

        .btn-action { background: var(--primary); color: #000; border: none; padding: 18px; font-size: 1.1rem; border-radius: 50px; width: 100%; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: var(--neon); }
        .btn-action:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-action:disabled { background: #334155 !important; opacity: 0.4 !important; cursor: not-allowed !important; color: #94a3b8 !important; box-shadow: none; }

        /* KHUNG KẾT QUẢ */
        #resultLog { margin-top: 30px; padding: 25px; border-radius: 20px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); font-family: 'Consolas', monospace; font-size: 0.85rem; max-height: 250px; overflow-y: auto; display: none; }
        .log-line { margin-bottom: 8px; border-left: 3px solid var(--primary); padding-left: 12px; }

        #toastNotice { position: fixed; top: 110px; right: 30px; background: var(--primary); color: #000; padding: 12px 30px; border-radius: 12px; z-index: 10000; font-weight: 900; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="load-logo">CHONANHNHANH.VN</div>
        <div class="pulse-shadow"></div>
    </div>

    <div id="toastNotice"></div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="admin.html">CHONANHNHANH.VN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#supremeNav"><i class="fas fa-bars"></i></button>
            <div class="collapse navbar-collapse" id="supremeNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link active">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div id="authControl" style="display: none !important;" class="align-items-center gap-2">
                    <div class="user-status-box">
                        <div id="avatarPlaceholder" class="avt-circle"></div>
                        <div class="d-flex flex-column">
                            <span id="userNameDisplay" style="font-weight:900; font-size:0.75rem; color:#fff;">...</span>
                            <div class="d-flex align-items-center gap-2">
                                <span id="badgeStatus" class="status-tag" style="background:var(--primary); color:#000;">...</span>
                                <span id="userExpiryText"></span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-link text-danger p-0 ms-1" onclick="logoutAdmin()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        <h1 class="supreme-title">Sao Chép Ảnh</h1>
        
        <div id="noticeVIP" class="text-center mb-4" style="display:none; font-weight:700; color:#ff4757; font-size: 0.85rem;">
            Tài khoản chưa Active, vui lòng <a href="payment.html" style="color:var(--primary); text-decoration:underline;">Gia hạn VIP</a> để sử dụng tính năng sao chép.
        </div>

        <div class="copy-wrapper">
            <div class="copy-card">
                <div class="mb-4">
                    <label>Link thư mục Gốc (Source)</label>
                    <input type="text" id="sourceLink" placeholder="Dán link thư mục cần sao chép...">
                </div>
                <div class="mb-4">
                    <label>Link thư mục Đích (Destination)</label>
                    <input type="text" id="destLink" placeholder="Dán link thư mục lưu trữ...">
                </div>
                
                <button id="btnStartCopy" class="btn-action" onclick="handleCopy()">Bắt đầu sao chép ngay</button>
                
                <div class="mt-4 text-center" style="color:var(--primary); font-weight:900; font-size:0.85rem; letter-spacing:1px;">
                    <i class="fas fa-bolt me-2"></i>Chuyển dữ liệu siêu tốc - Chính xác 100%
                </div>
            </div>
        </div>

        <div id="resultLog"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PATHS = { COPY_ACTION: 'https://dichvufb.tino.page/webhook/copy-folder-action' }; // Path giữ nguyên 100%
        let adminEmail = localStorage.getItem('admin_email');
        let isVIP = false;

        function showToast(msg) { const t = document.getElementById('toastNotice'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2200); }

        function updateHeaderUI() {
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name'), av = localStorage.getItem('admin_avatar'), status = localStorage.getItem('admin_status') || 'new', expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
                isVIP = (status === 'active' && expiry > Date.now());

                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('avatarPlaceholder').innerHTML = av && av !== 'null' ? `<img src="${av}">` : `<i class="fas fa-user-circle" style="font-size:32px; color:var(--primary)"></i>`;
                
                const badge = document.getElementById('badgeStatus'); const expText = document.getElementById('userExpiryText');
                const btnAction = document.getElementById('btnStartCopy');

                if (isVIP) {
                    badge.innerText = "ACTIVE"; badge.className = "status-tag"; badge.style.background = "var(--primary)";
                    expText.innerText = "Hạn: " + new Date(expiry).toLocaleDateString('vi-VN');
                    document.getElementById('noticeVIP').style.display = 'none';
                    btnAction.disabled = false;
                } else {
                    badge.innerText = status === 'new' ? "MỚI" : "EXPIRED";
                    badge.style.background = "#ff4757"; badge.style.color = "#fff";
                    document.getElementById('noticeVIP').style.display = 'block';
                    btnAction.disabled = true; // KHÓA NÚT CHUẨN ADMIN
                }
                document.getElementById('authControl').style.setProperty('display', 'flex', 'important');
            } else { window.location.href = 'admin.html'; }
        }

        async function handleCopy() {
            if(!isVIP) return;
            const src = document.getElementById('sourceLink').value.trim();
            const dst = document.getElementById('destLink').value.trim();
            if(!src || !dst) { showToast("Vui lòng nhập đầy đủ link"); return; }

            const btn = document.getElementById('btnStartCopy'); 
            const log = document.getElementById('resultLog');
            btn.innerHTML = 'ĐANG XỬ LÝ...'; btn.disabled = true;
            log.style.display = 'block';
            log.innerHTML = `<div class="log-line">Khởi tạo tiến trình sao chép...</div>`;

            try {
                // Giữ nguyên logic fetch và tham số path
                const res = await fetch(PATHS.COPY_ACTION, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ source: src, destination: dst, adminEmail: adminEmail })
                });
                const data = await res.json();
                log.innerHTML += `<div class="log-line" style="color:var(--primary)">${data.message || "Đã gửi yêu cầu sao chép thành công!"}</div>`;
                showToast("Đã gửi yêu cầu");
            } catch (e) {
                log.innerHTML += `<div class="log-line" style="color:#ff4757">Lỗi kết nối hệ thống</div>`;
            } finally { btn.innerHTML = 'BẮT ĐẦU SAO CHÉP NGAY'; btn.disabled = !isVIP; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            setTimeout(() => { document.getElementById('loadOverlay').style.display = 'none'; }, 1800);
        });
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
    </script>
</body>
</html>
