<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sao Chép Ảnh Cục Bộ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; 
            min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; 
        }

        /* HEADER */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: 1000; }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; transition: all 0.3s; border-radius: 8px; }
        
        /* MAIN CONTAINER (ĐÃ FIX: Căn giữa dọc) */
        .main-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* ⭐ FIX: Căn giữa dọc ⭐ */
            padding: 30px 20px; 
        }
        .copy-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 700px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }

        /* DIR SELECTION */
        .dir-selection { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 576px) { .dir-selection { grid-template-columns: 1fr; gap: 15px; } }
        
        .dir-item { text-align: center; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px dashed #ccc; }
        .dir-item button { 
            background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 10px 20px; 
            border-radius: 50px; font-weight: 700; transition: 0.3s; box-shadow: 0 4px 10px rgba(20, 122, 48, 0.3);
            margin-bottom: 10px;
        }
        .dir-item button:disabled { opacity: 0.7; cursor: not-allowed; }
        .dir-display { font-size: 14px; min-height: 20px; font-weight: 600; }

        /* COPY BUTTON */
        #copyButton { background: linear-gradient(135deg, #007bff, #0056b3); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: all 0.3s; box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3); }
        #copyButton:disabled { background: #6c757d; cursor: not-allowed; box-shadow: none; transform: none; }

        /* STATUS BADGE & LICENSE */
        .status-pill { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; margin-left: 8px; text-transform: uppercase; font-weight: 800; }
        .bg-active { background: #198754; color: white; box-shadow: 0 0 10px rgba(25, 135, 84, 0.5); }
        .bg-new { background: #0d6efd; color: white; } 
        .bg-expired { background: #dc3545; color: white; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); }

        /* LICENSE ALERT */
        .license-alert { 
            background-color: #f8d7da; color: #842029; border-color: #f5c6cb;
            border-radius: 15px; padding: 15px 25px; margin-bottom: 25px;
            font-size: 1.05rem; display: flex; align-items: center; gap: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-copy me-2"></i>Copy Ảnh</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a href="admin.html" class="nav-link"><i class="fas fa-plus-circle"></i> Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link active"><i class="fas fa-copy"></i> Sao Chép Ảnh</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link"><i class="fas fa-hand-holding-usd"></i> Donate</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link"><i class="fas fa-envelope"></i> Liên Hệ</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link"><i class="fas fa-folder-open"></i> Quản Lý</a></li>
                </ul>
                
                <div id="authControl" style="display: none;" class="d-flex align-items-center gap-3">
                    <div id="userEmailDisplay" class="d-flex align-items-center gap-2 text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">
                        <i class="fas fa-user-circle me-2"></i> Admin
                    </div>
                    <a href="javascript:void(0);" onclick="logoutAdmin()" class="btn btn-danger fw-bold rounded-pill px-3">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="copy-card">
            
            <div id="licenseAlert" class="license-alert shadow" style="display: none;">
                <i class="fas fa-exclamation-triangle fa-2x text-warning"></i>
                <div id="alertMessage"></div>
            </div>

            <h2><i class="fas fa-exchange-alt me-2"></i>Sao Chép Ảnh Nội Bộ</h2>

            <div class="dir-selection">
                <div class="dir-item">
                    <button onclick="selectDirectory('source')">📂 Chọn Thư mục Nguồn</button>
                    <div id="sourceDirDisplay" class="dir-display text-danger mt-2"><i class="fas fa-times-circle me-1"></i>Chưa chọn nguồn</div>
                </div>
                
                <div class="dir-item">
                    <button onclick="selectDirectory('destination')">➕ Chọn Thư mục Đích</button>
                    <div id="destDirDisplay" class="dir-display text-success mt-2"><i class="fas fa-times-circle me-1"></i>Chưa chọn đích</div>
                </div>
            </div>

            <label for="filenamesInput"><i class="fas fa-list me-2 text-primary"></i>Danh sách tên file (cách nhau dấu phẩy hoặc xuống dòng)</label>
            <textarea id="filenamesInput" rows="5" placeholder="Ví dụ: IMG_001.JPG, DSC_0522.NEF, IMG_9999.PNG..."></textarea>

            <button id="copyButton" onclick="startCopyProcess()">
                <i class="fas fa-clone"></i> Thực Hiện Sao Chép
            </button>
            
            <div id="statusDisplay" class="bg-light mt-4 p-3 rounded-3 shadow-sm"><i class="fas fa-info-circle me-2 text-muted"></i>Sẵn sàng. Vui lòng chọn thư mục.</div>
            
            <div class="warning-box bg-warning-subtle text-warning-emphasis mt-4 p-3 rounded-3" style="font-size: 14px;">
                <i class="fas fa-exclamation-triangle"></i> Chức năng này chỉ hoạt động với trình duyệt **Chrome và Edge** và yêu cầu cấp quyền.
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- CẤU HÌNH BIẾN TOÀN CỤC ---
        let sourceDirectoryHandle = null;
        let destinationDirectoryHandle = null;
        let isPremiumUser = false; 

        const adminEmail = localStorage.getItem('admin_email');
        const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';

        const STATUS_DISPLAY_ID = 'statusDisplay';
        const COPY_BUTTON_ID = 'copyButton';

        // --- 1. LOGIC KIỂM TRA BẢN QUYỀN VÀ STATUS (FIX: CHUẨN HÓA DỮ LIỆU) ---
        function checkLicense() {
            const statusRaw = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0; 
            const now = Date.now();
            
            const status = statusRaw ? statusRaw.toLowerCase().trim() : 'new'; 

            const licenseAlert = document.getElementById('licenseAlert');
            const alertMessage = document.getElementById('alertMessage');
            const copyButton = document.getElementById(COPY_BUTTON_ID);

            isPremiumUser = false;
            licenseAlert.style.display = 'none';

            if (isLoggedIn) {
                if (status === 'active' && expiry > now) {
                    isPremiumUser = true; 
                } else if (status === 'new') {
                    // Người mới
                    alertMessage.innerHTML = `<strong>Tài khoản MỚI.</strong> Vui lòng <a href="lienhe.html">Liên Hệ Admin</a> để kích hoạt dùng thử.`;
                    licenseAlert.style.display = 'flex';
                } else {
                    // Hết hạn
                    alertMessage.innerHTML = `<strong>Tài khoản đã HẾT HẠN.</strong> Vui lòng <a href="donate.html">Gia Hạn</a> để sử dụng tính năng này.`;
                    licenseAlert.style.display = 'flex';
                }
            }
            
            // Khóa/Mở nút chính
            copyButton.disabled = !isPremiumUser;
        }

        function updateHeaderUI() {
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            const name = localStorage.getItem('admin_name') || 'Admin';
            const avatar = localStorage.getItem('admin_avatar');
            const status = localStorage.getItem('admin_status') || 'new';
            const expiry = localStorage.getItem('admin_expiry') || '0';

            checkLicense(); 

            if (isLoggedIn) {
                // Xác định trạng thái hiển thị
                let badgeClass = 'bg-expired';
                let badgeText = 'EXPIRED';
                let expiryDateText = '';

                if (isPremiumUser) {
                    badgeClass = 'bg-active';
                    badgeText = 'ACTIVE';
                    expiryDateText = `(Hạn: ${new Date(parseInt(expiry)).toLocaleDateString('vi-VN')})`;
                } else if (status === 'new') {
                    badgeClass = 'bg-new';
                    badgeText = 'NEW';
                }
                
                let badge = `<span class="status-pill ${badgeClass}">${badgeText}</span>`;
                let imgTag = avatar ? `<img src="${avatar}" class="user-avatar me-2">` : `<i class="fas fa-user-circle me-2"></i>`;
                
                userEmailDisplay.innerHTML = `${imgTag} ${name} ${badge} <span style="font-size: 0.7em; margin-left: 5px;">${expiryDateText}</span>`;
                document.getElementById('authControl').style.display = 'flex'; 
            } else {
                window.location.href = 'admin.html'; 
            }
        }

        // --- 2. LOGIC SAO CHÉP CỤC BỘ ---

        async function selectDirectory(type) {
            if (!isPremiumUser) {
                document.getElementById(STATUS_DISPLAY_ID).innerHTML = '<span class="text-danger">❌ Tính năng bị khóa. Vui lòng kích hoạt tài khoản.</span>';
                return;
            }

            if (!('showDirectoryPicker' in window)) {
                alert("Trình duyệt của bạn không hỗ trợ chức năng này. Vui lòng dùng Chrome hoặc Edge.");
                return;
            }

            try {
                const handle = await window.showDirectoryPicker();
                const displayElement = document.getElementById(type === 'source' ? SOURCE_DISPLAY_ID : DEST_DISPLAY_ID);

                if (type === 'source') {
                    sourceDirectoryHandle = handle;
                    displayElement.innerHTML = `<i class="fas fa-check-circle me-1"></i>Nguồn: <strong>${handle.name}</strong>`;
                    displayElement.className = 'dir-display text-primary mt-2';
                } else {
                    destinationDirectoryHandle = handle;
                    displayElement.innerHTML = `<i class="fas fa-check-circle me-1"></i>Đích: <strong>${handle.name}</strong>`;
                    displayElement.className = 'dir-display text-success mt-2';
                }

                document.getElementById(STATUS_DISPLAY_ID).innerHTML = `✅ Đã chọn và cấp quyền cho thư mục <strong>${handle.name}</strong>.`;

            } catch (err) {
                if (err.name !== 'AbortError') {
                    document.getElementById(STATUS_DISPLAY_ID).innerHTML = `<span class="text-danger">❌ Lỗi: ${err.message}</span>`;
                }
            }
        }

        async function startCopyProcess() {
            if (!isPremiumUser) {
                document.getElementById(STATUS_DISPLAY_ID).innerHTML = '<span class="text-danger fw-bold">❌ Tính năng bị khóa. Vui lòng kích hoạt tài khoản.</span>';
                return;
            }
            
            const statusElement = document.getElementById(STATUS_DISPLAY_ID);
            const copyButton = document.getElementById(COPY_BUTTON_ID);

            if (!sourceDirectoryHandle || !destinationDirectoryHandle) {
                statusElement.innerHTML = '<span class="text-danger fw-bold">❌ Vui lòng chọn cả Thư mục nguồn và Thư mục đích.</span>';
                return;
            }

            const filenamesRaw = document.getElementById('filenamesInput').value;
            const filenamesToCopy = filenamesRaw.split(/[\n,]+/).map(name => name.trim()).filter(name => name.length > 0);
            
            if (filenamesToCopy.length === 0) {
                 statusElement.innerHTML = '<span class="text-danger fw-bold">Danh sách file trống.</span>';
                 return;
            }
            
            copyButton.disabled = true;
            copyButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Đang xử lý...';
            statusElement.innerHTML = '<span class="text-primary">⏳ Bắt đầu sao chép...</span>';

            let successCount = 0;
            let failedList = [];
            let totalFiles = filenamesToCopy.length;

            for (let i = 0; i < totalFiles; i++) {
                const filename = filenamesToCopy[i];
                statusElement.innerHTML = `<span class="text-primary">⏳ Đang chép (${i + 1}/${totalFiles}): <strong>${filename}</strong>...</span>`;
                try {
                    const fileHandle = await sourceDirectoryHandle.getFileHandle(filename);
                    const file = await fileHandle.getFile();
                    const destFileHandle = await destinationDirectoryHandle.getFileHandle(filename, { create: true });
                    const writable = await destFileHandle.createWritable();
                    await writable.write(file);
                    await writable.close();
                    successCount++;
                } catch (error) {
                    failedList.push(filename);
                }
            }

            let finalMessage = `<div class="text-success mb-2"><i class="fas fa-check-double me-2"></i>Hoàn tất! Thành công: <strong>${successCount}</strong> / ${totalFiles} file.</div>`;
            if (failedList.length > 0) {
                 finalMessage += `<div class="alert alert-warning mt-2 p-2" style="font-size: 0.9rem;">
                    <strong><i class="fas fa-exclamation-triangle me-2"></i>Lỗi (${failedList.length} file):</strong>
                    ${failedList.join(', ')}
                 </div>`;
            }
            
            statusElement.innerHTML = finalMessage;
            copyButton.innerHTML = '<i class="fas fa-clone"></i> Thực Hiện Sao Chép';
            copyButton.disabled = false;
        }
        
        function logoutAdmin() {
            localStorage.clear();
            window.location.href = 'admin.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLicense();
            updateHeaderUI();
            
            // Đặt trạng thái ban đầu của nút sao chép dựa trên license
            if (!isPremiumUser) {
                document.getElementById(COPY_BUTTON_ID).disabled = true;
                document.getElementById(COPY_BUTTON_ID).innerHTML = '<i class="fas fa-lock me-1"></i> Tính năng bị khóa';
            } else {
                document.getElementById(STATUS_DISPLAY_ID).innerHTML = '<i class="fas fa-info-circle me-2 text-muted"></i>Sẵn sàng. Vui lòng chọn thư mục.';
            }
        });
    </script>
</body>
</html>
