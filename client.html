<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chonanhnhanh.vn - VIP Client Master</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00ebb0;
            --accent: #51ff7d;
            --bg-deep: #050a14;
            --header-h: 70px;
            --footer-h: 85px;
            --neon-glow: 0 0 15px rgba(0, 235, 176, 0.4);
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, #0a1f3d 0%, #050a14 100%);
            color: #fff; font-family: 'Montserrat', sans-serif;
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; margin: 0; user-select: none;
        }

        /* --- HEADER --- */
        .navbar {
            height: var(--header-h); background: rgba(5, 10, 20, 0.85);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0 15px; z-index: 3000;
        }
        .album-title-text { font-weight: 900; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }

        .view-switcher { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 4px; display: flex; }
        .view-btn {
            border: none; background: transparent; color: #aaa;
            padding: 6px 15px; border-radius: 12px; font-size: 0.75rem; font-weight: 800;
            transition: 0.3s;
        }
        .view-btn.active { background: var(--primary); color: #000; box-shadow: var(--neon-glow); }

        /* --- GRID CONTAINER --- */
        #photoGrid {
            flex: 1; overflow-y: auto; padding: 15px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            padding-bottom: 100px; -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 768px) { #photoGrid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        @media (min-width: 1200px) { #photoGrid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        .grid-item {
            position: relative; border-radius: 15px; overflow: hidden;
            aspect-ratio: 1/1; cursor: pointer; border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s; background: #111;
        }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        /* Hiệu ứng tập trung (Focused) */
        .grid-item.focused { border-color: var(--primary); transform: scale(0.96); box-shadow: var(--neon-glow); }
        /* Hiệu ứng đã chọn (Selected) */
        .grid-item.selected::after {
            content: "\f058"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; inset: 0; background: rgba(0, 235, 176, 0.25);
            display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary);
        }

        .vip-dot {
            position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
            background: var(--primary); color: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 11px; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- VIEWER FULLSCREEN --- */
        #photoViewer {
            position: absolute; inset: 0; background: #000;
            z-index: 5000; display: none; flex-direction: column;
        }
        .close-vip {
            position: absolute; top: 15px; right: 15px; width: 45px; height: 45px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 6000; border: 1px solid rgba(255,255,255,0.2);
        }
        #viewerBadge {
            position: absolute; top: 15px; left: 15px; background: var(--primary);
            color: #000; padding: 6px 15px; border-radius: 20px; font-weight: 900;
            font-size: 0.8rem; z-index: 10; box-shadow: var(--neon-glow);
        }

        .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; }
        #mainImg { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.2s; }

        /* THANH CUỘN THUMBNAIL (STRIP) - TỐI ƯU MƯỢT MÀ */
        .strip-luxury {
            height: 85px; background: rgba(5, 10, 20, 0.95);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
        }
        .th-vip {
            height: 60px; width: 60px; border-radius: 10px; flex-shrink: 0;
            overflow: hidden; border: 2px solid transparent; opacity: 0.4;
            position: relative; transition: 0.2s;
        }
        .th-vip.act { opacity: 1; border-color: var(--primary); transform: scale(1.1); }
        .th-vip.sel { border-color: var(--accent); opacity: 0.9; }

        /* --- BOTTOM BAR --- */
        .bottom-bar {
            height: var(--footer-h); background: rgba(5, 10, 20, 0.9);
            backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1);
            padding: 0 15px; display: flex; align-items: center; justify-content: space-between;
            position: fixed; bottom: 0; width: 100%; z-index: 4000;
        }
        .info-area { max-width: 40%; display: flex; flex-direction: column; }
        .btn-vip-action {
            padding: 10px 18px; border-radius: 12px; font-weight: 900;
            border: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
        }
        .btn-select-vip { background: #1a2a3a; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-select-vip.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: var(--neon-glow); }
        .btn-save-vip { background: linear-gradient(90deg, #00ebb0, #51ff7d); color: #000; box-shadow: 0 5px 15px rgba(0, 235, 176, 0.3); }

        #loadOverlay { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-neon { width: 40px; height: 40px; border: 4px solid #111; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="loader-neon mb-3"></div>
        <div style="font-weight: 900; color: var(--primary); letter-spacing: 2px; font-size: 0.8rem;">DÉCORING...</div>
    </div>

    <nav class="navbar">
        <div class="d-flex align-items-center gap-2">
            <div style="width: 30px; height: 30px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #000;"><i class="fas fa-check"></i></div>
            <div class="d-flex flex-column">
                <span class="album-title-text" id="albumTitle">...</span>
                <small style="color: #666; font-size: 0.65rem; font-weight: 800;">CHỌN: <span id="totalPhotos">0</span></small>
            </div>
        </div>
        <div class="view-switcher">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')">LƯỚI</button>
            <button class="view-btn" id="btnViewer" onclick="setView('viewer')">XEM</button>
        </div>
    </nav>

    <div class="main-container" style="flex: 1; position: relative; overflow: hidden;">
        <div id="photoGrid"></div>
        <div id="photoViewer">
            <div class="close-vip" onclick="setView('grid')"><i class="fas fa-times"></i></div>
            <div id="viewerBadge">ẢNH SỐ 1</div>
            <div class="stage"><img id="mainImg" src=""></div>
            <div class="strip-luxury" id="strip"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="info-area">
            <span id="pName" style="font-weight: 900; color: var(--primary); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</span>
            <span id="pCount" style="font-size: 0.65rem; color: #666; font-weight: 800;">0 / 0</span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn-vip-action btn-select-vip" id="btnSel" onclick="togSel()">
                <i class="far fa-circle"></i> <span>CHỌN</span>
            </button>
            <button class="btn-vip-action btn-save-vip" onclick="finalCommit()">
                <i class="fas fa-cloud-upload-alt"></i> <span>LƯU CHỌN</span>
            </button>
        </div>
    </div>

    <script>
        const PATHS = { GET: 'https://dichvufb.tino.page/webhook/get-photos', SAVE: 'https://dichvufb.tino.page/webhook/save-selection', DONE: 'https://dichvufb.tino.page/webhook/finish-selection' };
        let photos=[], cur=0, currentView='grid', selectedIds = [];
        const fid = new URLSearchParams(window.location.search).get('id');

        function getLink(id, sz) { return `https://drive.google.com/thumbnail?id=${id}&sz=${sz}`; }

        function setView(v) {
            currentView = v;
            document.getElementById('photoGrid').style.display = (v === 'grid') ? 'grid' : 'none';
            document.getElementById('photoViewer').style.display = (v === 'viewer') ? 'flex' : 'none';
            document.getElementById('btnGrid').classList.toggle('active', v === 'grid');
            document.getElementById('btnViewer').classList.toggle('active', v === 'viewer');
            refreshUI();
        }

        // TỐI ƯU HÓA RENDER ĐỂ KHÔNG LAG
        function refreshUI() {
            const grid = document.getElementById('photoGrid');
            if (currentView === 'grid') {
                if (grid.children.length === 0) {
                    photos.forEach((p, i) => {
                        const item = document.createElement('div');
                        item.className = 'grid-item';
                        item.setAttribute('data-idx', i);
                        item.innerHTML = `<img src="${getLink(p.id, 's400')}" loading="lazy">`;
                        item.onclick = () => { cur = i; syncFocus(); };
                        item.ondblclick = () => { cur = i; setView('viewer'); };
                        grid.appendChild(item);
                    });
                }
                syncFocus();
            } else {
                showViewer(cur);
            }
        }

        // ĐỒNG BỘ TIÊU ĐIỂM VÀ TRẠNG THÁI CHỌN
        function syncFocus() {
            const items = document.querySelectorAll('.grid-item');
            items.forEach((item, i) => {
                const isSel = selectedIds.includes(photos[i].id);
                item.classList.toggle('focused', i === cur);
                item.classList.toggle('selected', isSel);
                let dot = item.querySelector('.vip-dot');
                if(isSel) {
                    if(!dot) item.insertAdjacentHTML('beforeend', `<div class="vip-dot">${selectedIds.indexOf(photos[i].id)+1}</div>`);
                    else dot.innerText = selectedIds.indexOf(photos[i].id)+1;
                } else if(dot) dot.remove();
            });
            
            // Cuộn mượt mà đến ảnh đang chọn trong lưới
            if(currentView === 'grid') {
                const act = document.querySelector('.grid-item.focused');
                if(act) act.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            updateInfo();
        }

        function showViewer(i) {
            cur = i;
            const p = photos[i];
            const mainImg = document.getElementById('mainImg');
            mainImg.style.opacity = '0.5';
            mainImg.src = getLink(p.id, 's2000');
            mainImg.onload = () => mainImg.style.opacity = '1';

            const strip = document.getElementById('strip');
            strip.innerHTML = '';
            photos.forEach((thumb, idx) => {
                const isSel = selectedIds.includes(thumb.id);
                const th = document.createElement('div');
                th.className = `th-vip ${idx === cur ? 'act' : ''} ${isSel ? 'sel' : ''}`;
                const num = selectedIds.indexOf(thumb.id) + 1;
                th.innerHTML = `<img src="${getLink(thumb.id, 's100')}">${isSel ? `<div class="vip-dot">${num}</div>` : ''}`;
                th.onclick = () => showViewer(idx);
                strip.appendChild(th);
            });
            if(strip.children[cur]) strip.children[cur].scrollIntoView({ behavior: 'smooth', inline: 'center' });
            updateInfo();
        }

        function updateInfo() {
            const p = photos[cur];
            const isSel = selectedIds.includes(p.id);
            document.getElementById('pName').innerText = p.name || `PIC_${cur+1}`;
            document.getElementById('pCount').innerText = `${cur + 1} / ${photos.length}`;
            document.getElementById('totalPhotos').innerText = selectedIds.length;
            
            const btnSel = document.getElementById('btnSel');
            const badge = document.getElementById('viewerBadge');
            
            if(isSel) {
                btnSel.classList.add('active');
                btnSel.innerHTML = `<i class="fas fa-check-circle"></i> ĐÃ CHỌN`;
                if(currentView === 'viewer') {
                    badge.style.display = 'block';
                    badge.innerText = `ẢNH SỐ ${selectedIds.indexOf(p.id) + 1}`;
                }
            } else {
                btnSel.classList.remove('active');
                btnSel.innerHTML = `<i class="far fa-circle"></i> CHỌN`;
                badge.style.display = 'none';
            }
        }

        // CHỈ CHỌN KHI NHẤP VÀO NÚT CHỌN
        function togSel() {
            const p = photos[cur];
            const idx = selectedIds.indexOf(p.id);
            if (idx === -1) selectedIds.push(p.id);
            else selectedIds.splice(idx, 1);
            
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedIds));
            currentView === 'grid' ? syncFocus() : showViewer(cur);

            fetch(PATHS.SAVE, {
                method:'POST', headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({id:p.id, selected: idx === -1})
            }).catch(e => console.warn(e));
        }

        async function finalCommit(){
            if(selectedIds.length === 0) return alert("Dạ mình chưa chọn ảnh nào ạ!");
            if(confirm(`Gửi ${selectedIds.length} ảnh đã chọn?`)) {
                try {
                    await fetch(PATHS.DONE, {
                        method:'POST', headers:{'Content-Type':'application/json'}, 
                        body:JSON.stringify({ id: fid, selected_ids: selectedIds, count: selectedIds.length })
                    });
                    alert("✅ Đã gửi thành công!");
                } catch(e) { alert("Lỗi: "+e.message); }
            }
        }

        async function init() {
            try {
                if(!fid) throw new Error("Mã Album lỗi");
                const local = localStorage.getItem('anh_da_chon_cua_khach_' + fid);
                if (local) selectedIds = JSON.parse(local);
                const res = await fetch(`${PATHS.GET}?id=${fid}`);
                const data = await res.json();
                photos = data.photos || data;
                document.getElementById('albumTitle').innerText = data.folderName || "VIP GALLERY";
                document.getElementById('loadOverlay').style.display='none';
                setView('grid');
            } catch(e) { document.getElementById('loadOverlay').innerHTML = `<div class="text-danger"><b>LỖI:</b> ${e.message}</div>`; }
        }
        init();
    </script>
</body>
</html>
