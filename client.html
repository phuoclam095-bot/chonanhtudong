<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ảnh - Bạc Liêu</title>
<style>
        :root { 
            --bg: #1a1a1a; 
            --gold: #c5a059; 
            --text: #f0f0f0; 
            --panel: #2b2b2b; 
            --blue-frame: #007bff; 
            --grid-bg-image: url('https://img.tripi.vn/cdn-cgi/image/width=700,height=700/https://gcs.tripi.vn/public-tripi/tripi-feed/img/482888PMq/anh-mo-ta.png'); 
            --grid-item-size: 500px; /* TĂNG KÍCH THƯỚC CHIỀU RỘNG */
            --grid-item-height: 250px; /* CHIỀU CAO HÌNH CHỮ NHẬT NẰM */
            --grid-gap: 10px; 
        }
        
        /* ... (CSS cho các thành phần khác giữ nguyên) ... */
        
        /* CHẾ ĐỘ 1: GRID VIEW */
        #photoGrid { 
            padding: var(--grid-gap); 
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-item-size), 1fr));
            gap: var(--grid-gap);
            flex-grow: 1; 
            /* ... */
        }

        .grid-item-wrapper { 
            /* ... (các thuộc tính bo tròn, viền giữ nguyên) ... */
            height: var(--grid-item-height); /* Dùng chiều cao mới */
            display: flex; 
            justify-content: center;
            align-items: center; 
            /* ... */
        }
        .grid-item-wrapper img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Đảm bảo hình chữ nhật được lấp đầy */
            /* ... */
        }
        /* ... (CSS cho Viewer và Dots giữ nguyên) ... */
    </style>
</head>
<body>
    <div id="load"><div>⏳</div><div>Đang tải dữ liệu...</div></div>

    <div class="header">
        <div class="album-title">Thư Viện Ảnh (<span id="totalPhotos">0</span> ảnh)</div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')">🖼️ Dạng Lưới</button>
            <button class="view-btn" id="btnViewer" onclick="setView('viewer')">🔍 Xem Chi Tiết</button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="ctrl" id="commonCtrlBar">
            <div class="info">
                <div style="font-weight:bold; color:var(--gold)" id="pName">...</div>
                <div class="p-count" id="pCount">0 / 0</div>
            </div>
            <div style="display:flex; align-items:center">
                <button class="btn btn-draw" id="btnDraw" onclick="togDraw(true)">🖌️ Vẽ</button>
                <button class="btn btn-sel" id="btnSel" onclick="togSel()">Chọn</button>
            </div>
            <button class="btn btn-done" onclick="finish()">🚀 Gửi List</button>
        </div>
        
        <div id="photoGrid">
             </div>

        <div id="photoViewer">
            <div class="tools" id="tools">
                <button class="t-btn act" onclick="setPen()">✏️</button>
                <button class="t-btn" onclick="cls()">🗑️</button>
                <button class="t-btn" style="background:green" onclick="saveDraw()">💾</button>
                <button class="t-btn" style="background:red" onclick="togDraw(false)">❌</button>
            </div>

            <div class="stage">
                <button class="nav prev" onclick="mov(-1)">&#10094;</button>
                <div class="canvas-box">
                    <img id="mainImg" src="">
                    <canvas id="drawCanvas"></canvas>
                </div>
                <button class="nav next" onclick="mov(1)">&#10095;</button>
            </div>

            <div class="strip" id="strip"></div>
        </div>

    </div>

    <script>
        // ============================================================
        // ⚠️ CẤU HÌNH LINK SẢN PHẨM (PRODUCTION)
        // ============================================================
        const URL_GET = 'https://dichvufb.tino.page/webhook/get-photos'; 
        const URL_SAVE = 'https://dichvufb.tino.page/webhook/save-selection'; 
        const URL_DRAW = 'https://dichvufb.tino.page/webhook/upload-drawing';
        const URL_DONE = 'https://dichvufb.tino.page/webhook/finish-selection';

        let photos=[], cur=0, isDraw=false, ctx=null, currentView='grid'; 
        let cvs, img; 
        let albumTitle = "Thư Viện Ảnh"; 
        let isSelectionLocked = false; // Luôn đặt là false vì không khóa

        const urlParams = new URLSearchParams(window.location.search);
        const fid = urlParams.get('id');

        let selectedPhotoIds = []; 

        // --- HÀM TẠO LINK THÔNG MINH (Dùng /thumbnail) ---
        function getLink(id, size) {
            return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`;
        }

        // 💡 HÀM CHUYỂN ĐỔI CHẾ ĐỘ XEM
        function setView(view) {
            currentView = view;
            const gridDiv = document.getElementById('photoGrid');
            const viewerDiv = document.getElementById('photoViewer');
            const btnGrid = document.getElementById('btnGrid');
            const btnViewer = document.getElementById('btnViewer');
            const btnDraw = document.getElementById('btnDraw'); 
            const pNameElement = document.getElementById('pName');
            const pCountElement = document.getElementById('pCount');
            
            if (view === 'grid') {
                gridDiv.style.display = 'grid';
                viewerDiv.style.display = 'none';
                btnGrid.classList.add('active');
                btnViewer.classList.remove('active');
                btnDraw.style.display = 'none'; // Ẩn nút Vẽ khi ở Grid View
                
                // Cập nhật thông tin trên thanh điều khiển cho Grid View
                pNameElement.innerText = 'Chọn Ảnh Dạng Lưới';
                pCountElement.innerText = `Đã chọn: ${selectedPhotoIds.length} ảnh`;
                
                capNhatSoThuTuVaTổngSố(); 
            } else {
                gridDiv.style.display = 'none';
                viewerDiv.style.display = 'flex'; 
                btnGrid.classList.remove('active');
                btnViewer.classList.add('active');
                btnDraw.style.display = 'block'; // Hiển thị nút Vẽ khi ở Viewer Mode
                show(cur); // Đảm bảo Viewer Mode hiển thị ảnh đang chọn
            }
        }

        // 💡 HÀM LƯU TRẠNG THÁI VÀO LOCAL STORAGE (Đảm bảo lưu ID độc lập theo FID)
        function luuTrangThaiLocally() {
            const LOCAL_STORAGE_KEY = 'anh_da_chon_cua_khach_' + fid;
            
            // Luôn lưu danh sách ID đã chọn
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(selectedPhotoIds));
            
            // Bỏ qua việc lưu trạng thái khóa
        }

        // 💡 HÀM CẬP NHẬT SỐ THỨ TỰ VÀ TỔNG SỐ ẢNH (CHUNG CHO CẢ HAI CHẾ ĐỘ)
        function capNhatSoThuTuVaTổngSố() {
            let count = selectedPhotoIds.length;
            
            // 1. Cập nhật Viewer Strip 
            const strip = document.getElementById('strip');
            if (strip) {
                strip.innerHTML = '';
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'th';
                    d.id = `t-${i}`;
                    d.onclick = () => show(i);

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's220');
                    const dotIndex = isSel ? selectedPhotoIds.indexOf(p.id) + 1 : '';
                    d.innerHTML = `<img src="${thumb}" loading="lazy"><div class="dot">${dotIndex}</div>`;
                    strip.appendChild(d);
                });
                
                let t = document.getElementById(`t-${cur}`);
                if (t) t.classList.add('act');
            }
            
            // 2. Cập nhật Grid View
            const grid = document.getElementById('photoGrid');
            if (grid) {
                // Loại bỏ Overlay khóa
                
                grid.innerHTML = '';
                
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'grid-item-wrapper'; 
                    
                    // Sự kiện click wrapper (CHỈ ĐỂ CHỌN/BỎ CHỌN)
                    d.onclick = () => {
                        const oldCur = cur;
                        cur = i;
                        togSel();
                        cur = oldCur; 
                        
                        if (currentView === 'grid') {
                            capNhatSoThuTuVaTổngSố(); 
                        }
                    };
                    
                    // Sự kiện Double-click (MỞ VIEWER)
                    d.ondblclick = (event) => {
                         event.preventDefault(); 
                         cur = i;
                         setView('viewer');
                    }

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's500'); 
                    
                    // DOT Grid: Hiển thị số thứ tự
                    let dotContent = isSel ? `<div class="grid-dot">${selectedPhotoIds.indexOf(p.id) + 1}</div>` : '';
                    
                    d.innerHTML = `<img src="${thumb}" loading="lazy">${dotContent}`;
                    
                    grid.appendChild(d);
                });
            }

            // 3. Cập nhật nút "Gửi List" và Tổng số ảnh trên thanh điều khiển chung
            const btnDone = document.querySelector('.btn-done');
            if (btnDone) btnDone.innerText = `🚀 Gửi List (${count})`;
            document.getElementById('totalPhotos').innerText = photos.length;

            // 4. Cập nhật tên album
            document.querySelector('.album-title').innerText = `${albumTitle} (${photos.length} ảnh)`;

            // 5. Cập nhật trạng thái nút Chọn trên thanh điều khiển chung
            const btnSel = document.getElementById('btnSel');
            const isSelCur = photos.length > 0 && selectedPhotoIds.includes(photos[cur].id);
            
            if (btnSel) {
                // Đảm bảo không bị khóa
                btnSel.disabled = false;

                if (currentView === 'viewer') {
                    btnSel.className=`btn btn-sel ${isSelCur?'act':''}`; 
                    btnSel.innerText=isSelCur?'✔ Đã Chọn':'Chọn';
                } else {
                    btnSel.className='btn btn-sel'; 
                    btnSel.innerText='Chọn';
                }
            }
            
            // 6. Cập nhật thông tin file (tên và số đếm)
            const pNameElement = document.getElementById('pName');
            const pCountElement = document.getElementById('pCount');

            if (currentView === 'viewer' && photos.length > 0) {
                pNameElement.innerText = photos[cur].name;
                pCountElement.innerText = `${cur + 1} / ${photos.length}`;
            } else if (currentView === 'grid') {
                pNameElement.innerText = 'Chọn Ảnh Dạng Lưới';
                pCountElement.innerText = `Đã chọn: ${count} ảnh`;
            }
        }


        // SỬA ĐỔI: INIT (Khắc phục lỗi mất dữ liệu khi refresh)
        async function init() {
            try {
                cvs = document.getElementById('drawCanvas');
                img = document.getElementById('mainImg');

                if(!fid) throw new Error("Link thiếu mã Album (id)");
                
                // 1. TẢI DỮ LIỆU ĐÃ CHỌN TỪ LOCAL STORAGE (Bền vững)
                const LOCAL_STORAGE_KEY = 'anh_da_chon_cua_khach_' + fid;
                const duLieuDaLuuJSON = localStorage.getItem(LOCAL_STORAGE_KEY);
                
                if (duLieuDaLuuJSON) {
                    selectedPhotoIds = JSON.parse(duLieuDaLuuJSON); 
                } else {
                    selectedPhotoIds = [];
                }
                
                // BỎ QUA KIỂM TRA KHÓA Ở ĐÂY

                // 2. TẢI DỮ LIỆU ẢNH (Từ Server)
                let res = await fetch(`${URL_GET}?id=${fid}`);
                if(!res.ok) throw new Error("Lỗi Server/Kết nối");
                
                let data = await res.json();
                
                photos = data.photos || data; 
                if (!photos || !photos.length) throw Error("Album trống hoặc sai ID");

                document.getElementById('load').style.display='none';
                
                capNhatSoThuTuVaTổngSố(); 
                setView('grid'); 
                
                ['mousedown','touchstart'].forEach(e=>cvs.addEventListener(e,start));
                ['mouseup','touchend'].forEach(e=>cvs.addEventListener(e,end));
                ['mousemove','touchmove'].forEach(e=>cvs.addEventListener(e,draw));
                
                document.onkeydown=e=>{if(currentView==='viewer' && !isDraw){if(e.key=='ArrowRight')mov(1);if(e.key=='ArrowLeft')mov(-1);if(e.key==' ')togSel();}};

            } catch(e) { 
                document.getElementById('load').innerHTML = `<span style="color:red">Lỗi tải dữ liệu: ${e.message}</span>`; 
            }
        }

        // HÀM SHOW (CHỈ CHẠY TRONG CHẾ ĐỘ VIEWER)
        function show(i) {
            if(isDraw) togDraw(false); 
            if(i<0 || i>=photos.length) return;
            cur=i; let p=photos[i];
            
            let hd = getLink(p.id, 's2000'); 
            img.src=hd; 
            img.onload = () => { 
                cvs.width = img.offsetWidth; 
                cvs.height = img.offsetHeight;
                if(isDraw) ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
            };
            
            document.getElementById('pName').innerText=p.name;
            document.getElementById('pCount').innerText = `${i+1} / ${photos.length}`;
            
            document.querySelectorAll('.th').forEach(d=>d.classList.remove('act'));
            let t=document.getElementById(`t-${i}`); 
            if(t){t.classList.add('act'); t.scrollIntoView({behavior:'smooth',inline:'center'});}

            capNhatSoThuTuVaTổngSố(); 

            let isSel = selectedPhotoIds.includes(p.id);
            let btn=document.getElementById('btnSel');
            btn.className=`btn btn-sel ${isSel?'act':''}`; 
            btn.innerText=isSel?'✔ Đã Chọn':'Chọn';
        }
        
        // FIX LỖI VẼ
        function togDraw(en) {
            const tl=document.getElementById('tools');
            isDraw=en; tl.classList.toggle('active', en); cvs.style.display=en?'block':'none';
            if(en) { 
                if (!ctx) {
                    ctx=cvs.getContext('2d'); 
                }
                ctx.strokeStyle='red'; 
                ctx.lineWidth=5; 
                ctx.lineCap='round'; 
                ctx.drawImage(img, 0, 0, cvs.width, cvs.height); 
            } else {
                cls(); 
            }
        }

        let paint=false;
        function start(e){paint=true;draw(e);}
        function end(){paint=false;if(ctx) ctx.beginPath();} 
        function draw(e){
            if(!paint||!isDraw||!ctx)return; 
            e.preventDefault();
            const r=cvs.getBoundingClientRect();
            const x=((e.clientX||e.touches[0].clientX)-r.left) * (cvs.width/r.width);
            const y=((e.clientY||e.touches[0].clientY)-r.top) * (cvs.height/r.height);
            ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
        }
        
        function setPen(){if(ctx){ctx.globalCompositeOperation='source-over';ctx.strokeStyle='red';}}
        function cls(){if(ctx){ctx.clearRect(0,0,cvs.width,cvs.height); ctx.drawImage(img,0,0,cvs.width,cvs.height);}}
        
        function saveDraw() {
            if(!confirm("Lưu ghi chú?")) return;
            cvs.toBlob(async function(blob) {
                let fd=new FormData();
                fd.append('file', blob, `Ve_${fid}_${photos[cur].name}.png`);
                fd.append('photoId', photos[cur].id);
                try {
                    let r = await fetch(URL_DRAW, {method:'POST', body:fd});
                    if(r.ok) { alert("✅ Đã lưu!"); togDraw(false); } else alert("Lỗi!");
                } catch(e) { alert("Lỗi: "+e.message); }
            }, 'image/png');
        }

        // SỬA ĐỔI: TOGGLE SEL (FIX CỘNG DỒN)
        function togSel() {
            let p=photos[cur]; 
            let ns = !selectedPhotoIds.includes(p.id); 
            
            if (ns) {
                selectedPhotoIds.push(p.id);
            } else {
                const index = selectedPhotoIds.indexOf(p.id);
                if (index > -1) {
                    selectedPhotoIds.splice(index, 1);
                }
            }
            p.selected = ns ? 'true' : 'false';

            capNhatSoThuTuVaTổngSố();

            let btn=document.getElementById('btnSel');
            btn.className=`btn btn-sel ${ns?'act':''}`; 
            btn.innerText=ns?'✔ Đã Chọn':'Chọn';
            
            luuTrangThaiLocally(); 

            fetch(URL_SAVE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:p.id, selected:ns})});
        }
        
        function mov(d){show(cur+d);}
        async function finish(){
            if(confirm("Gửi danh sách chọn?")) {
                await fetch(URL_DONE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:fid})});
                alert("✅ Đã gửi!");
            }
        }
        
        init();
    </script>
</body>
</html>
