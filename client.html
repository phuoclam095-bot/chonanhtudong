<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ảnh - Công Tử Bạc Liêu</title>
    <style>
        :root { --bg: #1a1a1a; --gold: #c5a059; --text: #f0f0f0; --panel: #2b2b2b; --blue-frame: #007bff; }
        
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
        
        /* HEADER VÀ TOOLBAR CHUNG */
        .header { background: #155724; color: white; padding: 15px 20px; text-align: center; font-size: 20px; font-weight: bold; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        .view-toggle { display: flex; gap: 10px; }
        .view-btn { padding: 5px 10px; background: rgba(255, 255, 255, 0.2); border: none; color: white; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .view-btn.active { background: var(--gold); color: #000; font-weight: bold; }

        /* KHU VỰC CHÍNH */
        .main-container { flex: 1; overflow: hidden; position: relative; }
        
        /* CHẾ ĐỘ 1: GRID VIEW (MỚI) */
        #photoGrid { 
            padding: 20px; 
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 100%;
            background: #000;
        }
        .grid-item { position: relative; border: 2px solid transparent; cursor: pointer; overflow: hidden; }
        .grid-item img { width: 100%; height: auto; display: block; }
        .grid-item:hover { opacity: 0.9; }
        .grid-item.sel { border-color: var(--blue-frame); } /* Khung xanh cho ảnh đã chọn */
        
        .grid-heart { position: absolute; top: 10px; right: 10px; color: white; text-shadow: 0 0 5px #000; font-size: 24px; pointer-events: none; }
        .grid-dot { 
            position: absolute; top: 4px; right: 4px; 
            width: 20px; height: 20px; 
            background: var(--gold); color: #000;
            border-radius: 4px; 
            font-size: 12px; font-weight: bold;
            text-align: center; line-height: 20px;
            z-index: 10;
        }

        /* CHẾ ĐỘ 2: VIEWER (DÙNG CODE CŨ) */
        #photoViewer { display: none; height: 100%; flex-direction: column; }
        .stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #333, #000); width: 100%; overflow: hidden; }
        .canvas-box { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #mainImg { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 0 20px #000; }
        #drawCanvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: crosshair; display: none; z-index: 10; }
        .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 15px; cursor: pointer; font-size: 24px; z-index: 20; border-radius: 5px; }
        .nav:hover { background: var(--gold); } .prev { left: 10px; } .next { right: 10px; }
        .tools { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 8px 15px; border-radius: 50px; display: none; gap: 15px; z-index: 100; border: 1px solid var(--gold); }
        .tools.active { display: flex; }
        .t-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 1px solid #555; background: #444; color: #fff; font-size: 18px; }
        .t-btn:hover { transform: scale(1.1); } .t-btn.act { background: var(--gold); color: #000; }
        .ctrl { height: 65px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-top: 1px solid #444; flex-shrink: 0; z-index: 50; }
        .info { display: flex; flex-direction: column; } .p-count { font-size: 12px; color: #888; }
        .btn { padding: 8px 20px; border-radius: 30px; cursor: pointer; border: none; font-weight: bold; }
        .btn-draw { background: #d63384; color: white; margin-left: 20px; }
        .btn-sel { background: transparent; border: 2px solid var(--gold); color: var(--gold); margin-left: 20px; }
        .btn-sel.act { background: var(--gold); color: #000; }
        .btn-done { background: #28a745; color: white; border-radius: 5px; }
        .strip { height: 110px; background: #000; display: flex; gap: 10px; padding: 10px; overflow-x: auto; flex-shrink: 0; border-top: 1px solid #333; }
        .th { min-width: 90px; height: 90px; opacity: 0.5; border: 2px solid transparent; cursor: pointer; position: relative; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .th img { width: 100%; height: 100%; object-fit: cover; } 
        .th.act { opacity: 1; border-color: var(--gold); transform: scale(1.05); z-index: 5; } 
        .th.sel { opacity: 1; border-color: var(--blue-frame); } 
        .th.sel.act { border-color: var(--gold); } 
        .dot { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: var(--gold); color: #000; border-radius: 4px; display: none; box-shadow: 0 0 4px #000; font-size: 12px; font-weight: bold; text-align: center; line-height: 20px; z-index: 10; }
        
        #load { position: fixed; inset: 0; background: #1a1a1a; color: var(--gold); display: flex; justify-content: center; align-items: center; z-index: 999; font-size: 20px; flex-direction: column; }
    </style>
</head>
<body>
    <div id="load"><div>⏳</div><div>Đang tải dữ liệu...</div></div>

    <div class="header">
        Album Ảnh Nhi (<span id="totalPhotos">0</span> ảnh)
        <div class="view-toggle">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')">🖼️ Dạng Lưới</button>
            <button class="view-btn" id="btnViewer" onclick="setView('viewer')">🔍 Xem Chi Tiết</button>
        </div>
    </div>

    <div class="main-container">
        
        <div id="photoGrid">
            </div>

        <div id="photoViewer">
            <div class="tools" id="tools">
                <button class="t-btn act" onclick="setPen()">✏️</button>
                <button class="t-btn" onclick="cls()">🗑️</button>
                <button class="t-btn" style="background:green" onclick="saveDraw()">💾</button>
                <button class="t-btn" style="background:red" onclick="togDraw(false)">❌</button>
            </div>

            <div class="stage">
                <button class="nav prev" onclick="mov(-1)">&#10094;</button>
                <div class="canvas-box">
                    <img id="mainImg" src="">
                    <canvas id="drawCanvas"></canvas>
                </div>
                <button class="nav next" onclick="mov(1)">&#10095;</button>
            </div>

            <div class="ctrl">
                <div class="info">
                    <div style="font-weight:bold; color:var(--gold)" id="pName">...</div>
                    <div class="p-count" id="pCount">0 / 0</div>
                </div>
                <div style="display:flex; align-items:center">
                    <button class="btn btn-draw" onclick="togDraw(true)">🖌️ Vẽ</button>
                    <button class="btn btn-sel" id="btnSel" onclick="togSel()">Chọn</button>
                </div>
                <button class="btn btn-done" onclick="finish()">🚀 Gửi List</button>
            </div>

            <div class="strip" id="strip"></div>
        </div>

    </div>

    <script>
        // ============================================================
        // ⚠️ CẤU HÌNH LINK SẢN PHẨM (PRODUCTION)
        // ============================================================
        const URL_GET = 'https://dichvufb.tino.page/webhook/get-photos'; 
        const URL_SAVE = 'https://dichvufb.tino.page/webhook/save-selection'; 
        const URL_DRAW = 'https://dichvufb.tino.page/webhook/upload-drawing';
        const URL_DONE = 'https://dichvufb.tino.page/webhook/finish-selection';

        let photos=[], cur=0, isDraw=false, ctx=null, currentView='grid'; 
        let cvs, img; 

        const urlParams = new URLSearchParams(window.location.search);
        const fid = urlParams.get('id');

        let selectedPhotoIds = []; // Mảng (Array) để lưu trữ ID theo thứ tự chọn

        // --- HÀM TẠO LINK THÔNG MINH (Dùng /thumbnail) ---
        function getLink(id, size) {
            return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`;
        }

        // 💡 HÀM CHUYỂN ĐỔI CHẾ ĐỘ XEM
        function setView(view) {
            currentView = view;
            const gridDiv = document.getElementById('photoGrid');
            const viewerDiv = document.getElementById('photoViewer');
            const btnGrid = document.getElementById('btnGrid');
            const btnViewer = document.getElementById('btnViewer');
            
            if (view === 'grid') {
                gridDiv.style.display = 'grid';
                viewerDiv.style.display = 'none';
                btnGrid.classList.add('active');
                btnViewer.classList.remove('active');
                capNhatSoThuTuVaTongSo(); // Cập nhật lại Grid View
            } else {
                gridDiv.style.display = 'none';
                viewerDiv.style.display = 'flex';
                btnGrid.classList.remove('active');
                btnViewer.classList.add('active');
                show(cur); // Chuyển sang Viewer và hiển thị ảnh hiện tại
            }
        }

        // 💡 HÀM LƯU TRẠNG THÁI VÀO LOCAL STORAGE
        function luuTrangThaiLocally() {
            localStorage.setItem('anh_da_chon_cua_khach', JSON.stringify(selectedPhotoIds));
        }

        // 💡 HÀM CẬP NHẬT SỐ THỨ TỰ VÀ TỔNG SỐ ẢNH (CHUNG CHO CẢ HAI CHẾ ĐỘ)
        function capNhatSoThuTuVaTongSo() {
            let count = selectedPhotoIds.length;
            
            // 1. Cập nhật Viewer Strip (Nếu đang ở chế độ Viewer)
            const strip = document.getElementById('strip');
            if (strip) {
                strip.innerHTML = '';
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'th';
                    d.id = `t-${i}`;
                    d.onclick = () => show(i);

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's220');
                    d.innerHTML = `<img src="${thumb}" loading="lazy"><div class="dot">${isSel ? selectedPhotoIds.indexOf(p.id) + 1 : ''}</div>`;
                    strip.appendChild(d);
                });
                // Đảm bảo ảnh đang xem vẫn được làm nổi bật
                let t = document.getElementById(`t-${cur}`);
                if (t) t.classList.add('act');
            }
            
            // 2. Cập nhật Grid View
            const grid = document.getElementById('photoGrid');
            if (grid) {
                grid.innerHTML = '';
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'grid-item';
                    d.onclick = () => {
                        // Khi click vào Grid, chuyển sang Viewer và hiển thị ảnh đó
                        setView('viewer');
                        show(i);
                    };

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's400'); // Kích thước lớn hơn cho dạng lưới
                    let dotContent = isSel ? `<div class="grid-dot">${selectedPhotoIds.indexOf(p.id) + 1}</div>` : '';
                    
                    d.innerHTML = `<img src="${thumb}" loading="lazy"><div class="grid-heart">❤️</div>${dotContent}`;
                    grid.appendChild(d);
                });
            }

            // 3. Cập nhật nút "Gửi List" và Tổng số ảnh
            const btnDone = document.querySelector('.btn-done');
            if (btnDone) btnDone.innerText = `🚀 Gửi List (${count})`;
            document.getElementById('totalPhotos').innerText = photos.length;
        }


        // SỬA ĐỔI: INIT
        async function init() {
            // ... (Phần gán DOM và tải dữ liệu giữ nguyên) ...
            try {
                cvs = document.getElementById('drawCanvas');
                img = document.getElementById('mainImg');

                if(!fid) throw new Error("Link thiếu mã Album (id)");
                
                let res = await fetch(`${URL_GET}?id=${fid}`);
                if(!res.ok) throw new Error("Lỗi Server/Kết nối");
                
                let data = await res.json();
                if (!data || !data.length) throw new Error("Album trống hoặc sai ID");
                
                photos = data;

                // Tải trạng thái đã lưu
                const duLieuDaLuuJSON = localStorage.getItem('anh_da_chon_cua_khach');
                if (duLieuDaLuuJSON) {
                    selectedPhotoIds = JSON.parse(duLieuDaLuuJSON); 
                }

                document.getElementById('load').style.display='none';
                
                // 💡 CHỈ RENDER BAN ĐẦU, HIỂN THỊ CHẾ ĐỘ LƯỚI MẶC ĐỊNH
                capNhatSoThuTuVaTongSo(); // Vừa render cả Grid và Strip, vừa tính toán số thứ tự
                setView('grid'); 
                
                // ... (Gắn sự kiện) ...
                ['mousedown','touchstart'].forEach(e=>cvs.addEventListener(e,start));
                ['mouseup','touchend'].forEach(e=>cvs.addEventListener(e,end));
                ['mousemove','touchmove'].forEach(e=>cvs.addEventListener(e,draw));
                
                document.onkeydown=e=>{if(currentView==='viewer' && !isDraw){if(e.key=='ArrowRight')mov(1);if(e.key=='ArrowLeft')mov(-1);if(e.key==' ')togSel();}};

            } catch(e) { 
                document.getElementById('load').innerHTML = `<span style="color:red">Lỗi tải dữ liệu: ${e.message}</span>`; 
            }
        }

        // HÀM SHOW (CHỈ CHẠY TRONG CHẾ ĐỘ VIEWER)
        function show(i) {
            if(i<0 || i>=photos.length) return;
            cur=i; let p=photos[i];
            
            // Load ảnh chính
            let hd = getLink(p.id, 's2000'); 
            img.src=hd; 
            img.onload = () => { 
                cvs.width = img.offsetWidth; 
                cvs.height = img.offsetHeight;
                if(isDraw) ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
            };
            
            document.getElementById('pName').innerText=p.name;
            document.getElementById('pCount').innerText = `${i+1} / ${photos.length}`;
            
            // Xóa act cũ trên strip, đặt act mới
            document.querySelectorAll('.th').forEach(d=>d.classList.remove('act'));
            let t=document.getElementById(`t-${i}`); 
            if(t){t.classList.add('act'); t.scrollIntoView({behavior:'smooth',inline:'center'});}

            // Kiểm tra trạng thái đã chọn từ Mảng
            let isSel = selectedPhotoIds.includes(p.id);
            let btn=document.getElementById('btnSel');
            btn.className=`btn btn-sel ${isSel?'act':''}`; btn.innerText=isSel?'✔ Đã Chọn':'Chọn';
        }
        
        // ... (các hàm vẽ: togDraw, start, end, draw, setPen, cls, saveDraw giữ nguyên) ...

        function togDraw(en) {
            const tl=document.getElementById('tools');
            isDraw=en; tl.classList.toggle('active', en); cvs.style.display=en?'block':'none';
            if(en) { 
                ctx=cvs.getContext('2d'); 
                ctx.strokeStyle='red'; ctx.lineWidth=5; ctx.lineCap='round'; 
                ctx.drawImage(img, 0, 0, cvs.width, cvs.height); 
            } else {
                cls(); 
            }
        }

        let paint=false;
        function start(e){paint=true;draw(e);}
        function end(){paint=false;ctx.beginPath();}
        function draw(e){
            if(!paint||!isDraw)return; e.preventDefault();
            const r=cvs.getBoundingClientRect();
            const x=((e.clientX||e.touches[0].clientX)-r.left) * (cvs.width/r.width);
            const y=((e.clientY||e.touches[0].clientY)-r.top) * (cvs.height/r.height);
            ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
        }
        
        function setPen(){ctx.globalCompositeOperation='source-over';ctx.strokeStyle='red';}
        function cls(){ctx.clearRect(0,0,cvs.width,cvs.height); ctx.drawImage(img,0,0,cvs.width,cvs.height);}
        
        function saveDraw() {
            if(!confirm("Lưu ghi chú?")) return;
            cvs.toBlob(async function(blob) {
                let fd=new FormData();
                fd.append('file', blob, `Ve_${fid}_${photos[cur].name}.png`);
                fd.append('photoId', photos[cur].id);
                try {
                    let r = await fetch(URL_DRAW, {method:'POST', body:fd});
                    if(r.ok) { alert("✅ Đã lưu!"); togDraw(false); } else alert("Lỗi!");
                } catch(e) { alert("Lỗi: "+e.message); }
            }, 'image/png');
        }

        // SỬA ĐỔI: TOGGLE SEL (FIX CỘNG DỒN)
        function togSel() {
            let p=photos[cur]; 
            let ns = !selectedPhotoIds.includes(p.id); // Trạng thái mới là có chọn hay không
            
            // Cập nhật Mảng selectedPhotoIds theo logic thời gian chọn
            if (ns) {
                selectedPhotoIds.push(p.id);
            } else {
                const index = selectedPhotoIds.indexOf(p.id);
                if (index > -1) {
                    selectedPhotoIds.splice(index, 1);
                }
            }
            p.selected = ns ? 'true' : 'false';

            // Cập nhật số thứ tự và tổng số ảnh cho cả hai chế độ
            capNhatSoThuTuVaTongSo();

            if (currentView === 'viewer') {
                show(cur); // Cập nhật nút 'Chọn' và khung vàng/xanh trong Viewer
            }
            
            // Lưu trạng thái vào Local Storage và gửi lên Server
            luuTrangThaiLocally();

            fetch(URL_SAVE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:p.id, selected:ns})});
        }
        
        function mov(d){show(cur+d);}
        async function finish(){
            if(confirm("Gửi danh sách chọn?")) {
                await fetch(URL_DONE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:fid})});
                alert("✅ Đã gửi!");
            }
        }
        
        init();
    </script>
</body>
</html>
