<style>
        :root { 
            /* ... (các biến màu và hình nền giữ nguyên) ... */
            --grid-item-size: 300px; /* Ảnh lớn hơn */
            --grid-gap: 15px; /* Khoảng cách giữa các ảnh */
            --header-height: 80px; /* Chiều cao của thanh header mới */
        }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; 
        }
        
        /* HEADER MỚI (CHỨA thông tin chọn và nút Gửi List) */
        .header { 
            background: #155724; 
            color: white; 
            height: var(--header-height); /* Chiều cao cố định */
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            flex-shrink: 0;
            z-index: 10;
        }
        .album-info { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; /* Căn trái */
            margin-right: auto; /* Đẩy ra xa nút Gửi List */
        }
        .album-title { 
            font-size: 18px; 
            font-weight: bold; 
            color: white; /* Tiêu đề album màu trắng */
        }
        .selected-count { 
            font-size: 14px; 
            color: #ccc; 
        }
        .btn-done { 
            background: #28a745; 
            color: white; 
            padding: 10px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            border: none; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }
        .btn-done:hover {
            background: #218838;
        }

        /* KHU VỰC CHÍNH CHỈ CÓ GRID */
        .main-container { 
            flex: 1; 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg); /* Đảm bảo nền chính khớp với nền lưới */
        }
        
        #photoGrid { 
            padding: var(--grid-gap); 
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-item-size), 1fr));
            gap: var(--grid-gap); 
            flex-grow: 1; 
            background-image: var(--grid-bg-image); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed; 
            position: relative; 
        }
        #photoGrid::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); 
            z-index: 0;
        }

        .grid-item-wrapper { 
            position: relative;
            border: 3px solid transparent; /* Viền dày hơn */
            transition: border-color 0.2s, transform 0.2s;
            cursor: pointer;
            overflow: hidden;
            border-radius: 12px; /* Bo tròn lớn hơn */
            box-shadow: 0 6px 12px rgba(0,0,0,0.6); /* Đổ bóng mạnh hơn */
            z-index: 1; 
            height: var(--grid-item-size); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(0,0,0,0.8); /* Nền tối hơn */
        }
        .grid-item-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.8); 
            transform: scale(1.02); /* Phóng to nhẹ khi hover */
        }
        .grid-item-wrapper.sel { 
            border-color: var(--blue-frame); 
            transform: scale(1.03); 
        }
        .grid-item-wrapper img { 
            width: auto; 
            height: auto; 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; /* Đảm bảo ảnh không bị cắt */
            display: block; 
            border-radius: 8px; /* Bo tròn ảnh bên trong */
        }
        /* DOT Grid: Số thứ tự */
        .grid-dot { 
            position: absolute; top: 10px; right: 10px; 
            width: 32px; height: 32px; 
            background: var(--gold); color: #000;
            border-radius: 50%; 
            font-size: 18px; font-weight: bold; 
            text-align: center; line-height: 32px;
            z-index: 3; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; 
            display: none; 
        }
        .grid-item-wrapper.sel .grid-dot { display: flex; }
        
        /* ẨN HOÀN TOÀN VIEWER VÀ THANH CÔNG CỤ CŨ */
        #photoViewer, .ctrl, .view-toggle, .btn-draw, .btn-sel { 
            display: none !important; 
        }
        
        #load { 
            position: fixed; inset: 0; background: #1a1a1a; color: var(--gold); display: flex; justify-content: center; align-items: center; z-index: 999; font-size: 20px; flex-direction: column; 
        }
</style>
