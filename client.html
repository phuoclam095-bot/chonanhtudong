<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ảnh -ct Bạc Liêu</title>
    <style>
        :root { 
            --bg: #1a1a1a; 
            --gold: #c5a059; 
            --text: #f0f0f0; 
            --panel: #2b2b2b; 
            --blue-frame: #007bff; 
            --focus-frame: #f0c300; /* Màu vàng mới cho bo viền khi click đơn */
            /* ẢNH NỀN HOA VĂN TỐI */
            --grid-bg-image: url('https://img.tripi.vn/cdn-cgi/image/width=700,height=700/https://gcs.tripi.vn/public-tripi/tripi-feed/img/482888PMq/anh-mo-ta.png'); 
            --grid-item-size: 380px; 
            --grid-item-height: 240px; 
            --grid-gap: 10px; 
        }
        
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
        
        /* HEADER VÀ TOOLBAR CHUNG */
        .header { 
            background: #155724; 
            color: white; 
            padding: 15px 20px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            flex-shrink: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .album-title { flex-grow: 1; text-align: center; } 
        .view-toggle { display: flex; gap: 10px; flex-shrink: 0; }
        .view-btn { padding: 5px 10px; background: rgba(255, 255, 255, 0.2); border: none; color: white; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .view-btn:hover { background: rgba(255, 255, 255, 0.4); }
        .view-btn.active { background: var(--gold); color: #000; font-weight: bold; }

        /* KHU VỰC CHÍNH */
        .main-container { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        
        /* CHẾ ĐỘ 1: GRID VIEW */
        #photoGrid { 
            padding: var(--grid-gap); 
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-item-size), 1fr));
            gap: var(--grid-gap); 
            flex-grow: 1; 
            background: var(--bg); 
            background-image: var(--grid-bg-image); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed; 
            position: relative; 
        }
        #photoGrid::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); 
            z-index: 0;
        }

        .grid-item-wrapper { 
            position: relative;
            border: 1px solid transparent; 
            transition: border-color 0.2s, transform 0.2s;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 1; 
            height: var(--grid-item-height); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(0,0,0,0.5); 
        }
        .grid-item-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.7); 
            transform: translateY(-2px);
        }
        
        /* --- ĐIỀU CHỈNH MỚI CHO TRẠNG THÁI FOCUS/SINGLE CLICK --- */
        .grid-item-wrapper.focused {
            border-width: 4px;
            border-color: var(--focus-frame); /* MÀU VÀNG KHI NHẤP ĐƠN */
            transform: scale(1.02);
        }
        
        /* Trạng thái đã chọn (Màu Xanh Cố Định) */
        .grid-item-wrapper.sel { 
            border-width: 4px; 
            border-color: var(--blue-frame); /* MÀU XANH KHI ĐÃ CHỌN */
            transform: scale(1.02); 
        }
        /* Ưu tiên viền xanh nếu đã chọn, nếu không thì dùng viền vàng khi focus */
        .grid-item-wrapper.sel.focused {
             border-color: var(--blue-frame); 
        }
        
        .grid-item-wrapper img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            border-radius: 6px; 
        }
        /* DOT GRID: Số thứ tự */
        .grid-dot { 
            position: absolute; top: 8px; right: 8px; 
            width: 28px; height: 28px; 
            background: var(--gold); color: #000;
            border-radius: 50%; 
            font-size: 16px; font-weight: bold; 
            text-align: center; line-height: 28px;
            z-index: 3; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center; 
            display: none; 
        }
        .grid-item-wrapper.sel .grid-dot { display: flex; }
        
        /* CHẾ ĐỘ 2: VIEWER (Giữ nguyên) */
        #photoViewer { 
            display: none; 
            flex-direction: column; 
            flex-grow: 1; 
            background: var(--bg); 
            overflow: hidden;
        }
        .stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #333, #000); width: 100%; overflow: hidden; }
        .canvas-box { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #mainImg { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 0 20px #000; }
        #drawCanvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: crosshair; display: none; z-index: 10; }
        .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 15px; cursor: pointer; font-size: 24px; z-index: 20; border-radius: 5px; }
        .nav:hover { background: var(--gold); } .prev { left: 10px; } .next { right: 10px; }
        .tools { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 8px 15px; border-radius: 50px; display: none; gap: 15px; z-index: 100; border: 1px solid var(--gold); }
        .tools.active { display: flex; }
        .t-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 1px solid #555; background: #444; color: #fff; font-size: 18px; }
        .t-btn:hover { transform: scale(1.1); } .t-btn.act { background: var(--gold); color: #000; }

        /* THANH ĐIỀU KHIỂN CHUNG (Giữ nguyên) */
        .ctrl { height: 65px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-top: 1px solid #444; flex-shrink: 0; z-index: 50; }
        .info { display: flex; flex-direction: column; width: 180px; } 
        .p-count { font-size: 12px; color: #888; }
        .btn { padding: 8px 20px; border-radius: 30px; cursor: pointer; border: none; font-weight: bold; }
        .btn-draw { background: #d63384; color: white; margin-left: 20px; }
        .btn-sel { background: transparent; border: 2px solid var(--gold); color: var(--gold); margin-left: 20px; }
        .btn-sel.act { background: var(--gold); color: #000; }
        .btn-done { background: #28a745; color: white; border-radius: 5px; }
        .strip { height: 110px; background: #000; display: flex; gap: 10px; padding: 10px; overflow-x: auto; flex-shrink: 0; border-top: 1px solid #333; }
        .th { min-width: 90px; height: 90px; opacity: 0.5; border: 2px solid transparent; cursor: pointer; position: relative; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .th img { width: 100%; height: 100%; object-fit: cover; } 
        .th.act { opacity: 1; border-color: var(--gold); transform: scale(1.05); z-index: 5; } 
        .th.sel { opacity: 1; border-color: var(--blue-frame); } 
        .th.sel.act { border-color: var(--gold); } 
        .dot { 
            position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; 
            background: var(--gold); color: #000;
            border-radius: 50%; 
            font-size: 12px; font-weight: bold; 
            text-align: center; line-height: 20px;
            box-shadow: 0 0 4px #000; z-index: 10;
            display: none; 
        }
        .th.sel .dot { display: flex; justify-content: center; align-items: center; } 
        
        #load { position: fixed; inset: 0; background: #1a1a1a; color: var(--gold); display: flex; justify-content: center; align-items: center; z-index: 999; font-size: 20px; flex-direction: column; }
        
        .locked-overlay {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            pointer-events: auto; 
        }
    </style></head><body>
    <div id="load"><div>⏳</div><div>Đang tải dữ liệu...</div></div>

    <div class="header">
        <div class="album-title">Thư Viện Ảnh (<span id="totalPhotos">0</span> ảnh)</div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')">🖼️ Dạng Lưới</button>
            <button class="view-btn" id="btnViewer" onclick="setView('viewer')">🔍 Xem Chi Tiết</button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="ctrl" id="commonCtrlBar">
            <div class="info">
                <div style="font-weight:bold; color:var(--gold)" id="pName">...</div>
                <div class="p-count" id="pCount">0 / 0</div>
            </div>
            <div style="display:flex; align-items:center">
                <button class="btn btn-draw" id="btnDraw" onclick="togDraw(true)" style="display: none;">🖌️ Vẽ</button>
                <button class="btn btn-sel" id="btnSel" onclick="togSel()">Chọn</button>
            </div>
            <button class="btn btn-done" onclick="finalCommit()">Lưu Chọn</button>
        </div>
        
        <div id="photoGrid">
        </div>

        <div id="photoViewer">
            <div class="tools" id="tools">
                <button class="t-btn act" onclick="setPen()">✏️</button>
                <button class="t-btn" onclick="cls()">🗑️</button>
                <button class="t-btn" style="background:green" onclick="saveDraw()">💾</button>
                <button class="t-btn" style="background:red" onclick="togDraw(false)">❌</button>
            </div>

            <div class="stage">
                <button class="nav prev" onclick="mov(-1)">&#10094;</button>
                <div class="canvas-box">
                    <img id="mainImg" src="">
                    <canvas id="drawCanvas"></canvas>
                </div>
                <button class="nav next" onclick="mov(1)">&#10095;</button>
            </div>

            <div class="strip" id="strip"></div>
        </div>

    </div>

    <script>
        // Lệnh báo lỗi nếu cache không được xóa
        if (localStorage.getItem('layout_version') !== 'V16.3') { 
            alert('⚠️ YÊU CẦU XÓA CACHE: Vui lòng XÓA CACHE TRÌNH DUYỆT (Ctrl+Shift+R) và thử lại để áp dụng mã V16.3.');
        }
        localStorage.setItem('layout_version', 'V16.3'); 

        // ============================================================
        // ⚠️ CẤU HÌNH LINK SẢN PHẨM (PRODUCTION)
        // ============================================================
        const URL_GET = 'https://dichvufb.tino.page/webhook/get-photos'; 
        const URL_SAVE = 'https://dichvufb.tino.page/webhook/save-selection'; 
        const URL_DRAW = 'https://dichvufb.tino.page/webhook/upload-drawing';
        // ✅ WEBHOOK CHO LƯU CHỌN CUỐI CÙNG
        const URL_DONE = 'https://dichvufb.tino.page/webhook/commit-final-selection'; 

        let photos=[], cur=0, isDraw=false, ctx=null, currentView='grid'; 
        let cvs, img; 
        let albumTitle = "Thư Viện Ảnh"; 
        let isSelectionLocked = false; 

        const urlParams = new URLSearchParams(window.location.search);
        const fid = urlParams.get('id'); // Folder ID

        let selectedPhotoIds = []; 
        
        // --- HÀM TẠO LINK THÔNG MINH (Dùng /thumbnail) ---
        function getLink(id, size) {
            return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`;
        }

        // 💡 HÀM CHUYỂN ĐỔI CHẾ ĐỘ XEM
        function setView(view) {
            currentView = view;
            const gridDiv = document.getElementById('photoGrid');
            const viewerDiv = document.getElementById('photoViewer');
            const btnGrid = document.getElementById('btnGrid');
            const btnViewer = document.getElementById('btnViewer');
            const btnDraw = document.getElementById('btnDraw'); 
            
            if (view === 'grid') {
                gridDiv.style.display = 'grid';
                viewerDiv.style.display = 'none';
                btnGrid.classList.add('active');
                btnViewer.classList.remove('active');
                btnDraw.style.display = 'none'; 
                capNhatSoThuTuVaTổngSố(); 
            } else {
                gridDiv.style.display = 'none';
                viewerDiv.style.display = 'flex'; 
                btnGrid.classList.remove('active');
                btnViewer.classList.add('active');
                btnDraw.style.display = 'block'; 
                // Quan trọng: Luôn gọi show(cur) để đồng bộ trạng thái nút
                show(cur); 
            }
        }
        
        // 💡 HÀM ĐỂ XÓA MỌI TRẠNG THÁI FOCUS TRÊN LƯỚI
        function removeGridFocus() {
            document.querySelectorAll('.grid-item-wrapper').forEach(d => d.classList.remove('focused'));
        }

        // 💡 HÀM LƯU TRẠNG THÁI VÀO LOCAL STORAGE
        function luuTrangThaiLocally() {
            const LOCAL_STORAGE_KEY = 'anh_da_chon_cua_khach_' + fid;
            
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(selectedPhotoIds));
                console.log(`✅ LƯU BỀN VỮNG: ${selectedPhotoIds.length} ảnh vào ${LOCAL_STORAGE_KEY}`);
            } catch (e) {
                console.error("LỖI LƯU TRỮ LOCAL STORAGE:", e);
                alert("LỖI: Trình duyệt không thể lưu trạng thái chọn.");
            }
            
            localStorage.removeItem('anh_da_chon_cua_khach');
        }

        // 💡 HÀM CẬP NHẬT SỐ THỨ TỰ VÀ TỔNG SỐ ẢNH
        function capNhatSoThuTuVaTổngSố() {
            let count = selectedPhotoIds.length;
            
            // 1. Cập nhật Viewer Strip 
            const strip = document.getElementById('strip');
            if (strip) {
                strip.innerHTML = '';
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'th';
                    d.id = `t-${i}`;
                    d.onclick = () => show(i);

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's220');
                    const dotIndex = isSel ? selectedPhotoIds.indexOf(p.id) + 1 : '';
                    d.innerHTML = `<img src="${thumb}" loading="lazy"><div class="dot">${dotIndex}</div>`;
                    strip.appendChild(d);
                });
                
                let t = document.getElementById(`t-${cur}`);
                if (t) t.classList.add('act');
            }
            
            // 2. Cập nhật Grid View
            const grid = document.getElementById('photoGrid');
            if (grid) {
                
                grid.innerHTML = '';
                
                photos.forEach((p, i) => {
                    let d = document.createElement('div');
                    d.className = 'grid-item-wrapper'; 
                    d.setAttribute('data-index', i); 
                    
                    // Sự kiện single-click (bo viền vàng)
                    d.onclick = (e) => {
                        e.preventDefault(); 
                        
                        removeGridFocus();
                        d.classList.add('focused');
                        
                        cur = i;
                        
                        // 3. CẬP NHẬT NÚT CHỌN/ĐÃ CHỌN KHI CLICK TRÊN GRID (Đồng bộ)
                        const isSelCur = selectedPhotoIds.includes(photos[cur].id);
                        let btnSel = document.getElementById('btnSel');
                        btnSel.className=`btn btn-sel ${isSelCur?'act':''}`; 
                        btnSel.innerText=isSelCur?'✔ Đã Chọn':'Chọn';
                        
                        document.getElementById('pName').innerText = photos[cur].name;
                        document.getElementById('pCount').innerText = `${i + 1} / ${photos.length}`;
                    };
                    
                    // Sự kiện Double-click (MỞ VIEWER)
                    d.ondblclick = (event) => {
                         event.preventDefault(); 
                         cur = i;
                         setView('viewer');
                    }

                    let isSel = selectedPhotoIds.includes(p.id);
                    if (isSel) d.classList.add('sel');
                    
                    let thumb = getLink(p.id, 's500'); 
                    
                    // DOT Grid: Hiển thị số thứ tự
                    let dotContent = isSel ? `<div class="grid-dot">${selectedPhotoIds.indexOf(p.id) + 1}</div>` : '';
                    
                    d.innerHTML = `<img src="${thumb}" loading="lazy">${dotContent}`;
                    
                    grid.appendChild(d);
                });
            }

            // 3. Cập nhật nút "Lưu Chọn" và Tổng số ảnh trên thanh điều khiển chung
            const btnDone = document.querySelector('.btn-done');
            if (btnDone) btnDone.innerText = `Lưu Chọn (${count})`;
            document.getElementById('totalPhotos').innerText = photos.length;
            document.querySelector('.album-title').innerText = `${albumTitle} (${photos.length} ảnh)`;

### 🛠️ Hướng Dẫn Kích Hoạt SSL/TLS (Postgres Credential)

Bạn đã cung cấp danh sách đầy đủ các trường. Để kết nối thành công với Supabase, bạn **bắt buộc** phải kích hoạt SSL/TLS.

Nếu bạn không thấy **SSL** ở cuối màn hình sau `Password` và `Maximum Number of Connections`, hãy làm theo các bước sau trong Credential Node:

1.  **Cuộn Xuống/Tìm kiếm:** Cuộn xuống dưới cùng của tab **Parameters** (Tham số).

2.  **Tìm Trường SSL (Bị ẩn):** Dựa trên danh sách bạn cung cấp, trường **SSL** có tồn tại, nhưng có thể là một dropdown ẩn.

    | Trường | Giá trị/Cấu hình | Lý do |
    | :--- | :--- | :--- |
    | **Host** | **Địa chỉ DB Host** (Ví dụ: `db.xxxxxx.supabase.co`) | |
    | **Port** | `5432` | |
    | **SSL** | **Require** (Chọn từ Dropdown) | **BẮT BUỘC BẬT:** Supabase yêu cầu kết nối bảo mật. |

### 🚨 Lỗi Có Thể Xảy Ra (Nếu SSL không hiển thị)

Nếu trường **SSL** là một dropdown bị khóa hoặc không hiển thị giá trị, bạn cần kiểm tra xem có cần thiết lập **Tham số bổ sung (Additional Parameters)** thủ công không.

Nếu Node của bạn hiển thị trường **`Password`** và sau đó là **`Maximum Number of Connections`**, thì trường **`SSL`** sẽ là một dropdown **ngay bên dưới** `Ignore SSL Issues (Insecure)`.

**Hãy kiểm tra lại: Nếu trường SSL là dropdown, bạn phải đặt nó là Require để kết nối.**
