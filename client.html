<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Experience - V21.0 LUXURY</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --bg: #050a14; --header-h: 55px; --strip-h: 100px; --floating-bar-h: 60px; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
        
        /* HEADER LUXURY */
        .navbar { height: var(--header-h); background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 15px; z-index: 5000; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .album-title { font-weight: 900; font-size: 0.9rem; color: var(--primary); letter-spacing: 1px; }

        /* GRID CONTENT */
        #photoGrid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 10px; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
        @media (min-width: 768px) { #photoGrid { grid-template-columns: repeat(6, 1fr); } }

        .grid-item { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1/1; background: #111; border: 2.5px solid transparent; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .grid-item:hover img { transform: scale(1.1); }
        .grid-item.focused { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.25); transform: scale(0.96); }
        .grid-item.selected { border-color: var(--primary); }
        
        .vip-dot { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; background: var(--primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; z-index: 10; border: 2px solid #000; }

        /* CHI TIẾT - PHÂN TẦNG HIỆN ĐẠI */
        #photoViewer { position: absolute; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; }
        .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 15px; }
        #mainImg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        .strip-luxury { height: var(--strip-h); background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; gap: 15px; padding: 0 15px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .th-vip { height: 75px; width: 75px; border-radius: 15px; flex-shrink: 0; overflow: hidden; border: 3px solid transparent; opacity: 0.4; transition: 0.3s; position: relative; }
        .th-vip img { width: 100%; height: 100%; object-fit: cover; }
        .th-vip.act { opacity: 1; border-color: var(--primary); transform: scale(1.1) translateY(-5px); }
        .th-vip.sel { border-color: var(--primary); opacity: 1; }

        /* THANH CÔNG CỤ NỔI (FLOATING BAR) ĐẲNG CẤP */
        .bottom-floating-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; height: var(--floating-bar-h);
            background: rgba(20, 30, 45, 0.8); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 30px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; z-index: 6000; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .btn-vip { height: 44px; border-radius: 22px; font-weight: 900; border: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 0.8rem; }
        .btn-sq { width: 44px; font-size: 1.1rem; }
        .btn-long { padding: 0 20px; text-transform: uppercase; gap: 8px; }
        
        .bg-glass { background: rgba(255,255,255,0.1); color: #fff; }
        .bg-primary { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0, 235, 176, 0.3); }
        .bg-danger-soft { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .bg-gold-gradient { background: linear-gradient(135deg, #00ebb0, #51ff7d); color: #000; }

        #loadOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadOverlay"><div class="spinner-border text-success mb-2"></div><div style="font-weight: 900; color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">LUXURY MASTER V21.0</div></div>

    <nav class="navbar">
        <div class="album-title" id="albumTitle">VIP GALLERY</div>
        <div class="d-flex gap-2">
            <button id="btnGrid" style="background:transparent; border:none; color:var(--primary); font-weight:900; font-size:0.7rem;" onclick="setView('grid')"><i class="fas fa-th-large me-1"></i> LƯỚI</button>
            <button id="btnViewer" style="background:transparent; border:none; color:#666; font-weight:900; font-size:0.7rem;" onclick="setView('viewer')"><i class="fas fa-expand-arrows-alt me-1"></i> CHI TIẾT</button>
        </div>
    </nav>

    <div class="content-area">
        <div id="photoGrid"></div>
        <div id="photoViewer">
            <div id="viewerBadge" style="position:absolute; top:15px; left:15px; background:var(--primary); color:#000; padding:6px 16px; border-radius:30px; font-weight:900; z-index:10; display:none;"></div>
            <div class="stage"><img id="mainImg" src=""></div>
            <div class="strip-luxury" id="strip"></div>
        </div>
    </div>

    <div class="bottom-floating-bar">
        <div class="d-flex gap-2">
            <button class="btn-vip btn-sq bg-danger-soft" onclick="clearAll()"><i class="fas fa-undo"></i></button>
            <button class="btn-vip btn-sq bg-glass" id="btnFilter" onclick="toggleFilter()"><i class="fas fa-layer-group"></i></button>
        </div>
        <div class="d-flex gap-2">
            <button class="btn-vip btn-long bg-glass" id="btnSel" onclick="togSel()">CHỌN</button>
            <button class="btn-vip btn-long bg-gold-gradient" onclick="finalCommit()">LƯU (<span id="totalPhotos">0</span>)</button>
        </div>
    </div>

    <script>
        const PATHS = { GET: 'https://dichvufb.tino.page/webhook/get-photos', SAVE: 'https://dichvufb.tino.page/webhook/save-selection', DONE: 'https://dichvufb.tino.page/webhook/finish-selection' };
        let photos=[], cur=0, currentView='grid', selectedIds = [], isFiltering = false;
        const fid = new URLSearchParams(window.location.search).get('id');

        function getLink(id, sz) { return `https://drive.google.com/thumbnail?id=${id}&sz=${sz}`; }

        function setView(v) {
            currentView = v;
            document.getElementById('photoGrid').style.display = (v === 'grid') ? 'grid' : 'none';
            document.getElementById('photoViewer').style.display = (v === 'viewer') ? 'flex' : 'none';
            document.getElementById('btnGrid').style.color = (v === 'grid') ? 'var(--primary)' : '#666';
            document.getElementById('btnViewer').style.color = (v === 'viewer') ? 'var(--primary)' : '#666';
            if(v === 'viewer') showViewer(); else syncGridUI();
        }

        function initGrid() {
            const grid = document.getElementById('photoGrid'); grid.innerHTML = '';
            photos.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'grid-item'; item.id = `item-${i}`;
                item.innerHTML = `<img src="${getLink(p.id, 's500')}" loading="lazy">`;
                item.onclick = () => { cur = i; syncGridUI(); };
                item.ondblclick = () => { cur = i; setView('viewer'); };
                grid.appendChild(item);
            });
            syncGridUI();
        }

        function syncGridUI() {
            if(currentView !== 'grid') return;
            const displayPhotos = isFiltering ? photos.filter(p => selectedIds.includes(p.id)) : photos;
            photos.forEach((p, i) => {
                const el = document.getElementById(`item-${i}`); if(!el) return;
                const isSel = selectedIds.includes(p.id);
                el.classList.toggle('focused', i === cur);
                el.classList.toggle('selected', isSel);
                let dot = el.querySelector('.vip-dot');
                if(isSel) {
                    const num = selectedIds.indexOf(p.id) + 1;
                    if(!dot) el.insertAdjacentHTML('beforeend', `<div class="vip-dot">${num}</div>`);
                    else dot.innerText = num;
                } else if(dot) dot.remove();
                el.style.display = (isFiltering && !isSel) ? 'none' : 'block';
            });
            updateInfo();
        }

        function showViewer() {
            const p = photos[cur]; if(!p) return;
            document.getElementById('mainImg').src = getLink(p.id, 's2000');
            const strip = document.getElementById('strip'); strip.innerHTML = '';
            photos.forEach((p, i) => {
                const isSel = selectedIds.includes(p.id);
                if(isFiltering && !isSel) return;
                const th = document.createElement('div');
                th.className = `th-vip ${i === cur ? 'act' : ''} ${isSel ? 'sel' : ''}`;
                th.innerHTML = `<img src="${getLink(p.id, 's150')}">`;
                th.onclick = () => { cur = i; showViewer(); };
                strip.appendChild(th);
            });
            const activeTh = strip.querySelector('.act');
            if(activeTh) setTimeout(() => activeTh.scrollIntoView({behavior:'smooth', inline:'center'}), 50);
            updateInfo();
        }

        function togSel() {
            const p = photos[cur];
            const idx = selectedIds.indexOf(p.id);
            if (idx === -1) selectedIds.push(p.id);
            else selectedIds.splice(idx, 1);
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedIds));
            currentView === 'grid' ? syncGridUI() : showViewer();
            fetch(PATHS.SAVE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:p.id, selected: idx === -1}) });
        }

        function toggleFilter() {
            if(selectedIds.length === 0 && !isFiltering) return alert("Dạ khách chưa chọn ảnh nào!");
            isFiltering = !isFiltering;
            document.getElementById('btnFilter').classList.toggle('bg-primary', isFiltering);
            if(isFiltering) {
                cur = photos.indexOf(photos.find(p => selectedIds.includes(p.id)));
                setView('grid');
            } else { syncGridUI(); }
        }

        function clearAll() { if(confirm("Bỏ chọn toàn bộ và làm lại?")) { selectedIds = []; localStorage.setItem('anh_da_chon_cua_khach_' + fid, "[]"); isFiltering = false; syncGridUI(); } }

        function updateInfo() {
            const p = photos[cur]; if(!p) return;
            const isSel = selectedIds.includes(p.id);
            document.getElementById('totalPhotos').innerText = selectedIds.length;
            const btn = document.getElementById('btnSel');
            btn.className = isSel ? 'btn-vip btn-long bg-primary' : 'btn-vip btn-long bg-glass';
            btn.innerText = isSel ? 'ĐÃ CHỌN' : 'CHỌN';
            const badge = document.getElementById('viewerBadge');
            if(currentView === 'viewer' && isSel) { badge.style.display = 'block'; badge.innerText = `ĐÃ CHỌN #${selectedIds.indexOf(p.id)+1}`; }
            else badge.style.display = 'none';
        }

        async function finalCommit(){
            if(selectedIds.length === 0) return alert("Dạ hãy chọn ít nhất 1 tấm ảnh ạ!");
            if(confirm(`Xác nhận gửi ${selectedIds.length} ảnh đã chọn?`)) {
                try { await fetch(PATHS.DONE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id: fid, selected_ids: selectedIds, count: selectedIds.length }) }); alert("✅ Tuyệt vời! Danh sách đã được lưu."); } catch(e) { alert("Lỗi gửi!"); }
            }
        }

        async function init() {
            try {
                const res = await fetch(`${PATHS.GET}?id=${fid}`);
                const data = await res.json(); photos = data.photos || data;
                document.getElementById('albumTitle').innerText = data.folderName || "VIP ALBUM";
                const local = localStorage.getItem('anh_da_chon_cua_khach_' + fid);
                if (local) selectedIds = JSON.parse(local);
                document.getElementById('loadOverlay').style.display='none';
                initGrid();
            } catch(e) { alert("Lỗi kết nối!"); }
        }
        init();
    </script>
</body>
</html>
