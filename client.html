<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chonanhnhanh.vn - VIP Client Experience</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00ebb0;
            --accent: #51ff7d;
            --bg-deep: #050a14;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-shadow: 0 0 15px rgba(0, 235, 176, 0.4);
            --header-h: 70px;
            --footer-h: 85px;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, #0a1f3d 0%, #050a14 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* --- HEADER LUXURY --- */
        .navbar {
            height: var(--header-h);
            background: rgba(5, 10, 20, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0 20px;
            z-index: 3000;
        }
        
        .album-info-vip { display: flex; align-items: center; gap: 12px; }
        .album-icon { 
            width: 40px; height: 40px; background: var(--primary); 
            border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; color: #000; font-size: 1.2rem;
            box-shadow: var(--neon-shadow);
        }

        .album-title-text { font-weight: 900; font-size: 1.1rem; letter-spacing: 0.5px; }

        .view-switcher {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 4px;
            display: flex;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .view-btn {
            border: none; background: transparent; color: #aaa;
            padding: 8px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 800;
            transition: 0.3s; text-transform: uppercase;
        }
        .view-btn.active { background: var(--primary); color: #000; box-shadow: var(--neon-shadow); }

        /* --- GRID CONTAINER --- */
        #photoGrid {
            flex: 1; overflow-y: auto; padding: 20px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            padding-bottom: 100px;
        }
        @media (min-width: 768px) { #photoGrid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
        @media (min-width: 1200px) { #photoGrid { grid-template-columns: repeat(6, 1fr); gap: 25px; } }

        .grid-item {
            position: relative; border-radius: 20px; overflow: hidden;
            aspect-ratio: 1/1; cursor: pointer; border: 2px solid transparent;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #111;
        }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .grid-item:hover img { transform: scale(1.1); }
        .grid-item.selected { border-color: var(--primary); box-shadow: var(--neon-shadow); }
        .grid-item.selected::after {
            content: "\f058"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; inset: 0; background: rgba(0, 235, 176, 0.2);
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary);
        }

        .vip-dot {
            position: absolute; top: 12px; left: 12px; width: 30px; height: 30px;
            background: #000; color: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 14px; border: 2px solid var(--primary); z-index: 10;
        }

        /* --- VIEWER FULLSCREEN --- */
        #photoViewer {
            position: absolute; inset: 0; background: #000;
            z-index: 5000; display: none; flex-direction: column;
        }

        .close-vip {
            position: absolute; top: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .close-vip:hover { background: #ff4757; border-color: #ff4757; }

        #viewerBadge {
            position: absolute; top: 20px; left: 20px;
            background: var(--primary); color: #000;
            padding: 8px 20px; border-radius: 30px; font-weight: 900;
            box-shadow: var(--neon-shadow); display: none;
        }

        .strip-luxury {
            height: 100px; background: rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 12px; padding: 0 15px;
            overflow-x: auto; scrollbar-width: none;
        }
        .th-vip {
            height: 75px; width: 75px; border-radius: 12px; flex-shrink: 0;
            overflow: hidden; border: 2px solid transparent; opacity: 0.5; transition: 0.3s;
            position: relative;
        }
        .th-vip.act { opacity: 1; border-color: var(--primary); transform: scale(1.1); }
        .th-vip.sel { border-color: var(--accent); opacity: 1; }

        /* --- BOTTOM BAR MASTER --- */
        .bottom-bar {
            height: var(--footer-h);
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 0 25px; display: flex; align-items: center; justify-content: space-between;
            position: fixed; bottom: 0; width: 100%; z-index: 4000;
        }

        .btn-vip-action {
            padding: 12px 28px; border-radius: 50px; font-weight: 900;
            text-transform: uppercase; border: none; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-select-vip { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-select-vip.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: var(--neon-shadow); }
        
        .btn-send-vip { 
            background: linear-gradient(90deg, #00ebb0, #51ff7d); color: #000;
            box-shadow: 0 10px 20px rgba(0, 235, 176, 0.3);
        }

        #loadOverlay {
            position: fixed; inset: 0; background: var(--bg-deep);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-neon {
            width: 50px; height: 50px; border: 5px solid #111;
            border-top: 5px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: var(--neon-shadow);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadOverlay">
        <div class="loader-neon mb-3"></div>
        <div style="font-weight: 900; color: var(--primary); letter-spacing: 2px;">DÉCOR VIP...</div>
    </div>

    <nav class="navbar">
        <div class="album-info-vip">
            <div class="album-icon"><i class="fas fa-gem"></i></div>
            <div class="d-flex flex-column">
                <span class="album-title-text" id="albumTitle">ALBUM CỦA BẠN</span>
                <small style="color: #666; font-size: 0.7rem; font-weight: 800;">TOTAL: <span id="totalPhotos">0</span> PICS</small>
            </div>
        </div>
        
        <div class="view-switcher">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')"><i class="fas fa-th"></i> Lưới</button>
            <button class="view-btn" id="btnViewer" onclick="setView('viewer')"><i class="fas fa-expand"></i> Xem</button>
        </div>
    </nav>

    <div class="main-container" style="flex: 1; position: relative;">
        <div id="photoGrid"></div>

        <div id="photoViewer">
            <div class="close-vip" onclick="setView('grid')"><i class="fas fa-times"></i></div>
            <div id="viewerBadge">ẢNH SỐ 1</div>

            <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px;">
                <img id="mainImg" style="max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 30px rgba(0,0,0,0.8));">
            </div>

            <div class="strip-luxury" id="strip"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="d-flex flex-column" style="max-width: 40%;">
            <span id="pName" style="font-weight: 900; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</span>
            <span id="pCount" style="font-size: 0.75rem; color: #666; font-weight: 800;">0 / 0</span>
        </div>

        <div class="d-flex gap-3">
            <button class="btn-vip-action btn-select-vip" id="btnSel" onclick="togSel()">
                <i class="far fa-heart"></i> <span>CHỌN</span>
            </button>
            
            <button class="btn-vip-action btn-send-vip" onclick="finalCommit()">
                <i class="fas fa-paper-plane"></i> <span>GỬI NGAY</span>
            </button>
        </div>
    </div>

    <script>
        const URL_GET = 'https://dichvufb.tino.page/webhook/get-photos'; 
        const URL_SAVE = 'https://dichvufb.tino.page/webhook/save-selection'; 
        const URL_DONE = 'https://dichvufb.tino.page/webhook/finish-selection';

        let photos=[], cur=0, currentView='grid', selectedPhotoIds = [];
        const urlParams = new URLSearchParams(window.location.search);
        const fid = urlParams.get('id');

        function getLink(id, size) { return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`; }

        function setView(view) {
            currentView = view;
            document.getElementById('photoGrid').style.display = (view === 'grid') ? 'grid' : 'none';
            document.getElementById('photoViewer').style.display = (view === 'viewer') ? 'flex' : 'none';
            document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
            document.getElementById('btnViewer').classList.toggle('active', view === 'viewer');
            if(view === 'viewer') show(cur);
            else renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';
            photos.forEach((p, i) => {
                const isSel = selectedPhotoIds.includes(p.id);
                const item = document.createElement('div');
                item.className = `grid-item ${isSel ? 'selected' : ''}`;
                const num = selectedPhotoIds.indexOf(p.id) + 1;
                item.innerHTML = `
                    <img src="${getLink(p.id, 's500')}" loading="lazy">
                    ${isSel ? `<div class="vip-dot">${num}</div>` : ''}
                `;
                item.onclick = () => { cur = i; setView('viewer'); };
                grid.appendChild(item);
            });
        }

        function show(i) {
            if (i < 0 || i >= photos.length) return;
            cur = i;
            const p = photos[i];
            const mainImg = document.getElementById('mainImg');
            mainImg.src = getLink(p.id, 's2000');
            
            // Render Strip
            const strip = document.getElementById('strip');
            strip.innerHTML = '';
            photos.forEach((thumb, idx) => {
                const isSel = selectedPhotoIds.includes(thumb.id);
                const th = document.createElement('div');
                th.className = `th-vip ${idx === cur ? 'act' : ''} ${isSel ? 'sel' : ''}`;
                th.innerHTML = `<img src="${getLink(thumb.id, 's100')}">`;
                th.onclick = () => show(idx);
                strip.appendChild(th);
            });
            
            if(strip.children[cur]) strip.children[cur].scrollIntoView({behavior:'smooth', inline:'center'});
            updateInfo();
        }

        function updateInfo() {
            const p = photos[cur];
            const isSel = selectedPhotoIds.includes(p.id);
            document.getElementById('pName').innerText = p.name || `IMAGE_${cur+1}`;
            document.getElementById('pCount').innerText = `${cur + 1} / ${photos.length}`;
            
            const btnSel = document.getElementById('btnSel');
            const badge = document.getElementById('viewerBadge');
            
            if(isSel) {
                btnSel.classList.add('active');
                btnSel.innerHTML = `<i class="fas fa-check"></i> ĐÃ CHỌN`;
                badge.style.display = 'block';
                badge.innerText = `ẢNH SỐ ${selectedPhotoIds.indexOf(p.id) + 1}`;
            } else {
                btnSel.classList.remove('active');
                btnSel.innerHTML = `<i class="far fa-heart"></i> CHỌN`;
                badge.style.display = 'none';
            }
            document.getElementById('totalPhotos').innerText = selectedPhotoIds.length;
        }

        function togSel() {
            const p = photos[cur];
            const idx = selectedPhotoIds.indexOf(p.id);
            if (idx === -1) selectedPhotoIds.push(p.id);
            else selectedPhotoIds.splice(idx, 1);
            
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedPhotoIds));
            updateInfo();
            if(currentView === 'viewer') show(cur);

            fetch(URL_SAVE, {
                method:'POST', headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({id:p.id, selected: idx === -1})
            }).catch(e => console.warn(e));
        }

        async function finalCommit(){
            if(selectedPhotoIds.length === 0) return alert("Dạ, mình chưa chọn ảnh nào ạ!");
            if(confirm(`Gửi ${selectedPhotoIds.length} ảnh đã chọn cho chuyên viên?`)) {
                try {
                    await fetch(URL_DONE, {
                        method:'POST', headers:{'Content-Type':'application/json'}, 
                        body:JSON.stringify({ id: fid, selected_ids: selectedPhotoIds, count: selectedPhotoIds.length })
                    });
                    alert("✅ Tuyệt vời! Yêu cầu của bạn đã được gửi thành công.");
                } catch(e) { alert("Lỗi kết nối: "+e.message); }
            }
        }

        async function init() {
            try {
                if(!fid) throw new Error("ID Album không hợp lệ");
                const localData = localStorage.getItem('anh_da_chon_cua_khach_' + fid);
                if (localData) selectedPhotoIds = JSON.parse(localData);

                const res = await fetch(`${URL_GET}?id=${fid}`);
                const data = await res.json();
                photos = data.photos || data;
                
                document.getElementById('loadOverlay').style.display='none';
                renderGrid();
                updateInfo();
            } catch(e) {
                document.getElementById('loadOverlay').innerHTML = `<div class="text-danger text-center px-4"><b>LỖI:</b><br>${e.message}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
