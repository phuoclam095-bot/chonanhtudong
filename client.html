<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Album Master - V21.1 ULTIMATE</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --bg: #050a14; --header-h: 50px; --footer-h: 70px; --strip-h: 90px; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
        
        .navbar { height: var(--header-h); background: #000; border-bottom: 1px solid #222; padding: 0 15px; z-index: 5000; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        
        /* 1 & 2. HIỂN THỊ TÊN ALBUM VÀ TÊN ẢNH GẦN NHAU */
        .header-left { display: flex; flex-direction: column; max-width: 70%; }
        .album-title { font-weight: 900; font-size: 0.8rem; color: var(--primary); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #displayFileName { font-size: 0.55rem; color: #aaa; font-weight: 700; text-transform: uppercase; margin-top: -2px; }

        .content-area { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        #photoGrid { height: 100%; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 10px; align-content: start; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
        @media (min-width: 768px) { #photoGrid { grid-template-columns: repeat(6, 1fr); } }

        .grid-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #111; border: 2px solid transparent; transition: 0.2s; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; opacity: 0.85; }
        .grid-item:hover { border-color: rgba(255,255,255,0.5); }
        .grid-item:hover img { transform: scale(1.08); opacity: 1; }
        .grid-item.focused { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .grid-item.selected { border-color: var(--primary); }
        
        .vip-dot { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: var(--primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 10px; z-index: 10; border: 1.5px solid #000; }

        #photoViewer { position: absolute; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; }
        .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; position: relative; }
        #mainImg { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #photoInfoBadge { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; border: 1px solid rgba(255,255,255,0.1); z-index: 4500; }

        .strip-luxury { height: var(--strip-h); background: #080808; border-top: 1px solid #222; display: flex; align-items: center; gap: 10px; padding: 0 15px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .th-vip { height: 65px; width: 65px; border-radius: 10px; flex-shrink: 0; overflow: hidden; border: 2px solid transparent; opacity: 0.7; transition: 0.2s; position: relative; cursor: pointer; }
        .th-vip img { width: 100%; height: 100%; object-fit: cover; }
        .th-vip.act { opacity: 1; border-color: #fff; transform: scale(1.05); }
        .th-vip.sel { border-color: var(--primary); opacity: 1; }

        .bottom-bar { height: var(--footer-h); background: #000; border-top: 1px solid #222; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; flex-shrink: 0; }
        .btn-action { height: 42px; border-radius: 12px; font-weight: 900; border: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 0.75rem; }
        .btn-sq { width: 42px; font-size: 1.1rem; }
        .btn-text { padding: 0 20px; text-transform: uppercase; gap: 8px; }
        
        .bg-gray { background: #222; color: #fff; }
        .bg-primary { background: var(--primary); color: #000; }
        .bg-danger-vip { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; }
        .bg-gradient-vip { background: linear-gradient(90deg, #00ebb0, #51ff7d); color: #000; }

        #loadOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .note-badge {
        position: absolute;
        bottom: 6px;
        left: 6px;
        background: #3b82f6; /* Màu xanh dương nổi bật */
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        z-index: 10;
        border: 1.5px solid #000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    </style>
</head>
<body>

    <div id="loadOverlay"><div class="spinner-border text-success mb-2"></div><div style="font-weight: 900; color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">V21.1 ULTIMATE</div></div>

    <nav class="navbar">
        <div class="header-left">
            <div id="displayFileName">FILENAME.JPG</div>
            <div class="album-title" id="albumTitle">VIP ALBUM</div>
        </div>
        <div class="d-flex gap-2">
            <button id="btnGrid" style="background:transparent; border:none; color:var(--primary); font-weight:900; font-size:0.75rem;" onclick="setView('grid')">LƯỚI</button>
            <button id="btnViewer" style="background:transparent; border:none; color:#666; font-weight:900; font-size:0.75rem;" onclick="setView('viewer')">CHI TIẾT</button>
        </div>
    </nav>

    <div class="content-area">
        <div id="photoGrid"></div>
        <div id="photoViewer">
            <div class="stage">
                <div id="photoInfoBadge">0/0</div>
                <img id="mainImg" src="">
            </div>
            <div class="strip-luxury" id="strip"></div>
        </div>
    </div>
    <div id="commentBoxContainer" style="background: rgba(0,0,0,0.85); padding: 8px 15px; border-top: 1px solid #222; display: none; z-index: 4800;">
        <div class="input-group input-group-sm">
            <input type="text" id="photoCommentInput" class="form-control bg-dark text-white border-secondary" placeholder="Nhập ghi chú cho ảnh này...">
            <button class="btn btn-outline-light fw-bold" type="button" onclick="saveCurrentComment()">Lưu ghi chú</button>
        </div>
    </div>
    <div class="bottom-bar">
        <div class="d-flex gap-2">
            <button class="btn-action btn-sq bg-danger-vip" onclick="clearAll()"><i class="fas fa-undo-alt"></i></button>
            <button class="btn-action btn-sq bg-gray" id="btnFilter" onclick="toggleFilter()"><i class="fas fa-eye"></i></button>
            
            <!-- THÊM 2 NÚT NÀY -->
            <button class="btn-action btn-sq bg-gray" id="btnDownload" onclick="downloadPhoto()" style="display:none;"><i class="fas fa-download"></i></button>
            <button class="btn-action btn-sq bg-gray" id="btnComment" onclick="commentPhoto()" style="display:none;"><i class="fas fa-comment-dots"></i></button>
        </div>
        <div class="d-flex gap-2">
            <button class="btn-action btn-text bg-gray" id="btnSel" onclick="togSel()">CHỌN</button>
            <button class="btn-action btn-text bg-gradient-vip" onclick="finalCommit()">LƯU (<span id="totalPhotos">0</span>)</button>
        </div>
    </div>

    <script>
        let albumSettings = { download: false, comment: false, limitPhotos: 0 };
        const PATHS = { GET: 'https://wsm.congtubaclieu.com.vn/webhook/get-photos', SAVE: 'https://wsm.congtubaclieu.com.vn/webhook/save-selection', DONE: 'https://wsm.congtubaclieu.com.vn/webhook/finish-selection' };
        let photos=[], cur=0, currentView='grid', selectedIds = [], isFiltering = false;
        const fid = new URLSearchParams(window.location.search).get('id');

        function getLink(id, sz) { return `https://drive.google.com/thumbnail?id=${id}&sz=${sz}`; }

        function setView(v) {
            currentView = v;
            document.getElementById('photoGrid').style.display = (v === 'grid') ? 'grid' : 'none';
            document.getElementById('photoViewer').style.display = (v === 'viewer') ? 'flex' : 'none';
            document.getElementById('btnGrid').style.color = (v === 'grid') ? 'var(--primary)' : '#666';
            document.getElementById('btnViewer').style.color = (v === 'viewer') ? 'var(--primary)' : '#666';
            if(v === 'viewer') showViewer(); else syncGridUI();
        }

        function initGrid() {
            const grid = document.getElementById('photoGrid'); grid.innerHTML = '';
            photos.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'grid-item'; item.id = `item-${i}`;
                item.innerHTML = `<img src="${getLink(p.id, 's400')}" loading="lazy">`;
                item.onclick = () => { cur = i; syncGridUI(); };
                item.ondblclick = () => { cur = i; setView('viewer'); };
                grid.appendChild(item);
            });
            syncGridUI();
        }

       function syncGridUI() {
            if(currentView !== 'grid') return;
            const pCurrent = photos[cur];
            if(pCurrent) document.getElementById('displayFileName').innerText = pCurrent.name || "UNNAMED";
            
            // Lấy danh sách ghi chú đang lưu trên trình duyệt của khách
            const notesMap = JSON.parse(localStorage.getItem('ghi_chu_anh_' + fid) || '{}');
            
            photos.forEach((p, i) => {
                const el = document.getElementById(`item-${i}`); if(!el) return;
                const isSel = selectedIds.includes(p.id);
                const hasNote = p.note && p.note.trim() !== '';
                
                el.classList.toggle('focused', i === cur);
                el.classList.toggle('selected', isSel);
                
                let dot = el.querySelector('.vip-dot');
                if(isSel) {
                    const num = selectedIds.indexOf(p.id) + 1;
                    if(!dot) el.insertAdjacentHTML('beforeend', `<div class="vip-dot">${num}</div>`);
                    else dot.innerText = num;
                } else if(dot) dot.remove();

                // HIỂN THỊ HOẶC XÓA BIỂU TƯỢNG GHI CHÚ
                let noteIcon = el.querySelector('.note-badge');
                if(hasNote) {
                    if(!noteIcon) el.insertAdjacentHTML('beforeend', `<div class="note-badge" title="Xem ghi chú" onclick="event.stopPropagation(); openViewNoteModal('${p.id}');"><i class="fas fa-comment-alt"></i></div>`);
                } else if(noteIcon) {
                    noteIcon.remove();
                }

                el.style.display = (isFiltering && !isSel) ? 'none' : 'block';
            });
            updateInfo();
        }
       function showViewer() {
            const p = photos[cur]; if(!p) return;
            document.getElementById('mainImg').src = getLink(p.id, 's2000');
            document.getElementById('displayFileName').innerText = p.name || "UNNAMED";
            document.getElementById('photoInfoBadge').innerText = `${cur + 1} / ${photos.length}`;
            
            const notesMap = JSON.parse(localStorage.getItem('ghi_chu_anh_' + fid) || '{}');
            
            const strip = document.getElementById('strip'); strip.innerHTML = '';
            photos.forEach((p, i) => {
                const isSel = selectedIds.includes(p.id);
                const hasNote = p.note && p.note.trim() !== '';
                if(isFiltering && !isSel) return;
                
                const th = document.createElement('div');
                th.className = `th-vip ${i === cur ? 'act' : ''} ${isSel ? 'sel' : ''}`;
                th.innerHTML = `<img src="${getLink(p.id, 's100')}">`;
                
                if(isSel) {
                    const num = selectedIds.indexOf(p.id) + 1;
                    th.insertAdjacentHTML('beforeend', `<div class="vip-dot" style="width:14px; height:14px; font-size:7px; top:2px; right:2px;">${num}</div>`);
                }
                
                // HIỂN THỊ ICON GHI CHÚ TRÊN THANH THUMBNAIL CHI TIẾT
                if(hasNote) {
                    th.insertAdjacentHTML('beforeend', `<div class="note-badge" title="Xem ghi chú" style="width:14px; height:14px; font-size:7px; bottom:2px; left:2px;" onclick="event.stopPropagation(); openViewNoteModal('${p.id}');"><i class="fas fa-comment"></i></div>`);
                }
                
                th.onclick = () => { cur = i; showViewer(); };
                strip.appendChild(th);
            });
            const activeTh = strip.querySelector('.act');
            if(activeTh) setTimeout(() => activeTh.scrollIntoView({behavior:'smooth', inline:'center'}), 50);
            updateInfo();
        }
    // 3. HÀM XỬ LÝ KHI BẤM NÚT LƯU TRONG KHUNG GHI CHÚ
        async function saveCurrentComment() {
            const p = photos[cur];
            if (!p) return;
            
            const inputEl = document.getElementById('photoCommentInput');
            const noteVal = inputEl ? inputEl.value.trim() : '';
            
            // Cập nhật lại LocalStorage
            const notesMap = JSON.parse(localStorage.getItem('ghi_chu_anh_' + fid) || '{}');
            if (noteVal) {
                notesMap[p.id] = noteVal;
                p.note = noteVal; // Cập nhật luôn vào mảng photos hiện tại
            } else {
                delete notesMap[p.id];
                p.note = '';
            }
            localStorage.setItem('ghi_chu_anh_' + fid, JSON.stringify(notesMap));
            
            showToast("Đã cập nhật ghi chú thành công!");
            
            // Ẩn khung nhập sau khi lưu
            const container = document.getElementById('commentBoxContainer');
            if (container) container.style.display = 'none';
            
            // Cập nhật lại giao diện để hiển thị/làm mới icon ghi chú trên ảnh
            currentView === 'grid' ? syncGridUI() : showViewer();
            
            // Đồng bộ ngầm bản chỉnh sửa lên n8n / Database Supabase
            try {
                await fetch(PATHS.SAVE, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        id: p.id, 
                        note: noteVal 
                    }) 
                });
            } catch(e) {
                console.log("Lỗi đồng bộ ghi chú ngầm");
            }
        }
       function togSel() {
            const p = photos[cur];
            const idx = selectedIds.indexOf(p.id);
            
            if (idx === -1) {
                // KIỂM TRA GIỚI HẠN SỐ LƯỢNG ẢNH TỪ ADMIN
                if (albumSettings.limitPhotos > 0 && selectedIds.length >= albumSettings.limitPhotos) {
                    return alert (`Dạ, album này được giới hạn chọn tối đa ${albumSettings.limitPhotos} ảnh ạ!`);
                }
                selectedIds.push(p.id);
            } else {
                selectedIds.splice(idx, 1);
            }
            
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedIds));
            currentView === 'grid' ? syncGridUI() : showViewer();
            fetch(PATHS.SAVE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:p.id, selected: idx === -1}) });
        }
        // HÀM MỞ MODAL XEM GHI CHÚ KHI NHẤP VÀO ICON NHỎ
        function openViewNoteModal(photoId) {
            const p = photos.find(x => x.id === photoId);
            if (!p) return;
            
            // Gán hình ảnh và nội dung ghi chú tương ứng của ảnh đó lên Modal
            document.getElementById('modalNoteImg').src = getLink(p.id, 's200');
            document.getElementById('modalNoteContent').innerText = p.note || "Không có ghi chú nào.";
            
            // Hiển thị Modal Bootstrap
            new bootstrap.Modal(document.getElementById('viewNoteModal')).show();
        }
        function toggleFilter() {
            if(selectedIds.length === 0 && !isFiltering) return alert("Dạ chưa chọn ảnh nào!");
            isFiltering = !isFiltering;
            document.getElementById('btnFilter').classList.toggle('bg-primary', isFiltering);
            if(isFiltering) {
                const firstSel = photos.findIndex(p => selectedIds.includes(p.id));
                if(firstSel !== -1) cur = firstSel;
                setView('grid');
            } else { syncGridUI(); }
        }

        function clearAll() { if(confirm("Xóa toàn bộ ảnh đã chọn?")) { selectedIds = []; localStorage.setItem('anh_da_chon_cua_khach_' + fid, "[]"); isFiltering = false; syncGridUI(); } }

        function updateInfo() {
            const p = photos[cur]; if(!p) return;
            const isSel = selectedIds.includes(p.id);
            document.getElementById('totalPhotos').innerText = selectedIds.length;
            const btn = document.getElementById('btnSel');
            btn.className = isSel ? 'btn-action btn-text bg-primary' : 'btn-action btn-text bg-gray';
            btn.innerText = isSel ? 'ĐÃ CHỌN' : 'CHỌN';
        }

        async function finalCommit(){
            if(selectedIds.length === 0) return alert("Dạ khách chưa chọn ảnh nào ạ!");
            if(confirm(`Gửi ${selectedIds.length} ảnh đã chọn?`)) {
                try { await fetch(PATHS.DONE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id: fid, selected_ids: selectedIds, count: selectedIds.length }) }); alert("✅ Tuyệt vời! Yêu cầu đã được lưu."); } catch(e) { alert("Lỗi gửi!"); }
            }
        }
        function showToast(msg) {
            let t = document.getElementById('toastNotice');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toastNotice';
                t.style.cssText = 'position:fixed; top:110px; right:30px; background:var(--primary); color:#000; padding:10px 25px; border-radius:10px; z-index:10000; font-weight:900; display:none; box-shadow:0 10px 30px rgba(0,0,0,0.5);';
                document.body.appendChild(t);
            }
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2200);
        }
        // 1. CHỨC NĂNG TẢI ẢNH GỐC (Tải ảnh hiện tại đang xem hoặc chọn)
        async function downloadPhoto() {
            const p = photos[cur];
            if (!p) return;
            showToast("Đang tải ảnh gốc...");
            
            // Tạo link tải trực tiếp file từ Google Drive
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${p.id}`;
            
            // Mở tab ẩn hoặc tạo thẻ a tải trực tiếp
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = p.name || `photo_${p.id}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }


        async function commentPhoto() {
            // Lấy chính xác bức ảnh đang xem theo vị trí `cur`
            const p = photos[cur];
            if (!p) return;
            
            // Lấy thẳng ghi chú từ dữ liệu của tấm ảnh này (đã được tải sẵn khi mở trang)
            const currentNote = p.note || '';
            
            // Hiển thị hộp thoại prompt với đúng ghi chú riêng biệt của tấm ảnh đó
            const userNote = prompt(`Nhập ghi chú cho ảnh [${p.name || 'Ảnh'}]:`, currentNote);
            if (userNote === null) return; // Khách bấm Hủy thì thoát
            
            const trimmedNote = userNote.trim();
            
            // Cập nhật lại ngay vào đối tượng ảnh `p` hiện tại
            p.note = trimmedNote;
            
            showToast("Đang lưu ghi chú...");
            
            // Cập nhật lại giao diện lưới/chi tiết để hiện đúng icon tin nhắn trên ảnh đó
            currentView === 'grid' ? syncGridUI() : showViewer();
            
            // Đồng bộ ngầm bản ghi chú này lên Supabase thông qua webhook SAVE
            try {
                await fetch(PATHS.SAVE, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        id: p.id, 
                        note: trimmedNote 
                    }) 
                });
                showToast("Đã lưu ghi chú thành công!");
            } catch(e) {
                alert("Lỗi kết nối khi lưu ghi chú!");
            }
        }
      async function init() {
            try {
                const res = await fetch(`${PATHS.GET}?id=${fid}`);
                const data = await res.json(); 
                
                // Trích xuất cấu hình và danh sách ảnh từ cấu trúc n8n mới
                photos = Array.isArray(data) ? (data.photos || data) : (data.photos || []);
                albumSettings = data.settings || albumSettings;
                
                // MỞ KHÓA TÍNH NĂNG NẾU ADMIN CHO PHÉP
                if (albumSettings.download) document.getElementById('btnDownload').style.display = 'flex';
                if (albumSettings.comment) document.getElementById('btnComment').style.display = 'flex';

                if(photos.length > 0) {
                    document.getElementById('albumTitle').innerText = photos[0].folderName || "VIP ALBUM";
                }

                const local = localStorage.getItem('anh_da_chon_cua_khach_' + fid);
                if (local) selectedIds = JSON.parse(local);
                document.getElementById('loadOverlay').style.display='none';
                initGrid();
            } catch(e) { alert("Lỗi tải dữ liệu!"); }
        }
        init();
    </script>
    <!-- MODAL XEM GHI CHÚ CỦA ẢNH -->
    <div class="modal fade" id="viewNoteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: #0a0f1e; border: 2px solid var(--primary); border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-primary fw-900" style="font-size: 0.95rem;">GHI CHÚ CỦA ẢNH</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <img id="modalNoteImg" src="" style="width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 15px;">
                    <div id="modalNoteContent" style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; color: #fff; font-size: 0.9rem; min-height: 60px; text-align: left; border-left: 4px solid var(--primary); word-break: break-word;">
                        Đang tải...
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
