
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góp Ý & Báo Lỗi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh; display: flex; flex-direction: column; 
        }

        /* Navbar đơn giản để quay lại */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .back-btn { color: white; text-decoration: none; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .back-btn:hover { color: var(--accent-color); transform: translateX(-5px); }

        /* Container chính */
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        
        /* Card Góp ý */
        .feedback-card { 
            background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 700px; 
            border-radius: 25px; padding: 50px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.6); position: relative; 
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 10px; font-weight: 800; color: var(--primary-green); font-size: 2rem; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 35px; }

        /* Form Elements */
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: #444; font-size: 1.1rem; }
        
        /* Input & Textarea đẹp */
        .form-control {
            background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 15px;
            padding: 15px; font-size: 1rem; transition: all 0.3s; resize: none;
        }
        .form-control:focus {
            background: #fff; border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(20, 122, 48, 0.1);
        }

        /* Nút Gửi */
        .btn-send {
            background: linear-gradient(135deg, #147a30, #0e5a22);
            color: white; border: none; padding: 18px; font-size: 1.2rem;
            border-radius: 15px; width: 100%; font-weight: 800;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(20, 122, 48, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-send:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(20, 122, 48, 0.4); filter: brightness(1.1); }
        .btn-send:active { transform: scale(0.98); }
        .btn-send:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Thông báo thành công */
        #successMessage {
            display: none; text-align: center; margin-top: 20px;
            background: #d1e7dd; color: #0f5132; padding: 15px;
            border-radius: 15px; border: 1px solid #badbcc;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a href="admin.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại Admin</a>
            <span class="navbar-brand mb-0 h1"><i class="fas fa-paper-plane me-2"></i>Feedback System</span>
        </div>
    </nav>

    <div class="main-container">
        <div class="feedback-card">
            <h2>Đóng Góp Ý Kiến</h2>
            <p class="subtitle">Hãy giúp chúng tôi cải thiện hệ thống tốt hơn mỗi ngày!</p>

            <form id="feedbackForm" onsubmit="handleSendFeedback(event)">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>Tên của bạn</label>
                        <input type="text" id="senderName" class="form-control" placeholder="Ẩn danh" readonly>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Email liên hệ</label>
                        <input type="text" id="senderEmail" class="form-control" placeholder="Ẩn danh" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nội dung góp ý / Báo lỗi <span class="text-danger">*</span></label>
                    <textarea id="content" class="form-control" rows="8" placeholder="Nhập chi tiết vấn đề hoặc ý tưởng của bạn tại đây..." required></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="btn-send">
                    <i class="fas fa-paper-plane"></i> Gửi Góp Ý Ngay
                </button>
            </form>

            <div id="successMessage">
                <i class="fas fa-check-circle fa-2x mb-2"></i><br>
                <strong>Đã gửi thành công!</strong><br>Cảm ơn bạn đã đóng góp ý kiến.
            </div>
        </div>
    </div>

    <script>
        // ⚠️ THAY URL WEBHOOK N8N CỦA BẠN VÀO ĐÂY
        const WEBHOOK_FEEDBACK_URL = 'https://dichvufb.tino.page/webhook/feedback-form';

        // Tự động điền thông tin nếu đang đăng nhập
        document.addEventListener('DOMContentLoaded', () => {
            const name = localStorage.getItem('admin_name');
            const email = localStorage.getItem('admin_email');

            if (name) document.getElementById('senderName').value = name;
            if (email) document.getElementById('senderEmail').value = email;
        });

        async function handleSendFeedback(e) {
            e.preventDefault(); // Chặn tải lại trang

            const btn = document.getElementById('btnSubmit');
            const content = document.getElementById('content').value.trim();
            const name = document.getElementById('senderName').value || 'Ẩn danh';
            const email = document.getElementById('senderEmail').value || 'Không có';

            if (!content) return alert("Vui lòng nhập nội dung!");

            // Hiệu ứng Loading
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi...';
            btn.disabled = true;

            try {
                // Gửi về n8n
                await fetch(WEBHOOK_FEEDBACK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        message: content,
                        timestamp: new Date().toLocaleString('vi-VN')
                    })
                });

                // Thành công
                document.getElementById('feedbackForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                
                // Phát tiếng Ping
                const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
                audio.volume = 0.5;
                audio.play().catch(()=>{});

            } catch (error) {
                alert("Lỗi gửi: " + error.message);
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Thử Lại';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
