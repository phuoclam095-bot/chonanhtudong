<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Góp Ý & Báo Lỗi - CHONANHNHANH.VN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0; --gold-vip: #f0c300; --bg-deep: #050a14; 
            --neon: 0 0 20px rgba(0, 235, 176, 0.4);
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }
        body { 
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 1) 0%, rgba(5, 10, 20, 0.8) 40%, rgba(5, 10, 20, 0.95) 100%), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; 
        }

        /* Navbar VIP System */
        .navbar { background: rgba(5, 10, 20, 0.95); backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 0; }
        .back-btn { color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); transform: translateX(-5px); text-shadow: var(--neon); }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); font-size: 1.2rem; }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        
        /* Feedback Card Luxury */
        .feedback-card { 
            background: rgba(10, 17, 36, 0.9); width: 100%; max-width: 750px; 
            border-radius: 30px; padding: 50px; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.8); position: relative; 
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 10px; font-weight: 900; color: #fff; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-weight: 600; font-size: 0.95rem; }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 12px; font-weight: 700; color: var(--primary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Input Luxury Focus */
        .form-control {
            background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 18px;
            padding: 16px; font-size: 1rem; transition: all 0.3s; color: #fff; font-weight: 500;
        }
        .form-control:focus {
            background: rgba(0,0,0,0.6); border-color: var(--primary);
            box-shadow: var(--neon); color: #fff;
        }
        .form-control[readonly] { background: rgba(255,255,255,0.03); color: #94a3b8; border-style: dashed; cursor: not-allowed; }

        /* Nút Gửi Gold VIP */
        .btn-send {
            background: var(--gold-vip);
            color: #000; border: none; padding: 20px; font-size: 1rem;
            border-radius: 50px; width: 100%; font-weight: 900;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(240, 195, 0, 0.2);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            letter-spacing: 2px;
        }
        .btn-send:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 40px rgba(240, 195, 0, 0.4); background: #fff; }
        .btn-send:active { transform: scale(0.98); }
        .btn-send:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Success Message Luxury */
        #successMessage {
            display: none; text-align: center; margin-top: 20px;
            background: rgba(0, 235, 176, 0.1); color: var(--primary); padding: 25px;
            border-radius: 20px; border: 1px solid var(--primary);
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            .feedback-card { padding: 30px 20px; }
            h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container-fluid px-lg-5 d-flex justify-content-between align-items-center">
            <a href="admin.html" class="back-btn"><i class="fas fa-chevron-left"></i> Quay lại Admin</a>
            <span class="navbar-brand mb-0 h1">CHONANHNHANH.VN</span>
            <div style="width: 100px;"></div> </div>
    </nav>

    <div class="main-container">
        <div class="feedback-card">
            <h2>Đóng Góp Ý Kiến</h2>
            <p class="subtitle">Ý kiến của bạn là chìa khóa để CHONANHNHANH.VN hoàn thiện hơn!</p>

            <form id="feedbackForm" onsubmit="handleSendFeedback(event)">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label>Tên người gửi</label>
                        <input type="text" id="senderName" class="form-control" placeholder="Chưa đăng nhập" readonly>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Email xác nhận</label>
                        <input type="text" id="senderEmail" class="form-control" placeholder="Chưa có" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nội dung góp ý & Báo lỗi <span class="text-danger">*</span></label>
                    <textarea id="content" class="form-control" rows="6" placeholder="Nhập chi tiết vấn đề hoặc ý tưởng của bạn tại đây..." required></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="btn-send">
                    <i class="fas fa-paper-plane"></i> Gửi Góp Ý Ngay
                </button>
            </form>

            <div id="successMessage">
                <i class="fas fa-check-circle fa-3x mb-3"></i><br>
                <h4 class="fw-bold">GỬI THÀNH CÔNG!</h4>
                <p class="mb-0">Cảm ơn bạn đã đóng góp. Chúng tôi sẽ phản hồi sớm nhất có thể.</p>
            </div>
        </div>
    </div>

    <script>
        // --- WEBHOOK URL GIỮ NGUYÊN ---
        const WEBHOOK_FEEDBACK_URL = 'https://dichvufb.tino.page/webhook/feedback-form';

        // Tự động điền thông tin từ hệ thống VIP
        document.addEventListener('DOMContentLoaded', () => {
            const name = localStorage.getItem('admin_name');
            const email = localStorage.getItem('admin_email');
            if (name) document.getElementById('senderName').value = name;
            if (email) document.getElementById('senderEmail').value = email;
        });

        async function handleSendFeedback(e) {
            e.preventDefault(); 
            const btn = document.getElementById('btnSubmit');
            const content = document.getElementById('content').value.trim();
            const name = document.getElementById('senderName').value || 'Ẩn danh';
            const email = document.getElementById('senderEmail').value || 'Không có';

            if (!content) return;

            // Hiệu ứng Loading VIP
            btn.innerHTML = '<i class="fas fa-atom fa-spin"></i> ĐANG TRUYỀN DỮ LIỆU...';
            btn.disabled = true;

            try {
                // Tham số n8n giữ nguyên hoàn toàn
                await fetch(WEBHOOK_FEEDBACK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        message: content,
                        timestamp: new Date().toLocaleString('vi-VN')
                    })
                });

                document.getElementById('feedbackForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                
                // Tiếng Ping thành công
                const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
                audio.volume = 0.4;
                audio.play().catch(()=>{});

            } catch (error) {
                alert("Lỗi kết nối: " + error.message);
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> THỬ LẠI NGAY';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
