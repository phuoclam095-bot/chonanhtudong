<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Tạo Album - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* CSS Cơ bản mô phỏng giao diện từ ảnh */
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            background-color: #333;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #444;
            color: #fff;
            box-sizing: border-box;
        }
        .toggle-switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 0;
            border-top: 1px dashed #444;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4CAF50;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .btn-create {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-create:hover {
            background-color: #45a049;
        }
        .btn-create:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        .info-box {
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            text-align: center;
            display: none; /* Ban đầu ẩn */
        }
        .success-box {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            margin-top: 15px;
            display: none;
        }
        .success-box a {
            color: #155724;
            font-weight: bold;
        }
        /* Style cho phần tên Album và Link Khách sau khi tạo thành công */
        .preview-text {
            color: #155724;
            margin: 5px 0;
            text-align: left;
        }
        .preview-text strong {
            display: inline-block;
            width: 100px; /* Căn chỉnh */
        }
        .preview-text a {
            word-break: break-all;
        }
        .error-message {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h2>Bắt Đầu Tạo Album Ảnh Để Chọn</h2>
    
    <div class="form-group">
        <label for="driveLink">Hỗ trợ link từ thư mục Google Drive: <a href="javascript:void(0);" onclick="alert('Hướng dẫn dán link Google Drive: Đảm bảo link chia sẻ ở chế độ "Bất kỳ ai có đường liên kết" hoặc "Người dùng cụ thể". Ví dụ: https://drive.google.com/drive/folders/ID_THU_MUC?usp=sharing');">hướng dẫn</a></label>
        <input type="text" id="driveLink" placeholder="Dán Link Thư mục Google Drive vào đây" value="">
    </div>

    <div id="statusMessage" class="error-message"></div>

    <div class="toggle-switch-group">
        <span><i class="fas fa-download"></i> Cho phép tải xuống</span>
        <label class="toggle-switch">
            <input type="checkbox" id="allowDownload" checked>
            <span class="slider round"></span>
        </label>
    </div>
    
    <div class="toggle-switch-group">
        <span><i class="fas fa-comment"></i> Cho phép comment</span>
        <label class="toggle-switch">
            <input type="checkbox" id="allowComment" checked>
            <span class="slider round"></span>
        </label>
    </div>

    <div class="toggle-switch-group">
        <span><i class="fas fa-list-ol"></i> Số ảnh được phép chọn</span>
        <label class="toggle-switch">
            <input type="checkbox" id="limitPhotos">
            <span class="slider round"></span>
        </label>
    </div>

    <button type="button" class="btn-create" onclick="createAlbum()">+ Tạo trang cho khách</button>

    <div class="info-box">
        <i class="fas fa-info-circle"></i> Hiện tại Google Drive chưa hỗ trợ thumbnail file CR3
    </div>

    <div id="previewBox" class="success-box">
        <p class="preview-text"><strong>Tên Album:</strong> <span id="previewFolderName"></span></p>
        <p class="preview-text"><strong>Link Khách:</strong> <a id="previewClientLink" href="#" target="_blank"></a></p>
    </div>

</div>

<script>
    // ----------------------------------------------------------------------
    // CẤU HÌNH WEBHOOK N8N (THAY THẾ BẰNG URL CỦA BẠN)
    // ----------------------------------------------------------------------
    const URL_CREATE_ALBUM = 'YOUR_N8N_WEBHOOK_URL_FOR_CREATING_ALBUM'; 
    // Ví dụ: https://dichvufb.tino.page/webhook/tao-album
    
    // ----------------------------------------------------------------------
    // HÀM TRÍCH XUẤT FOLDER ID ĐÃ SỬA LỖI
    // ----------------------------------------------------------------------
    /**
     * Trích xuất ID thư mục Drive từ URL hoặc trả về ID thô nếu link chỉ là ID.
     * @param {string} link - Link Google Drive.
     * @returns {string|null} - Folder ID hoặc null nếu không tìm thấy.
     */
    function extractFolderId(link) {
        if (!link) return null;
        
        // Loại bỏ mọi tham số truy vấn và dấu gạch chéo cuối cùng
        let cleanedLink = link.split('?')[0].replace(/\/$/, ""); 
        
        // 1. Regex tìm ID sau /folders/
        const match = cleanedLink.match(/\/folders\/([-a-zA-Z0-9_]+)/);
        
        if (match) {
            return match[1]; // Trả về ID từ nhóm capture
        }

        // 2. Nếu không tìm thấy /folders/, thử kiểm tra xem chuỗi có phải là ID thô không
        // ID thô Google Drive thường là chữ, số, gạch dưới, gạch ngang
        if (cleanedLink.match(/^[a-zA-Z0-9_-]+$/)) {
            return cleanedLink;
        }

        return null; // Không phải link hợp lệ và không phải ID thô
    }

    // ----------------------------------------------------------------------
    // HÀM TẠO ALBUM ĐÃ SỬA LỖI (Sử dụng Folder ID đã trích xuất)
    // ----------------------------------------------------------------------
    async function createAlbum() {
        const btn = document.querySelector('.btn-create');
        const driveLinkInput = document.getElementById('driveLink');
        const previewBox = document.getElementById('previewBox');
        const previewFolderName = document.getElementById('previewFolderName');
        const previewClientLink = document.getElementById('previewClientLink');
        const statusMessage = document.getElementById('statusMessage');

        // Ẩn các hộp trạng thái cũ
        previewBox.style.display = 'none';
        statusMessage.style.display = 'none';

        let inputLink = driveLinkInput.value.trim(); 
        
        // 1. TRÍCH XUẤT VÀ KIỂM TRA ID
        const folderId = extractFolderId(inputLink);
        
        if (!folderId) {
            // LỖI: Không tìm thấy ID
            statusMessage.innerText = '❌ Vui lòng dán link Google Drive hợp lệ (ID thư mục)!';
            statusMessage.style.display = 'block';
            statusMessage.style.backgroundColor = '#f8d7da';
            statusMessage.style.color = '#721c24';
            return;
        }

        // Bắt đầu trạng thái Loading
        const oldText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tạo...';
        btn.disabled = true;

        try {
            // Lấy thông tin admin email (nếu bạn có lưu local)
            const adminEmail = localStorage.getItem('admin_email') || 'default_admin@example.com'; 

            // 2. CHUẨN BỊ DỮ LIỆU VÀ TẠO QUERY STRING CHO GET REQUEST
            const dataToSend = {
                folderId: folderId,
                download: document.getElementById('allowDownload').checked ? 1 : 0, // Chuyển boolean sang 1/0
                comment: document.getElementById('allowComment').checked ? 1 : 0,
                limitPhotos: document.getElementById('limitPhotos').checked ? 1 : 0,
                adminEmail: adminEmail 
            };
            const queryParams = new URLSearchParams(dataToSend).toString();
            const finalUrl = `${URL_CREATE_ALBUM}?${queryParams}`;

            // 3. GỌI WEBHOOK BẰNG GET REQUEST (Như đã sửa trong luồng n8n)
            const response = await fetch(finalUrl, {
                method: 'GET', 
                headers: { 'Accept': 'application/json' } // Đảm bảo n8n Response Node trả về JSON
            });

            const result = await response.json(); 

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status} - ${result.message || 'Lỗi server không xác định.'}`);
            }
            
            // 4. HIỂN THỊ KẾT QUẢ THÀNH CÔNG (Dựa trên cấu trúc JSON n8n trả về)
            if (result && result.folderName && result.clientLink) {
                previewFolderName.innerText = result.folderName;
                previewClientLink.href = result.clientLink;
                previewClientLink.innerText = result.clientLink;
                previewBox.style.display = 'block';
                previewBox.style.borderColor = '#c3e6cb';
                previewBox.style.backgroundColor = '#d4edda';

                alert(`✅ Album: "${result.folderName}" đã được tạo thành công.`);
                
            } else {
                // LỖI: Dữ liệu trả về bị thiếu (Giống lỗi bạn thấy trong ảnh)
                statusMessage.innerText = `❌ LỖI: Phản hồi bị thiếu (Workflow n8n không trả về folderName hoặc clientLink). Kiểm tra lại node Respond to Webhook.`;
                statusMessage.style.display = 'block';
                statusMessage.style.backgroundColor = '#f8d7da';
                statusMessage.style.color = '#721c24';
            }

        } catch (error) {
            // LỖI MẠNG/CÚ PHÁP
            statusMessage.innerText = `❌ LỖI GỌI WEBHOOK: ${error.message}. Kiểm tra URL và CORS/Cấu hình Respond to Webhook.`;
            statusMessage.style.display = 'block';
            statusMessage.style.backgroundColor = '#f8d7da';
            statusMessage.style.color = '#721c24';
        } finally {
            // Tắt trạng thái Loading
            btn.innerHTML = oldText;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
