<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; padding: 8px 15px !important; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2) !important; color: #fff !important; transform: translateY(-2px); }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 30px; padding: 45px 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.4); text-align: center; position: relative; }
        
        h2 { font-weight: 900; color: var(--primary-green); font-size: 2rem; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        .heartbeat-effect { color: #d63031; font-weight: 900; display: inline-block; animation: heartbeat 1.2s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 60% { transform: scale(1); } }
        
        .premium-input-group label { display: block; margin-bottom: 12px; font-weight: 900; color: var(--primary-green); font-size: 1.1rem; text-transform: uppercase; }
        input[type="text"] { width: 100%; padding: 18px 22px; border: 2.5px solid #f1f5f9; border-radius: 18px; outline: none; background: #fcfdfe; font-weight: 700; color: #334155; text-align: center; transition: 0.3s; }
        input[type="text"]:hover { border-color: var(--primary-green); }
        input[type="text"]:focus::placeholder { color: transparent; }
        input[type="text"]:focus { border-color: var(--primary-green); background: #fff; box-shadow: 0 10px 20px -5px rgba(20, 122, 48, 0.15); }

        .preview-box { border: 2.5px dashed var(--primary-green); background-color: #f0fff4; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: none; animation: slideUp 0.4s ease-out; }
        #finalLinkBox { background: #000; color: var(--accent-color); padding: 12px; border-radius: 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #333; }
        #finalLinkBox a { color: var(--accent-color); font-family: monospace; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline; }
        .btn-copy-link { background: var(--primary-green); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.75rem; }

        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; font-weight: 800; color: #4a5568; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 18px; font-size: 18px; border-radius: 18px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.25); margin-bottom: 15px; transition: 0.3s; }
        .btn-locked { background: #94a3b8 !important; cursor: not-allowed; }

        .user-info-container { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); padding: 4px 14px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .user-avatar-circle { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--accent-color); overflow: hidden; background: #333; display: flex; align-items: center; justify-content: center; }
        .status-badge-active { background: #147a30; color: #fff; padding: 1px 6px; border-radius: 5px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-right: 6px; }

        /* CHAT AI WIDGET */
        #chat-widget-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 4px 20px rgba(81, 255, 125, 0.4); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; z-index: 10001; }
        .pulse-green { animation: pulse-green-anim 2s infinite; }
        @keyframes pulse-green-anim { 0% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(81, 255, 125, 0); } 100% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0); } }
        #chat-box { display: none; position: absolute; bottom: 85px; right: 0; width: 360px; height: 480px; background: white; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; flex-direction: column; z-index: 10002; border: 1px solid #eee; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 10px 15px; border-radius: 18px; font-size: 0.9rem; font-weight: 600; }
        .bot-msg { background: white; border: 1px solid #e2e8f0; align-self: flex-start; }
        .user-msg { background: var(--primary-green); color: white; align-self: flex-end; }
        
        #copyToast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 10px 25px; border-radius: 50px; font-weight: 800; z-index: 10000; display: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                </ul>
                <div class="ms-auto">
                    <div id="userControl" style="display: none !important;" class="align-items-center gap-3">
                        <div class="user-info-container">
                            <div class="user-avatar-circle" id="avatarPlaceholder"></div>
                            <div class="d-flex flex-column">
                                <span id="userNameDisplay" style="color:white; font-weight:900; font-size:0.95rem;"></span>
                                <div id="expiryDisplay" style="line-height: 1.1; font-size: 0.75rem;"></div>
                            </div>
                        </div>
                        <button class="btn btn-danger rounded-pill px-3 py-1 ms-2" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Ảnh Mới</h2>
            
            <div id="welcomeArea" class="welcome-msg" style="display: none; font-size: 0.9rem; color: #666; margin-bottom: 20px;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                <div class="heartbeat-effect mt-1" style="font-weight: 900;">NHANH - GỌN - CHÍNH XÁC</div>
            </div>
            
            <div class="premium-input-group">
                <label>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="Dán link hoặc ID thư mục vào đây...">
            </div>

            <div id="previewBox" class="preview-box">
                <div class="fw-bold text-dark mb-1">TẠO ALBUM THÀNH CÔNG!</div>
                <div class="small text-secondary mb-2">Tên: <strong id="resFolderName" class="text-success">...</strong></div>
                <div id="finalLinkBox">
                    <a href="#" id="resClientLink" target="_blank">...</a>
                    <button class="btn-copy-link" onclick="copyResultLink()">COPY</button>
                </div>
            </div>

            <div class="switch-group"><span>Cho phép tải xuống</span><label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn số ảnh</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            
            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">Tạo Album Ngay</button>

            <div id="centralLoginArea" class="mt-4" style="display: none;">
                <div class="heartbeat-effect mb-3">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG</div>
                <button class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" class="me-2"> Đăng nhập Google
                </button>
            </div>
        </div>
    </div>

    <div id="chat-widget-container">
        <button id="chat-toggle-btn" class="pulse-green" onclick="toggleChat()"><i class="fas fa-robot fa-2x"></i></button>
        <div id="chat-box">
            <div class="chat-header d-flex justify-content-between align-items-center">
                <span>TRỢ LÝ AI STUDIO LNP</span>
                <button class="btn-close btn-close-white" onclick="toggleChat()"></button>
            </div>
            <div id="chat-messages"></div>
            <div class="p-3 border-top"><input type="text" id="chat-input" class="form-control" placeholder="Hỏi AI..." onkeypress="if(event.key==='Enter') sendMessage()"></div>
        </div>
    </div>

    <div id="copyToast">✅ Đã copy link thành công!</div>

    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };
        const URL_CREATE_SAVE = 'https://dichvufb.tino.page/webhook/create-album-auto';
        const URL_GET_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info';
        const API_CHAT = 'https://dichvufb.tino.page/webhook/chat-admin';

        // ⭐ QUAN TRỌNG: LOGIC 2 BƯỚC ĐỂ LẤY LINK CHUẨN
        async function handleCreateAlbum() {
            const driveLink = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if (!driveLink) return alert("Hãy dán link!");

            // Tách ID từ link
            const folderIdMatch = driveLink.match(/folders\/([a-zA-Z0-9_-]{20,})|id=([a-zA-Z0-9_-]{20,})/);
            const folderId = folderIdMatch ? (folderIdMatch[1] || folderIdMatch[2]) : (driveLink.length > 20 ? driveLink : null);
            if (!folderId) return alert("Link không hợp lệ!");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ĐANG TẠO...';
            btn.disabled = true;
            document.getElementById('previewBox').style.display = 'none';

            try {
                // BƯỚC 1: Gửi lệnh tạo album
                await fetch(URL_CREATE_SAVE, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        folderId,
                        adminEmail: localStorage.getItem('admin_email'),
                        settings: { download: document.getElementById('allowDownload').checked, limit: document.getElementById('limitPhotos').checked }
                    })
                });

                // BƯỚC 2: Gọi Path getinfo để lấy link thật
                const resInfo = await fetch(`${URL_GET_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await resInfo.json();

                if (data.clientLink) {
                    document.getElementById('resFolderName').innerText = data.folderName || "Album Mới";
                    document.getElementById('resClientLink').href = data.clientLink;
                    document.getElementById('resClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                    alert("✅ Tạo Album thành công!");
                }
            } catch (e) { alert("Lỗi hệ thống!"); }
            finally { btn.innerHTML = 'Tạo Album Ngay'; btn.disabled = false; }
        }

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', urlParams.get('user_email'));
                localStorage.setItem('admin_name', decodeURIComponent(urlParams.get('user_name') || 'Admin'));
                localStorage.setItem('admin_avatar', decodeURIComponent(urlParams.get('user_avatar') || ''));
                localStorage.setItem('admin_expiry', urlParams.get('user_expiry') || '0');
                localStorage.setItem('admin_status', urlParams.get('user_status') || 'new');
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function updateUI() {
            const logged = localStorage.getItem('admin_is_logged_in') === 'true';
            const name = localStorage.getItem('admin_name') || 'Admin';
            const avatar = localStorage.getItem('admin_avatar');
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;

            document.getElementById('adminNavLinks').style.display = logged ? 'flex' : 'none';
            document.getElementById('userControl').setAttribute('style', logged ? 'display: flex !important;' : 'display: none !important;');
            document.getElementById('centralLoginArea').style.display = logged ? 'none' : 'block';

            if (logged) {
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('avatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover;">` : `<span style="color:var(--accent-color); font-weight:900;">${name.charAt(0)}</span>`;
                
                const isExpired = expiry <= Date.now();
                const canCreate = (status === 'active' && !isExpired);
                const btn = document.getElementById('btnCreate');
                btn.className = canCreate ? 'btn-create' : 'btn-create btn-locked';
                btn.disabled = !canCreate;

                const expiryEl = document.getElementById('expiryDisplay');
                if (canCreate) {
                    const d = new Date(expiry);
                    expiryEl.innerHTML = `<div><span class="status-badge-active">ACTIVE</span> <small class="text-white-50">${d.toLocaleDateString()}</small></div>`;
                    document.getElementById('welcomeArea').style.display = 'none';
                } else {
                    expiryEl.innerHTML = `<span class="text-warning fw-bold small">CHƯA KÍCH HOẠT</span>`;
                    document.getElementById('welcomeArea').style.display = 'block';
                    document.getElementById('welcomeUserName').innerText = name;
                }
            }
        }

        function toggleChat() { 
            const box = document.getElementById('chat-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; 
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            appendMsg(msg, 'user');
            input.value = '';
            try {
                const res = await fetch(API_CHAT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, email: localStorage.getItem('admin_email') }) });
                const data = await res.json();
                appendMsg(data.output || "AI đang bận rồi!", 'bot');
            } catch (e) { appendMsg("Lỗi AI!", 'bot'); }
        }

        function appendMsg(t, s) {
            const container = document.getElementById('chat-messages');
            const d = document.createElement('div');
            d.className = `message ${s === 'user' ? 'user-msg' : 'bot-msg'}`;
            d.innerText = t; container.appendChild(d);
            container.scrollTop = container.scrollHeight;
        }

        function copyResultLink() {
            navigator.clipboard.writeText(document.getElementById('resClientLink').innerText).then(() => {
                const toast = document.getElementById('copyToast');
                toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2000);
            });
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.reload(); }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
