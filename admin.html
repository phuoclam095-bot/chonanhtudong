<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; padding: 8px 15px !important; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2) !important; color: #fff !important; transform: translateY(-2px); }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 30px; padding: 45px 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { font-weight: 900; color: var(--primary-green); font-size: 2rem; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        
        /* ⭐ KHUNG THÔNG TIN NGƯỜI DÙNG NHỎ GỌN */
        .user-mini-card { background: #f8fafc; border: 1px solid #edf2f7; border-radius: 20px; padding: 12px 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .user-avatar-inner { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--primary-green); background: #2d3436; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        /* THU NHỎ TÊN GOOGLE VÀ TRẠNG THÁI */
        .user-info-text { text-align: left; line-height: 1.2; }
        .user-info-text .name { font-weight: 800; color: #333; font-size: 0.9rem; display: block; margin-bottom: 2px; }
        .user-info-text .status-line { display: flex; align-items: center; gap: 6px; }
        .status-label { background: var(--primary-green); color: white; padding: 1.5px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; }
        .status-new { background: #ff9800; }
        .status-expired { background: #d63031; }
        .expiry-text { font-size: 0.7rem; font-weight: 700; color: #777; }

        .welcome-inline { font-size: 0.8rem; font-weight: 700; color: #555; margin-top: 4px; }
        .trial-btn { background: #ff9800; color: white !important; padding: 1.5px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; text-decoration: none; }
        .gia-han-link { color: var(--primary-green); font-weight: 800; text-decoration: underline; font-size: 0.75rem; margin-left: 4px; }

        .premium-input-group { text-align: center; margin-bottom: 30px; }
        .premium-input-group label { display: block; margin-bottom: 12px; font-weight: 900; color: var(--primary-green); font-size: 1.1rem; text-transform: uppercase; }
        input[type="text"] { width: 100%; padding: 18px 22px; border: 2.5px solid #f1f5f9; border-radius: 18px; outline: none; background: #fcfdfe; font-weight: 700; color: #334155; text-align: center; transition: 0.3s; }

        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; font-weight: 800; color: #4a5568; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 18px; font-size: 18px; border-radius: 18px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.25); margin-bottom: 15px; transition: 0.3s; }
        .btn-locked { background: #94a3b8 !important; cursor: not-allowed; box-shadow: none; }

        .central-login-area { margin-top: 15px; display: none; }
        .heartbeat-effect { color: #d63031; font-weight: 900; display: inline-block; animation: heartbeat 1.2s infinite; letter-spacing: 1px; }
        @keyframes heartbeat { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 60% { transform: scale(1); } }
        .btn-google-central { background: white; color: #1e293b; border: 2px solid #e2e8f0; padding: 14px 28px; border-radius: 50px; font-weight: 900; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); transition: 0.3s; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div class="ms-auto">
                    <button id="logoutBtn" class="btn btn-danger rounded-pill px-3 py-1" style="display: none;" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Ảnh Mới</h2>
            
            <div id="userMiniInfo" class="user-mini-card" style="display: none;">
                <div class="user-avatar-inner" id="avatarInner"></div>
                <div class="user-info-text">
                    <span class="name" id="userNameText"></span>
                    <div class="status-line" id="statusLine"></div>
                    <div id="welcomeSmall" class="welcome-inline" style="display: none;">
                        <a href="https://zalo.me/0879029170" target="_blank" class="trial-btn">Dùng thử Miễn phí</a>
                        <a href="payment.html" class="gia-han-link">Gia hạn ngay</a>
                    </div>
                </div>
            </div>
            
            <div class="premium-input-group">
                <label>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/...">
            </div>

            <div class="switch-group"><span>Cho phép tải xuống</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Tải Logo/Watermark lên</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn số ảnh</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            
            <button class="btn-create" id="btnCreate">Tạo Album Ngay</button>

            <div id="centralLoginArea" class="central-login-area">
                <div id="centralLoginMessage" class="heartbeat-effect">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG DỊCH VỤ</div>
                <button class="btn-google-central mt-3" onclick="startGoogleLogin()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22"> Đăng nhập bằng Google
                </button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth_status') === 'success') {
                const email = urlParams.get('user_email');
                if (email) {
                    localStorage.setItem('admin_is_logged_in', 'true');
                    localStorage.setItem('admin_email', email);
                    localStorage.setItem('admin_name', decodeURIComponent(urlParams.get('user_name') || ''));
                    localStorage.setItem('admin_avatar', decodeURIComponent(urlParams.get('user_avatar') || ''));
                    localStorage.setItem('admin_expiry', urlParams.get('user_expiry') || '0');
                    localStorage.setItem('admin_status', urlParams.get('user_status') || 'new');
                    history.replaceState(null, null, window.location.pathname);
                }
            }
            updateUI();
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const name = localStorage.getItem('admin_name') || 'Khách hàng';
            const avatar = localStorage.getItem('admin_avatar');

            const navLinks = document.getElementById('adminNavLinks');
            const logoutBtn = document.getElementById('logoutBtn');
            const centralLogin = document.getElementById('centralLoginArea');
            const userMiniCard = document.getElementById('userMiniInfo');
            const avatarInner = document.getElementById('avatarInner');
            const statusLine = document.getElementById('statusLine');
            const btn = document.getElementById('btnCreate');

            if (isLoggedIn) {
                navLinks.style.display = 'flex';
                logoutBtn.style.display = 'block';
                centralLogin.style.display = 'none'; 
                userMiniCard.style.display = 'flex';
                document.getElementById('userNameText').innerText = name;
                
                avatarInner.innerHTML = (avatar && avatar !== 'undefined' && avatar !== 'null') ? 
                    `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover;">` : 
                    `<span style="color:var(--accent-color); font-weight:900; font-size:1.1rem;">${name.charAt(0).toUpperCase()}</span>`;

                if (status === 'active' && expiry > Date.now()) {
                    btn.innerHTML = `<i class="fas fa-magic"></i> Tạo Album Ngay`;
                    btn.classList.remove('btn-locked');
                    const d = new Date(expiry);
                    statusLine.innerHTML = `<span class="status-label">ACTIVE</span><span class="expiry-text">Hạn: ${d.toLocaleDateString('vi-VN')}</span>`;
                    document.getElementById('welcomeSmall').style.display = 'none';
                } else {
                    btn.innerHTML = `<i class="fas fa-lock me-2"></i> Tính năng bị khóa`;
                    btn.classList.add('btn-locked');
                    const labelClass = status === 'new' ? 'status-new' : 'status-expired';
                    const labelText = status === 'new' ? 'TÀI KHOẢN MỚI' : 'HẾT HẠN DÙNG';
                    statusLine.innerHTML = `<span class="status-label ${labelClass}">${labelText}</span>`;
                    document.getElementById('welcomeSmall').style.display = 'block';
                }
            } else {
                navLinks.style.display = 'none';
                logoutBtn.style.display = 'none';
                centralLogin.style.display = 'block'; 
                userMiniCard.style.display = 'none';
                btn.innerHTML = `<i class="fas fa-lock me-2"></i> Tính năng bị khóa`;
                btn.classList.add('btn-locked');
            }
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.href = window.location.pathname; }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
