<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Album Ảnh - ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS GIỮ NGUYÊN */
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; 
        }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        .navbar-toggler { border: none; color: white; padding: 0.5rem; }
        .navbar-toggler:focus { box-shadow: none; outline: 2px solid var(--accent-color); }
        
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: #444; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; transition: 0.3s; }
        input:focus { border-color: var(--primary-green); outline: none; }
        
        .preview-box { border: 2px dashed #c3e6cb; background-color: #f0fff4; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        #finalLinkBox { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; padding: 15px; border-radius: 10px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        #finalLinkBox a { color: white; text-decoration: underline; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .btn-copy-link { background: #fff; color: var(--primary-green); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; }
        .switch-label { display: flex; gap: 10px; font-weight: 600; cursor: pointer; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; box-shadow: 0 10px 20px rgba(20, 122, 48, 0.3); }
        .btn-create:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-create:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.8; box-shadow: none; transform: none; }

        /* ALERT & BADGE */
        .alert-custom { border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-size: 0.95rem; }
        .alert-locked { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-locked a { color: #856404; font-weight: 800; text-decoration: underline; }
        
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .badge-active { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .badge-expired { background: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }

        .btn-google { background: white; color: #333; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .info-box { background: #e3f2fd; color: #0d47a1; padding: 15px; border-radius: 10px; margin-top: 25px; font-size: 14px; display: flex; align-items: center; gap: 12px; border-left: 5px solid #2196f3; }
        .footer { background: transparent; color: #666; text-align: center; padding: 20px; font-size: 13px; margin-top: auto; }
