<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaoAnhNhanh.vn - Hệ Thống Quản Trị Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0;
            --primary-glow: rgba(0, 235, 176, 0.6);
            --bg-overlay: rgba(5, 10, 20, 0.85);
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: #050a14;
            /* NỀN CÓ CHIỀU SÂU VÀ BLUR */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; min-height: 100vh;
            padding-top: 80px;
        }

        /* ================= NAVBAR & LOGO ================= */
        .navbar { 
            background: rgba(5, 10, 20, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            height: 80px;
        }
        .navbar-brand img { height: 48px; width: auto; filter: drop-shadow(0 0 10px rgba(0,235,176,0.3)); }

        /* ================= HIỆU ỨNG NHẮC NHỞ ĐĂNG NHẬP ================= */
        .login-reminder-box {
            display: flex; align-items: center; gap: 15px;
        }
        .remind-text {
            font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 3s linear infinite;
        }
        @keyframes textFlow { to { background-position: 200% center; } }

        .btn-login-vip {
            background: #fff; color: #000; font-weight: 800;
            border-radius: 50px; padding: 8px 25px; border: none;
            position: relative; transition: 0.3s;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        /* Hào quang tỏa ra từ nút đăng nhập */
        .btn-login-vip::after {
            content: ""; position: absolute; inset: -5px; border-radius: 50px;
            background: var(--primary); opacity: 0.4; z-index: -1;
            animation: pulseWave 2s infinite;
        }
        @keyframes pulseWave {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* ================= USER CONTROL KHI ĐÃ LOGO ================= */
        .user-wrapper { display: flex; align-items: center; gap: 10px; }
        .user-pill {
            background: rgba(255,255,255,0.05); padding: 6px 15px;
            border-radius: 50px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--primary); }

        /* ================= CARD THIẾT KẾ LUXURY ================= */
        .main-container { padding: 40px 20px; display: flex; justify-content: center; }
        .create-card { 
            background: rgba(10, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            width: 100%; max-width: 600px; 
            border-radius: 32px; padding: 45px; 
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
        }
        .create-card::before {
            content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        h2 { font-weight: 900; font-size: 2rem; margin-bottom: 40px; text-align: center; }

        input[type="text"] { 
            width: 100%; padding: 18px 25px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--border); border-radius: 18px; 
            color: #fff; font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 20px var(--primary-glow); }

        .btn-create { 
            background: var(--primary); color: #050a14;
            border: none; padding: 20px; border-radius: 18px;
            width: 100%; font-weight: 900; font-size: 1.1rem;
            margin-top: 25px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }
        .btn-create:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px var(--primary-glow); }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .create-card { padding: 30px 20px; }
            .remind-text { display: none; } /* Ẩn text trên mobile để tránh chật chội */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5 px-3">
            <a class="navbar-brand" href="#">
                <img src="https://i.ibb.co/Cr14Xxd/Gemini-Generated-Image-q81wzkq81wzkq81w.png" alt="Logo TaoAnhNhanh">
            </a>
            
            <div class="ms-auto">
                <div id="loggedOutArea" class="login-reminder-box">
                    <span class="remind-text">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG DỊCH VỤ</span>
                    <button class="btn-login-vip" onclick="startGoogleLogin()">
                        <i class="fab fa-google me-2"></i> LOGIN VIP
                    </button>
                </div>

                <div id="loggedInArea" class="user-wrapper" style="display: none;">
                    <div class="user-pill" id="userEmailDisplay"></div>
                    <button class="btn btn-outline-danger btn-sm rounded-circle" onclick="logoutAdmin()">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Thiết Lập Album</h2>
            
            <div class="form-group mb-4">
                <label class="mb-2 text-muted fw-bold small">LINK GOOGLE DRIVE (FOLDER)</label>
                <input type="text" id="driveLink" placeholder="Dán đường dẫn thư mục ảnh tại đây...">
            </div>

            <button class="btn-create" id="btnCreate" onclick="createAlbum()">
                <i class="fas fa-magic me-2"></i> BẮT ĐẦU KHỞI TẠO
            </button>

            <div class="mt-4 text-center">
                <span class="badge rounded-pill bg-dark py-2 px-3 border border-secondary" style="font-size: 0.7rem; letter-spacing: 1px;">
                    <i class="fas fa-bolt text-primary me-2"></i>ĐỒNG BỘ SIÊU TỐC 1-5 GIÂY
                </span>
            </div>
        </div>
    </div>

    <script>
        // Logic mô phỏng (Hãy tích hợp các hàm API n8n của bạn vào đây)
        function startGoogleLogin() {
            // Cài đặt đường dẫn login của bạn ở đây
            alert("Đang chuyển hướng đến Google Login...");
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            if (isLoggedIn) {
                document.getElementById('loggedOutArea').style.display = 'none';
                document.getElementById('loggedInArea').style.display = 'flex';
                // Render thông tin user
                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar') || '';
                document.getElementById('userEmailDisplay').innerHTML = `
                    <img src="${avatar}" class="user-avatar">
                    <span class="small fw-bold">${name}</span>
                `;
            } else {
                document.getElementById('loggedOutArea').style.display = 'flex';
                document.getElementById('loggedInArea').style.display = 'none';
            }
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
