<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; padding: 8px 15px !important; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2) !important; color: #fff !important; transform: translateY(-2px); }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 25px; font-weight: 800; color: var(--primary-green); }
        
        /* ⭐ THÔNG BÁO LỜI CHÀO NỔI BẬT */
        .alert-contact { background-color: #fffdf0; border: 1px solid #ffeeba; border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .alert-contact .text-content { font-size: 0.95rem; color: #856404; line-height: 1.5; flex: 1; font-weight: 700; }
        .user-highlight { color: #147a30; font-weight: 900; text-transform: capitalize; }
        .zalo-btn { background: #0068ff; color: white !important; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,104,255,0.3); }

        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; outline: none; }
        .switch-group { display: flex; align-items: center; margin-bottom: 12px; justify-content: space-between; font-weight: 600; }
        .toggle-switch { position: relative; width: 46px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(22px); }
        
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; }
        .btn-locked { background: #6c757d !important; cursor: not-allowed; }

        /* ⭐ USER CONTROL GIAO DIỆN MẪU */
        .user-info-container { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); padding: 5px 15px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .expiry-stack { display: flex; flex-direction: column; line-height: 1.1; text-align: left; font-size: 0.75rem; color: #fff; font-weight: 800; }
        .status-pill { background: #147a30; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; margin-right: 5px; }
        
        /* ⭐ AVATAR NỀN ĐEN VIỀN XANH */
        .user-avatar-wrapper { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent-color); display: flex; align-items: center; justify-content: center; background: #222; overflow: hidden; }
        .user-avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .user-avatar-initial { color: var(--accent-color); font-weight: 900; font-size: 1.1rem; }
        
        .btn-google-login { background: white; color: #444; border: none; padding: 8px 18px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link">Donate</a></li>
                    <li class="nav-item"><a href="feedback.html" class="nav-link">Góp Ý</a></li>
                </ul>
                <div class="ms-auto d-flex align-items-center">
                    <button id="loginBtn" class="btn-google-login" onclick="startGoogleLogin()">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="16"> Đăng nhập Google
                    </button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-2">
                        <div class="user-info-container">
                            <div class="user-avatar-wrapper" id="avatarPlaceholder"></div>
                            <div class="d-flex flex-column">
                                <span id="userNameDisplay" style="color:white; font-weight:900; font-size:1.05rem; letter-spacing: 0.5px;"></span>
                                <div class="expiry-stack" id="expiryDisplay"></div>
                            </div>
                        </div>
                        <button class="btn btn-danger rounded-pill px-3 py-1" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Ảnh Mới</h2>
            
            <div id="statusAlert" class="alert-contact" style="display: none;">
                <i class="fas fa-info-circle" style="color:#856404; font-size: 1.4rem;"></i>
                <div class="text-content" id="alertText"></div>
            </div>
            
            <div class="form-group mb-4">
                <label class="fw-bold mb-2">Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/...">
            </div>

            <div class="switch-group"><span>Cho phép tải xuống</span><label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label></div>
            <div class="switch-group"><span>Tải Logo/Watermark lên</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn số ảnh</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            
            <button class="btn-create mt-2" id="btnCreate">Tạo Album Ngay</button>
        </div>
    </div>

    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com',
            N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback'
        };

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const authStatus = urlParams.get('auth_status');
            if (authStatus === 'success') {
                const email = urlParams.get('user_email');
                const name = urlParams.get('user_name');
                const avatar = urlParams.get('user_avatar');
                const expiry = urlParams.get('user_expiry');
                const status = urlParams.get('user_status');
                if (email) {
                    localStorage.setItem('admin_is_logged_in', 'true');
                    localStorage.setItem('admin_email', email);
                    localStorage.setItem('admin_name', decodeURIComponent(name || ''));
                    localStorage.setItem('admin_avatar', decodeURIComponent(avatar || ''));
                    localStorage.setItem('admin_expiry', expiry || '0');
                    localStorage.setItem('admin_status', status || 'new');
                    history.replaceState(null, null, window.location.pathname);
                }
            }
            updateUI();
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const name = localStorage.getItem('admin_name') || 'Thành viên';
            const avatar = localStorage.getItem('admin_avatar');

            const navLinks = document.getElementById('adminNavLinks');
            const loginBtn = document.getElementById('loginBtn');
            const userControl = document.getElementById('userControl');
            const btn = document.getElementById('btnCreate');
            const alertBox = document.getElementById('statusAlert');
            const alertText = document.getElementById('alertText');
            const expiryEl = document.getElementById('expiryDisplay');

            if (isLoggedIn) {
                navLinks.style.display = 'flex';
                loginBtn.style.display = 'none';
                userControl.style.display = 'flex';
                document.getElementById('userNameDisplay').innerText = name;
                
                const isAllowed = (status === 'active' && expiry > Date.now());
                
                // ⭐ XỬ LÝ AVATAR (NỀN ĐEN, CHỮ XANH HOẶC ẢNH GỐC)
                document.getElementById('avatarPlaceholder').innerHTML = avatar ? 
                    `<img src="${avatar}" class="user-avatar-img">` : 
                    `<span class="user-avatar-initial">${name.charAt(0).toUpperCase()}</span>`;

                if (!isAllowed) {
                    btn.innerHTML = `<i class="fas fa-lock me-2"></i> Tính năng bị khóa`;
                    btn.classList.add('btn-locked');
                    btn.disabled = true;
                    alertBox.style.display = 'flex';
                    
                    // LỜI CHÀO KÈM TÊN GOOGLE
                    alertText.innerHTML = `Chào mừng <span class="user-highlight">${name}</span>! <a href="https://zalo.me/0879029170" target="_blank" class="zalo-btn"><i class="fas fa-comment"></i> Liên hệ Admin</a> để dùng thử Miễn phí hoặc <a href="payment.html" style="color:#147a30; font-weight:900">Gia hạn ngay</a>.`;
                    
                    expiryEl.innerHTML = `<span style="color:#ff9800; font-weight:900; font-size:0.85rem">${status === 'new' ? 'TÀI KHOẢN MỚI' : 'HẾT HẠN'}</span>`;
                } else {
                    btn.innerHTML = `<i class="fas fa-magic"></i> Tạo Album Ngay`;
                    btn.classList.remove('btn-locked');
                    btn.disabled = false;
                    alertBox.style.display = 'none';
                    
                    const d = new Date(expiry);
                    const timeStr = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                    const dateStr = d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    expiryEl.innerHTML = `<div><span class="status-pill">ACTIVE</span><span style="color:var(--accent-color)">${timeStr}</span></div><div style="font-size:0.65rem; color:rgba(255,255,255,0.8)">Hạn: ${dateStr}</div>`;
                }
            } else {
                navLinks.style.display = 'none';
                loginBtn.style.display = 'block';
                userControl.style.display = 'none';
            }
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
