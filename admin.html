<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS GIAO DIỆN GỐC CỦA BẠN - GIỮ NGUYÊN 100% */
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: 0.3s; box-shadow: 0 10px 20px rgba(20, 122, 48, 0.3); }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .badge-active { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .badge-expired { background: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }
        .btn-google { background: white; color: #333; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        #chat-widget-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 4px 20px rgba(81, 255, 125, 0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #chat-box { display: none; position: absolute; bottom: 85px; right: 0; width: 360px; height: 480px; background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); flex-direction: column; border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-camera me-2"></i>Tạo Album</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link"><i class="fas fa-newspaper"></i> Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                    <li class="nav-item"><a href="feedback.html" class="nav-link"><i class="fas fa-comment-alt"></i> Góp Ý</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <button id="loginBtn" class="btn-google" onclick="startGoogleLogin()">
                        <i class="fab fa-google text-danger"></i> <span>Đăng Nhập</span>
                    </button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-3">
                        <div id="userEmailDisplay" class="d-flex align-items-center gap-2 text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">Admin</div>
                        <button class="btn btn-danger fw-bold rounded-pill px-3" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Bắt Đầu Tạo Album Ảnh</h2>
            <div id="statusAlert" class="alert-custom alert-locked" style="display: none;"></div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label><i class="fab fa-google-drive me-2 text-success"></i>Dán Link Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/..." style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px;">
            </div>
            <button class="btn-create" id="btnCreate" onclick="createAlbum()"><i class="fas fa-magic"></i> Tạo Album Ngay</button>
        </div>
    </div>

    <div id="chat-widget-container">
        <div id="chat-greeting-bubble" style="background:white; padding:10px; border-radius:10px; display:none;">👋 Xin chào!</div>
        <button id="chat-toggle-btn" onclick="toggleChat()"><i class="fas fa-comment-dots fa-lg"></i></button>
        <div id="chat-box">
            <div class="chat-header d-flex justify-content-between align-items-center"><span>CSKH Lâm Nam Phước</span></div>
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div class="chat-input-area" style="padding:10px; border-top:1px solid #eee;">
                <input type="text" id="chat-input" placeholder="Nhập câu hỏi..." style="width:80%; border-radius:20px; border:1px solid #ddd; padding:5px 10px;">
                <button onclick="sendMessage()" class="btn btn-success btn-sm">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com',
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback'
        };

        // ⭐ ĐÓN DỮ LIỆU CHUẨN TỪ PAYMENT (TRÁNH LỖI 2035)
        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const newStatus = urlParams.get('user_status');
            const newExpiryString = urlParams.get('user_expiry'); 
            const newEmail = urlParams.get('user_email'); 
            const isCallback = urlParams.get('auth_status') === 'success';

            if (newStatus && newExpiryString && newEmail) {
                // Nhận ngày chuẩn (179435...) từ Payment đẩy sang
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', newEmail);
                localStorage.setItem('admin_expiry', newExpiryString);
                localStorage.setItem('admin_status', newStatus);
                
                // Lưu thêm tên/avatar nếu có (từ Google Login)
                const name = urlParams.get('user_name');
                const avatar = urlParams.get('user_avatar');
                if (name) localStorage.setItem('admin_name', decodeURIComponent(name));
                if (avatar) localStorage.setItem('admin_avatar', decodeURIComponent(avatar));

                history.replaceState(null, null, window.location.pathname);
            } else if (isCallback && newEmail) {
                // Nếu là callback từ Google Login, vẫn dùng lệnh refresh để lấy data sạch từ n8n
                forceRefreshStatus(newEmail);
                return;
            }
            updateUI();
        }

        function forceRefreshStatus(email) {
            const redirectUrl = window.location.origin + window.location.pathname;
            window.location.href = `${GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI}?action=check_status&email=${encodeURIComponent(email)}&redirect_to=${encodeURIComponent(redirectUrl)}`;
        }

        function formatTimestamp(timestamp) {
            const tsNumber = parseInt(timestamp); 
            if (!tsNumber || tsNumber <= Date.now()) return 'Đã hết hạn';
            let date = new Date(tsNumber);
            // Sửa lỗi 2035 cục bộ (bù trừ 10 năm)
            if (date.getFullYear() >= 2035) date = new Date(tsNumber - 315576000000);
            return date.toLocaleString('vi-VN');
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const email = localStorage.getItem('admin_email');
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const name = localStorage.getItem('admin_name') || 'Admin';

            if (isLoggedIn && email) {
                document.getElementById('adminNavLinks').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userControl').style.display = 'flex';
                
                const isAllowed = (status === 'active' && expiry > Date.now());
                const statusAlert = document.getElementById('statusAlert');
                if (isAllowed) {
                    statusAlert.style.display = 'none';
                } else {
                    statusAlert.style.display = 'flex';
                    statusAlert.classList.add('alert-locked');
                    statusAlert.innerHTML = `<i class="fas fa-lock text-danger"></i> <span>Hết hạn. <a href="payment.html">Gia hạn</a></span>`;
                }

                const avatar = localStorage.getItem('admin_expiry'); // Placeholder for avatar
                document.getElementById('userEmailDisplay').innerHTML = `${name} <span class="status-badge ${isAllowed?'badge-active':'badge-expired'}">${formatTimestamp(expiry)}</span>`;
                document.getElementById('btnCreate').disabled = !isAllowed;
            }
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        function toggleChat() { const box = document.getElementById('chat-box'); box.style.display = (box.style.display === 'none' || !box.style.display) ? 'flex' : 'none'; }

        window.onload = checkAuthCallback;
    </script>
</body>
</html>
