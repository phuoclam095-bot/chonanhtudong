<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --accent-color: #51ff7d; --bg-dark: #1a1a1a; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; overflow-x: hidden; }
        
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.3rem; color: white !important; text-transform: uppercase; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; transition: 0.3s; border-radius: 8px; font-size: 0.9rem; }
        .nav-link.active { background-color: rgba(255,255,255,0.2); }

        /* USER CONTROL MOBILE */
        .user-status-box { background-color: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px; padding: 5px 12px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .user-avatar-circle { width: 30px; height: 30px; background: #333; color: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 2px solid var(--accent-color); overflow: hidden; }
        .status-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: white; background-color: #198754; }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 500px; border-radius: 25px; padding: 30px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { font-weight: 900; color: var(--primary-green); font-size: 1.6rem; text-transform: uppercase; margin-bottom: 20px; }
        .heartbeat-effect { color: #d63031; font-weight: 900; display: inline-block; animation: heartbeat 1.2s infinite; }
        @keyframes heartbeat { 0%, 60% { transform: scale(1); } 30% { transform: scale(1.1); } }
        
        input[type="text"] { width: 100%; padding: 15px; border: 2.5px solid #f1f5f9; border-radius: 15px; outline: none; font-weight: 700; text-align: center; transition: 0.3s; margin-bottom: 20px; }
        input[type="text"]:focus { border-color: var(--primary-green); background: #fff; }
        input[type="text"]:focus::placeholder { color: transparent; }

        /* PREVIEW BOX */
        .preview-box { border: 2.5px dashed var(--primary-green); background-color: #f0fff4; padding: 20px; border-radius: 20px; margin: 15px 0; display: none; }
        #resFolderName { font-size: 1.4rem; font-weight: 900; color: var(--primary-green); display: block; margin: 5px 0; }
        #finalLinkBox { background: #000; color: var(--accent-color); padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; margin-top: 10px; }
        #finalLinkBox a { color: var(--accent-color); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .switch-group { display: flex; align-items: center; margin-bottom: 12px; justify-content: space-between; font-weight: 800; color: #4a5568; font-size: 0.9rem; }
        .toggle-switch { position: relative; width: 45px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(21px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 16px; font-size: 1rem; border-radius: 15px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.2); transition: 0.3s; }
        .btn-locked { background: #94a3b8 !important; cursor: not-allowed; }

        /* FIX CHAT AI MOBILE */
        #chat-widget-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
        #chat-greeting-bubble { visibility: hidden; opacity: 0; position: absolute; bottom: 15px; right: 75px; background: white; padding: 10px 15px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); font-size: 0.85rem; font-weight: 800; color: #333; border: 2px solid var(--accent-color); transition: 0.5s; white-space: nowrap; }
        #chat-greeting-bubble.show { visibility: visible; opacity: 1; }
        #chat-box { display: none; position: absolute; bottom: 75px; right: 0; width: 320px; height: 400px; background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); overflow: hidden; flex-direction: column; border: 1px solid #eee; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 85%; padding: 8px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: 600; }
        .bot-msg { background: white; border: 1px solid #e2e8f0; align-self: flex-start; }
        .user-msg { background: var(--primary-green); color: white; align-self: flex-end; }
        
        #copyToast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 10px 25px; border-radius: 50px; font-weight: 800; z-index: 10000; display: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div id="userControl" style="display: none !important;" class="ms-auto align-items-center gap-2">
                    <div class="user-status-box">
                        <div class="user-avatar-circle" id="userAvatarPlaceholder"></div>
                        <div class="d-flex flex-column text-white">
                            <span id="userNameDisplay" class="fw-bold">Admin</span>
                            <span id="userExpiryText" style="font-size:0.6rem; opacity:0.8;"></span>
                        </div>
                    </div>
                    <button onclick="logoutAdmin()" class="btn btn-sm btn-danger rounded-pill px-2"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Mới</h2>
            <div id="welcomeArea" class="welcome-msg" style="display: none; font-size: 0.85rem; color: #666; margin-bottom: 15px;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                <div class="heartbeat-effect mt-1">NHANH - GỌN - CHÍNH XÁC</div>
            </div>
            <input type="text" id="driveLink" placeholder="Dán link hoặc ID thư mục Drive...">
            <div id="previewBox" class="preview-box">
                <small class="fw-bold text-secondary">ALBUM ĐÃ SẴN SÀNG!</small>
                <strong id="resFolderName">...</strong>
                <div id="finalLinkBox">
                    <a href="#" id="resClientLink" target="_blank">...</a>
                    <button class="btn-copy-link" onclick="copyResultLink()">COPY</button>
                </div>
            </div>
            <div class="switch-group"><span>Cho phép khách tải ảnh</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Chèn Logo/Watermark</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn số ảnh chọn</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">Bắt Đầu Tạo Ngay</button>
            <div id="centralLoginArea" class="mt-4" style="display: none;">
                <button class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">Đăng nhập Google</button>
            </div>
        </div>
    </div>

    <div id="chat-widget-container">
        <div id="chat-greeting-bubble">...</div>
        <button id="chat-toggle-btn" class="pulse-green" onclick="toggleChat()"><i class="fas fa-robot fa-2x"></i></button>
        <div id="chat-box">
            <div class="chat-header">TRỢ LÝ AI STUDIO LNP</div>
            <div id="chat-messages"></div>
            <div class="p-2 border-top"><input type="text" id="chat-input" class="form-control" placeholder="Hỏi AI..." onkeypress="if(event.key==='Enter') sendMessage()"></div>
        </div>
    </div>
    <div id="copyToast">✅ Đã copy link thành công!</div>

    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };
        const URL_CREATE = 'https://dichvufb.tino.page/webhook/create-album-auto', URL_GET_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info', API_CHAT = 'https://dichvufb.tino.page/webhook/chat-admin';

        function playNotiSound() {
            const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
            audio.volume = 0.4; audio.play().catch(() => {});
        }

        async function handleCreateAlbum() {
            const link = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if (!link) return alert("Hãy dán link!");
            const fIdMatch = link.match(/folders\/([a-zA-Z0-9_-]{20,})|id=([a-zA-Z0-9_-]{20,})/);
            const folderId = fIdMatch ? (fIdMatch[1] || fIdMatch[2]) : (link.length > 20 ? link : null);
            if (!folderId) return alert("Link không hợp lệ!");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...'; btn.disabled = true;
            try {
                await fetch(URL_CREATE, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ folderId, adminEmail: localStorage.getItem('admin_email'), settings: { download: document.getElementById('allowDownload').checked, logo: document.getElementById('allowLogo').checked, limit: document.getElementById('limitPhotos').checked } }) });
                const res = await fetch(`${URL_GET_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await res.json();
                if (data.clientLink) {
                    document.getElementById('resFolderName').innerText = data.folderName;
                    document.getElementById('resClientLink').href = data.clientLink;
                    document.getElementById('resClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                }
            } catch (e) { alert("Lỗi hệ thống!"); }
            finally { btn.innerHTML = 'Tạo Album Ngay'; btn.disabled = false; }
        }

        function updateUI() {
            const logged = localStorage.getItem('admin_is_logged_in') === 'true';
            const name = localStorage.getItem('admin_name') || 'Admin';
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            document.getElementById('adminNavLinks').style.display = logged ? 'flex' : 'none';
            document.getElementById('userControl').setAttribute('style', logged ? 'display: flex !important;' : 'display: none !important;');
            document.getElementById('centralLoginArea').style.display = logged ? 'none' : 'block';
            if (logged) {
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = `<img src="${localStorage.getItem('admin_avatar')}" style="width:100%; height:100%; object-fit:cover;">`;
                const canCreate = (localStorage.getItem('admin_status') === 'active' && expiry > Date.now());
                document.getElementById('btnCreate').className = canCreate ? 'btn-create' : 'btn-create btn-locked';
                document.getElementById('userExpiryText').innerText = `Hạn: ${new Date(expiry).toLocaleDateString('vi-VN')}`;
                
                // AI CHÀO THEO TÊN
                const bubble = document.getElementById('chat-greeting-bubble');
                bubble.innerText = `👋 Chào ${name}, em giúp gì được ạ?`;
                setTimeout(() => { bubble.classList.add('show'); playNotiSound(); }, 3000);
            }
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', params.get('user_email'));
                localStorage.setItem('admin_name', decodeURIComponent(params.get('user_name')));
                localStorage.setItem('admin_avatar', decodeURIComponent(params.get('user_avatar')));
                localStorage.setItem('admin_expiry', params.get('user_expiry'));
                localStorage.setItem('admin_status', params.get('user_status'));
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function toggleChat() { const box = document.getElementById('chat-box'); box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; }
        async function sendMessage() {
            const input = document.getElementById('chat-input'), msg = input.value.trim();
            if (!msg) return; appendMsg(msg, 'user'); input.value = '';
            try {
                const res = await fetch(API_CHAT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, email: localStorage.getItem('admin_email') }) });
                const data = await res.json(); appendMsg(data.output || "AI bận rồi!", 'bot');
            } catch (e) { appendMsg("Lỗi AI!", 'bot'); }
        }
        function appendMsg(t, s) {
            const container = document.getElementById('chat-messages'), d = document.createElement('div');
            d.className = `message ${s === 'user' ? 'user-msg' : 'bot-msg'}`; d.innerText = t;
            container.appendChild(d); container.scrollTop = container.scrollHeight;
        }
        function copyResultLink() { navigator.clipboard.writeText(document.getElementById('resClientLink').innerText).then(() => { const toast = document.getElementById('copyToast'); toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2000); }); }
        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.reload(); }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
