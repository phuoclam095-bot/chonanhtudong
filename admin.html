<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Album Ảnh - ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; 
        }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: #444; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; transition: 0.3s; }
        input:focus { border-color: var(--primary-green); outline: none; box-shadow: 0 0 10px rgba(20, 122, 48, 0.1); }
        
        /* HIỆU ỨNG NHỊP TIM CHO NÚT TẠO [TỐI ƯU] */
        @keyframes pulse-create {
            0% { box-shadow: 0 0 0 0 rgba(20, 122, 48, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(20, 122, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(20, 122, 48, 0); }
        }
        .pulse-btn { animation: pulse-create 2s infinite; }

        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-create:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-create:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.8; animation: none; }

        /* BOX HIỂN THỊ LINK SAO CHÉP */
        .preview-box { border: 2px dashed #147a30; background-color: #f0fff4; padding: 20px; border-radius: 15px; margin-bottom: 25px; display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #finalLinkBox { background: #000; color: var(--accent-color); padding: 15px; border-radius: 10px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #333; }
        #finalLinkBox span { font-family: monospace; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-copy-link { background: var(--primary-green); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }

        /* SWITCH CHỈNH SỬA */
        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* CHAT WIDGET (GIỮ NGUYÊN) */
        #chat-widget-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 4px 20px rgba(81, 255, 125, 0.4); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; z-index: 10001; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(81, 255, 125, 0); } 100% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0); } }
        .pulse { animation: pulse-green 2s infinite; }
        #chat-box { display: none; position: absolute; bottom: 85px; right: 0; width: 360px; height: 480px; background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; flex-direction: column; z-index: 10002; }

        #copyNotification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background-color: #28a745; color: white; padding: 12px 25px; border-radius: 50px; z-index: 1050; opacity: 0; transition: 0.3s; }
        #copyNotification.active { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-camera me-2"></i>Tạo Album</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <button id="loginBtn" class="btn btn-light rounded-pill px-3" onclick="startGoogleLogin()">Đăng Nhập</button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-3">
                        <div id="userEmailDisplay" class="d-flex align-items-center gap-2 text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10">Admin</div>
                        <button class="btn btn-danger rounded-pill px-3" onclick="logoutAdmin()">Thoát</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Bắt Đầu Tạo Album Ảnh</h2>
            <div id="statusAlert" class="alert alert-warning" style="display: none; border-radius: 12px;"></div>

            <div class="form-group">
                <label><i class="fab fa-google-drive me-2 text-success"></i>Dán ID hoặc Link Thư mục</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off">
            </div>
            
            <div id="previewBox" class="preview-box text-dark">
                <div class="small fw-bold mb-1 text-uppercase text-secondary">Sẵn sàng gửi cho khách:</div>
                <div class="fw-bold mb-2">Album: <span id="previewFolderName" class="text-success">...</span></div>
                <div id="finalLinkBox">
                    <span id="previewClientText">...</span>
                    <button class="btn-copy-link" onclick="copyFinalLink()"><i class="fas fa-copy me-1"></i> COPY</button>
                </div>
            </div>

            <div class="switch-group">
                <div class="fw-bold">Cho phép tải xuống</div>
                <label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label>
            </div>
            <div class="switch-group">
                <div class="fw-bold">Cho phép bình luận</div>
                <label class="toggle-switch"><input type="checkbox" id="allowComment" checked><span class="slider"></span></label>
            </div>

            <button class="btn-create pulse-btn" id="btnCreate" onclick="createAlbum()">
                <i class="fas fa-magic"></i> Tạo Album Ngay
            </button>
        </div>
    </div>

    <div id="chat-widget-container">
        <button id="chat-toggle-btn" class="pulse" onclick="toggleChat()"><i class="fas fa-comment-dots fa-lg"></i></button>
        <div id="chat-box">
            <div class="p-3 bg-success text-white fw-bold d-flex justify-content-between">
                <span>CSKH Lâm Nam Phước</span>
                <button class="btn-close btn-close-white" onclick="toggleChat()"></button>
            </div>
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:15px; background:#f8f9fa;"></div>
            <div class="p-2 border-top">
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" placeholder="Nhập câu hỏi..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn btn-success" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="copyNotification">✅ Đã sao chép link!</div>

    <script>
        // GIỮ NGUYÊN TOÀN BỘ LOGIC HÀM CỦA BẠN
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', 
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback', 
            SCOPE: 'openid profile email' 
        };
        const URL_CREATE_ALBUM_SAVE = 'https://dichvufb.tino.page/webhook/create-album-auto'; 
        const URL_GET_FOLDER_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info';

        // --- Logic Đăng nhập & UI (Dựa trên bản gốc) ---
        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const adminNavLinks = document.getElementById('adminNavLinks');
            const loginBtn = document.getElementById('loginBtn');
            const userControl = document.getElementById('userControl');
            const btnCreate = document.getElementById('btnCreate');

            if (isLoggedIn) {
                adminNavLinks.style.display = 'flex';
                loginBtn.style.display = 'none';
                userControl.style.display = 'flex';
                document.getElementById('userEmailDisplay').innerText = localStorage.getItem('admin_name') || 'Admin';
                btnCreate.disabled = false;
                btnCreate.classList.add('pulse-btn');
            } else {
                btnCreate.disabled = true;
                btnCreate.classList.remove('pulse-btn');
            }
        }

        async function createAlbum() {
            const driveLink = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if(!driveLink) return alert("Vui lòng dán link!");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tạo...';
            btn.disabled = true;

            try {
                // Logic xử lý ID và gọi Webhook (Giữ nguyên từ bản gốc)
                const folderId = driveLink.includes('folders/') ? driveLink.match(/folders\/([^/?]+)/)[1] : driveLink;
                
                await fetch(URL_CREATE_ALBUM_SAVE, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        folderId: folderId,
                        adminEmail: localStorage.getItem('admin_email'),
                        settings: {
                            download: document.getElementById('allowDownload').checked,
                            comment: document.getElementById('allowComment').checked
                        }
                    })
                });

                const res = await fetch(`${URL_GET_FOLDER_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await res.json();

                if(data.clientLink) {
                    document.getElementById('previewFolderName').innerText = data.folderName;
                    document.getElementById('previewClientText').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                    showNotification('Tạo Album thành công!');
                }
            } catch (e) {
                alert("Có lỗi xảy ra, vui lòng thử lại!");
            } finally {
                btn.innerHTML = '<i class="fas fa-magic"></i> Tạo Album Ngay';
                btn.disabled = false;
            }
        }

        function copyFinalLink() {
            const link = document.getElementById('previewClientText').innerText;
            navigator.clipboard.writeText(link).then(() => showNotification('✅ Đã sao chép link!'));
        }

        function showNotification(msg) {
            const n = document.getElementById('copyNotification');
            n.innerText = msg; n.classList.add('active');
            setTimeout(() => n.classList.remove('active'), 3000);
        }

        // --- Logic Chat AI (Giữ nguyên từ bản gốc) ---
        function toggleChat() {
            const box = document.getElementById('chat-box');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function startGoogleLogin() {
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(GOOGLE_CONFIG.SCOPE)}&access_type=offline&prompt=consent`;
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
