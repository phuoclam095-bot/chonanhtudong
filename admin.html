<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; padding: 8px 15px !important; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2) !important; color: #fff !important; transform: translateY(-2px); }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 28px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); text-align: center; }
        h2 { font-weight: 900; color: var(--primary-green); font-size: 1.8rem; text-transform: uppercase; margin-bottom: 20px; }
        
        /* ⭐ SỬA LỖI CHỮ KHÔNG ĐỀU - DÀN HÀNG NGANG */
        .welcome-msg { margin-bottom: 25px; font-size: 1rem; font-weight: 700; color: #444; line-height: 1.8; }
        .slogan-heartbeat { color: #d63031; font-weight: 900; display: inline-block; animation: heartbeat 1.2s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 60% { transform: scale(1); } }
        .contact-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .zalo-link-btn { background: #0068ff; color: white !important; padding: 5px 15px; border-radius: 50px; text-decoration: none; font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(0,104,255,0.3); }

        /* KHUNG DÁN LINK */
        .premium-input-group { text-align: left; margin-bottom: 25px; }
        .premium-input-group label { display: block; margin-bottom: 10px; font-weight: 800; color: #333; }
        input[type="text"] { width: 100%; padding: 16px; border: 2px solid #edf2f7; border-radius: 16px; outline: none; background: #f8fafc; font-weight: 600; }

        /* NÚT GẠT */
        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; font-weight: 800; color: #4a5568; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 16px; font-size: 18px; border-radius: 16px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.25); }
        .btn-locked { background: #94a3b8 !important; cursor: not-allowed; box-shadow: none; }

        /* ⭐ SỬA KHUNG NGÀY GIỜ CHUẨN MẪU */
        .user-info-container { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.18); padding: 6px 16px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.25); }
        .user-avatar-circle { width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--accent-color); display: flex; align-items: center; justify-content: center; background: #2d3436; overflow: hidden; }
        .user-avatar-initial { color: var(--accent-color); font-weight: 900; font-size: 1.3rem; }
        .expiry-stack { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        .status-badge-row { display: flex; align-items: center; gap: 8px; }
        .status-badge-active { background: #147a30; color: #fff; padding: 1px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; }
        .expiry-time-text { color: var(--accent-color); font-weight: 800; font-size: 1rem; }
        .expiry-date-text { color: #fff; font-weight: 700; font-size: 0.8rem; opacity: 0.95; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div class="ms-auto">
                    <button id="loginBtn" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">Đăng nhập Google</button>
                    <div id="userControl" style="display: none;" class="d-flex align-items-center gap-3">
                        <div class="user-info-container">
                            <div class="user-avatar-circle" id="avatarPlaceholder"></div>
                            <div class="d-flex flex-column">
                                <span id="userNameDisplay" style="color:white; font-weight:900; font-size:1.1rem; margin-bottom: 2px;"></span>
                                <div id="expiryDisplay" class="expiry-stack"></div>
                            </div>
                        </div>
                        <button class="btn btn-danger rounded-pill px-3 py-1" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Ảnh Mới</h2>
            
            <div id="welcomeArea" class="welcome-msg" style="display: none;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                Trải nghiệm dịch vụ <span class="slogan-heartbeat">NHANH - GỌN - CHÍNH XÁC</span>. 
                <div class="contact-row">
                    <a href="https://zalo.me/0879029170" target="_blank" class="zalo-link-btn"><i class="fab fa-zalo"></i> Liên hệ Admin</a> 
                    để kích hoạt <strong>Dùng thử Miễn phí</strong> hoặc <a href="payment.html" style="color:var(--primary-green); text-decoration: underline;">Gia hạn</a>.
                </div>
            </div>
            
            <div class="premium-input-group">
                <label>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/...">
            </div>

            <div class="switch-group"><span>Cho phép tải xuống</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Tải Logo/Watermark lên</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn số ảnh</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            
            <button class="btn-create mt-2" id="btnCreate">Tạo Album Ngay</button>
        </div>
    </div>

    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com',
            N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback'
        };

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const authStatus = urlParams.get('auth_status');
            if (authStatus === 'success') {
                const email = urlParams.get('user_email');
                const name = urlParams.get('user_name');
                const avatar = urlParams.get('user_avatar');
                const expiry = urlParams.get('user_expiry');
                const status = urlParams.get('user_status');
                if (email) {
                    localStorage.setItem('admin_is_logged_in', 'true');
                    localStorage.setItem('admin_email', email);
                    localStorage.setItem('admin_name', decodeURIComponent(name || ''));
                    localStorage.setItem('admin_avatar', decodeURIComponent(avatar || ''));
                    localStorage.setItem('admin_expiry', expiry || '0');
                    localStorage.setItem('admin_status', status || 'new');
                    history.replaceState(null, null, window.location.pathname);
                }
            }
            updateUI();
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const name = localStorage.getItem('admin_name') || 'Khách hàng';
            const avatar = localStorage.getItem('admin_avatar');

            if (isLoggedIn) {
                document.getElementById('adminNavLinks').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userControl').style.display = 'flex';
                document.getElementById('userNameDisplay').innerText = name;
                
                const isAllowed = (status === 'active' && expiry > Date.now());
                const welcomeArea = document.getElementById('welcomeArea');
                const btn = document.getElementById('btnCreate');
                const expiryEl = document.getElementById('expiryDisplay');
                
                // ⭐ SỬA LỖI AVATAR
                const avatarPlaceholder = document.getElementById('avatarPlaceholder');
                if (avatar && avatar !== 'undefined' && avatar !== 'null') {
                    avatarPlaceholder.innerHTML = `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover;">`;
                } else {
                    avatarPlaceholder.innerHTML = `<span class="user-avatar-initial">${name.charAt(0).toUpperCase()}</span>`;
                }

                if (!isAllowed) {
                    btn.innerHTML = `<i class="fas fa-lock me-2"></i> Tính năng bị khóa`;
                    btn.classList.add('btn-locked');
                    welcomeArea.style.display = 'block';
                    document.getElementById('welcomeUserName').innerText = name;
                    expiryEl.innerHTML = `<span style="color:#ff9800; font-weight:900; font-size:0.95rem;">${status === 'new' ? 'TÀI KHOẢN MỚI' : 'HẾT HẠN DÙNG'}</span>`;
                } else {
                    btn.innerHTML = `<i class="fas fa-magic"></i> Tạo Album Ngay`;
                    btn.classList.remove('btn-locked');
                    welcomeArea.style.display = 'none';
                    
                    const d = new Date(expiry);
                    const timeStr = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                    const dateStr = d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    
                    // Cấu trúc 2 dòng chuẩn mẫu
                    expiryEl.innerHTML = `
                        <div class="status-badge-row">
                            <span class="status-badge-active">ACTIVE</span>
                            <span class="expiry-time-text">${timeStr}</span>
                        </div>
                        <div class="expiry-date-text">Hạn: ${dateStr}</div>
                    `;
                }
            } else {
                // ⭐ XỬ LÝ KHI ĐĂNG XUẤT: Xóa sạch dữ liệu UI
                document.getElementById('adminNavLinks').style.display = 'none';
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('userControl').style.display = 'none';
                document.getElementById('welcomeArea').style.display = 'none';
                document.getElementById('avatarPlaceholder').innerHTML = "";
                document.getElementById('userNameDisplay').innerText = "";
            }
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        
        function logoutAdmin() { 
            localStorage.clear(); 
            // Buộc trang load lại để xóa sạch trạng thái cũ
            window.location.href = 'admin.html'; 
        }
        
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
