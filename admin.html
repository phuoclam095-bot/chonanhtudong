<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --highlight-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 50px 50px; background-position: 0 0, 25px 25px; min-height: 100vh; padding-top: 75px; overflow-x: hidden; }
        
        /* NAVBAR CHUẨN COPY_LOCAL */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 2000; border-bottom: 2px solid var(--highlight-color); height: 70px; }
        .navbar-brand { font-weight: 800; font-size: 1.1rem; color: white !important; text-transform: uppercase; }
        .navbar-toggler { border: 2px solid white !important; padding: 5px 8px; order: 1; }
        .navbar-toggler-icon { width: 25px; height: 25px; filter: brightness(0) invert(1); }

        /* TABS NGANG NỔI NỀN */
        .navbar-collapse { order: 3; }
        .navbar-nav { flex-direction: row !important; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .navbar-nav::-webkit-scrollbar { display: none; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 800; font-size: 0.75rem; padding: 8px 12px !important; transition: 0.3s; border-radius: 8px; text-transform: uppercase; white-space: nowrap; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2) !important; color: #fff !important; }

        /* ⭐ HEADER USER INFO SÁT GÓC PHẢI */
        #userControl { order: 2; margin-left: auto; }
        .user-status-box { background-color: rgba(255, 255, 255, 0.15); border: 1.5px solid var(--highlight-color); border-radius: 50px; padding: 4px 5px 4px 12px; display: flex; align-items: center; gap: 8px; }
        .avatar-circle { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--highlight-color); overflow: hidden; background: #222; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .user-meta { display: flex; flex-direction: column; line-height: 1; text-align: left; }
        .u-name { color: white; font-weight: 900; font-size: 0.75rem; white-space: nowrap; max-width: 65px; overflow: hidden; text-overflow: ellipsis; }
        .status-pill { display: flex; align-items: center; gap: 4px; }
        .u-status { color: white; background: #198754; font-size: 0.55rem; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
        .u-expiry { color: var(--highlight-color); font-size: 0.6rem; font-weight: 800; }
        .btn-logout-sq { background: #dc3545; color: white; border: none; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        /* ⭐ HIỆU ỨNG NHỊP TIM ĐĂNG NHẬP */
        .heartbeat-login { color: #ff4757; font-weight: 900; font-size: 0.9rem; letter-spacing: 1px; animation: heartbeat-anim 1.2s infinite; margin-bottom: 20px; }
        @keyframes heartbeat-anim { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.08); } }

        .main-container { padding: 15px; display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 120px); }
        .create-card { background: #fff; width: 100%; max-width: 450px; border-radius: 30px; padding: 30px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; border: 1px solid #eee; }
        h2 { font-weight: 900; color: var(--primary-green); font-size: 1.4rem; margin-bottom: 20px; text-transform: uppercase; }

        input[type="text"] { width: 100%; padding: 14px; border: 2.5px solid #f1f5f9; border-radius: 18px; font-weight: 800; text-align: center; font-size: 0.95rem; margin-bottom: 15px; }
        input[type="text"]:focus { border-color: var(--primary-green) !important; outline: none; }

        .preview-box { border: 2px dashed var(--primary-green); background: #f0fff4; padding: 15px; border-radius: 20px; margin: 15px 0; display: none; text-align: left; }
        #finalLinkBox { background: #000; padding: 8px 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; margin-top: 10px; }
        #finalLinkBox a { color: var(--highlight-color); font-size: 0.7rem; text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; font-family: monospace; }
        .btn-copy-sm { background: var(--primary-green); color: white; border: none; padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; }

        .switch-group { display: flex; align-items: center; margin-bottom: 12px; justify-content: space-between; font-weight: 800; font-size: 0.85rem; color: #444; }
        .toggle-switch { position: relative; width: 45px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #cbd5e0; border-radius: 34px; transition: 0.4s; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.4s; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(23px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 16px; border-radius: 15px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20,122,48,0.2); font-size: 1rem; }
        .btn-locked { background: #94a3b8 !important; pointer-events: none; }

        /* CHAT AI FIXED */
        #chat-widget-container { position: fixed; bottom: 20px; right: 15px; z-index: 3000; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; position: relative; z-index: 3001; }
        #chat-greeting-bubble { visibility: hidden; opacity: 0; position: absolute; bottom: 15px; right: 70px; background: white; padding: 10px 15px; border-radius: 15px; border-bottom-right-radius: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-size: 0.8rem; font-weight: 800; border: 2px solid var(--accent-color); white-space: nowrap; transition: 0.5s; z-index: 3000; }
        #chat-greeting-bubble.show { visibility: visible; opacity: 1; }
        #chat-box { display: none; position: absolute; bottom: 75px; right: 0; width: 310px; height: 400px; background: white; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); overflow: hidden; flex-direction: column; border: 1px solid #eee; z-index: 3002; }
        .chat-header { background: linear-gradient(to right, #147a30, #0e5a22); color: white; padding: 12px 15px; font-weight: 800; font-size: 0.85rem; display: flex; justify-content: space-between; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #f8fafc; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-2">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="userControl" style="display: none !important;" class="ms-auto d-flex align-items-center">
                <div class="user-header-box">
                    <div class="avatar-circle" id="userAvatarPlaceholder"></div>
                    <div class="user-meta">
                        <span id="userNameDisplay" class="u-name">Admin</span>
                        <div class="status-pill">
                            <span class="u-status">ACTIVE</span>
                            <span id="userExpiryText" class="u-expiry"></span>
                        </div>
                    </div>
                    <button onclick="logoutAdmin()" class="btn-logout-sq" title="Đăng xuất"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
            
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 py-2 py-lg-0 px-3">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">TẠO ALBUM</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">QUẢN LÝ</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">SAO CHÉP</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">BLOG</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">GIA HẠN</a></li> 
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card shadow-lg">
            <h2>Tạo Album Mới</h2>

            <div id="centralLoginArea" class="mt-4" style="display: none;">
                <div class="heartbeat-login">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG DỊCH VỤ</div>
                <button class="btn btn-light border rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18" class="me-2"> Đăng nhập bằng Google
                </button>
            </div>

            <div id="welcomeArea" class="welcome-msg" style="display: none; font-size: 0.85rem; color: #666; margin-bottom: 15px; font-weight: 700;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                <div class="heartbeat mt-1" style="color:#d63031">NHANH - GỌN - CHÍNH XÁC</div>
            </div>

            <input type="text" id="driveLink" placeholder="Dán link thư mục Google Drive...">

            <div id="previewBox" class="preview-box">
                <small class="fw-bold text-secondary text-uppercase">Tạo Thành Công!</small>
                <strong id="resFolderName">...</strong>
                <div id="finalLinkBox">
                    <a href="#" id="resClientLink" target="_blank">...</a>
                    <button class="btn-copy-sm" onclick="copyResultLink()">COPY</button>
                </div>
            </div>

            <div class="switch-group"><span>Cho phép khách tải ảnh</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Tự động chèn Logo</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn ảnh chọn</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            
            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">Bắt Đầu Tạo Ngay</button>
        </div>
    </div>

    <div id="chat-widget-container">
        <div id="chat-greeting-bubble">...</div>
        <button id="chat-toggle-btn" onclick="toggleChat()"><i class="fas fa-robot fa-lg"></i></button>
        <div id="chat-box">
            <div class="chat-header"><span>TRỢ LÝ AI STUDIO LNP</span><button class="btn-close btn-close-white" onclick="toggleChat()" style="font-size:0.6rem"></button></div>
            <div id="chat-messages"></div>
            <div class="p-2 border-top"><input type="text" id="chat-input" class="form-control form-control-sm" placeholder="Hỏi AI..." onkeypress="if(event.key==='Enter') sendMessage()"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };
        const URL_CREATE = 'https://dichvufb.tino.page/webhook/create-album-auto', URL_GET_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info', API_CHAT = 'https://dichvufb.tino.page/webhook/chat-admin';

        function playSound() { new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3").play().catch(()=>{}); }

        // ⭐ HÀM ĐĂNG NHẬP FIXED
        function startGoogleLogin() { 
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; 
        }

        async function handleCreateAlbum() {
            const link = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if (!link) return alert("Hãy dán link!");
            const match = link.match(/folders\/([a-zA-Z0-9_-]{20,})|id=([a-zA-Z0-9_-]{20,})/);
            const folderId = match ? (match[1] || match[2]) : (link.length > 20 ? link : null);
            if (!folderId) return alert("Link không hợp lệ!");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            try {
                await fetch(URL_CREATE, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ folderId, adminEmail: localStorage.getItem('admin_email'), settings: { download: document.getElementById('allowDownload').checked, logo: document.getElementById('allowLogo').checked, limit: document.getElementById('limitPhotos').checked } }) });
                const res = await fetch(`${URL_GET_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await res.json();
                if (data.clientLink) {
                    document.getElementById('resFolderName').innerText = data.folderName;
                    document.getElementById('resClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                }
            } catch (e) { alert("Lỗi hệ thống!"); }
            finally { btn.innerHTML = 'Tạo Album Ngay'; btn.disabled = false; }
        }

        function updateUI() {
            const logged = localStorage.getItem('admin_is_logged_in') === 'true';
            const name = localStorage.getItem('admin_name') || 'Admin';
            const avatar = localStorage.getItem('admin_avatar');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;

            document.getElementById('userControl').setAttribute('style', logged ? 'display: flex !important;' : 'display: none !important;');
            document.getElementById('centralLoginArea').style.display = logged ? 'none' : 'block';

            if (logged) {
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}">` : `<b style="color:var(--highlight-color)">${name.charAt(0)}</b>`;
                const canCreate = (localStorage.getItem('admin_status') === 'active' && expiry > Date.now());
                document.getElementById('btnCreate').className = canCreate ? 'btn-create' : 'btn-create btn-locked';
                document.getElementById('userExpiryText').innerText = `${new Date(expiry).toLocaleDateString('vi-VN')}`;
                
                const bubble = document.getElementById('chat-greeting-bubble');
                bubble.innerText = `👋 Chào ${name.split(' ').pop()}, em giúp gì được ạ?`;
                setTimeout(() => { bubble.classList.add('show'); playSound(); }, 3000);
            }
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', params.get('user_email'));
                localStorage.setItem('admin_name', decodeURIComponent(params.get('user_name')));
                localStorage.setItem('admin_avatar', decodeURIComponent(params.get('user_avatar')));
                localStorage.setItem('admin_expiry', params.get('user_expiry'));
                localStorage.setItem('admin_status', params.get('user_status'));
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function toggleChat() { const box = document.getElementById('chat-box'); box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; document.getElementById('chat-greeting-bubble').classList.remove('show'); }
        async function sendMessage() {
            const input = document.getElementById('chat-input'), msg = input.value.trim();
            if (!msg) return; appendMsg(msg, 'user'); input.value = '';
            try {
                const res = await fetch(API_CHAT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, email: localStorage.getItem('admin_email') }) });
                const data = await res.json(); appendMsg(data.output || "AI bận rồi!", 'bot');
            } catch (e) { appendMsg("Lỗi AI!", 'bot'); }
        }
        function appendMsg(t, s) {
            const container = document.getElementById('chat-messages'), d = document.createElement('div');
            d.className = `message ${s === 'user' ? 'user-msg' : 'bot-msg'}`; d.innerText = t;
            container.appendChild(d); container.scrollTop = container.scrollHeight;
        }
        function copyResultLink() {
            navigator.clipboard.writeText(document.getElementById('resClientLink').innerText).then(() => alert("✅ Đã copy link!"));
        }
        function logoutAdmin() { localStorage.clear(); window.location.reload(); }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
