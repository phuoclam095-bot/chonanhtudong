<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Quản lý Album</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; 
        }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        .form-group { margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; transition: 0.3s; }
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; box-shadow: 0 10px 20px rgba(20, 122, 48, 0.3); }
        .alert-custom { border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-size: 0.95rem; }
        .alert-locked { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .badge-active { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .badge-expired { background: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }
        .btn-google { background: white; color: #333; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        #copyNotification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background-color: #28a745; color: white; padding: 12px 25px; border-radius: 50px; z-index: 1050; opacity: 0; transition: 0.3s; }
        #copyNotification.active { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-camera me-2"></i>Tạo Album</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <button id="loginBtn" class="btn-google" onclick="startGoogleLogin()">
                        <i class="fab fa-google text-danger"></i> <span>Đăng Nhập</span>
                    </button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-3">
                        <div id="userEmailDisplay" class="d-flex align-items-center gap-2 text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">
                            Admin
                        </div>
                        <button class="btn btn-danger fw-bold rounded-pill px-3" onclick="logoutAdmin()">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card" id="createCard">
            <h2>Bắt Đầu Tạo Album Ảnh</h2>
            <div id="statusAlert" class="alert-custom alert-locked" style="display: none;"></div>

            <div class="form-group">
                <label><i class="fab fa-google-drive me-2 text-success"></i>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off">
            </div>

            <div class="switch-group">
                <div class="switch-label"><span>Cho phép tải xuống</span></div>
                <label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label>
            </div>
            
            <button class="btn-create" id="btnCreate" onclick="createAlbum()">
                <i class="fas fa-magic"></i> Tạo Album Ngay
            </button>
        </div>
    </div>
    
    <div id="copyNotification">Đã sao chép link!</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com',
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback', 
            SCOPE: 'openid profile email' 
        };

        // ⭐ HÀM QUAN TRỌNG: BUỘC LÀM MỚI (RELGIN GIẢ) ĐỂ LẤY NGÀY CHUẨN TỪ SHEET
        function triggerStatusRefresh(email) {
            const redirectUrl = window.location.origin + window.location.pathname;
            let refreshApiUrl = `${GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI}?action=check_status&email=${encodeURIComponent(email)}&redirect_to=${encodeURIComponent(redirectUrl)}`;
            
            // Xóa dữ liệu cũ để tránh xung đột
            localStorage.removeItem('admin_status');
            localStorage.removeItem('admin_expiry');
            
            window.location.href = refreshApiUrl;
        }

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            
            const isGoogleLogin = urlParams.get('auth_status') === 'success';
            const isPaymentSuccess = urlParams.get('auth_status') === 'payment_success';
            const newEmail = urlParams.get('user_email'); 

            // Nếu vừa thanh toán hoặc vừa đăng nhập -> Kích hoạt Refresh ngay để lấy ngày từ Sheet
            if ((isGoogleLogin || isPaymentSuccess) && newEmail) {
                localStorage.setItem('admin_email', newEmail);
                if (isGoogleLogin) localStorage.setItem('admin_is_logged_in', 'true');
                
                // Lưu tên/avatar nếu có
                const name = urlParams.get('user_name');
                const avatar = urlParams.get('user_avatar');
                if (name) localStorage.setItem('admin_name', decodeURIComponent(name));
                if (avatar) localStorage.setItem('admin_avatar', decodeURIComponent(avatar));

                history.replaceState(null, null, window.location.pathname);
                triggerStatusRefresh(newEmail);
                return;
            }

            // Nhận dữ liệu CHUẨN sau khi Refresh
            const statusFromN8n = urlParams.get('user_status');
            const expiryFromN8n = urlParams.get('user_expiry');

            if (statusFromN8n && expiryFromN8n && newEmail) {
                localStorage.setItem('admin_status', statusFromN8n);
                localStorage.setItem('admin_expiry', expiryFromN8n.toString());
                localStorage.setItem('admin_email', newEmail);
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function formatTimestamp(timestamp) {
            let tsNumber = Number(timestamp);
            if (!tsNumber || tsNumber <= Date.now()) return 'Đã hết hạn';
            let date = new Date(tsNumber);
            // Sửa lỗi hiển thị 2035 cục bộ (bù trừ 10 năm)
            if (date.getFullYear() >= 2035) date = new Date(tsNumber - 315576000000);
            return date.toLocaleString('vi-VN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const email = localStorage.getItem('admin_email');
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const name = localStorage.getItem('admin_name') || 'Admin';

            if (isLoggedIn && email) {
                document.getElementById('adminNavLinks').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userControl').style.display = 'flex';
                
                const isAllowed = (status === 'active' && expiry > Date.now());
                const statusAlert = document.getElementById('statusAlert');
                const btnCreate = document.getElementById('btnCreate');

                if (isAllowed) {
                    statusAlert.style.display = 'none';
                    btnCreate.disabled = false;
                } else {
                    statusAlert.style.display = 'flex';
                    statusAlert.innerHTML = `<i class="fas fa-lock text-danger fa-lg"></i> <span>Tài khoản hết hạn/chưa kích hoạt. <a href="payment.html">Gia hạn</a></span>`;
                    btnCreate.disabled = true;
                }
                
                const avatar = localStorage.getItem('admin_avatar');
                let img = avatar ? `<img src="${avatar}" class="user-avatar me-1">` : `<i class="fas fa-user-circle me-1"></i>`;
                document.getElementById('userEmailDisplay').innerHTML = `${img} ${name} <span class="status-badge ${isAllowed?'badge-active':'badge-expired'}">${formatTimestamp(expiry)}</span>`;
            }
        }

        function startGoogleLogin() {
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(GOOGLE_CONFIG.SCOPE)}&access_type=offline&prompt=consent`;
        }

        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }

        window.onload = checkAuthCallback;
    </script>
</body>
</html>
