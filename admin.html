<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Album - Chọn Ảnh</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --accent-color: #51ff7d; --bg-dark: #1a1a1a; }
        body { background-color: var(--bg-dark); font-family: 'Nunito', sans-serif; color: white; padding-top: 80px; min-height: 100vh; }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .navbar-brand { font-weight: 800; text-transform: uppercase; }
        
        /* USER INFO ĐỒNG BỘ */
        .user-status-box { background-color: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .user-avatar-circle { width: 32px; height: 32px; background: #333; color: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 2px solid var(--accent-color); overflow: hidden; }
        .user-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: white; }
        .bg-active { background-color: #198754; }

        .form-container { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .input-group-custom { margin-bottom: 20px; }
        .input-group-custom label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--accent-color); }
        .form-control { background: rgba(0,0,0,0.3); border: 1px solid #444; color: white; border-radius: 10px; padding: 12px; }
        .form-control:focus { background: rgba(0,0,0,0.5); border-color: var(--accent-color); color: white; box-shadow: none; }
        
        /* BẢNG KẾT QUẢ SAO CHÉP */
        #resultArea { margin-top: 25px; display: none; background: rgba(81, 255, 125, 0.1); padding: 20px; border-radius: 15px; border: 1px dashed var(--accent-color); }
        .link-box { background: #000; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; word-break: break-all; margin: 10px 0; border: 1px solid #333; }
        
        .btn-create { background: linear-gradient(135deg, #198754, #147a30); border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 1.1rem; transition: 0.3s; }
        .btn-create:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(25, 135, 84, 0.4); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-magic me-2"></i>Studio LNP</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                </ul>
                <div id="authControl" style="display: none;" class="align-items-center gap-3">
                    <div class="user-status-box">
                        <div class="user-avatar-circle" id="userAvatarPlaceholder"></div>
                        <div>
                            <div class="fw-bold" id="userNameDisplay">Admin</div>
                            <div style="font-size: 0.7rem; color: #ddd;"><span id="badgeStatus" class="status-badge bg-active">ACTIVE</span></div>
                        </div>
                    </div>
                    <button onclick="logoutAdmin()" class="btn btn-danger rounded-pill px-3 py-1"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container shadow-lg">
            <h2 class="text-center mb-4"><i class="fas fa-folder-plus me-2"></i>Tạo Album Mới</h2>
            
            <div class="input-group-custom">
                <label>Tên Album (Ví dụ: Tiệc Cưới Anh A - Chị B)</label>
                <input type="text" id="albumName" class="form-control" placeholder="Nhập tên album...">
            </div>

            <div class="input-group-custom">
                <label>ID Thư mục Google Drive</label>
                <input type="text" id="folderId" class="form-control" placeholder="Dán ID thư mục vào đây...">
            </div>

            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">
                <i class="fas fa-rocket me-2"></i> BẮT ĐẦU TẠO ALBUM
            </button>

            <div id="resultArea">
                <div class="fw-bold text-success mb-2"><i class="fas fa-check-circle me-2"></i>Album đã tạo thành công!</div>
                <div class="text-light small">Tên album: <strong id="resName" class="text-warning"></strong></div>
                <div class="link-box" id="resLink"></div>
                <button class="btn btn-sm btn-primary w-100 fw-bold" onclick="copyResultLink()">
                    <i class="fas fa-copy me-2"></i> SAO CHÉP LINK GỬI KHÁCH
                </button>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_CREATE = 'https://dichvufb.tino.page/webhook/create-album'; // Webhook tạo album của bạn
        const DOMAIN_CLIENT = 'https://phuoclam095-bot.github.io/chonanhtudong/client.html';

        async function handleCreateAlbum() {
            const name = document.getElementById('albumName').value.trim();
            const id = document.getElementById('folderId').value.trim();
            const btn = document.getElementById('btnCreate');

            if(!name || !id) return alert("Vui lòng nhập đầy đủ thông tin!");

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG XỬ LÝ...';
            
            try {
                const response = await fetch(WEBHOOK_CREATE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        folderName: name, 
                        folderId: id, 
                        adminEmail: localStorage.getItem('admin_email') 
                    })
                });

                if(response.ok) {
                    // ⭐ HIỂN THỊ KẾT QUẢ ĐỂ SAO CHÉP
                    const finalLink = `${DOMAIN_CLIENT}?id=${id}`;
                    document.getElementById('resName').innerText = name;
                    document.getElementById('resLink').innerText = finalLink;
                    document.getElementById('resultArea').style.display = 'block';
                    alert("✅ Tạo thành công!");
                } else { alert("❌ Lỗi server!"); }
            } catch (e) { alert("❌ Lỗi kết nối!"); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-rocket me-2"></i> BẮT ĐẦU TẠO ALBUM'; }
        }

        function copyResultLink() {
            const link = document.getElementById('resLink').innerText;
            navigator.clipboard.writeText(link).then(() => alert("✅ Đã sao chép link!"));
        }

        function updateHeaderUI() {
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                const name = localStorage.getItem('admin_name'), avatar = localStorage.getItem('admin_avatar');
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}">` : name.charAt(0).toUpperCase();
                document.getElementById('authControl').style.display = 'flex';
            } else { window.location.href = 'admin.html'; }
        }

        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        document.addEventListener('DOMContentLoaded', updateHeaderUI);
    </script>
</body>
</html>
