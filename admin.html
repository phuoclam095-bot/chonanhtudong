<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaoAnhNhanh.vn - Admin Professional</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0;
            --bg-deep: #050a14;
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg-deep);
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 1) 0%, rgba(5, 10, 20, 0.6) 30%, rgba(5, 10, 20, 0.9) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; padding-top: 100px;
        }

        /* ================= NAVBAR & TABS ================= */
        .navbar { 
            background: linear-gradient(to bottom, var(--bg-deep) 0%, rgba(5, 10, 20, 0.8) 100%);
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .navbar-brand img { height: 50px; }

        .nav-link { 
            color: #94a3b8 !important; font-weight: 700; font-size: 0.85rem;
            text-transform: uppercase; padding: 10px 12px !important;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary) !important; }

        /* ================= LOGIN VIP RAINBOW ================= */
        @keyframes rainbow-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .btn-login-vip-rainbow {
            position: relative; padding: 2px; border-radius: 50px;
            background: var(--rainbow); background-size: 200% auto;
            animation: rainbow-move 3s linear infinite; border: none;
        }
        .btn-login-inner {
            background: #fff; color: #000; font-weight: 900; border-radius: 50px;
            padding: 6px 18px; display: block; font-size: 0.8rem;
        }

        .user-pill {
            background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px; border: 1px solid var(--primary);
        }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; }

        /* ================= CARD THIẾT LẬP CHI TIẾT ================= */
        .main-container { padding: 20px; display: flex; justify-content: center; }
        .rainbow-border-wrapper {
            position: relative; padding: 3px; border-radius: 35px;
            background: var(--rainbow); background-size: 200% auto;
            animation: rainbow-move 6s linear infinite;
            max-width: 650px; width: 100%; box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }
        .create-card { background: #080d1a; border-radius: 32px; padding: 40px; }

        /* INPUT STYLE */
        .label-highlight {
            color: #ffffff !important; font-weight: 800; font-size: 0.85rem;
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
            text-transform: uppercase;
        }
        .form-control-luxury {
            width: 100%; padding: 14px 20px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; 
            color: #fff; font-size: 0.95rem; margin-bottom: 20px; transition: 0.3s;
        }
        .form-control-luxury:focus { border-color: var(--primary); outline: none; background: #000; }

        .btn-create-vip {
            width: 100%; padding: 18px; border: none; border-radius: 18px;
            background: var(--primary); color: #000; font-weight: 900;
            font-size: 1.1rem; text-transform: uppercase; margin-top: 10px;
        }

        /* AI & HEARTBEAT */
        .ai-zone { margin-top: 25px; text-align: center; }
        .heartbeat-sync {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--primary); font-weight: 800; font-size: 0.7rem;
            text-transform: uppercase; animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); opacity: 0.6; } 20% { transform: scale(1.05); opacity: 1; } }

        @media (max-width: 991px) { .nav-remind { display: none; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="#">
                <img src="https://i.ibb.co/C3L2Ch5Z/logo.png" alt="Logo">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" href="admin.html">Tạo Album</a></li>
                    <li class="nav-item"><a class="nav-link" href="manage.html">Quản Lý</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Gia Hạn</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Liên Hệ</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div id="loggedOutNav">
                        <div class="btn-login-vip-rainbow" onclick="startGoogleLogin()">
                            <span class="btn-login-inner">LOGIN VIP</span>
                        </div>
                    </div>
                    <div id="loggedInNav" style="display: none;" class="align-items-center gap-2">
                        <div class="user-pill" id="userEmailDisplay"></div>
                        <button class="btn btn-link text-danger p-0 ms-1" onclick="logoutAdmin()">
                            <i class="fas fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="rainbow-border-wrapper">
            <div class="create-card">
                <h2 class="fw-900 text-center mb-4">Thiết Lập Album VIP</h2>
                
                <div class="row">
                    <div class="col-md-6">
                        <label class="label-highlight"><i class="fas fa-image"></i> Link Ảnh Tải Lên</label>
                        <input type="text" class="form-control-luxury" id="imageLink" placeholder="Link ảnh hoặc Folder...">
                    </div>
                    <div class="col-md-6">
                        <label class="label-highlight"><i class="fas fa-copyright"></i> Link Logo Brand</label>
                        <input type="text" class="form-control-luxury" id="logoLink" placeholder="Link ảnh logo của bạn...">
                    </div>
                </div>

                <label class="label-highlight"><i class="fas fa-list-ol"></i> Giới hạn số lượng ảnh</label>
                <input type="text" class="form-control-luxury" id="limitCount" placeholder="Ví dụ: 50, 100 hoặc Không giới hạn">

                <label class="label-highlight"><i class="fab fa-google-drive"></i> Link Thư Mục Google Drive</label>
                <input type="text" class="form-control-luxury" id="driveLink" placeholder="Dán link folder drive của bạn...">

                <button class="btn-create-vip" id="btnCreate" onclick="handleAction()">
                    KHỞI TẠO ALBUM NGAY
                </button>

                <div class="ai-zone">
                    <div class="heartbeat-sync">
                        <i class="fas fa-robot"></i> AI INTEGRATED - ĐỒNG BỘ 1-5 GIÂY
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startGoogleLogin() {
            const loginPath = "https://dichvufb.tino.page/webhook/google-oauth-callback";
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com&redirect_uri=${encodeURIComponent(loginPath)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`;
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_name', params.get('user_name'));
                localStorage.setItem('admin_avatar', params.get('user_avatar'));
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            if (isLoggedIn) {
                document.getElementById('loggedOutNav').style.display = 'none';
                document.getElementById('loggedInNav').style.display = 'flex';
                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar') || '';
                document.getElementById('userEmailDisplay').innerHTML = `<img src="${avatar}" class="user-avatar"> <span class="fw-bold small">${name}</span>`;
            }
        }

        function logoutAdmin() { localStorage.clear(); window.location.reload(); }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthCallback();
            updateUI();
        });
    </script>
</body>
</html>
