<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS GIAO DIỆN GỐC - GIỮ NGUYÊN 100% */
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-color); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        .form-group { margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; }
        .preview-box { border: 2px dashed #c3e6cb; background-color: #f0fff4; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        #finalLinkBox { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy-link { background: #fff; color: var(--primary-green); border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; }
        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .badge-active { background: #d1e7dd; color: #0f5132; }
        .badge-expired { background: #f8d7da; color: #842029; }
        #chat-widget-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-camera me-2"></i>Tạo Album</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="feedback.html" class="nav-link">Góp Ý</a></li>
                </ul>
                <div class="ms-auto d-flex align-items-center">
                    <button id="loginBtn" class="btn btn-light rounded-pill px-4 fw-bold" onclick="startGoogleLogin()">Đăng Nhập</button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-3">
                        <div id="userEmailDisplay" class="text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10">Admin</div>
                        <button class="btn btn-danger rounded-pill px-3" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Bắt Đầu Tạo Album Ảnh</h2>
            <div id="statusAlert" class="alert alert-warning" style="display: none;"></div>
            <div class="form-group">
                <label>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/...">
            </div>
            
            <div id="previewBox" class="preview-box">
                <p>Tên Album: <span id="previewFolderName" class="text-success fw-bold">...</span></p>
                <div id="finalLinkBox">
                    <a href="#" id="previewClientLink" target="_blank" style="color:white; text-decoration:underline">...</a>
                    <button class="btn-copy-link" onclick="copyFinalLink()">Copy</button>
                </div>
            </div>

            <div class="switch-group">
                <span>Cho phép tải xuống</span>
                <label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label>
            </div>
            <div class="switch-group">
                <span>Cho phép bình luận</span>
                <label class="toggle-switch"><input type="checkbox" id="allowComment" checked><span class="slider"></span></label>
            </div>
            <div class="switch-group">
                <span>Giới hạn số ảnh</span>
                <label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label>
            </div>
            
            <button class="btn-create" id="btnCreate" onclick="createAlbum()"><i class="fas fa-magic"></i> Tạo Album Ngay</button>
        </div>
    </div>

    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com',
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback'
        };

        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('user_status');
            const expiry = urlParams.get('user_expiry'); 
            const email = urlParams.get('user_email'); 
            const isGoogleLogin = urlParams.get('auth_status') === 'success';

            if (status && expiry && email) {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', email);
                localStorage.setItem('admin_expiry', expiry);
                localStorage.setItem('admin_status', status);
                history.replaceState(null, null, window.location.pathname);
            } else if (isGoogleLogin && email) {
                forceRefreshStatus(email);
                return;
            }
            updateUI();
        }

        function forceRefreshStatus(email) {
            const redirectUrl = window.location.origin + window.location.pathname;
            window.location.href = `${GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI}?action=check_status&email=${encodeURIComponent(email)}&redirect_to=${encodeURIComponent(redirectUrl)}`;
        }

        function formatTimestamp(timestamp) {
            const tsNumber = parseInt(timestamp); 
            if (!tsNumber || tsNumber <= Date.now()) return 'Đã hết hạn';
            let date = new Date(tsNumber);
            if (date.getFullYear() >= 2035) date = new Date(tsNumber - 315576000000);
            return date.toLocaleString('vi-VN');
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const email = localStorage.getItem('admin_email');
            const status = localStorage.getItem('admin_status');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;

            if (isLoggedIn && email) {
                document.getElementById('adminNavLinks').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userControl').style.display = 'flex';
                const isAllowed = (status === 'active' && expiry > Date.now());
                document.getElementById('userEmailDisplay').innerHTML = `${email.split('@')[0]} <span class="status-badge ${isAllowed?'badge-active':'badge-expired'}">${formatTimestamp(expiry)}</span>`;
                document.getElementById('btnCreate').disabled = !isAllowed;
            }
        }

        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }
        
        async function createAlbum() {
            const driveLink = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...'; btn.disabled = true;
            // Logic fetch album giữ nguyên như bản gốc của bạn...
            setTimeout(() => { btn.innerHTML = '<i class="fas fa-magic"></i> Tạo Album Ngay'; btn.disabled = false; }, 2000);
        }

        window.onload = checkAuthCallback;
    </script>
</body>
</html>
