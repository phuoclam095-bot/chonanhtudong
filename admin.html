<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --bg-dark: #1a1a1a; --accent-color: #51ff7d; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 40px 40px; background-position: 0 0, 20px 20px; min-height: 100vh; padding-top: 75px; overflow-x: hidden; }
        
        /* NAVBAR MOBILE OPTIMIZED */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 15px rgba(0,0,0,0.3); height: 65px; }
        .navbar-brand { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; }
        .user-status-box { background: rgba(255,255,255,0.15); border-radius: 50px; padding: 4px 10px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .user-avatar-circle { width: 32px; height: 32px; background: #333; border: 2px solid var(--accent-color); border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .status-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: 800; background: #198754; color: white; }

        .main-container { padding: 15px; display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); }
        .create-card { background: #fff; width: 100%; max-width: 450px; border-radius: 25px; padding: 25px 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { font-weight: 900; color: var(--primary-green); font-size: 1.4rem; text-transform: uppercase; margin-bottom: 20px; }
        .heartbeat-effect { color: #d63031; font-weight: 900; animation: heartbeat 1.5s infinite; display: inline-block; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .premium-input-group label { display: block; margin-bottom: 8px; font-weight: 800; color: var(--primary-green); font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 15px; font-weight: 700; text-align: center; transition: 0.3s; font-size: 0.9rem; }
        input[type="text"]:focus { border-color: var(--primary-green); outline: none; }

        /* PREVIEW BOX - TÊN ALBUM NHỎ LẠI */
        .preview-box { border: 2px dashed var(--primary-green); background: #f0fff4; padding: 15px; border-radius: 18px; margin: 15px 0; display: none; }
        #resFolderName { font-size: 1.1rem; font-weight: 800; color: #111; display: block; margin: 5px 0; }
        #finalLinkBox { background: #000; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        #finalLinkBox a { color: var(--accent-color); font-size: 0.75rem; text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
        .btn-copy-small { background: var(--primary-green); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }

        .switch-group { display: flex; align-items: center; margin-bottom: 10px; justify-content: space-between; font-weight: 800; font-size: 0.85rem; color: #444; }
        .toggle-switch { position: relative; width: 42px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #cbd5e0; border-radius: 34px; transition: 0.4s; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.4s; }
        input:checked + .slider { background: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 8px 20px rgba(20, 122, 48, 0.2); font-size: 1rem; margin-top: 10px; }
        .btn-locked { background: #94a3b8 !important; pointer-events: none; }

        /* FIX CHAT AI MOBILE */
        #chat-widget-container { position: fixed; bottom: 15px; right: 15px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
        #chat-greeting-bubble { visibility: hidden; opacity: 0; position: absolute; bottom: 10px; right: 65px; background: white; padding: 10px 15px; border-radius: 15px; border-bottom-right-radius: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-size: 0.8rem; font-weight: 800; border: 2px solid var(--accent-color); white-space: nowrap; transition: 0.5s; z-index: 10000; }
        #chat-greeting-bubble.show { visibility: visible; opacity: 1; }
        #chat-box { display: none; position: absolute; bottom: 70px; right: 0; width: 300px; height: 380px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; flex-direction: column; border: 1px solid #eee; }
        .chat-header { background: linear-gradient(to right, #147a30, #0e5a22); color: white; padding: 12px 15px; font-weight: 800; font-size: 0.8rem; display: flex; justify-content: space-between; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #f8fafc; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
        .message { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-weight: 600; }
        .bot-msg { background: #fff; border: 1px solid #e2e8f0; align-self: flex-start; }
        .user-msg { background: var(--primary-green); color: white; align-self: flex-end; }
        
        #copyToast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 8px 20px; border-radius: 50px; font-weight: 800; font-size: 0.8rem; display: none; z-index: 10001; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li> 
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div id="userControl" style="display: none !important;" class="ms-auto align-items-center gap-2">
                    <div class="user-status-box">
                        <div class="user-avatar-circle" id="userAvatarPlaceholder"></div>
                        <div class="d-flex flex-column text-white" style="line-height:1.1">
                            <span id="userNameDisplay" class="fw-bold" style="font-size:0.8rem;">Admin</span>
                            <span id="userExpiryText" style="font-size:0.6rem; opacity:0.8;">Hạn: ...</span>
                        </div>
                    </div>
                    <button onclick="logoutAdmin()" class="btn btn-sm btn-danger rounded-pill px-2"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Mới</h2>
            <div id="welcomeArea" class="welcome-msg" style="display: none; font-size: 0.8rem; color: #666; margin-bottom: 15px;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                <div class="heartbeat-effect mt-1">NHANH - GỌN - CHÍNH XÁC</div>
            </div>
            <div class="premium-input-group">
                <input type="text" id="driveLink" placeholder="Dán link thư mục Google Drive...">
            </div>
            <div id="previewBox" class="preview-box">
                <small class="fw-bold text-secondary">THÀNH CÔNG!</small>
                <strong id="resFolderName">...</strong>
                <div id="finalLinkBox">
                    <a href="#" id="resClientLink" target="_blank">...</a>
                    <button class="btn-copy-small" onclick="copyResultLink()">COPY</button>
                </div>
            </div>
            <div class="switch-group"><span>Cho phép tải ảnh</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Chèn Watermark</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn ảnh</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">Tạo Album Ngay</button>
            <div id="centralLoginArea" class="mt-4" style="display: none;">
                <button class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">Đăng nhập Google</button>
            </div>
        </div>
    </div>

    <div id="chat-widget-container">
        <div id="chat-greeting-bubble">...</div>
        <button id="chat-toggle-btn" onclick="toggleChat()"><i class="fas fa-robot fa-lg"></i></button>
        <div id="chat-box">
            <div class="chat-header"><span>TRỢ LÝ AI STUDIO LNP</span><button class="btn-close btn-close-white" onclick="toggleChat()" style="font-size:0.6rem"></button></div>
            <div id="chat-messages"></div>
            <div class="p-2 border-top"><input type="text" id="chat-input" class="form-control form-control-sm" placeholder="Hỏi AI..." onkeypress="if(event.key==='Enter') sendMessage()"></div>
        </div>
    </div>
    <div id="copyToast">✅ Đã copy link!</div>

    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };
        const URL_CREATE = 'https://dichvufb.tino.page/webhook/create-album-auto', URL_GET_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info', API_CHAT = 'https://dichvufb.tino.page/webhook/chat-admin';

        function playNotiSound() {
            const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
            audio.volume = 0.4; audio.play().catch(() => {});
        }

        async function handleCreateAlbum() {
            const link = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if (!link) return alert("Hãy dán link!");
            const folderIdMatch = link.match(/folders\/([a-zA-Z0-9_-]{20,})|id=([a-zA-Z0-9_-]{20,})/);
            const folderId = folderIdMatch ? (folderIdMatch[1] || folderIdMatch[2]) : (link.length > 20 ? link : null);
            if (!folderId) return alert("Link không hợp lệ!");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            try {
                await fetch(URL_CREATE, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ folderId, adminEmail: localStorage.getItem('admin_email'), settings: { download: document.getElementById('allowDownload').checked, logo: document.getElementById('allowLogo').checked, limit: document.getElementById('limitPhotos').checked } }) });
                const res = await fetch(`${URL_GET_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await res.json();
                if (data.clientLink) {
                    document.getElementById('resFolderName').innerText = data.folderName;
                    document.getElementById('resClientLink').href = data.clientLink;
                    document.getElementById('resClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                }
            } catch (e) { alert("Lỗi hệ thống!"); }
            finally { btn.innerHTML = 'Tạo Album Ngay'; btn.disabled = false; }
        }

        function updateUI() {
            const logged = localStorage.getItem('admin_is_logged_in') === 'true';
            const name = localStorage.getItem('admin_name') || 'Admin';
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            const avatar = localStorage.getItem('admin_avatar');

            document.getElementById('adminNavLinks').style.display = logged ? 'flex' : 'none';
            document.getElementById('userControl').setAttribute('style', logged ? 'display: flex !important;' : 'display: none !important;');
            document.getElementById('centralLoginArea').style.display = logged ? 'none' : 'block';

            if (logged) {
                document.getElementById('userNameDisplay').innerText = name;
                // SỬA LỖI AVATAR
                document.getElementById('userAvatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover;">` : `<b style="color:var(--accent-color)">${name.charAt(0)}</b>`;
                
                const canCreate = (localStorage.getItem('admin_status') === 'active' && expiry > Date.now());
                document.getElementById('btnCreate').className = canCreate ? 'btn-create' : 'btn-create btn-locked';
                document.getElementById('userExpiryText').innerText = `Hạn: ${new Date(expiry).toLocaleDateString('vi-VN')}`;
                
                if (!canCreate) {
                    document.getElementById('welcomeArea').style.display = 'block';
                    document.getElementById('welcomeUserName').innerText = name;
                }

                // AI CHÀO THEO TÊN + TIẾNG
                const bubble = document.getElementById('chat-greeting-bubble');
                bubble.innerText = `👋 Chào ${name.split(' ').pop()}, em giúp gì cho anh Phước ạ?`;
                setTimeout(() => { bubble.classList.add('show'); playNotiSound(); }, 3000);
            }
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', params.get('user_email'));
                localStorage.setItem('admin_name', decodeURIComponent(params.get('user_name')));
                localStorage.setItem('admin_avatar', decodeURIComponent(params.get('user_avatar')));
                localStorage.setItem('admin_expiry', params.get('user_expiry'));
                localStorage.setItem('admin_status', params.get('user_status'));
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function toggleChat() { const box = document.getElementById('chat-box'); box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; document.getElementById('chat-greeting-bubble').classList.remove('show'); }
        async function sendMessage() {
            const input = document.getElementById('chat-input'), msg = input.value.trim();
            if (!msg) return; appendMsg(msg, 'user'); input.value = '';
            try {
                const res = await fetch(API_CHAT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, email: localStorage.getItem('admin_email') }) });
                const data = await res.json(); appendMsg(data.output || "AI bận rồi!", 'bot');
            } catch (e) { appendMsg("Lỗi AI!", 'bot'); }
        }
        function appendMsg(t, s) {
            const container = document.getElementById('chat-messages'), d = document.createElement('div');
            d.className = `message ${s === 'user' ? 'user-msg' : 'bot-msg'}`; d.innerText = t;
            container.appendChild(d); container.scrollTop = container.scrollHeight;
        }
        function copyResultLink() { navigator.clipboard.writeText(document.getElementById('resClientLink').innerText).then(() => { const toast = document.getElementById('copyToast'); toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2000); }); }
        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.reload(); }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
