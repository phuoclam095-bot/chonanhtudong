<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaoAnhNhanh.vn - Hệ Thống Quản Trị Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0;
            --bg-overlay: rgba(5, 10, 20, 0.85);
            --border-width: 2px;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: #050a14;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; padding-top: 90px;
        }

        /* ================= NAVBAR & LOGO ================= */
        .navbar { 
            background: rgba(5, 10, 20, 0.9);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 85px;
        }
        .navbar-brand img { height: 50px; width: auto; }

        /* ================= HIỆU ỨNG RAINBOW GRADIENT CHẠY VÒNG ================= */
        @keyframes rotate-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= LOGIN AREA ================= */
        .login-wrapper { display: flex; align-items: center; gap: 15px; }
        .remind-text {
            font-size: 0.75rem; font-weight: 800;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rotate-gradient 5s ease infinite;
        }

        .btn-login-vip {
            background: #fff; color: #000; font-weight: 900; border-radius: 50px;
            padding: 10px 25px; border: none; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 20px rgba(0,235,176,0.4);
        }
        .btn-login-vip:hover { transform: scale(1.05); background: var(--primary); }

        /* ================= CARD THIẾT KẾ CẦU VỒNG ================= */
        .main-container { padding: 40px 20px; display: flex; justify-content: center; }
        
        /* Viền cầu vồng bao quanh Card */
        .rainbow-border {
            position: relative; padding: var(--border-width); border-radius: 32px;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%; animation: rotate-gradient 8s ease infinite;
            max-width: 600px; width: 100%;
        }

        .create-card { 
            background: #0a1120; border-radius: 30px; padding: 45px; 
            width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h2 { font-weight: 900; font-size: 2rem; margin-bottom: 40px; text-align: center; color: #fff; }

        /* Làm nổi bật nhãn Drive Link */
        .label-highlight {
            color: #fff !important; font-weight: 800; font-size: 0.95rem;
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        input[type="text"] { 
            width: 100%; padding: 18px 25px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; 
            color: #fff; font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: #000; }

        .btn-create-rainbow {
            width: 100%; padding: 20px; border: none; border-radius: 18px;
            background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000);
            background-size: 300% 300%; animation: rotate-gradient 4s ease infinite;
            color: #fff; font-weight: 900; font-size: 1.2rem;
            text-transform: uppercase; margin-top: 30px; transition: 0.3s;
        }
        .btn-create-rainbow:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* Thông tin User khi login */
        .user-pill {
            background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; border: 1px solid var(--primary);
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; }

        @media (max-width: 768px) {
            .remind-text { display: none; }
            .create-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5 px-3">
            <a class="navbar-brand" href="#">
                <img src="https://i.ibb.co/Cr14Xxd/Gemini-Generated-Image-q81wzkq81wzkq81w.png" alt="Logo TaoAnhNhanh">
            </a>
            
            <div class="ms-auto">
                <div id="loggedOutArea" class="login-wrapper">
                    <span class="remind-text">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG DỊCH VỤ</span>
                    <button class="btn-login-vip" onclick="startGoogleLogin()">
                        <i class="fab fa-google me-2 text-danger"></i> LOGIN VIP
                    </button>
                </div>

                <div id="loggedInArea" class="user-wrapper" style="display: none;">
                    <div class="user-pill" id="userEmailDisplay"></div>
                    <button class="btn btn-link text-danger ms-2 p-0" onclick="logoutAdmin()">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="rainbow-border">
            <div class="create-card">
                <h2>Thiết Lập Album VIP</h2>
                
                <div class="form-group mb-4">
                    <label class="label-highlight">
                        <i class="fab fa-google-drive" style="color: #34A853;"></i> LINK THƯ MỤC GOOGLE DRIVE
                    </label>
                    <input type="text" id="driveLink" placeholder="Dán link folder ảnh của bạn vào đây...">
                </div>

                <button class="btn-create-rainbow" id="btnCreate" onclick="createAlbum()">
                    <i class="fas fa-bolt me-2"></i> KHỞI TẠO ALBUM NGAY
                </button>

                <div class="mt-4 text-center">
                    <small class="text-white-50">Tự động đồng bộ ảnh siêu tốc 1-5 giây</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình chuyển hướng Google chính xác
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', 
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback', 
            SCOPE: 'openid profile email' 
        };

        function startGoogleLogin() {
            // Chuyển hướng chính xác theo cấu hình của bạn
            localStorage.setItem('current_admin_path', window.location.href.split('?')[0]);
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(GOOGLE_CONFIG.SCOPE)}&access_type=offline&prompt=consent`;
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            if (isLoggedIn) {
                document.getElementById('loggedOutArea').style.display = 'none';
                document.getElementById('loggedInArea').style.display = 'flex';
                
                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar') || '';
                document.getElementById('userEmailDisplay').innerHTML = `
                    <img src="${avatar}" class="user-avatar">
                    <span class="fw-bold">${name}</span>
                `;
                document.getElementById('btnCreate').disabled = false;
            } else {
                document.getElementById('loggedOutArea').style.display = 'flex';
                document.getElementById('loggedInArea').style.display = 'none';
                document.getElementById('btnCreate').disabled = true;
                document.getElementById('btnCreate').innerHTML = '<i class="fas fa-lock me-2"></i> VUI LÒNG ĐĂNG NHẬP';
            }
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.reload();
        }

        // Logic tạo Album (Tích hợp lại các API của bạn)
        async function createAlbum() {
            const link = document.getElementById('driveLink').value;
            if(!link) return alert("Vui lòng dán link Drive!");
            // ... Call API n8n của bạn ở đây
            alert("Đang khởi tạo album từ link: " + link);
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
