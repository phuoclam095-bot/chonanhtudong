<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaoAnhNhanh.vn - Luxury Admin VIP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0;
            --bg-deep: #020617;
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg-deep);
            /* GIỮ NGUYÊN ẢNH NỀN 7 SAO CÓ CHIỀU SÂU */
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 0.7) 30%, rgba(2, 6, 23, 0.9) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; padding-top: 100px;
        }

        /* ================= NAVBAR HÒA QUYỆN ================= */
        .navbar { 
            background: linear-gradient(to bottom, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 0.5) 100%);
            backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.03);
            height: 90px;
        }
        /* LOGO MỚI CỦA BẠN */
        .navbar-brand img { height: 65px; transition: 0.4s; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .navbar-brand img:hover { transform: scale(1.05); }

        /* ================= LOGIN VIP RAINBOW (GÓC PHẢI) ================= */
        @keyframes rainbow-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .btn-login-vip-rainbow {
            position: relative; padding: 2px; border-radius: 50px;
            background: var(--rainbow); background-size: 200% auto;
            animation: rainbow-move 3s linear infinite;
            border: none; cursor: pointer; display: inline-block;
        }
        .btn-login-inner {
            background: #fff; color: #000; font-weight: 900; border-radius: 50px;
            padding: 7px 22px; display: block; font-size: 0.85rem; transition: 0.3s;
        }
        .btn-login-vip-rainbow:hover .btn-login-inner { background: #000; color: #fff; }
        .btn-login-vip-rainbow::after {
            content: ""; position: absolute; inset: -3px; border-radius: 50px;
            background: var(--rainbow); background-size: 200% auto;
            filter: blur(10px); opacity: 0.6; z-index: -1;
            animation: rainbow-move 3s linear infinite;
        }

        /* ================= CARD CHÍNH ================= */
        .main-container { padding: 40px 20px; display: flex; justify-content: center; }
        .rainbow-card-wrapper {
            position: relative; padding: 3px; border-radius: 35px;
            background: var(--rainbow); background-size: 200% auto;
            animation: rainbow-move 6s linear infinite;
            max-width: 580px; width: 100%;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }
        .create-card { 
            background: #080d1a; border-radius: 32px; padding: 50px; width: 100%;
        }

        /* ================= INPUT & LABEL ================= */
        .label-highlight {
            color: #ffffff !important; font-weight: 900; font-size: 1rem;
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        input[type="text"] { 
            width: 100%; padding: 20px 25px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; 
            color: #fff; font-size: 1.1rem; transition: 0.3s;
        }

        /* ================= VÙNG NHẮC NHỞ DƯỚI LINK ================= */
        .auth-reminder-zone {
            margin-top: 25px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .lock-status {
            font-size: 1.8rem; color: var(--primary); 
            filter: drop-shadow(0 0 10px var(--primary)); margin-bottom: 5px;
        }
        .remind-text-luxury {
            font-size: 0.85rem; font-weight: 800;
            background: var(--rainbow); background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rainbow-move 5s linear infinite;
            letter-spacing: 0.5px;
        }

        /* ================= NÚT KHỞI TẠO ================= */
        .btn-create-luxury {
            width: 100%; padding: 20px; border: none; border-radius: 20px;
            background: var(--primary); color: #000; font-weight: 900;
            font-size: 1.1rem; text-transform: uppercase; transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0,235,176,0.3);
            display: none;
        }
        .btn-create-luxury:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0,235,176,0.5); }

        /* ================= HEARTBEAT SYNC ================= */
        .heartbeat-sync {
            display: inline-flex; align-items: center; gap: 10px;
            color: var(--primary); font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 2px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-top: 30px; opacity: 0.8;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            15%, 45% { transform: scale(1.08); opacity: 1; }
        }

        .user-pill {
            background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 12px; border: 1px solid var(--primary);
        }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; }

        @media (max-width: 768px) { .nav-remind { display: none; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5 px-3">
            <a class="navbar-brand" href="#">
                <img src="https://i.ibb.co/C3L2Ch5Z/logo.png" alt="TaoAnhNhanh Logo">
            </a>
            
            <div class="ms-auto">
                <div id="loggedOutNav" class="d-flex align-items-center gap-3">
                    <span class="nav-remind small fw-bold text-white-50">PRIVATE ACCESS</span>
                    <div class="btn-login-vip-rainbow" onclick="startGoogleLogin()">
                        <span class="btn-login-inner">LOGIN VIP</span>
                    </div>
                </div>

                <div id="loggedInNav" class="user-wrapper" style="display: none;">
                    <div class="user-pill" id="userEmailDisplay"></div>
                    <button class="btn btn-link text-danger ms-2 p-0" onclick="logoutAdmin()">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="rainbow-card-wrapper">
            <div class="create-card">
                <h2 class="fw-900 text-center mb-5">Thiết Lập Album VIP</h2>
                
                <div class="form-group mb-4">
                    <label class="label-highlight">
                        <i class="fab fa-google-drive"></i> LINK THƯ MỤC GOOGLE DRIVE
                    </label>
                    <input type="text" id="driveLink" placeholder="Dán link folder ảnh của bạn...">
                </div>

                <div id="authReminder" class="auth-reminder-zone">
                    <i class="fas fa-lock lock-status"></i>
                    <span class="remind-text-luxury">VUI LÒNG ĐĂNG NHẬP ĐỂ SỬ DỤNG DỊCH VỤ</span>
                </div>

                <button class="btn-create-luxury" id="btnCreate" onclick="createAlbum()">
                    <i class="fas fa-bolt me-2"></i> KHỞI TẠO ALBUM NGAY
                </button>

                <div class="text-center">
                    <div class="heartbeat-sync">
                        <i class="fas fa-sync-alt"></i> Đồng bộ ảnh 1-5 giây
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startGoogleLogin() {
            const loginPath = "https://dichvufb.tino.page/webhook/google-oauth-callback";
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com&redirect_uri=${encodeURIComponent(loginPath)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`;
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_name', params.get('user_name'));
                localStorage.setItem('admin_avatar', params.get('user_avatar'));
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const reminder = document.getElementById('authReminder');
            const btn = document.getElementById('btnCreate');

            if (isLoggedIn) {
                document.getElementById('loggedOutNav').style.display = 'none';
                document.getElementById('loggedInNav').style.display = 'flex';
                reminder.style.display = 'none';
                btn.style.display = 'block';
                
                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar') || '';
                document.getElementById('userEmailDisplay').innerHTML = `<img src="${avatar}" class="user-avatar"><span class="fw-bold ms-2">${name}</span>`;
            } else {
                document.getElementById('loggedOutNav').style.display = 'flex';
                document.getElementById('loggedInNav').style.display = 'none';
                reminder.style.display = 'flex';
                btn.style.display = 'none';
            }
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthCallback();
            updateUI();
        });
    </script>
</body>
</html>
