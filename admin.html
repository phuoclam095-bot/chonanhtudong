<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tạo Album Ảnh Premium - ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #00ebb0;
            --primary-rgb: 0, 235, 176;
            --bg-body: #05070a;
            --bg-card: #0f121a;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --nav-height: 75px;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body);
            color: var(--text-main); min-height: 100vh;
            padding-top: var(--nav-height);
            /* Giảm bớt gradient phức tạp để khử lag */
            background-image: radial-gradient(circle at top right, rgba(0, 235, 176, 0.05), transparent);
        }

        /* ================= NAVBAR TỐI ƯU ================= */
        .navbar { 
            background: rgba(5, 7, 10, 0.95);
            border-bottom: 1px solid var(--border);
            height: var(--nav-height);
        }
        .navbar-brand img { height: 42px; width: auto; transition: 0.3s; }
        
        .nav-link { 
            color: var(--text-dim) !important; font-weight: 600; font-size: 0.85rem;
            padding: 8px 15px !important; border-radius: 10px;
        }
        .nav-link.active { color: var(--primary) !important; background: rgba(var(--primary-rgb), 0.1); }

        /* SỬA LỖI KHỐI ĐĂNG XUẤT */
        .user-control-wrapper {
            display: flex; align-items: center; gap: 12px;
        }
        .user-pill {
            display: flex; align-items: center; gap: 8px;
            background: #1a1f2b; padding: 5px 12px;
            border-radius: 50px; border: 1px solid var(--border);
            font-size: 0.85rem; font-weight: 600; white-space: nowrap;
        }
        .user-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
        .logout-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; display: flex; align-items: center; 
            justify-content: center; background: transparent; transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); transform: rotate(90deg); }

        /* ================= CARD CHÍNH & HIỆU ỨNG TÀI KHOẢN MỚI ================= */
        .main-container { padding: 40px 20px; display: flex; justify-content: center; }
        
        .create-card { 
            background: var(--bg-card);
            width: 100%; max-width: 580px; 
            border-radius: 24px; padding: 40px; 
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
        }

        /* HIỆU ỨNG CHẠY VIỀN CHO TÀI KHOẢN MỚI (NEW/EXPIRED) */
        .card-vip-glow::before {
            content: ""; position: absolute; inset: -2px;
            border-radius: 26px; padding: 2px;
            background: linear-gradient(45deg, var(--primary), transparent, #0099ff, var(--primary));
            background-size: 400% 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: moveGlow 4s linear infinite;
            z-index: -1;
        }
        @keyframes moveGlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        h2 { font-weight: 800; font-size: 1.75rem; text-align: center; margin-bottom: 35px; }

        .form-group label { color: var(--text-dim); font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; display: block; }
        input[type="text"] { 
            width: 100%; padding: 15px 20px; background: #080a0f;
            border: 1px solid var(--border); border-radius: 14px; 
            color: #fff; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.1); }

        .switch-group { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 18px; background: rgba(255,255,255,0.02);
            border-radius: 14px; margin-bottom: 15px; border: 1px solid transparent;
            transition: 0.3s;
        }
        .switch-group:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }

        /* BUTTON CẢI TIẾN - GIẢM LAG ANIMATION */
        .btn-create { 
            background: var(--primary); color: #000;
            border: none; padding: 18px; border-radius: 16px;
            width: 100%; font-weight: 800; margin-top: 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-create:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(var(--primary-rgb), 0.4); }
        .btn-create:disabled { background: #1e293b; color: #475569; }

        /* ALERT SANG TRỌNG */
        .alert-custom {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; padding: 15px; border-radius: 14px; margin-bottom: 25px;
            display: flex; align-items: center; gap: 12px; font-size: 0.85rem;
        }
        .alert-custom a { color: #fff; font-weight: 700; text-decoration: underline; }

        .status-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 6px; font-weight: 800; }
        .badge-active { background: var(--primary); color: #000; }
        .badge-expired { background: #ef4444; color: #fff; }

        #copyNotification { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #000; padding: 10px 25px;
            border-radius: 50px; font-weight: 700; z-index: 9999;
            opacity: 0; transition: 0.3s; pointer-events: none;
        }
        #copyNotification.active { opacity: 1; top: 40px; }

        @media (max-width: 991px) {
            .navbar { height: auto; padding: 10px 0; }
            .navbar-collapse { background: var(--bg-card); padding: 20px; margin-top: 10px; border-radius: 15px; }
            .user-control-wrapper { margin-top: 15px; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5 px-3">
            <a class="navbar-brand" href="#">
                <img src="https://i.ibb.co/Cr14Xxd/Gemini-Generated-Image-q81wzkq81wzkq81w.png" alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">Gia Hạn</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                </ul>
                <div class="user-control-wrapper ms-auto">
                    <button id="loginBtn" class="btn btn-light btn-sm fw-bold px-3 rounded-pill" onclick="startGoogleLogin()">
                        <i class="fab fa-google me-2 text-danger"></i> Đăng nhập
                    </button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-2">
                        <div class="user-pill" id="userEmailDisplay">
                            </div>
                        <button class="logout-btn" onclick="logoutAdmin()" title="Đăng xuất">
                            <i class="fas fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card" id="createCard">
            <h2>Thiết Lập Album</h2>
            
            <div id="statusAlert" class="alert-custom" style="display: none;"></div>

            <div class="form-group mb-4">
                <label>LINK THƯ MỤC GOOGLE DRIVE</label>
                <input type="text" id="driveLink" placeholder="Dán đường dẫn thư mục ảnh của bạn..." autocomplete="off">
            </div>

            <div class="row g-3">
                <div class="col-12"><div class="switch-group"><span>Cho phép tải xuống</span><label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label></div></div>
                <div class="col-12"><div class="switch-group"><span>Bật bình luận ảnh</span><label class="toggle-switch"><input type="checkbox" id="allowComment" checked><span class="slider"></span></label></div></div>
            </div>
            
            <button class="btn-create" id="btnCreate" onclick="createAlbum()">
                <i class="fas fa-bolt me-2"></i> Kích Hoạt Ngay
            </button>

            <div class="mt-4 text-center" style="font-size: 0.75rem; color: var(--text-dim);">
                <i class="fas fa-sync-alt fa-spin me-2 text-primary"></i> Tự động đồng bộ ảnh sau 1-5 giây.
            </div>
        </div>
    </div>

    <div id="copyNotification">Đã sao chép liên kết!</div>

    <script>
        // --- LOGIC GIỮ NGUYÊN VÀ TỐI ƯU HIỆU ỨNG ---
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', 
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback', 
            SCOPE: 'openid profile email' 
        };

        function startGoogleLogin() {
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(GOOGLE_CONFIG.SCOPE)}&access_type=offline&prompt=consent`;
        }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            const status = localStorage.getItem('admin_status');
            const card = document.getElementById('createCard');

            if (isLoggedIn) {
                document.getElementById('adminNavLinks').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userControl').style.display = 'flex';

                const avatar = localStorage.getItem('admin_avatar');
                const name = localStorage.getItem('admin_name') || 'Admin';
                const badgeClass = status === 'active' ? 'badge-active' : 'badge-expired';
                const badgeText = status === 'active' ? 'VIP' : 'LOCK';

                document.getElementById('userEmailDisplay').innerHTML = `
                    <img src="${avatar}" class="user-avatar">
                    <span>${name}</span>
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                `;

                // HIỆU ỨNG ĐỘNG CHO TÀI KHOẢN MỚI HOẶC HẾT HẠN
                if (status !== 'active') {
                    card.classList.add('card-vip-glow');
                    document.getElementById('statusAlert').style.display = 'flex';
                    document.getElementById('statusAlert').innerHTML = `<i class="fas fa-crown"></i> <span>Tài khoản chưa kích hoạt VIP. <a href="payment.html">Gia hạn ngay</a></span>`;
                    document.getElementById('btnCreate').disabled = true;
                } else {
                    card.classList.remove('card-vip-glow');
                    document.getElementById('statusAlert').style.display = 'none';
                    document.getElementById('btnCreate').disabled = false;
                }
            }
        }

        function logoutAdmin() { localStorage.clear(); window.location.reload(); }

        // Các hàm checkAuth, createAlbum... giữ nguyên logic xử lý của bạn
        document.addEventListener('DOMContentLoaded', () => {
            // Giả lập check callback từ URL
            const params = new URLSearchParams(window.location.search);
            if(params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_status', params.get('user_status'));
                localStorage.setItem('admin_name', params.get('user_name'));
                localStorage.setItem('admin_avatar', params.get('user_avatar'));
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            updateUI();
        });
    </script>
</body>
</html>
