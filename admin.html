<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN - Studio LNP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #147a30; --accent-color: #51ff7d; --bg-dark: #1a1a1a; }
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; min-height: 100vh; padding-top: 80px; overflow-x: hidden; }
        
        /* NAVBAR & HAMBURGER MENU */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-bottom: 2px solid var(--accent-color); }
        .navbar-brand { font-weight: 900; font-size: 1.4rem; color: white !important; text-transform: uppercase; }
        
        /* Nút 3 gạch to cho điện thoại */
        .navbar-toggler { border: 2px solid var(--accent-color); padding: 8px 12px; }
        .navbar-toggler-icon { width: 30px; height: 30px; filter: brightness(0) invert(1); }

        /* HIỆU ỨNG ĐÓNG KHUNG XANH */
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 800; margin: 5px; border: 2px solid transparent; border-radius: 12px; transition: 0.3s; padding: 10px 20px !important; text-align: center; }
        .nav-link:hover, .nav-link.active { border-color: var(--accent-color); background: rgba(81, 255, 125, 0.1) !important; color: var(--accent-color) !important; transform: translateY(-2px); }

        /* HEADER USER SYNC MANAGA */
        .user-status-box { background: rgba(0, 0, 0, 0.3); border: 2px solid var(--accent-color); border-radius: 50px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; }
        .user-avatar-circle { width: 34px; height: 34px; background: #222; border: 2px solid var(--accent-color); border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .status-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; background: #198754; color: white; }

        .main-container { padding: 20px; display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 100px); }
        .create-card { background: #fff; width: 100%; max-width: 480px; border-radius: 30px; padding: 35px 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; border: 3px solid #eee; }
        
        h2 { font-weight: 900; color: var(--primary-green); font-size: 1.6rem; text-transform: uppercase; margin-bottom: 25px; }

        /* INPUT SANG TRỌNG */
        .premium-input-group label { display: block; margin-bottom: 10px; font-weight: 900; color: var(--primary-green); font-size: 0.95rem; }
        input[type="text"] { width: 100%; padding: 16px; border: 2.5px solid #f1f5f9; border-radius: 20px; font-weight: 800; text-align: center; transition: 0.3s; font-size: 1rem; color: #333; }
        input[type="text"]:hover { border-color: var(--primary-green); }
        input[type="text"]:focus { border-color: var(--primary-green); outline: none; background: #fff; }
        input[type="text"]:focus::placeholder { color: transparent; }

        /* PREVIEW BOX THU NHỎ */
        .preview-box { border: 2.5px dashed var(--primary-green); background: #f0fff4; padding: 15px; border-radius: 20px; margin: 20px 0; display: none; }
        #resFolderName { font-size: 1.1rem; font-weight: 900; color: #111; display: block; margin: 5px 0; }
        #finalLinkBox { background: #000; padding: 10px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        #finalLinkBox a { color: var(--accent-color); font-size: 0.75rem; text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
        .btn-copy-small { background: var(--primary-green); color: white; border: none; padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; }

        .switch-group { display: flex; align-items: center; margin-bottom: 12px; justify-content: space-between; font-weight: 800; font-size: 0.9rem; color: #444; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #cbd5e0; border-radius: 34px; transition: 0.4s; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.4s; }
        input:checked + .slider { background: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: var(--primary-green); color: white; border: none; padding: 18px; border-radius: 20px; width: 100%; font-weight: 900; text-transform: uppercase; box-shadow: 0 10px 25px rgba(20, 122, 48, 0.3); font-size: 1.1rem; margin-top: 15px; transition: 0.3s; }
        .btn-locked { background: #94a3b8 !important; cursor: not-allowed; }

        /* AI CHAT MOBILE FIX */
        #chat-widget-container { position: fixed; bottom: 25px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #chat-toggle-btn { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #147a30, #51ff7d); color: white; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
        #chat-greeting-bubble { visibility: hidden; opacity: 0; position: absolute; bottom: 20px; right: 80px; background: white; padding: 12px 20px; border-radius: 20px; border-bottom-right-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-size: 0.85rem; font-weight: 800; border: 2px solid var(--accent-color); white-space: nowrap; transition: 0.5s; }
        #chat-greeting-bubble.show { visibility: visible; opacity: 1; }
        #chat-box { display: none; position: absolute; bottom: 85px; right: 0; width: 330px; height: 450px; background: white; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); overflow: hidden; flex-direction: column; border: 1px solid #eee; }
        .chat-header { background: linear-gradient(to right, #147a30, #0e5a22); color: white; padding: 15px; font-weight: 800; font-size: 0.9rem; display: flex; justify-content: space-between; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .message { max-width: 85%; padding: 10px 15px; border-radius: 18px; font-weight: 600; }
        .bot-msg { background: white; border: 1px solid #e2e8f0; align-self: flex-start; }
        .user-msg { background: var(--primary-green); color: white; align-self: flex-end; }
        .chat-input-area { padding: 10px; background: white; border-top: 1px solid #eee; }

        #copyToast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 10px 25px; border-radius: 50px; font-weight: 800; display: none; z-index: 10005; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="admin.html">Studio LNP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">TẠO ALBUM</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">QUẢN LÝ</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">SAO CHÉP</a></li>
                    <li class="nav-item"><a href="payment.html" class="nav-link">GIA HẠN</a></li> 
                </ul>
                <div id="userControl" style="display: none !important;" class="ms-auto align-items-center gap-2 py-2">
                    <div class="user-status-box">
                        <div class="user-avatar-circle" id="userAvatarPlaceholder"></div>
                        <div class="d-flex flex-column text-white" style="line-height:1.1">
                            <span id="userNameDisplay" class="fw-bold" style="font-size:0.85rem;">Admin</span>
                            <span id="userExpiryText" style="font-size:0.65rem; color:var(--accent-color); font-weight:800;"></span>
                        </div>
                    </div>
                    <button onclick="logoutAdmin()" class="btn btn-sm btn-danger rounded-pill px-3 py-1"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card">
            <h2>Tạo Album Ảnh Mới</h2>
            <div id="welcomeArea" class="welcome-msg" style="display: none; font-size: 0.85rem; color: #666; margin-bottom: 15px; font-weight: 700;">
                Chào mừng <span style="color:var(--primary-green)" id="welcomeUserName"></span>! 
                <div class="heartbeat-effect mt-1" style="font-weight: 900;">NHANH - GỌN - CHÍNH XÁC</div>
            </div>
            <div class="premium-input-group">
                <input type="text" id="driveLink" placeholder="Dán link thư mục Google Drive...">
            </div>
            <div id="previewBox" class="preview-box">
                <small class="fw-bold text-secondary text-uppercase">Tạo Thành Công!</small>
                <strong id="resFolderName">...</strong>
                <div id="finalLinkBox">
                    <a href="#" id="resClientLink" target="_blank">...</a>
                    <button class="btn-copy-small" onclick="copyResultLink()">COPY</button>
                </div>
            </div>
            <div class="switch-group"><span>Cho phép tải ảnh</span><label class="toggle-switch"><input type="checkbox" id="allowDownload"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Chèn Watermark</span><label class="toggle-switch"><input type="checkbox" id="allowLogo"><span class="slider"></span></label></div>
            <div class="switch-group"><span>Giới hạn ảnh chọn</span><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label></div>
            <button class="btn-create" id="btnCreate" onclick="handleCreateAlbum()">Bắt Đầu Tạo Ngay</button>
            <div id="centralLoginArea" class="mt-4" style="display: none;">
                <button class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="startGoogleLogin()">Đăng nhập Google</button>
            </div>
        </div>
    </div>

    <div id="chat-widget-container">
        <div id="chat-greeting-bubble">...</div>
        <button id="chat-toggle-btn" class="pulse-green" onclick="toggleChat()"><i class="fas fa-robot fa-2x"></i></button>
        <div id="chat-box">
            <div class="chat-header"><span>TRỢ LÝ AI STUDIO LNP</span><button class="btn-close btn-close-white" onclick="toggleChat()"></button></div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="form-control" placeholder="Hỏi AI..." onkeypress="if(event.key==='Enter') sendMessage()">
            </div>
        </div>
    </div>
    <div id="copyToast">✅ Đã copy link!</div>

    <script>
        const GOOGLE_CONFIG = { CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', N8N_WEBHOOK: 'https://dichvufb.tino.page/webhook/google-oauth-callback' };
        const URL_CREATE = 'https://dichvufb.tino.page/webhook/create-album-auto', URL_GET_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info', API_CHAT = 'https://dichvufb.tino.page/webhook/chat-admin';

        function playSound() { new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3").play().catch(()=>{}); }

        async function handleCreateAlbum() {
            const link = document.getElementById('driveLink').value.trim();
            const btn = document.getElementById('btnCreate');
            if (!link) return alert("Hãy dán link!");
            const match = link.match(/folders\/([a-zA-Z0-9_-]{20,})|id=([a-zA-Z0-9_-]{20,})/);
            const folderId = match ? (match[1] || match[2]) : (link.length > 20 ? link : null);
            if (!folderId) return alert("Link không hợp lệ!");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            try {
                await fetch(URL_CREATE, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ folderId, adminEmail: localStorage.getItem('admin_email'), settings: { download: document.getElementById('allowDownload').checked, logo: document.getElementById('allowLogo').checked, limit: document.getElementById('limitPhotos').checked } }) });
                const res = await fetch(`${URL_GET_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                const data = await res.json();
                if (data.clientLink) {
                    document.getElementById('resFolderName').innerText = data.folderName;
                    document.getElementById('resClientLink').href = data.clientLink;
                    document.getElementById('resClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                }
            } catch (e) { alert("Lỗi hệ thống!"); }
            finally { btn.innerHTML = 'Bắt Đầu Tạo Ngay'; btn.disabled = false; }
        }

        function updateUI() {
            const logged = localStorage.getItem('admin_is_logged_in') === 'true';
            const name = localStorage.getItem('admin_name') || 'Admin';
            const avatar = localStorage.getItem('admin_avatar');
            const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
            
            document.getElementById('adminNavLinks').style.display = logged ? 'flex' : 'none';
            document.getElementById('userControl').setAttribute('style', logged ? 'display: flex !important;' : 'display: none !important;');
            document.getElementById('centralLoginArea').style.display = logged ? 'none' : 'block';

            if (logged) {
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = (avatar && avatar !== 'null') ? `<img src="${avatar}" style="width:100%; height:100%; object-fit:cover;">` : `<b style="color:var(--accent-color)">${name.charAt(0)}</b>`;
                const canCreate = (localStorage.getItem('admin_status') === 'active' && expiry > Date.now());
                document.getElementById('btnCreate').className = canCreate ? 'btn-create' : 'btn-create btn-locked';
                document.getElementById('userExpiryText').innerText = `HẠN: ${new Date(expiry).toLocaleDateString('vi-VN')}`;
                
                if (!canCreate) {
                    document.getElementById('welcomeArea').style.display = 'block';
                    document.getElementById('welcomeUserName').innerText = name;
                }
                
                // AI CHÀO THEO TÊN + TIẾNG
                const bubble = document.getElementById('chat-greeting-bubble');
                bubble.innerText = `👋 Chào ${name.split(' ').pop()}, em giúp gì cho anh Phước ạ?`;
                setTimeout(() => { bubble.classList.add('show'); playSound(); }, 3000);
            }
        }

        function checkAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', params.get('user_email'));
                localStorage.setItem('admin_name', decodeURIComponent(params.get('user_name')));
                localStorage.setItem('admin_avatar', decodeURIComponent(params.get('user_avatar')));
                localStorage.setItem('admin_expiry', params.get('user_expiry'));
                localStorage.setItem('admin_status', params.get('user_status'));
                history.replaceState(null, null, window.location.pathname);
            }
            updateUI();
        }

        function toggleChat() { const box = document.getElementById('chat-box'); box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; document.getElementById('chat-greeting-bubble').classList.remove('show'); }
        async function sendMessage() {
            const input = document.getElementById('chat-input'), msg = input.value.trim();
            if (!msg) return; appendMsg(msg, 'user'); input.value = '';
            try {
                const res = await fetch(API_CHAT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, email: localStorage.getItem('admin_email') }) });
                const data = await res.json(); appendMsg(data.output || "AI đang bận rồi!", 'bot');
            } catch (e) { appendMsg("Lỗi kết nối AI!", 'bot'); }
        }
        function appendMsg(t, s) {
            const container = document.getElementById('chat-messages'), d = document.createElement('div');
            d.className = `message ${s === 'user' ? 'user-msg' : 'bot-msg'}`; d.innerText = t;
            container.appendChild(d); container.scrollTop = container.scrollHeight;
        }
        function copyResultLink() {
            navigator.clipboard.writeText(document.getElementById('resClientLink').innerText).then(() => {
                const toast = document.getElementById('copyToast'); toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2000);
            });
        }
        function startGoogleLogin() { window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_WEBHOOK)}&response_type=code&scope=openid%20profile%20email&access_type=offline&prompt=consent`; }
        function logoutAdmin() { localStorage.clear(); window.location.reload(); }
        window.onload = checkAuthCallback;
    </script>
</body>
</html>
