<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Album Ảnh - ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================= */
        /* CSS GỐC (GIỮ NGUYÊN)                      */
        /* ========================================= */
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh; display: flex; flex-direction: column; padding-top: 80px; 
        }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; transition: all 0.3s; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(255,255,255,0.2); color: #fff !important; transform: translateY(-2px); }
        .navbar-toggler { border: none; color: white; padding: 0.5rem; }
        .navbar-toggler:focus { box-shadow: none; outline: 2px solid var(--accent-color); }
        
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .create-card { background: rgba(255, 255, 255, 0.98); width: 100%; max-width: 550px; border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--primary-green); }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: #444; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; transition: 0.3s; }
        input:focus { border-color: var(--primary-green); outline: none; }
        
        .preview-box { border: 2px dashed #c3e6cb; background-color: #f0fff4; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        #finalLinkBox { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; padding: 15px; border-radius: 10px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        #finalLinkBox a { color: white; text-decoration: underline; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .btn-copy-link { background: #fff; color: var(--primary-green); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        .switch-group { display: flex; align-items: center; margin-bottom: 15px; justify-content: space-between; }
        .switch-label { display: flex; gap: 10px; font-weight: 600; cursor: pointer; }
        .toggle-switch { position: relative; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-create { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 12px; width: 100%; font-weight: 800; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; box-shadow: 0 10px 20px rgba(20, 122, 48, 0.3); }
        .btn-create:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-create:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.8; box-shadow: none; transform: none; }

        /* ALERT & BADGE */
        .alert-custom { border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-size: 0.95rem; }
        .alert-locked { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-locked a { color: #856404; font-weight: 800; text-decoration: underline; }
        
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .badge-active { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .badge-expired { background: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }

        .btn-google { background: white; color: #333; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .info-box { background: #e3f2fd; color: #0d47a1; padding: 15px; border-radius: 10px; margin-top: 25px; font-size: 14px; display: flex; align-items: center; gap: 12px; border-left: 5px solid #2196f3; }
        .footer { background: transparent; color: #666; text-align: center; padding: 20px; font-size: 13px; margin-top: auto; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        
        #copyNotification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background-color: #28a745; color: white; padding: 12px 25px; border-radius: 50px; z-index: 1050; opacity: 0; transition: 0.3s; }
        #copyNotification.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        @media (max-width: 768px) { .create-card { padding: 30px 20px; } .btn-create { font-size: 16px; } .user-info-mobile { border-top: 1px solid rgba(255,255,255,0.1); margin-top: 15px; padding-top: 15px; justify-content: flex-end; } }

        /* ========================================= */
        /* CSS CHO CHAT WIDGET AI (NEW DESIGN)      */
        /* ========================================= */
        #chat-widget-container {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: 'Nunito', sans-serif;
        }

        /* Nút Chat tròn với hiệu ứng Pulse */
        #chat-toggle-btn {
            width: 65px; height: 65px; border-radius: 50%; 
            background: linear-gradient(135deg, #147a30, #51ff7d); /* Gradient đẹp */
            color: white; border: none; 
            box-shadow: 0 4px 20px rgba(81, 255, 125, 0.4); 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        
        /* Hiệu ứng rung nhẹ thu hút sự chú ý */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(81, 255, 125, 0); }
            100% { box-shadow: 0 0 0 0 rgba(81, 255, 125, 0); }
        }
        #chat-toggle-btn.pulse {
            animation: pulse-green 2s infinite;
        }

        #chat-toggle-btn:hover { transform: scale(1.1); box-shadow: 0 6px 25px rgba(81, 255, 125, 0.6); }

        /* Khung Chat */
        #chat-box {
            display: none; position: absolute; bottom: 85px; right: 0;
            width: 360px; height: 480px; background: white; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden;
            flex-direction: column; border: 1px solid rgba(0,0,0,0.05);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Header Chat */
        .chat-header {
            background: linear-gradient(to right, #147a30, #0e5a22);
            color: white; padding: 15px; font-size: 1rem;
        }

        /* Vùng tin nhắn */
        #chat-messages {
            flex: 1; overflow-y: auto; background: #f4f6f8; 
            display: flex; flex-direction: column; gap: 12px; padding: 15px;
            scroll-behavior: smooth;
        }

        /* Bong bóng tin nhắn */
        .message { 
            max-width: 80%; padding: 10px 15px; border-radius: 18px; 
            font-size: 0.9rem; line-height: 1.5; position: relative; word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .bot-message { 
            background: white; color: #333; align-self: flex-start; 
            border-bottom-left-radius: 4px; border: 1px solid #eee;
        }
        .user-message { 
            background: linear-gradient(135deg, #147a30, #0e5a22); 
            color: white; align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }

        /* Input area */
        .chat-input-area { padding: 12px; background: white; border-top: 1px solid #eee; }
        .typing-indicator { font-style: italic; color: #888; font-size: 0.75rem; margin-left: 10px; margin-bottom: 5px; }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-camera me-2"></i>Tạo Album</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="adminNavLinks" style="display: none;">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Tạo Album</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link">Donate</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 ms-auto user-info-mobile">
                    <button id="loginBtn" class="btn-google" onclick="startGoogleLogin()">
                        <i class="fab fa-google text-danger"></i> <span>Đăng Nhập</span>
                    </button>
                    <div id="userControl" style="display: none;" class="align-items-center gap-3">
                        <div id="userEmailDisplay" class="d-flex align-items-center gap-2 text-white fw-bold px-3 py-2 rounded-pill bg-white bg-opacity-10 border border-white border-opacity-25">
                            Admin
                        </div>
                        <button class="btn btn-danger fw-bold rounded-pill px-3" onclick="logoutAdmin()">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="create-card" id="createCard">
            <h2>Bắt Đầu Tạo Album Ảnh</h2>
            
            <div id="statusAlert" class="alert-custom alert-locked" style="display: none;">
                </div>

            <div class="form-group">
                <label><i class="fab fa-google-drive me-2 text-success"></i>Dán Link Thư mục Google Drive</label>
                <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off">
            </div>
            
            <div id="previewBox" class="preview-box">
                <p style="margin-bottom: 8px; font-weight: bold;">Tên Album: <span id="previewFolderName" class="text-success">...</span></p>
                <div id="finalLinkBox">
                    <div class="text-truncate me-2" style="max-width: 250px;"><a href="#" id="previewClientLink" target="_blank">...</a></div>
                    <button class="btn-copy-link" onclick="copyFinalLink()">Copy</button>
                </div>
            </div>

            <div class="switch-group">
                <div class="switch-label"><label class="toggle-switch"><input type="checkbox" id="allowDownload" checked><span class="slider"></span></label><span>Cho phép tải xuống</span></div>
            </div>
            <div class="switch-group">
                <div class="switch-label"><label class="toggle-switch"><input type="checkbox" id="allowComment" checked><span class="slider"></span></label><span>Cho phép bình luận</span></div>
            </div>
            <div class="switch-group">
                <div class="switch-label"><label class="toggle-switch"><input type="checkbox" id="limitPhotos"><span class="slider"></span></label><span>Giới hạn số ảnh</span></div>
            </div>
            
            <button class="btn-create" id="btnCreate" onclick="createAlbum()">
                <i class="fas fa-magic"></i> Tạo Album Ngay
            </button>

            <div class="info-box"><i class="fas fa-info-circle fa-lg"></i><span>Lưu ý: Không hỗ trợ hiển thị thumbnail file .CR3</span></div>
        </div>
    </div>
    
    <div id="copyNotification"><i class="fas fa-check-circle me-2"></i>Đã sao chép link!</div>
    <div class="footer text-white-50">© 2025 Tiện Ích Chọn Ảnh</div>

    <div id="chat-widget-container">
        <button id="chat-toggle-btn" class="pulse" onclick="toggleChat()">
            <i class="fas fa-comment-dots fa-lg" style="font-size: 1.8rem;"></i>
        </button>

        <div id="chat-box">
            <div class="chat-header d-flex justify-content-between align-items-center">
                <span class="fw-bold">
                    <i class="fas fa-headset me-2"></i>CSKH Lâm Nam Phước
                </span>
                <button class="btn btn-sm btn-close btn-close-white" onclick="toggleChat()"></button>
            </div>
            
            <div id="chat-messages">
                </div>
            
            <div class="chat-input-area">
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" placeholder="Nhập câu hỏi..." onkeypress="handleEnter(event)" style="border-radius: 20px 0 0 20px;">
                    <button class="btn btn-success" onclick="sendMessage()" id="send-btn" style="border-radius: 0 20px 20px 0;">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const GOOGLE_CONFIG = {
            CLIENT_ID: '781143890416-3hsl3fii3is9r7fl6m55gsuuulcteiq8.apps.googleusercontent.com', 
            N8N_OAUTH_REDIRECT_URI: 'https://dichvufb.tino.page/webhook/google-oauth-callback', 
            SCOPE: 'openid profile email' 
        };
        const URL_CREATE_ALBUM_SAVE = 'https://dichvufb.tino.page/webhook/create-album-auto'; 
        const URL_GET_FOLDER_INFO = 'https://dichvufb.tino.page/webhook/get-folder-info';

        function startGoogleLogin() {
            localStorage.setItem('current_admin_path', window.location.href.split('?')[0]);
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(GOOGLE_CONFIG.N8N_OAUTH_REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(GOOGLE_CONFIG.SCOPE)}&access_type=offline&prompt=consent`;
        }

        // ✅ QUAN TRỌNG: Hàm này nhận dữ liệu từ n8n (Respond to Webhook)
        function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('auth_status') === 'success') {
                localStorage.setItem('admin_is_logged_in', 'true');
                localStorage.setItem('admin_email', urlParams.get('user_email'));
                
                try {
                    localStorage.setItem('admin_name', decodeURIComponent(urlParams.get('user_name')));
                    localStorage.setItem('admin_avatar', decodeURIComponent(urlParams.get('user_avatar')));
                } catch(e) {}

                // 👉 Lưu trạng thái ACTIVE và HẠN DÙNG vào bộ nhớ trình duyệt
                localStorage.setItem('admin_expiry', urlParams.get('user_expiry') || '0');
                localStorage.setItem('admin_status', urlParams.get('user_status') || 'new');

                history.replaceState(null, null, window.location.pathname);
                updateUI();
            }
        }

        function logoutAdmin() { localStorage.clear(); window.location.href = 'admin.html'; }

        function updateUI() {
            const isLoggedIn = localStorage.getItem('admin_is_logged_in') === 'true';
            
            const adminNavLinks = document.getElementById('adminNavLinks');
            const loginBtn = document.getElementById('loginBtn');
            const userControl = document.getElementById('userControl');
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            const statusAlert = document.getElementById('statusAlert');
            const btnCreate = document.getElementById('btnCreate');

            if (isLoggedIn) {
                adminNavLinks.style.display = 'flex';
                loginBtn.style.display = 'none';
                userControl.style.display = 'flex';

                const name = localStorage.getItem('admin_name') || 'Admin';
                const avatar = localStorage.getItem('admin_avatar');
                const status = localStorage.getItem('admin_status'); // 'active' hoặc 'new'
                const expiry = parseInt(localStorage.getItem('admin_expiry')) || 0;
                
                let isAllowed = false;
                let badgeHtml = '';

                // --- KIỂM TRA QUYỀN TRUY CẬP ---
                if (status === 'new') {
                    statusAlert.style.display = 'flex';
                    statusAlert.innerHTML = `<i class="fas fa-user-clock text-warning fa-lg"></i> <span>Tài khoản mới. Vui lòng <a href="lienhe.html">Liên Hệ Admin</a> kích hoạt.</span>`;
                    badgeHtml = `<span class="status-badge badge-expired">MỚI</span>`;
                    isAllowed = false;
                } else {
                    if (expiry > Date.now()) {
                        statusAlert.style.display = 'none';
                        badgeHtml = `<span class="status-badge badge-active">Hạn: ${new Date(expiry).toLocaleDateString('vi-VN')}</span>`;
                        isAllowed = true;
                    } else {
                        statusAlert.style.display = 'flex';
                        statusAlert.innerHTML = `<i class="fas fa-lock text-danger fa-lg"></i> <span>Tài khoản hết hạn. Vui lòng <a href="donate.html">Gia Hạn</a>.</span>`;
                        badgeHtml = `<span class="status-badge badge-expired">HẾT HẠN</span>`;
                        isAllowed = false;
                    }
                }

                let imgTag = avatar ? `<img src="${avatar}" class="user-avatar me-1">` : `<i class="fas fa-user-circle me-1"></i>`;
                userEmailDisplay.innerHTML = `${imgTag} ${name} ${badgeHtml}`;

                if (isAllowed) {
                    btnCreate.disabled = false;
                    btnCreate.innerHTML = '<i class="fas fa-magic"></i> Tạo Album Ngay';
                    btnCreate.style.cursor = 'pointer';
                } else {
                    btnCreate.disabled = true;
                    btnCreate.innerHTML = '<i class="fas fa-lock"></i> Tính năng bị khóa';
                    btnCreate.style.cursor = 'not-allowed';
                }

            } else {
                adminNavLinks.style.display = 'none';
                loginBtn.style.display = 'flex';
                userControl.style.display = 'none';
                statusAlert.style.display = 'none';
                btnCreate.disabled = true;
            }
        }

        function extractFolderId(link) {
            if (!link) return null;
            let cleaned = link.split('?')[0].replace(/\/$/, ""); 
            const match = cleaned.match(/folders\/([-a-zA-Z0-9_]+)/);
            return match ? match[1] : (cleaned.match(/^[a-zA-Z0-9_-]+$/) ? cleaned : null);
        }

        function copyFinalLink() {
            const link = document.getElementById('previewClientLink');
            if (link.href && link.innerText !== '...') {
                navigator.clipboard.writeText(link.href).then(() => showNotification('✅ Đã sao chép link!'));
            }
        }

        function showNotification(msg) {
            const n = document.getElementById('copyNotification');
            n.innerHTML = `<i class="fas fa-check-circle me-2"></i>${msg}`; n.classList.add('active');
            setTimeout(() => n.classList.remove('active'), 3000);
        }

        async function createAlbum() {
            const driveLink = document.getElementById('driveLink').value.trim();
            const folderId = extractFolderId(driveLink);
            if (!folderId) return alert("Link không hợp lệ!");

            const btn = document.getElementById('btnCreate');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...'; btn.disabled = true;
            document.getElementById('previewBox').style.display = 'none';

            try {
                await fetch(URL_CREATE_ALBUM_SAVE, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        folderId: folderId,
                        adminEmail: localStorage.getItem('admin_email'),
                        settings: {
                            download: document.getElementById('allowDownload').checked,
                            comment: document.getElementById('allowComment').checked,
                            limitPhotos: document.getElementById('limitPhotos').checked
                        }
                    })
                });

                const res = await fetch(`${URL_GET_FOLDER_INFO}?folderId=${folderId}&adminEmail=${localStorage.getItem('admin_email')}`);
                if (!res.ok) throw new Error('Lỗi server');
                const data = await res.json();

                if (data.clientLink) {
                    document.getElementById('previewFolderName').innerText = data.folderName;
                    document.getElementById('previewClientLink').href = data.clientLink;
                    document.getElementById('previewClientLink').innerText = data.clientLink;
                    document.getElementById('previewBox').style.display = 'block';
                    showNotification('Tạo thành công!');
                }
            } catch (e) {
                alert("Lỗi: " + e.message);
            } finally {
                btn.innerHTML = '<i class="fas fa-magic"></i> Tạo Album Ngay'; btn.disabled = false;
            }
        }

        // =========================================
        // JAVASCRIPT CHO CHAT WIDGET (LOGIC AI CHÀO)
        // =========================================
        const CHAT_WEBHOOK_URL = 'https://dichvufb.tino.page/webhook/chat-admin'; // ✅ Link Webhook của bạn

        // Tạo Session ID
        let chatSessionId = localStorage.getItem('chat_session_id');
        if (!chatSessionId) {
            chatSessionId = 'admin-' + Math.random().toString(36).substring(7);
            localStorage.setItem('chat_session_id', chatSessionId);
        }

        // Biến kiểm tra đã chào chưa (Lưu trong phiên làm việc hiện tại)
        let welcomeMessageSent = sessionStorage.getItem('welcome_sent') === 'true';

        function toggleChat() {
            const chatBox = document.getElementById('chat-box');
            const toggleBtn = document.getElementById('chat-toggle-btn');
            
            if (chatBox.style.display === 'none' || !chatBox.style.display) {
                chatBox.style.display = 'flex';
                // Xóa animation pulse khi đã mở
                toggleBtn.classList.remove('pulse');
                setTimeout(() => document.getElementById('chat-input').focus(), 100);
            } else {
                chatBox.style.display = 'none';
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            const messagesContainer = document.getElementById('chat-messages');

            if (!message) return;

            addMessageToUI(message, 'user');
            input.value = '';

            const loadingId = 'loading-' + Date.now();
            showTypingIndicator(loadingId);

            try {
                const response = await fetch(CHAT_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, sessionId: chatSessionId })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();
                
                const aiReply = data.output || data.text || "Xin lỗi, tôi không hiểu phản hồi.";
                addMessageToUI(aiReply, 'bot');

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessageToUI("❌ Lỗi kết nối server AI.", 'bot');
            }
        }

        function addMessageToUI(text, sender) {
            const messagesContainer = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator(id) {
            const messagesContainer = document.getElementById('chat-messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'typing-indicator';
            loadingDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i>AI đang phản hồi...';
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // --- HÀM MỚI: AI TỰ ĐỘNG CHÀO ---
        function sendWelcomeMessage() {
            if (welcomeMessageSent) return; // Nếu chào rồi thì thôi

            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = ''; 
            
            const loadingId = 'welcome-loading';
            showTypingIndicator(loadingId);

            // Giả lập AI nghĩ 1.5 giây
            setTimeout(() => {
                document.getElementById(loadingId)?.remove();
                
                // Câu chào
                const welcomeText = "👋 Xin chào Admin! Em là Trợ lý ảo của Studio Lâm Nam Phước.\nEm có thể giúp gì cho anh/chị hôm nay ạ? (Ví dụ: Tra cứu lịch, dời lịch...)";
                
                addMessageToUI(welcomeText, 'bot');
                sessionStorage.setItem('welcome_sent', 'true');
                welcomeMessageSent = true;
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthCallback();
            updateUI();
            
            // Kích hoạt chào mừng
            sendWelcomeMessage();
        });
    </script>
</body>
</html>
