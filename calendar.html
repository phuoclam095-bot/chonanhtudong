<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDIO PLANNER PRO - CHONANHNHANH.VN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --gold-vip: #f0c300; --bg-deep: #050a14; --neon: 0 0 15px rgba(0, 235, 176, 0.4); --gold-muted: #b89b00; }
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(rgba(5, 10, 20, 0.7), rgba(5, 10, 20, 0.7)), url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; background-attachment: fixed; 
            color: #fff; font-family: 'Montserrat', sans-serif; padding-top: 85px; height: 100vh; overflow: hidden;
        }

        /* --- NAVBAR ĐỒNG BỘ --- */
        .navbar { background: rgba(5, 10, 20, 0.95); border-bottom: 1px solid rgba(255,255,255,0.08); min-height: 75px; position: fixed; width: 100%; top: 0; z-index: 2000; }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); font-size: 1.1rem; }
        .navbar-nav.mx-auto { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.65rem; text-transform: uppercase; padding: 10px 12px !important; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: var(--primary) !important; text-shadow: var(--neon); }

        .main-wrapper { max-width: 1350px; margin: 0 auto; padding: 15px; display: grid; grid-template-columns: 1fr 380px; gap: 20px; height: calc(100vh - 110px); overflow: hidden; }

        /* --- CALENDAR BOX --- */
        .calendar-container { 
            background: rgba(10, 17, 36, 0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; padding: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; position: relative;
        }

        /* LÀM NỔI BẬT 2 MŨI TÊN */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { 
            background: rgba(0, 235, 176, 0.15); border: 1.5px solid var(--primary); color: var(--primary); 
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            transition: 0.3s; box-shadow: var(--neon);
        }
        .btn-nav:hover { background: var(--primary); color: #000; transform: scale(1.1); }

        .month-year-display { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; display: flex; gap: 12px; letter-spacing: 1px; }
        .month-year-display span { cursor: pointer; transition: 0.3s; padding: 4px 8px; border-radius: 8px; }
        .month-year-display span:hover { background: rgba(0, 235, 176, 0.1); color: var(--primary); }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 800; color: var(--primary); margin-bottom: 8px; font-size: 0.8rem; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; flex: 1; }
        
        .day { 
            min-height: 60px; background: rgba(255,255,255,0.02); border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .day:hover:not(.other-month) { border-color: var(--primary); background: rgba(0, 235, 176, 0.1); }
        .day.today { border-color: var(--gold-vip); color: var(--gold-vip); background: rgba(240, 195, 0, 0.08); }
        .day.selected { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: var(--neon); }
        .day.other-month { opacity: 0.15; cursor: default; }
        .lunar-day { font-size: 0.6rem; opacity: 0.6; font-weight: 600; margin-top: 1px; }

        /* --- SIDEBAR --- */
        .sidebar { background: rgba(10, 17, 36, 0.75); border-radius: 30px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .event-list { overflow-y: auto; flex: 1; padding-right: 5px; margin-bottom: 10px; }
        .event-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; margin-bottom: 10px; border-radius: 18px; border-left: 4px solid var(--primary); position: relative; }
        
        /* TIỀN CỌC CHÌM XUỐNG TÝ */
        .deposit-text { color: var(--gold-muted) !important; font-weight: 700; font-size: 0.75rem; text-shadow: none; }

        .form-control, .form-select { background: rgba(0,0,0,0.5) !important; border: 1.5px solid rgba(255,255,255,0.2) !important; color: #fff !important; border-radius: 12px; padding: 10px; font-weight: 700; font-size: 0.9rem; }
        .form-control::placeholder { color: #a5f3e0 !important; }
        .btn-action-main { background: var(--primary); color: #000; font-weight: 900; padding: 14px; border-radius: 50px; width: 100%; border: none; text-transform: uppercase; box-shadow: var(--neon); }

        .quick-selector { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 90%; background: #080d1a; border: 1px solid var(--primary); border-radius: 25px; padding: 20px; display: none; z-index: 100; box-shadow: 0 0 50px #000; }
        .selector-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .selector-item { padding: 8px; text-align: center; font-weight: 700; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.05); font-size: 0.8rem; }
        .selector-item:hover { background: var(--primary); color: #000; }

        @media (max-width: 1000px) { .main-wrapper { grid-template-columns: 1fr; height: auto; } body { height: auto; overflow: auto; } }
    </style>
</head>
