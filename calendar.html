<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Lịch Chụp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* GIỮ NGUYÊN CSS CŨ CỦA BẠN (KHÔNG THAY ĐỔI GIAO DIỆN) */
        :root { --primary-green: #147a30; --dark-green: #0e5a22; --accent-gold: #f0c300; --bg-dark: #121212; --text-light: #f0f0f0; --glass-bg: rgba(30, 30, 30, 0.6); --glass-border: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Nunito', sans-serif; min-height: 100vh; background-image: radial-gradient(#222 15%, transparent 16%), radial-gradient(#222 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; padding-top: 80px; }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .navbar-brand { font-weight: 800; font-size: 1.2rem; color: white !important; text-transform: uppercase; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; }
        .main-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .calendar-container { background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .month-year { font-size: 1.5rem; font-weight: 800; color: var(--accent-gold); }
        .btn-nav { background: rgba(255,255,255,0.1); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .btn-nav:hover { background: var(--primary-green); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: #aaa; margin-bottom: 10px; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day { aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid transparent; }
        .day:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .day.today { border-color: var(--accent-gold); color: var(--accent-gold); font-weight: bold; background: rgba(240, 195, 0, 0.1); }
        .day.selected { background: var(--primary-green); color: white; border-color: var(--primary-green); }
        .day.prev-date, .day.next-date { opacity: 0.3; pointer-events: none; }
        .event-dots { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; justify-content: center; }
        .dot { width: 6px; height: 6px; background-color: var(--accent-gold); border-radius: 50%; }
        .sidebar { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; height: fit-content; max-height: 80vh; }
        .sidebar h3 { font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .selected-date-title { font-size: 1rem; margin-bottom: 15px; color: #ccc; }
        .event-list { overflow-y: auto; flex: 1; padding-right: 5px; }
        .event-item { background: rgba(0,0,0,0.3); border-left: 4px solid var(--primary-green); padding: 10px; margin-bottom: 10px; border-radius: 5px; position: relative; }
        .event-item h4 { font-size: 1rem; margin: 0 0 5px 0; color: white; }
        .event-item p { font-size: 0.85rem; margin: 0; color: #aaa; }
        .event-time { font-weight: bold; color: var(--accent-gold); font-size: 0.8rem; margin-bottom: 3px; display: block;}
        .btn-add-event { background: linear-gradient(135deg, #147a30, #0e5a22); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 15px; width: 100%; transition: 0.3s; }
        .btn-add-event:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(20, 122, 48, 0.4); }
        .modal-content { background-color: #222; color: white; border: 1px solid #444; }
        .modal-header { border-bottom: 1px solid #444; }
        .modal-footer { border-top: 1px solid #444; }
        .form-control, .form-select { background-color: #333; border: 1px solid #555; color: white; }
        .form-control:focus { background-color: #333; color: white; border-color: var(--accent-gold); box-shadow: none; }
        #loadingOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; color: var(--accent-gold); flex-direction: column; }
        @media (max-width: 900px) { .main-wrapper { grid-template-columns: 1fr; } .sidebar { max-height: none; } .day { height: 60px; aspect-ratio: auto; } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner-border mb-3" role="status"></div>
        <div>Đang đồng bộ dữ liệu...</div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-alt me-2"></i>Lịch Chụp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a href="managa.html" class="nav-link"><i class="fas fa-arrow-left"></i> Quay lại Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn-nav" onclick="prevMonth()"><i class="fas fa-chevron-left"></i></button>
                <div class="month-year" id="monthYear">...</div>
                <button class="btn-nav" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="weekdays"><div>CN</div><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div></div>
            <div class="days" id="daysGrid"></div>
        </div>

        <div class="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #444; padding-bottom:10px; margin-bottom:15px;">
                <h3 style="margin:0; border:none;">Chi Tiết Lịch</h3>
                <button class="btn btn-sm btn-outline-warning" onclick="fetchAllEvents()">🔄 Làm mới</button>
            </div>
            
            <div class="selected-date-title" id="selectedDateDisplay">Hôm nay</div>
            <div class="event-list" id="eventList"></div>
            <button class="btn-add-event" onclick="openAddModal()"><i class="fas fa-plus-circle me-2"></i> Thêm Lịch Mới</button>
        </div>
    </div>

    <div class="modal fade" id="addEventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-warning"><i class="fas fa-camera me-2"></i>Đặt Lịch Chụp</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEventForm">
                        <div class="mb-3">
                            <label class="form-label">Tên Khách Hàng</label>
                            <input type="text" class="form-control" id="clientName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loại Chụp</label>
                            <select class="form-select" id="shootType">
                                <option value="Cưới (Wedding)">💍 Chụp Cưới</option>
                                <option value="Tiệc (Party)">🎉 Tiệc / Sự Kiện</option>
                                <option value="Chân Dung">📸 Chân Dung</option>
                                <option value="Gia Đình">👨‍👩‍👧‍👦 Gia Đình</option>
                                <option value="Khác">🔹 Khác</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Thời Gian</label>
                            <input type="time" class="form-control" id="eventTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi Chú</label>
                            <textarea class="form-control" id="eventNote" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" onclick="saveEvent()">Lưu Lịch</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ======================================================
        // ⚠️ CẤU HÌNH WEBHOOK (BẠN CẦN TẠO TRÊN N8N)
        // ======================================================
        // 1. Webhook Lấy Lịch (Method GET): Trả về JSON toàn bộ lịch
        const URL_GET_CALENDAR = 'https://dichvufb.tino.page/webhook/get-calendar-events';
        // 2. Webhook Thêm Lịch (Method POST): Nhận JSON để lưu vào Sheet
        const URL_ADD_EVENT = 'https://dichvufb.tino.page/webhook/add-calendar-event';

        // ======================================================
        // LOGIC CHÍNH
        // ======================================================
        const date = new Date();
        let currentMonth = date.getMonth();
        let currentYear = date.getFullYear();
        let selectedDate = new Date();
        let events = {}; // Dữ liệu sẽ được load từ Server

        const monthYearEl = document.getElementById('monthYear');
        const daysGridEl = document.getElementById('daysGrid');
        const eventListEl = document.getElementById('eventList');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const modal = new bootstrap.Modal(document.getElementById('addEventModal'));
        const loadingOverlay = document.getElementById('loadingOverlay');

        // 1. LOAD DỮ LIỆU TỪ N8N/GOOGLE SHEETS
        async function fetchAllEvents() {
            loadingOverlay.style.display = 'flex';
            try {
                const res = await fetch(URL_GET_CALENDAR);
                if (!res.ok) throw new Error("Lỗi kết nối server");
                
                // Server trả về mảng, ta chuyển đổi sang Object { "YYYY-MM-DD": [...] }
                const data = await res.json();
                events = {}; // Reset
                
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        // Giả sử item có: date (YYYY-MM-DD), client, type, time, note
                        if (!events[item.date]) events[item.date] = [];
                        events[item.date].push(item);
                    });
                }
                
                renderCalendar();
            } catch (error) {
                console.error(error);
                alert("Không thể tải dữ liệu lịch. Vui lòng kiểm tra kết nối.");
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        // 2. RENDER CALENDAR
        function renderCalendar() {
            date.setDate(1);
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
            const lastDayIndex = new Date(currentYear, currentMonth + 1, 0).getDay();
            const nextDays = 7 - lastDayIndex - 1;

            const months = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            monthYearEl.innerText = `${months[currentMonth]} ${currentYear}`;

            let days = "";

            for (let x = firstDayIndex; x > 0; x--) {
                days += `<div class="day prev-date">${prevLastDay - x + 1}</div>`;
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateKey = formatDateKey(currentYear, currentMonth, i);
                const hasEvent = events[dateKey] && events[dateKey].length > 0;
                
                const isToday = i === new Date().getDate() && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear();
                const isSelected = i === selectedDate.getDate() && currentMonth === selectedDate.getMonth() && currentYear === selectedDate.getFullYear();

                let dotsHtml = '';
                if (hasEvent) {
                    const count = Math.min(events[dateKey].length, 3);
                    for(let d=0; d<count; d++) dotsHtml += `<div class="dot"></div>`;
                }

                days += `<div class="day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate(${i})">
                            ${i}
                            <div class="event-dots">${dotsHtml}</div>
                         </div>`;
            }

            for (let j = 1; j <= nextDays + 1; j++) { 
                 if(days.split('class="day').length < 35) { /* Fill gap logic optional */ }
            }

            daysGridEl.innerHTML = days;
            renderEventList();
        }

        function selectDate(day) {
            selectedDate = new Date(currentYear, currentMonth, day);
            renderCalendar();
        }

        function renderEventList() {
            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            const dayEvents = events[dateKey] || [];

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            selectedDateDisplay.innerText = selectedDate.toLocaleDateString('vi-VN', options);

            if (dayEvents.length === 0) {
                eventListEl.innerHTML = `<div class="text-center text-muted mt-4"><i class="far fa-calendar-times fa-2x mb-2"></i><br>Không có lịch chụp.</div>`;
            } else {
                let html = '';
                dayEvents.sort((a, b) => a.time.localeCompare(b.time));

                dayEvents.forEach((ev) => {
                    html += `
                        <div class="event-item">
                            <span class="event-time"><i class="far fa-clock me-1"></i>${ev.time}</span>
                            <h4>${ev.client}</h4>
                            <p class="text-white-50"><i class="fas fa-camera me-1"></i>${ev.type}</p>
                            ${ev.note ? `<p style="font-style:italic">"${ev.note}"</p>` : ''}
                        </div>
                    `;
                });
                eventListEl.innerHTML = html;
            }
        }

        // 3. THÊM SỰ KIỆN (GỬI VỀ N8N)
        function openAddModal() { document.getElementById('addEventForm').reset(); modal.show(); }

        async function saveEvent() {
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('shootType').value;
            const time = document.getElementById('eventTime').value;
            const note = document.getElementById('eventNote').value;

            if (!name || !time) { alert("Vui lòng nhập tên và giờ!"); return; }

            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            
            // Payload gửi đi
            const newEvent = {
                date: dateKey,
                client: name,
                type: type,
                time: time,
                note: note
            };

            // UI Feedback
            const btnSave = document.querySelector('.modal-footer .btn-success');
            const oldText = btnSave.innerText;
            btnSave.innerText = "Đang lưu...";
            btnSave.disabled = true;

            try {
                // Gửi về n8n để lưu vào Google Sheet
                const res = await fetch(URL_ADD_EVENT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEvent)
                });

                if (res.ok) {
                    // Cập nhật local ngay lập tức để không cần reload
                    if (!events[dateKey]) events[dateKey] = [];
                    events[dateKey].push(newEvent);
                    
                    renderCalendar();
                    modal.hide();
                    // alert("Đã lưu thành công!");
                } else {
                    alert("Lỗi khi lưu vào server.");
                }
            } catch (e) {
                alert("Lỗi kết nối: " + e.message);
            } finally {
                btnSave.innerText = oldText;
                btnSave.disabled = false;
            }
        }

        function prevMonth() { currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} renderCalendar(); }
        function nextMonth() { currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} renderCalendar(); }
        function formatDateKey(year, month, day) { return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAllEvents(); // Load dữ liệu khi mở web
        });
    </script>
</body>
</html>
