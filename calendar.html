<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Lịch Chụp - Studio</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #147a30;
            --dark-green: #0e5a22;
            --accent-gold: #f0c300;
            --bg-dark: #121212;
            --text-light: #f0f0f0;
            --glass-bg: rgba(30, 30, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            /* Nền chấm bi đồng bộ */
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            padding-top: 80px; /* Chừa chỗ cho header */
        }

        /* --- HEADER --- */
        .navbar {
            background: var(--primary-green);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .navbar-brand { font-weight: 800; font-size: 1.2rem; color: white !important; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; transition: 0.3s; }
        .nav-link:hover { background: rgba(255,255,255,0.2); border-radius: 8px; }

        /* --- LAYOUT CHÍNH --- */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 350px; /* Calendar rộng, Sidebar nhỏ */
            gap: 25px;
        }

        /* --- CALENDAR BOX --- */
        .calendar-container {
            background: linear-gradient(135deg, rgba(13, 26, 33, 0.9) 0%, rgba(14, 90, 34, 0.8) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .month-year { font-size: 1.5rem; font-weight: 800; color: var(--accent-gold); text-transform: capitalize; }
        
        .btn-nav {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-nav:hover { background: var(--primary-green); transform: scale(1.1); }

        /* GRID LỊCH */
        .weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-weight: 700; color: #aaa; margin-bottom: 15px;
            text-transform: uppercase; font-size: 0.9rem;
        }
        .days {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            aspect-ratio: 1/1; /* Vuông */
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 10px;
            cursor: pointer; transition: 0.2s; position: relative;
            border: 1px solid transparent;
            font-weight: 600;
        }
        .day:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-3px); border-color: var(--accent-gold); }
        
        /* Trạng thái ngày */
        .day.today { border: 2px solid var(--accent-gold); color: var(--accent-gold); background: rgba(240, 195, 0, 0.1); }
        .day.selected { background: var(--primary-green); color: white; border-color: var(--primary-green); box-shadow: 0 5px 15px rgba(20, 122, 48, 0.4); }
        .day.prev-date, .day.next-date { opacity: 0.3; pointer-events: none; }

        /* Dấu chấm báo hiệu có lịch */
        .event-dots {
            display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; justify-content: center;
        }
        .dot { width: 6px; height: 6px; background-color: var(--accent-gold); border-radius: 50%; box-shadow: 0 0 5px var(--accent-gold); }

        /* --- SIDEBAR (EVENTS LIST) --- */
        .sidebar {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex; flex-direction: column;
            height: fit-content;
            max-height: 80vh;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px; margin-bottom: 15px;
        }
        .sidebar h3 { font-size: 1.2rem; font-weight: 800; color: var(--accent-gold); margin: 0; }
        
        .selected-date-title { font-size: 1.1rem; margin-bottom: 15px; color: white; font-weight: 700; text-align: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }

        .event-list { overflow-y: auto; flex: 1; padding-right: 5px; min-height: 200px; }
        
        .event-item {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--primary-green);
            padding: 12px; margin-bottom: 12px;
            border-radius: 8px; position: relative;
            transition: 0.2s;
        }
        .event-item:hover { background: rgba(255, 255, 255, 0.1); }
        .event-item h4 { font-size: 1rem; margin: 0 0 5px 0; color: white; font-weight: 700; }
        .event-item p { font-size: 0.85rem; margin: 0; color: #ccc; display: flex; align-items: center; gap: 5px; }
        .event-time { font-weight: 800; color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 5px; display: block;}
        
        .btn-add-event {
            background: linear-gradient(135deg, #147a30, #0e5a22);
            color: white; border: none; padding: 12px;
            border-radius: 12px; font-weight: 800; margin-top: 15px;
            width: 100%; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(20, 122, 48, 0.3);
        }
        .btn-add-event:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20, 122, 48, 0.5); }

        /* --- MODAL (POPUP) --- */
        .modal-content { background-color: #222; color: white; border: 1px solid #444; border-radius: 15px; }
        .modal-header { border-bottom: 1px solid #444; }
        .modal-footer { border-top: 1px solid #444; }
        .form-control, .form-select { background-color: #333; border: 1px solid #555; color: white; border-radius: 8px; padding: 10px; }
        .form-control:focus, .form-select:focus { background-color: #333; color: white; border-color: var(--accent-gold); box-shadow: none; }
        
        /* LOADING */
        #loadingOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            color: var(--accent-gold); flex-direction: column;
            backdrop-filter: blur(5px);
        }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 900px) {
            .main-wrapper { grid-template-columns: 1fr; gap: 30px; } /* Chuyển thành 1 cột */
            .sidebar { max-height: none; }
            .day { height: 50px; font-size: 0.9rem; } /* Giảm chiều cao ô ngày */
            .event-dots { margin-top: 2px; gap: 2px; }
            .dot { width: 4px; height: 4px; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner-border mb-3 text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
        <div class="fw-bold">Đang đồng bộ dữ liệu...</div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-check me-2 text-warning"></i>Lịch Chụp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a href="managa.html" class="nav-link"><i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn-nav" onclick="prevMonth()"><i class="fas fa-chevron-left"></i></button>
                <div class="month-year" id="monthYear">...</div>
                <button class="btn-nav" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="weekdays">
                <div>CN</div><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div>
            </div>
            <div class="days" id="daysGrid">
                </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-clipboard-list me-2"></i>Chi Tiết</h3>
                <button class="btn btn-sm btn-outline-warning rounded-pill px-3" onclick="fetchAllEvents(false)">
                    <i class="fas fa-sync-alt me-1"></i> Làm mới
                </button>
            </div>
            
            <div class="selected-date-title" id="selectedDateDisplay">Hôm nay</div>
            
            <div class="event-list" id="eventList">
                </div>

            <button class="btn-add-event" onclick="openAddModal()">
                <i class="fas fa-plus-circle me-2"></i> Đặt Lịch Mới
            </button>
        </div>

    </div>

    <div class="modal fade" id="addEventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-warning fw-bold"><i class="fas fa-camera me-2"></i>Đặt Lịch Chụp</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEventForm">
                        <div class="mb-3">
                            <label class="form-label text-white-50 fw-bold">Tên Khách Hàng</label>
                            <input type="text" class="form-control" id="clientName" placeholder="Nhập tên khách..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 fw-bold">Loại Dịch Vụ</label>
                            <select class="form-select" id="shootType">
                                <option value="Cưới (Wedding)">💍 Chụp Cưới (Wedding)</option>
                                <option value="Tiệc (Party)">🎉 Chụp Tiệc / Sự Kiện</option>
                                <option value="Chân Dung (Portrait)">📸 Chân Dung / Profile</option>
                                <option value="Gia Đình (Family)">👨‍👩‍👧‍👦 Chụp Gia Đình</option>
                                <option value="Khác">🔹 Khác</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 fw-bold">Thời Gian</label>
                            <input type="time" class="form-control" id="eventTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 fw-bold">Ghi Chú (Tùy chọn)</label>
                            <textarea class="form-control" id="eventNote" rows="2" placeholder="Địa điểm, yêu cầu..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success fw-bold px-4" onclick="saveEvent()">Lưu Lịch</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ======================================================
        // ⚠️ CẤU HÌNH WEBHOOK (Thay link n8n của bạn vào đây)
        // ======================================================
        const URL_GET_CALENDAR = 'https://dichvufb.tino.page/webhook/get-calendar-events';
        const URL_ADD_EVENT = 'https://dichvufb.tino.page/webhook/add-calendar-event';
        
        // Tự động làm mới sau 30 giây (Silent Refresh)
        const AUTO_REFRESH_INTERVAL = 30000; 

        // ======================================================
        // LOGIC CHÍNH
        // ======================================================
        const date = new Date();
        let currentMonth = date.getMonth();
        let currentYear = date.getFullYear();
        let selectedDate = new Date();
        let events = {}; 

        const monthYearEl = document.getElementById('monthYear');
        const daysGridEl = document.getElementById('daysGrid');
        const eventListEl = document.getElementById('eventList');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const modal = new bootstrap.Modal(document.getElementById('addEventModal'));
        const loadingOverlay = document.getElementById('loadingOverlay');

        // 1. LOAD DỮ LIỆU
        async function fetchAllEvents(isSilent = false) {
            if (!isSilent) loadingOverlay.style.display = 'flex';

            try {
                const res = await fetch(URL_GET_CALENDAR);
                if (!res.ok) throw new Error("Lỗi kết nối server");
                
                const data = await res.json();
                events = {}; // Reset
                
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        // item.date phải là format YYYY-MM-DD từ server
                        if (!events[item.date]) events[item.date] = [];
                        events[item.date].push(item);
                    });
                }
                
                renderCalendar();
                if(isSilent) console.log("Auto-refreshed: " + new Date().toLocaleTimeString());

            } catch (error) {
                console.error(error);
                if(!isSilent) alert("Không thể tải dữ liệu lịch. Vui lòng kiểm tra kết nối.");
            } finally {
                if (!isSilent) loadingOverlay.style.display = 'none';
            }
        }

        // 2. RENDER CALENDAR
        function renderCalendar() {
            date.setDate(1);
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
            const lastDayIndex = new Date(currentYear, currentMonth + 1, 0).getDay();
            const nextDays = 7 - lastDayIndex - 1;

            const months = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            monthYearEl.innerText = `${months[currentMonth]} ${currentYear}`;

            let days = "";

            for (let x = firstDayIndex; x > 0; x--) {
                days += `<div class="day prev-date">${prevLastDay - x + 1}</div>`;
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateKey = formatDateKey(currentYear, currentMonth, i);
                const hasEvent = events[dateKey] && events[dateKey].length > 0;
                
                const isToday = i === new Date().getDate() && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear();
                const isSelected = i === selectedDate.getDate() && currentMonth === selectedDate.getMonth() && currentYear === selectedDate.getFullYear();

                let dotsHtml = '';
                if (hasEvent) {
                    const count = Math.min(events[dateKey].length, 3);
                    for(let d=0; d<count; d++) dotsHtml += `<div class="dot"></div>`;
                }

                days += `<div class="day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate(${i})">
                            ${i}
                            <div class="event-dots">${dotsHtml}</div>
                         </div>`;
            }

            for (let j = 1; j <= nextDays + 1; j++) { 
                 if(days.split('class="day').length < 35) { /* Fill gap if needed */ }
            }

            daysGridEl.innerHTML = days;
            renderEventList();
        }

        function selectDate(day) {
            selectedDate = new Date(currentYear, currentMonth, day);
            renderCalendar();
        }

        function renderEventList() {
            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            const dayEvents = events[dateKey] || [];

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            selectedDateDisplay.innerText = selectedDate.toLocaleDateString('vi-VN', options);

            if (dayEvents.length === 0) {
                eventListEl.innerHTML = `<div class="text-center text-muted mt-5 opacity-50">
                    <i class="far fa-calendar-times fa-3x mb-3"></i><br>Không có lịch chụp.
                </div>`;
            } else {
                let html = '';
                // Sắp xếp theo giờ
                dayEvents.sort((a, b) => a.time.localeCompare(b.time));

                dayEvents.forEach((ev) => {
                    html += `
                        <div class="event-item">
                            <span class="event-time"><i class="far fa-clock me-1"></i>${ev.time}</span>
                            <h4>${ev.client}</h4>
                            <p class="text-white-50"><i class="fas fa-camera me-2"></i>${ev.type}</p>
                            ${ev.note ? `<p style="font-style:italic; font-size:0.8rem; margin-top:5px;"><i class="fas fa-sticky-note me-2"></i>${ev.note}</p>` : ''}
                        </div>
                    `;
                });
                eventListEl.innerHTML = html;
            }
        }

        // 3. THÊM SỰ KIỆN
        function openAddModal() { document.getElementById('addEventForm').reset(); modal.show(); }

        async function saveEvent() {
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('shootType').value;
            const time = document.getElementById('eventTime').value;
            const note = document.getElementById('eventNote').value;

            if (!name || !time) { alert("Vui lòng nhập tên và giờ!"); return; }

            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            
            const newEvent = {
                date: dateKey,
                client: name,
                type: type,
                time: time,
                note: note
            };

            const btnSave = document.querySelector('.modal-footer .btn-success');
            const oldText = btnSave.innerText;
            btnSave.innerText = "Đang lưu...";
            btnSave.disabled = true;

            try {
                const res = await fetch(URL_ADD_EVENT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEvent)
                });

                if (res.ok) {
                    if (!events[dateKey]) events[dateKey] = [];
                    events[dateKey].push(newEvent);
                    
                    renderCalendar();
                    modal.hide();
                    
                    // Trigger refresh ngầm để đồng bộ ID
                    setTimeout(() => fetchAllEvents(true), 500);
                } else {
                    alert("Lỗi khi lưu vào server.");
                }
            } catch (e) {
                alert("Lỗi kết nối: " + e.message);
            } finally {
                btnSave.innerText = oldText;
                btnSave.disabled = false;
            }
        }

        function prevMonth() { currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} renderCalendar(); }
        function nextMonth() { currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} renderCalendar(); }
        
        function formatDateKey(year, month, day) { 
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; 
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            fetchAllEvents(false); // Load lần đầu
            setInterval(() => fetchAllEvents(true), AUTO_REFRESH_INTERVAL); // Auto refresh
        });
    </script>
</body>
</html>
