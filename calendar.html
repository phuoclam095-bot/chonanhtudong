<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUẢN LÝ LỊCH CHỤP PRO - CHONANHNHANH.VN</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00ebb0;
            --primary-dark: #008f6c;
            --gold-vip: #f0c300;
            --bg-deep: #050a14;
            --card-glass: rgba(10, 17, 36, 0.9);
            --border-glass: rgba(255, 255, 255, 0.1);
            --neon: 0 0 15px rgba(0, 235, 176, 0.4);
        }

        body {
            background-color: var(--bg-deep);
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 1) 0%, rgba(5, 10, 20, 0.8) 40%, rgba(5, 10, 20, 0.95) 100%), url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding-top: 100px;
        }

        /* --- NAVBAR VIP --- */
        .navbar {
            background: rgba(5, 10, 20, 0.95);
            backdrop-filter: blur(30px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            min-height: 85px;
        }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); letter-spacing: 1px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        .nav-link:hover { color: var(--primary) !important; }

        /* --- LAYOUT --- */
        .main-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        /* --- CALENDAR CARD --- */
        .calendar-container {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .month-year { font-size: 1.8rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn-nav {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass); color: white;
            width: 45px; height: 45px; border-radius: 15px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-nav:hover { background: var(--primary); color: #000; box-shadow: var(--neon); }

        .weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-weight: 800; color: var(--primary); margin-bottom: 15px;
            text-transform: uppercase; font-size: 0.85rem;
        }
        .days {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .day {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.03);
            border-radius: 18px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem;
            cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border-glass);
            position: relative;
        }
        .day:hover { background: rgba(0, 235, 176, 0.1); border-color: var(--primary); transform: scale(1.05); z-index: 2; }
        
        .day.today { border-color: var(--gold-vip); color: var(--gold-vip); box-shadow: 0 0 15px rgba(240, 195, 0, 0.2); background: rgba(240, 195, 0, 0.05); }
        .day.selected { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: var(--neon); }
        .day.prev-date, .day.next-date { opacity: 0.15; pointer-events: none; }

        .dot { width: 6px; height: 6px; background-color: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); margin: 2px; }

        /* --- SIDEBAR LIST --- */
        .sidebar {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 30px;
            max-height: 85vh;
            display: flex; flex-direction: column;
        }

        .sidebar h3 { font-size: 1.4rem; font-weight: 900; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; }
        .selected-date-title { font-size: 0.9rem; margin-bottom: 25px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px;}

        .event-list { overflow-y: auto; flex: 1; padding-right: 8px; }
        
        /* --- EVENT ITEM CARDS --- */
        .event-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            padding: 20px; margin-bottom: 15px;
            border-radius: 20px; position: relative;
            transition: 0.3s;
        }
        .event-item:hover { background: rgba(255,255,255,0.06); border-color: var(--primary); }
        
        .status-badge {
            font-size: 0.65rem; padding: 4px 10px; border-radius: 50px; font-weight: 900;
            text-transform: uppercase; margin-bottom: 10px; display: inline-block;
        }
        .status-pending { background: rgba(240, 195, 0, 0.2); color: var(--gold-vip); }
        .status-paid { background: rgba(0, 235, 176, 0.2); color: var(--primary); }

        .event-item h4 { font-size: 1.1rem; font-weight: 800; margin: 0 0 8px 0; color: #fff; }
        .event-item p { font-size: 0.85rem; margin: 0; color: #94a3b8; line-height: 1.5; }
        .event-time { font-weight: 900; color: #fff; font-size: 0.9rem; margin-bottom: 5px; display: block;}
        
        .btn-delete-event {
            position: absolute; top: 20px; right: 15px;
            color: rgba(255,255,255,0.2); cursor: pointer;
            background: none; border: none; transition: 0.3s;
        }
        .btn-delete-event:hover { color: #ff4757; transform: scale(1.2); }

        .btn-add-event {
            background: var(--primary);
            color: #000; border: none; padding: 18px;
            border-radius: 20px; font-weight: 900; margin-top: 20px;
            width: 100%; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: var(--neon);
        }
        .btn-add-event:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* --- MODAL LUXURY --- */
        .modal-content { background: #080d1a; border: 1px solid var(--primary); border-radius: 30px; box-shadow: 0 0 40px rgba(0, 235, 176, 0.2); }
        .modal-header { border: none; padding: 30px 30px 10px; }
        .modal-footer { border: none; padding: 10px 30px 30px; }
        .form-control, .form-select { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); color: white; 
            border-radius: 15px; padding: 12px 18px;
        }
        .form-control:focus { background: rgba(0,0,0,0.7); color: white; border-color: var(--primary); box-shadow: var(--neon); }

        @media (max-width: 1000px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .day { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="#"><i class="fas fa-camera-retro me-2"></i>STUDIO PLANNER PRO</a>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="managa.html" class="nav-link"><i class="fas fa-th-large me-1"></i> Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn-nav" onclick="prevMonth()"><i class="fas fa-chevron-left"></i></button>
                <div class="month-year" id="monthYear">Tháng 12 2025</div>
                <button class="btn-nav" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="weekdays">
                <div>CN</div><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div>
            </div>
            <div class="days" id="daysGrid"></div>
        </div>

        <div class="sidebar">
            <h3><i class="fas fa-calendar-check me-2"></i>LỊCH TRÌNH</h3>
            <div class="selected-date-title" id="selectedDateDisplay">Chọn ngày</div>
            
            <div class="event-list" id="eventList"></div>

            <button class="btn-add-event" onclick="openAddModal()">
                <i class="fas fa-plus-circle me-2"></i> ĐẶT LỊCH MỚI
            </button>
        </div>
    </div>

    <div class="modal fade" id="addEventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-900 text-primary"><i class="fas fa-magic me-2"></i>THIẾT LẬP LỊCH CHỤP</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEventForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Khách Hàng</label>
                            <input type="text" class="form-control" id="clientName" placeholder="Tên khách hàng..." required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Gói Chụp</label>
                                <select class="form-select" id="shootType">
                                    <option value="Wedding">💍 Chụp Cưới</option>
                                    <option value="Event">🎉 Chụp Tiệc</option>
                                    <option value="Portrait">📸 Chân Dung</option>
                                    <option value="Family">👨‍👩‍👧‍👦 Gia Đình</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Trạng Thái</label>
                                <select class="form-select" id="eventStatus">
                                    <option value="pending">🟡 Chờ xác nhận</option>
                                    <option value="paid">🟢 Đã đặt cọc</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Thời Gian Bắt Đầu</label>
                            <input type="time" class="form-control" id="eventTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Địa điểm & Ghi chú</label>
                            <textarea class="form-control" id="eventNote" rows="3" placeholder="Địa chỉ chụp, yêu cầu trang phục..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary rounded-pill px-5 fw-bold text-black" onclick="saveEvent()">XÁC NHẬN ĐẶT LỊCH</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let date = new Date();
        let currentMonth = date.getMonth();
        let currentYear = date.getFullYear();
        let selectedDate = new Date();
        let events = JSON.parse(localStorage.getItem('photo_planner_v2')) || {};

        const monthYearEl = document.getElementById('monthYear');
        const daysGridEl = document.getElementById('daysGrid');
        const eventListEl = document.getElementById('eventList');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const modal = new bootstrap.Modal(document.getElementById('addEventModal'));

        const months = ["Tháng Một", "Tháng Hai", "Tháng Ba", "Tháng Tư", "Tháng Năm", "Tháng Sáu", "Tháng Bảy", "Tháng Tám", "Tháng Chín", "Tháng Mười", "Tháng Mười Một", "Tháng Mười Hai"];

        function renderCalendar() {
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
            const lastDayIndex = new Date(currentYear, currentMonth + 1, 0).getDay();
            const nextDays = 7 - lastDayIndex - 1;

            monthYearEl.innerText = `${months[currentMonth]} ${currentYear}`;
            let days = "";

            for (let x = firstDayIndex; x > 0; x--) {
                days += `<div class="day prev-date">${prevLastDay - x + 1}</div>`;
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateKey = formatDateKey(currentYear, currentMonth, i);
                const dayEvents = events[dateKey] || [];
                const isToday = i === new Date().getDate() && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear();
                const isSelected = i === selectedDate.getDate() && currentMonth === selectedDate.getMonth() && currentYear === selectedDate.getFullYear();

                let dots = "";
                dayEvents.slice(0, 3).forEach(() => dots += `<div class="dot"></div>`);

                days += `<div class="day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate(${i})">
                            ${i}
                            <div class="d-flex mt-1">${dots}</div>
                         </div>`;
            }

            for (let j = 1; j <= nextDays; j++) {
                days += `<div class="day next-date">${j}</div>`;
            }

            daysGridEl.innerHTML = days;
            renderEventList();
        }

        function selectDate(day) {
            selectedDate = new Date(currentYear, currentMonth, day);
            renderCalendar();
        }

        function renderEventList() {
            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            const dayEvents = events[dateKey] || [];
            selectedDateDisplay.innerText = selectedDate.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            if (dayEvents.length === 0) {
                eventListEl.innerHTML = `<div class="text-center text-muted mt-5 opacity-50"><i class="fas fa-ghost fa-3x mb-3"></i><br>Trống lịch ngày này</div>`;
            } else {
                eventListEl.innerHTML = dayEvents.sort((a,b) => a.time.localeCompare(b.time)).map((ev, idx) => `
                    <div class="event-item">
                        <span class="status-badge ${ev.status === 'paid' ? 'status-paid' : 'status-pending'}">
                            ${ev.status === 'paid' ? '● Đã đặt cọc' : '○ Chờ duyệt'}
                        </span>
                        <span class="event-time"><i class="far fa-clock me-2 text-primary"></i>${ev.time}</span>
                        <h4>${ev.client}</h4>
                        <p><i class="fas fa-tag me-2"></i>Gói: ${ev.type}</p>
                        ${ev.note ? `<p class="mt-2 small opacity-75"><i class="fas fa-map-marker-alt me-2"></i>${ev.note}</p>` : ''}
                        <button class="btn-delete-event" onclick="deleteEvent('${dateKey}', ${idx})"><i class="fas fa-times-circle"></i></button>
                    </div>
                `).join('');
            }
        }

        function openAddModal() {
            document.getElementById('addEventForm').reset();
            modal.show();
        }

        function saveEvent() {
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('shootType').value;
            const status = document.getElementById('eventStatus').value;
            const time = document.getElementById('eventTime').value;
            const note = document.getElementById('eventNote').value;

            if (!name || !time) return alert("Vui lòng điền đầy đủ!");

            const dateKey = formatDateKey(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            if (!events[dateKey]) events[dateKey] = [];
            
            events[dateKey].push({ client: name, type, status, time, note });
            localStorage.setItem('photo_planner_v2', JSON.stringify(events));
            modal.hide();
            renderCalendar();
        }

        function deleteEvent(key, idx) {
            if (confirm("Xóa lịch chụp này?")) {
                events[key].splice(idx, 1);
                if (events[key].length === 0) delete events[key];
                localStorage.setItem('photo_planner_v2', JSON.stringify(events));
                renderCalendar();
            }
        }

        function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
        function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }
        function formatDateKey(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        document.addEventListener('DOMContentLoaded', renderCalendar);
    </script>
</body>
</html>
