<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIX NAVIGATION - STUDIO MANAGER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --gold-vip: #f0c300; --bg-deep: #050a14; --neon: 0 0 15px rgba(0, 235, 176, 0.4); --gold-muted: #b89b00; }
        body { background-color: var(--bg-deep); background-image: linear-gradient(rgba(5, 10, 20, 0.85), rgba(5, 10, 20, 0.85)), url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; font-family: 'Montserrat', sans-serif; padding-top: 100px; height: 100vh; overflow: hidden; }
        
        .navbar { background: rgba(5, 10, 20, 0.95); border-bottom: 1px solid rgba(255,255,255,0.08); min-height: 85px; position: fixed; width: 100%; top: 0; z-index: 2000; }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); font-size: 1.2rem; }
        .navbar-nav.mx-auto { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; padding: 12px 18px !important; }
        .nav-link.active { color: var(--primary) !important; text-shadow: var(--neon); }

        .main-wrapper { max-width: 1400px; margin: 0 auto; padding: 15px; display: grid; grid-template-columns: 1fr 420px; gap: 25px; height: calc(100vh - 130px); overflow: hidden; }
        .calendar-container { background: rgba(10, 17, 36, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 35px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; position: relative; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        /* NỔI BẬT MŨI TÊN */
        .btn-nav { background: rgba(0, 235, 176, 0.2); border: 2px solid var(--primary); color: var(--primary); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: var(--neon); cursor: pointer; }
        .btn-nav:hover { background: var(--primary); color: #000; transform: scale(1.1); }
        
        .month-year-display { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; display: flex; gap: 15px; }
        .month-year-display span { cursor: pointer; border-radius: 8px; padding: 2px 8px; transition: 0.3s; }
        .month-year-display span:hover { background: rgba(0, 235, 176, 0.15); color: var(--primary); }

        .quick-selector { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 90%; background: #080d1a; border: 1px solid var(--primary); border-radius: 25px; padding: 20px; display: none; z-index: 1000; box-shadow: 0 0 50px #000; }
        .selector-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .selector-item { padding: 12px; text-align: center; font-weight: 800; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.05); }
        .selector-item:hover { background: var(--primary); color: #000; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 800; color: var(--primary); margin-bottom: 12px; font-size: 0.9rem; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1; }
        .day { min-height: 65px; background: rgba(255,255,255,0.03); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .day.today { border: 2px solid var(--gold-vip); color: var(--gold-vip); background: rgba(240, 195, 0, 0.1); }
        .day.selected { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: var(--neon); }
        .day.other-month { opacity: 0.2; cursor: default; }
        .lunar-day { font-size: 0.7rem; opacity: 0.7; font-weight: 600; margin-top: 2px; }

        .sidebar { background: rgba(10, 17, 36, 0.85); border-radius: 35px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .s-tab { cursor: pointer; font-weight: 900; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; padding: 5px 10px; }
        .s-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .event-list { overflow-y: auto; flex: 1; padding-right: 5px; }
        .event-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; margin-bottom: 12px; border-radius: 20px; border-left: 5px solid var(--primary); position: relative; cursor: pointer; }
        .status-badge { font-size: 0.65rem; font-weight: 900; padding: 4px 10px; border-radius: 30px; text-transform: uppercase; }
        .badge-wait { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; }
        .badge-done { background: rgba(0, 235, 176, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .btn-action { background: linear-gradient(45deg, #00ebb0, #00a87e); color: #000; font-weight: 900; padding: 16px; border-radius: 50px; width: 100%; border: none; text-transform: uppercase; box-shadow: var(--neon); margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand">CHONANHNHANH.VN</a>
            <div class="collapse navbar-collapse d-block">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link active">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="donate.html" class="nav-link">Donate</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link">Liên Hệ</a></li>
                    <li class="nav-item"><a href="fedback.html" class="nav-link">Góp Ý</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn btn-nav" id="btnPrev"><i class="fas fa-chevron-left"></i></button>
                <div class="month-year-display">
                    <span id="monthTitle" onclick="toggleQuickSelector('month')"></span>
                    <span id="yearTitle" onclick="toggleQuickSelector('year')"></span>
                </div>
                <button class="btn btn-nav" id="btnNext"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div id="quickSelector" class="quick-selector">
                <div id="selectorGrid" class="selector-grid"></div>
                <button class="btn btn-sm btn-outline-danger w-100 mt-3 rounded-pill" onclick="toggleQuickSelector()">ĐÓNG</button>
            </div>

            <div class="weekdays"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div></div>
            <div id="daysGrid" class="days"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-tabs"><div class="s-tab active" id="tabLich" onclick="switchTab('lich')">LỊCH NGÀY</div><div class="s-tab" id="tabDash" onclick="switchTab('dash')">DASHBOARD</div></div>
            <p id="dateInfo" class="small opacity-75 mb-3 fw-bold"></p>
            <div id="eventList" class="event-list"></div>
            <button class="btn-action" onclick="showModal()"><i class="fas fa-calendar-plus me-2"></i> THÊM LỊCH MỚI</button>
        </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: #080d1a; border: 2px solid var(--primary); border-radius: 30px;">
                <div class="modal-body p-4">
                    <h5 class="fw-900 text-primary mb-4 uppercase text-center" id="modalTitle">THIẾT LẬP LỊCH</h5>
                    <form id="showForm">
                        <input type="hidden" id="editIndex">
                        <input type="hidden" id="editDateKey">
                        <input type="text" class="form-control mb-3" id="cName" placeholder="Tên khách hàng..." required style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;">
                        <input type="text" class="form-control mb-3" id="cPhone" placeholder="Số điện thoại..." style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;">
                        <div class="row">
                            <div class="col-6 mb-3"><select class="form-select" id="sType" style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;"><option value="Wedding">💍 Gói Chụp Cưới</option><option value="Party">🎉 Gói Chụp Tiệc</option><option value="Portrait">📸 Chân Dung</option><option value="Family">👨‍👩‍👧 Gia Đình</option><option value="Other">🌀 Gói Khác</option></select></div>
                            <div class="col-6 mb-3"><input type="time" class="form-control" id="sTime" required style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;"></div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3"><select class="form-select" id="sStatus" style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;"><option value="wait">🟡 Chờ cọc</option><option value="done">🟢 Đã cọc</option></select></div>
                            <div class="col-6 mb-3"><input type="text" class="form-control" id="sDeposit" placeholder="Cọc: 1,000,000" style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;"></div>
                        </div>
                        <textarea class="form-control mb-4" id="sNote" rows="2" placeholder="Ghi chú địa điểm..." style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px;"></textarea>
                        <button type="button" class="btn-action w-100" onclick="saveShow()">XÁC NHẬN LƯU</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let curr = new Date(); let sel = new Date(); let currentView = 'lich';
        let store = JSON.parse(localStorage.getItem('studio_pro_v24')) || {};
        const monthsArr = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];

        function getLunar(d, m, y) {
            const base = new Date(2025, 11, 22); const target = new Date(y, m, d);
            const diff = Math.floor((target - base) / 86400000);
            let l = 3 + diff; while(l <= 0) l += 30; return l > 30 ? l % 30 || 30 : l;
        }

        // FIX TRIỆT ĐỂ LỖI ĐIỀU HƯỚNG
        function render() {
            const y = curr.getFullYear(), m = curr.getMonth();
            if (isNaN(y) || isNaN(m)) { curr = new Date(); render(); return; } // Bảo vệ dữ liệu
            
            document.getElementById('monthTitle').innerText = monthsArr[m];
            document.getElementById('yearTitle').innerText = y;
            
            let firstDayRaw = new Date(y, m, 1).getDay();
            let firstDay = (firstDayRaw === 0) ? 6 : firstDayRaw - 1;
            const lastDate = new Date(y, m + 1, 0).getDate();
            const prevLastDate = new Date(y, m, 0).getDate();
            
            let html = "";
            for(let i = firstDay; i > 0; i--) {
                const d = prevLastDate - i + 1;
                html += `<div class="day other-month"><span>${d}</span><span class="lunar-day">${getLunar(d, m-1, y)}</span></div>`;
            }
            for(let i = 1; i <= lastDate; i++) {
                const isToday = i === new Date().getDate() && m === new Date().getMonth() && y === new Date().getFullYear();
                const isSel = i === sel.getDate() && m === sel.getMonth() && y === sel.getFullYear();
                const key = `${y}-${m+1}-${i}`;
                html += `<div class="day ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDay(${i})"><span>${i}</span><span class="lunar-day">${getLunar(i, m, y)}</span>${store[key] ? '<div style="width:6px;height:6px;background:var(--primary);border-radius:50%;margin-top:2px;"></div>' : ''}</div>`;
            }
            const remaining = 42 - (firstDay + lastDate);
            for(let j = 1; j <= remaining; j++) {
                html += `<div class="day other-month"><span>${j}</span><span class="lunar-day">${getLunar(j, m+1, y)}</span></div>`;
            }
            document.getElementById('daysGrid').innerHTML = html;
            updateList();
        }

        // SỬA LỖI MŨI TÊN
        document.getElementById('btnPrev').addEventListener('click', () => { curr.setMonth(curr.getMonth() - 1); render(); });
        document.getElementById('btnNext').addEventListener('click', () => { curr.setMonth(curr.getMonth() + 1); render(); });

        function selectDay(d) { sel = new Date(curr.getFullYear(), curr.getMonth(), d); currentView = 'lich'; render(); }

        function toggleQuickSelector(type) {
            const box = document.getElementById('quickSelector');
            const grid = document.getElementById('selectorGrid');
            if (!type) { box.style.display = 'none'; return; }
            box.style.display = 'block'; grid.innerHTML = '';
            if (type === 'month') {
                monthsArr.forEach((m, idx) => { grid.innerHTML += `<div class="selector-item" onclick="jumpToMonth(${idx})">${m}</div>`; });
            } else {
                for (let y = 2025; y <= 2030; y++) { grid.innerHTML += `<div class="selector-item" onclick="jumpToYear(${y})">${y}</div>`; }
            }
        }
        function jumpToMonth(m) { curr.setMonth(m); toggleQuickSelector(); render(); }
        function jumpToYear(y) { curr.setFullYear(y); toggleQuickSelector(); render(); }

        function switchTab(t) { currentView = t; document.getElementById('tabLich').classList.toggle('active', t==='lich'); document.getElementById('tabDash').classList.toggle('active', t==='dash'); updateList(); }

        function showModal(index = null, dateKey = null) { 
            document.getElementById('showForm').reset();
            const key = dateKey || `${sel.getFullYear()}-${sel.getMonth()+1}-${sel.getDate()}`;
            if (index !== null) {
                const it = store[key][index];
                document.getElementById('modalTitle').innerText = "CHỈNH SỬA LỊCH";
                document.getElementById('editIndex').value = index; document.getElementById('editDateKey').value = key;
                document.getElementById('cName').value = it.name; document.getElementById('cPhone').value = it.phone;
                document.getElementById('sType').value = it.type; document.getElementById('sTime').value = it.time;
                document.getElementById('sStatus').value = it.status; document.getElementById('sDeposit').value = it.deposit;
                document.getElementById('sNote').value = it.note;
            } else {
                document.getElementById('modalTitle').innerText = "THIẾT LẬP LỊCH";
                document.getElementById('editIndex').value = ""; document.getElementById('editDateKey').value = "";
            }
            new bootstrap.Modal(document.getElementById('eventModal')).show(); 
        }

        function updateList() {
            const eventList = document.getElementById('eventList');
            if (currentView === 'lich') {
                const key = `${sel.getFullYear()}-${sel.getMonth()+1}-${sel.getDate()}`;
                document.getElementById('dateInfo').innerText = sel.toLocaleDateString('vi-VN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
                const items = store[key] || [];
                eventList.innerHTML = items.length ? items.map((it, idx) => generateItemHtml(it, idx, key)).join('') : '<div class="text-center mt-5 opacity-25">TRỐNG LỊCH TRÌNH</div>';
            } else {
                document.getElementById('dateInfo').innerText = "DASHBOARD TỔNG HỢP";
                let allItems = [];
                Object.keys(store).forEach(k => store[k].forEach((it, idx) => allItems.push({ ...it, idx, key: k })));
                allItems.sort((a, b) => new Date(b.key) - new Date(a.key));
                eventList.innerHTML = allItems.length ? allItems.map(it => generateItemHtml(it, it.idx, it.key, true)).join('') : '<div class="text-center mt-5 opacity-25">CHƯA CÓ DỮ LIỆU</div>';
            }
        }

        function generateItemHtml(it, idx, key, showDate = false) {
            return `
                <div class="event-item" onclick="showModal(${idx}, '${key}')">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-900 text-primary small">${showDate ? key.split('-').reverse().join('/') + ' | ' : ''}${it.time}</span>
                        <span class="status-badge ${it.status === 'wait' ? 'badge-wait' : 'badge-done'}">${it.status === 'wait' ? '🟡 Chờ cọc' : '🟢 Đã cọc'}</span>
                    </div>
                    <div class="fw-900 mt-1">${it.name}</div>
                    <div class="small opacity-75 text-info mt-1"><i class="fas fa-sticky-note me-1"></i>${it.note || 'Không có ghi chú'}</div>
                    <div class="d-flex justify-content-between mt-2 align-items-end">
                        <span class="small opacity-50">${it.type} | ${it.phone}</span>
                        <div class="d-flex align-items-center gap-3"><span style="color:var(--gold-muted);font-size:0.75rem;font-weight:700;">${it.deposit || '0'}đ</span><button class="btn btn-sm text-danger p-0" onclick="event.stopPropagation(); deleteShow('${key}', ${idx})"><i class="fas fa-trash"></i></button></div>
                    </div>
                </div>`;
        }

        function saveShow() {
            const key = document.getElementById('editDateKey').value || `${sel.getFullYear()}-${sel.getMonth()+1}-${sel.getDate()}`;
            const editIdx = document.getElementById('editIndex').value;
            const data = { name: document.getElementById('cName').value, phone: document.getElementById('cPhone').value, type: document.getElementById('sType').value, time: document.getElementById('sTime').value, status: document.getElementById('sStatus').value, deposit: document.getElementById('sDeposit').value, note: document.getElementById('sNote').value };
            if(!store[key]) store[key] = [];
            if (editIdx !== "") store[key][editIdx] = data; else store[key].push(data);
            localStorage.setItem('studio_pro_v24', JSON.stringify(store));
            bootstrap.Modal.getInstance(document.getElementById('eventModal')).hide(); render();
        }

        function deleteShow(key, idx) { if(confirm("Xóa lịch trình này?")) { store[key].splice(idx, 1); if(store[key].length === 0) delete store[key]; localStorage.setItem('studio_pro_v24', JSON.stringify(store)); render(); } }
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
