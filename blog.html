<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
            --card-bg: #ffffff;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh;
        }
        
        /* NAVBAR */
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 700; transition: 0.3s; }
        .nav-link:hover { color: var(--accent-color) !important; transform: translateY(-2px); }

        /* HERO SECTION */
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; background-position: center;
            color: white; padding: 80px 20px; text-align: center;
            border-bottom: 5px solid var(--primary-green);
        }
        .hero-title { font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 15px; }
        
        /* SECTION HEADER & BUTTON */
        .section-header { 
            text-align: center; margin: 50px 0 30px 0; 
            color: var(--accent-color); font-weight: 800; font-size: 2rem; 
            text-shadow: 0 0 10px rgba(81, 255, 125, 0.3);
        }
        .btn-write-post {
            background: var(--accent-color); color: var(--dark-green);
            font-weight: 800; padding: 10px 25px; border-radius: 50px;
            border: none; box-shadow: 0 5px 15px rgba(81, 255, 125, 0.3);
            transition: 0.3s; font-size: 1rem;
        }
        .btn-write-post:hover { transform: scale(1.05); background: white; }

        /* BLOG CARDS */
        .blog-card {
            background: var(--card-bg); border: none; border-radius: 15px; overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s; height: 100%;
            display: flex; flex-direction: column;
        }
        .blog-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .blog-img { height: 200px; object-fit: cover; width: 100%; background: #eee; }
        .blog-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .blog-date { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .blog-author { font-size: 0.85rem; color: var(--primary-green); font-weight: 700; }
        .blog-title { font-weight: 700; font-size: 1.2rem; color: var(--dark-green); margin: 10px 0; }
        .blog-desc { font-size: 0.95rem; color: #555; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-read { 
            margin-top: 15px; background: transparent; border: 2px solid var(--primary-green); 
            color: var(--primary-green); font-weight: 700; padding: 5px 15px; border-radius: 50px; 
            transition: 0.3s; display: inline-block; width: fit-content; text-decoration: none;
        }
        .btn-read:hover { background: var(--primary-green); color: white; }

        /* REVIEW CARDS */
        .review-card {
            background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: relative;
            border-left: 5px solid var(--primary-green);
        }
        .user-avatar { width: 50px; height: 50px; background: #e0e0e0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .stars { color: #ffc107; font-size: 0.9rem; }
        .review-text { font-style: italic; color: #444; line-height: 1.6; }
        .quote-icon { position: absolute; top: 15px; right: 20px; font-size: 3rem; color: rgba(0,0,0,0.05); }

        .footer { text-align: center; color: rgba(255,255,255,0.5); padding: 30px; font-size: 0.9rem; }

        /* MODAL */
        .modal-content { border-radius: 20px; border: none; }
        .modal-header { background: var(--primary-green); color: white; border-radius: 20px 20px 0 0; }
        .form-control { border-radius: 10px; padding: 12px; }
        #imagePreviewContainer img { border: 2px dashed #ddd; border-radius: 10px; }
    </style>
</head>

    <div class="hero-section" style="margin-top: 60px;">

    <div class="modal fade" id="writePostModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-edit me-2"></i>Chia sẻ câu chuyện</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="postForm" onsubmit="submitPost(event)">
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <input type="email" id="postEmail" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold mb-1">Ảnh bìa bài viết</label>
                            <input type="file" id="postImageFile" class="form-control" accept="image/*" onchange="previewImage()">
                            <div id="imagePreviewContainer" class="mt-2" style="display:none;">
                                <img id="imgPreview" src="" style="width: 100%; height: 200px; object-fit: cover;">
                            </div>
                            <input type="hidden" id="postImageBase64">
                            <input type="hidden" id="postImageName">
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold mb-1">Tiêu đề bài viết</label>
                            <input type="text" id="postTitle" class="form-control" placeholder="Tiêu đề hấp dẫn..." required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold mb-1">Nội dung</label>
                            <textarea id="postContent" class="form-control" rows="6" placeholder="Viết nội dung tại đây..." required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" id="btnSubmitPost" class="btn btn-success fw-bold px-4">Gửi Duyệt</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ⚠️ THAY URL N8N CỦA BẠN VÀO ĐÂY
        const N8N_GET_BLOGS = 'https://dichvufb.tino.page/webhook/get-blogs';     
        const N8N_SUBMIT_BLOG = 'https://dichvufb.tino.page/webhook/submit-blog'; 

        // --- HÀM NÉN & RESIZE ẢNH (QUAN TRỌNG) ---
        function processImage() {
            const fileInput = document.getElementById('postImageFile');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const imgPreview = document.getElementById('imgPreview');
            const file = fileInput.files[0];

            if (file) {
                // Đọc file
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    
                    img.onload = function() {
                        // Tạo Canvas để vẽ lại ảnh (Resize)
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Giới hạn chiều rộng tối đa 800px (đủ nét cho web blog)
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        
                        // Vẽ ảnh lên canvas
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Xuất ra Base64 với định dạng JPEG, chất lượng 0.7 (Nén 30%)
                        // Kết quả: Ảnh từ 5MB -> còn khoảng 150KB
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        
                        // Hiển thị và Lưu
                        imgPreview.src = compressedBase64;
                        previewContainer.style.display = 'block';
                        document.getElementById('postImageBase64').value = compressedBase64;
                        document.getElementById('postImageName').value = file.name;
                    }
                }
            }
        }

        // --- GỬI BÀI VIẾT (ĐÃ CẬP NHẬT) ---
        async function submitPost(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitPost');
            
            // Lấy dữ liệu từ các ô input ẩn
            const imageBase64 = document.getElementById('postImageBase64').value;
            const imageName = document.getElementById('postImageName').value;

            if (!imageBase64) {
                alert("Vui lòng chọn ảnh bìa cho bài viết!");
                return;
            }

            const postData = {
                author: document.getElementById('postAuthor').value,
                email: document.getElementById('postEmail').value,
                title: document.getElementById('postTitle').value,
                content: document.getElementById('postContent').value,
                date: new Date().toLocaleDateString('vi-VN'),
                // Gửi ảnh đã nén
                image_data: imageBase64,
                image_name: imageName
            };

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải lên...';
            btn.disabled = true;

            try {
                await fetch(N8N_SUBMIT_BLOG, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                alert("✅ Gửi bài thành công! Ảnh đã được tối ưu và tải lên.");
                
                // Reset form
                document.getElementById('postForm').reset();
                document.getElementById('imagePreviewContainer').style.display = 'none';
                document.getElementById('postImageBase64').value = '';
                
                const modal = bootstrap.Modal.getInstance(document.getElementById('writePostModal'));
                modal.hide();

            } catch (error) {
                alert("Lỗi: " + error.message);
                console.error(error);
            } finally {
                btn.innerHTML = 'Gửi Duyệt';
                btn.disabled = false;
            }
        }

        // --- CẬP NHẬT HTML INPUT FILE ---
        // Bạn nhớ sửa lại thẻ input file trong HTML để gọi hàm mới:
        // <input type="file" id="postImageFile" ... onchange="processImage()">

        const demoBlogs = [ /* ...giữ nguyên... */ ];
        const demoReviews = [ /* ...giữ nguyên... */ ];

        function renderBlogHTML(blogs, container) { /* ...giữ nguyên... */ }
        function renderReviews() { /* ...giữ nguyên... */ }

            loadBlogs();
            renderReviews();
        });
    </script>
