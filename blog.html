<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Cộng Đồng</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-green: #147a30; --dark-green: #0e5a22; 
            --bg-color: #1a1a1a; --text-color: #f0f0f0; --accent-color: #51ff7d;
            --card-bg: #ffffff;
        }
        body { 
            margin: 0; padding: 0; font-family: 'Nunito', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%); 
            background-size: 60px 60px; background-position: 0 0, 30px 30px; 
            color: #333; min-height: 100vh;
        }
        .navbar { background: var(--primary-green); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 700; transition: 0.3s; }
        .nav-link:hover { color: var(--accent-color) !important; transform: translateY(-2px); }

        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; background-position: center;
            color: white; padding: 80px 20px; text-align: center;
            border-bottom: 5px solid var(--primary-green);
        }
        .hero-title { font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 15px; }
        
        .section-header { 
            text-align: center; margin: 50px 0 30px 0; 
            color: var(--accent-color); font-weight: 800; font-size: 2rem; 
            text-shadow: 0 0 10px rgba(81, 255, 125, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }

        /* Nút Viết Bài */
        .btn-write-post {
            background: var(--accent-color); color: var(--dark-green);
            font-weight: 800; padding: 10px 20px; border-radius: 50px;
            border: none; box-shadow: 0 5px 15px rgba(81, 255, 125, 0.3);
            transition: 0.3s; font-size: 1rem;
        }
        .btn-write-post:hover { transform: scale(1.05); background: white; }

        /* BLOG CARDS */
        .blog-card {
            background: var(--card-bg); border: none; border-radius: 15px; overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s; height: 100%;
            display: flex; flex-direction: column;
        }
        .blog-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .blog-img { height: 200px; object-fit: cover; width: 100%; }
        .blog-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .blog-date { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .blog-author { font-size: 0.85rem; color: var(--primary-green); font-weight: 700; margin-bottom: 5px; }
        .blog-title { font-weight: 700; font-size: 1.2rem; color: var(--dark-green); margin-bottom: 10px; }
        .blog-desc { font-size: 0.95rem; color: #555; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .footer { text-align: center; color: rgba(255,255,255,0.5); padding: 30px; font-size: 0.9rem; }

        /* Modal Custom */
        .modal-content { border-radius: 20px; border: none; }
        .modal-header { background: var(--primary-green); color: white; border-radius: 20px 20px 0 0; }
        .form-control { border-radius: 10px; padding: 12px; }
        .form-control:focus { border-color: var(--primary-green); box-shadow: 0 0 0 0.2rem rgba(20, 122, 48, 0.25); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-camera-retro me-2"></i>Studio LNP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="admin.html">Về Admin</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Blog</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="hero-section" style="margin-top: 60px;">
        <div class="container">
            <h1 class="hero-title">Góc Chia Sẻ & Cảm Nhận</h1>
            <p class="hero-subtitle">Nơi lưu giữ những khoảnh khắc và câu chuyện đẹp nhất.</p>
        </div>
    </div>

    <div class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
            <h2 class="section-header m-0"><i class="fas fa-newspaper"></i> Bài Viết Mới</h2>
            <button class="btn-write-post" data-bs-toggle="modal" data-bs-target="#writePostModal">
                <i class="fas fa-pen-fancy me-2"></i>Đăng Bài
            </button>
        </div>

        <div class="row g-4" id="blogGrid">
            <div class="col-12 text-center text-white py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2">Đang tải bài viết...</p>
            </div>
        </div>

    </div>

    <div class="footer">© 2025 Studio Lâm Nam Phước. All rights reserved.</div>

    <div class="modal fade" id="writePostModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-edit me-2"></i>Chia sẻ câu chuyện của bạn</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="postForm" onsubmit="submitPost(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold mb-1">Tên của bạn</label>
                                <input type="text" id="postAuthor" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold mb-1">Link Ảnh bìa (Nếu có)</label>
                                <input type="text" id="postImage" class="form-control" placeholder="https://...">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold mb-1">Tiêu đề bài viết</label>
                            <input type="text" id="postTitle" class="form-control" placeholder="Tiêu đề hấp dẫn..." required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold mb-1">Nội dung</label>
                            <textarea id="postContent" class="form-control" rows="6" placeholder="Viết nội dung tại đây..." required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" id="btnSubmitPost" class="btn btn-success fw-bold px-4">Gửi Duyệt</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ⚠️ THAY URL N8N CỦA BẠN VÀO ĐÂY SAU KHI TẠO WORKFLOW
        const N8N_GET_BLOGS = 'https://dichvufb.tino.page/webhook/get-blogs';     // Method GET
        const N8N_SUBMIT_BLOG = 'https://dichvufb.tino.page/webhook/submit-blog'; // Method POST

        // 1. TẢI DANH SÁCH BÀI VIẾT
        async function loadBlogs() {
            const container = document.getElementById('blogGrid');
            try {
                const response = await fetch(N8N_GET_BLOGS);
                if(!response.ok) throw new Error("Lỗi kết nối");
                
                const data = await response.json();
                // Xử lý nếu n8n trả về {data: [...]} hoặc [...]
                const blogs = Array.isArray(data) ? data : (data.data || []);

                if (blogs.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-white">Chưa có bài viết nào. Hãy là người đầu tiên!</div>';
                    return;
                }

                let html = '';
                blogs.forEach(blog => {
                    // Ảnh mặc định nếu không có ảnh
                    const imgUrl = blog.image || 'https://via.placeholder.com/500x300?text=No+Image';
                    
                    html += `
                    <div class="col-md-4">
                        <div class="blog-card">
                            <img src="${imgUrl}" class="blog-img" alt="Blog Image" onerror="this.src='https://via.placeholder.com/500x300?text=Error'">
                            <div class="blog-body">
                                <div class="d-flex justify-content-between">
                                    <div class="blog-date"><i class="far fa-clock me-1"></i>${blog.date || 'Mới nhất'}</div>
                                    <div class="blog-author"><i class="far fa-user me-1"></i>${blog.author}</div>
                                </div>
                                <div class="blog-title mt-2">${blog.title}</div>
                                <div class="blog-desc">${blog.content}</div>
                                <button class="btn-read mt-3" style="border:none; background:none; color:var(--primary-green); font-weight:bold; padding:0;">
                                    Đọc tiếp <i class="fas fa-arrow-right ms-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="col-12 text-center text-danger bg-white p-3 rounded">Không tải được bài viết. Vui lòng thử lại sau.</div>';
            }
        }

        // 2. GỬI BÀI VIẾT MỚI
        async function submitPost(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitPost');
            
            const postData = {
                author: document.getElementById('postAuthor').value,
                title: document.getElementById('postTitle').value,
                image: document.getElementById('postImage').value,
                content: document.getElementById('postContent').value,
                date: new Date().toLocaleDateString('vi-VN')
            };

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi...';
            btn.disabled = true;

            try {
                await fetch(N8N_SUBMIT_BLOG, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                alert("✅ Bài viết đã gửi thành công!\nVui lòng chờ Admin phê duyệt để hiển thị.");
                
                // Reset form và đóng modal
                document.getElementById('postForm').reset();
                const modal = bootstrap.Modal.getInstance(document.getElementById('writePostModal'));
                modal.hide();

            } catch (error) {
                alert("❌ Lỗi gửi bài: " + error.message);
            } finally {
                btn.innerHTML = 'Gửi Duyệt';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
