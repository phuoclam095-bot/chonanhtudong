<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chonanhnhanh.vn - Hỗ Trợ Kỹ Thuật</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ebb0; 
            --bg-deep: #050a14; 
            --neon: 0 0 15px rgba(0, 235, 176, 0.3);
        }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.7) 0%, rgba(5, 10, 20, 0.9) 100%), 
                              url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-top: 90px; overflow-x: hidden;
        }

        /* --- NAVBAR & TABS --- */
        .navbar { background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 75px; }
        .navbar-brand { font-weight: 900; font-size: 1.3rem; color: var(--primary) !important; text-shadow: var(--neon); }
        
        .nav-link { color: #94a3b8 !important; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; padding: 10px 15px !important; transition: 0.3s; position: relative; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 5px; left: 50%; background: var(--primary); transition: 0.3s; transform: translateX(-50%); }
        .nav-link:hover { color: #fff !important; }
        .nav-link:hover::after, .nav-link.active::after { width: 60%; box-shadow: var(--neon); }
        .nav-link.active { color: var(--primary) !important; }

        /* USER PILL */
        .user-pill { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 50px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--primary); }
        .avt-circle { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 1px solid var(--primary); }
        .avt-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* MAIN LAYOUT - ĐÃ THU NHỎ */
        .main-container { max-width: 1100px; margin: 20px auto; display: grid; grid-template-columns: 1fr 380px; gap: 25px; padding: 15px; }
        @media (max-width: 992px) { .main-container { grid-template-columns: 1fr; } }

        /* CARD LIÊN HỆ */
        .supreme-card { 
            background: rgba(10, 20, 40, 0.8); backdrop-filter: blur(15px); border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05); padding: 50px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center;
        }
        
        /* HIỆU ỨNG CHỮ MỚI - FIX DẤU HỖ TRỆ TRIỆT ĐỂ */
        .supreme-title { 
            font-weight: 900; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 3px;
            color: #fff; margin-bottom: 20px;
            text-shadow: 0 0 8px var(--primary);
            position: relative;
            display: inline-block;
        }
        .supreme-title::before {
            content: "HỖ TRỢ KỸ THUẬT"; position: absolute; top: 0; left: 0; width: 0; height: 100%;
            color: var(--primary); overflow: hidden; white-space: nowrap;
            border-right: 3px solid var(--primary);
            animation: move-light 3s linear infinite;
        }
        @keyframes move-light { 0%, 10% { width: 0; } 70%, 100% { width: 100%; } }

        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .contact-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; display: flex; align-items: center; gap: 12px; transition: 0.3s; text-decoration: none; text-align: left; }
        .contact-item:hover { transform: scale(1.03); border-color: var(--primary); box-shadow: var(--neon); }
        .contact-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: rgba(255,255,255,0.05); }
        .contact-info label { display: block; font-size: 0.6rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .contact-info span { display: block; font-weight: 700; font-size: 0.85rem; color: #fff; }

        /* AI CHAT BOX - THU NHỎ CHIỀU CAO */
        .ai-box { background: rgba(10, 20, 40, 0.9); border: 1px solid var(--primary); border-radius: 25px; display: flex; flex-direction: column; height: 580px; overflow: hidden; box-shadow: var(--neon); }
        .ai-header { padding: 18px; background: var(--primary); color: #000; font-weight: 900; font-size: 0.8rem; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .ai-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; font-size: 0.85rem; scrollbar-width: none; }
        .msg { padding: 12px 18px; border-radius: 20px; line-height: 1.5; max-width: 85%; }
        .msg-ai { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .msg-user { background: var(--primary); color: #000; font-weight: 700; align-self: flex-end; }
        .ai-input-area { padding: 15px; background: rgba(0,0,0,0.4); display: flex; gap: 10px; }
        .ai-input-area input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.9rem; }
        .ai-btn { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; color: #000; transition: 0.2s; }

        #loadOverlay { position: fixed; inset: 0; background: #050a14; z-index: 20000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadOverlay"><div class="spinner-border text-primary"></div></div>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="admin.html">CHONANHNHANH<span style="color:#fff">.VN</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#supremeNav"><i class="fas fa-bars"></i></button>
            <div class="collapse navbar-collapse" id="supremeNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="admin.html" class="nav-link">Tạo Album</a></li>
                    <li class="nav-item"><a href="managa.html" class="nav-link">Quản Lý</a></li>
                    <li class="nav-item"><a href="copy_local.html" class="nav-link">Sao Chép</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="lienhe.html" class="nav-link active">Liên Hệ</a></li>
                </ul>
                <div id="authControl" style="display: none !important;" class="align-items-center gap-2">
                    <div class="user-pill">
                        <div class="avt-circle" id="userAvatarPlaceholder"></div>
                        <div class="d-flex flex-column overflow-hidden">
                            <span id="userNameDisplay" style="font-weight:800; font-size:0.7rem; color:#fff;">...</span>
                            <span id="badgeStatus" style="color:var(--primary); font-size: 0.5rem; font-weight: 800;">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="supreme-card">
            <h1 class="supreme-title">HỖ TRỢ KỸ THUẬT</h1>
            <p class="text-secondary fw-bold" style="font-size: 0.95rem;">Giải pháp chuyên nghiệp - Xử lý nhanh chóng.<br>Hệ thống tối ưu cho Studio từ <b>chonanhnhanh.vn</b>.</p>
            
            <div class="contact-grid">
                <a href="https://m.me/lamnamphuoc95" target="_blank" class="contact-item">
                    <div class="contact-icon" style="color: #0099ff;"><i class="fab fa-facebook-messenger"></i></div>
                    <div class="contact-info"><label>Messenger</label><span>Lâm Nam Phước</span></div>
                </a>
                <a href="https://zalo.me/0879029170" target="_blank" class="contact-item">
                    <div class="contact-icon" style="color: #00ebb0;"><i class="fas fa-comment-dots"></i></div>
                    <div class="contact-info"><label>Zalo</label><span>0879 029 170</span></div>
                </a>
                <a href="https://t.me/david_coby" target="_blank" class="contact-item">
                    <div class="contact-icon" style="color: #27A0DF;"><i class="fab fa-telegram-plane"></i></div>
                    <div class="contact-info"><label>Telegram</label><span>@david_coby</span></div>
                </a>
                <a href="mailto:phuoclam095@gmail.com" class="contact-item">
                    <div class="contact-icon" style="color: #ff4757;"><i class="fas fa-envelope-open-text"></i></div>
                    <div class="contact-info"><label>Email</label><span>phuoclam095@gmail.com</span></div>
                </a>
            </div>
        </div>

        <div class="ai-box">
            <div class="ai-header"><i class="fas fa-robot"></i> TRỢ LÝ TRỰC TUYẾN</div>
            <div class="ai-messages" id="aiChat">
                <div class="msg msg-ai" id="welcomeMsg">Đang kết nối...</div>
            </div>
            <div class="ai-input-area">
                <input type="text" id="aiInput" placeholder="Bạn cần hỗ trợ gì?" onkeypress="if(event.key==='Enter') askAI()">
                <button class="ai-btn" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const AI_PATH = 'https://dichvufb.tino.page/webhook/chat-admin';
        
        function updateUI() {
            const name = localStorage.getItem('admin_name') || 'Bạn';
            const av = localStorage.getItem('admin_avatar');
            
            // Cập nhật lời chào AI
            document.getElementById('welcomeMsg').innerHTML = `Chào <b>${name}</b>! Tôi là trợ lý ảo của <b>chonanhnhanh.vn</b>. Rất vui được hỗ trợ bạn chuyên nghiệp và nhanh chóng nhất!`;
            
            if (localStorage.getItem('admin_is_logged_in') === 'true') {
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userAvatarPlaceholder').innerHTML = av ? `<img src="${av}">` : `<i class="fas fa-user-circle"></i>`;
                document.getElementById('authControl').style.setProperty('display', 'flex', 'important');
            }
        }

        async function askAI() {
            const input = document.getElementById('aiInput');
            const chat = document.getElementById('aiChat');
            if(!input.value.trim()) return;
            const userMsg = input.value;
            chat.innerHTML += `<div class="msg msg-user">${userMsg}</div>`;
            input.value = ''; chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(AI_PATH, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMsg, adminEmail: localStorage.getItem('admin_email') })
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg msg-ai">${data.output || "Đã nhận yêu cầu!"}</div>`;
            } catch (e) { chat.innerHTML += `<div class="text-center small opacity-50">Lỗi kết nối...</div>`; }
            chat.scrollTop = chat.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
            setTimeout(() => document.getElementById('loadOverlay').style.display = 'none', 500);
        });
    </script>
</body>
</html>
